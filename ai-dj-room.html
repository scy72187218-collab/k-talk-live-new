<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>K-Talk AI DJ</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#020105;color:#fff;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}
body{min-height:100dvh}
.screen{position:relative;width:100%;max-width:480px;margin:0 auto;background:#020105;overflow:hidden}
.screen>img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.hot{position:absolute;border:0;background:transparent;padding:0;margin:0;cursor:pointer;z-index:10}
.hot:active{background:rgba(255,255,255,.06)}
.toast{position:fixed;left:50%;bottom:84px;z-index:9999;transform:translateX(-50%);display:none;padding:10px 15px;border-radius:999px;background:#17111eee;border:1px solid #ff55d1;color:#fff;font-size:12px;font-weight:900;white-space:nowrap}
.modal{position:fixed;inset:0;z-index:9998;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55);padding:20px}
.card{width:min(92vw,360px);border-radius:18px;border:2px solid #ff55d1;background:#100817;padding:16px;box-shadow:0 0 24px #ff44cf66}
.card h3{margin:0 0 10px;font-size:17px}.card input{width:100%;padding:12px;border-radius:12px;border:1px solid #ffffff26;background:#191020;color:#fff;font-size:14px;outline:0}
.actions{display:flex;gap:8px;margin-top:10px}.actions button{flex:1;padding:11px;border:0;border-radius:12px;font-weight:900}.cancel{background:#2a2630;color:#fff}.ok{background:linear-gradient(135deg,#ff3fb2,#8a4cff);color:#fff}
</style>
</head>
<body>
<div class="screen" id="room">
  <img src="/ai-dj-approved.jpg?v=20260927-approved1" alt="K-Talk AI DJ room">

  <!-- top banners -->
  <button class="hot" style="left:2%;top:6.3%;width:49%;height:5.4%" onclick="toast('출석체크 완료')"></button>
  <button class="hot" style="left:52.5%;top:6.3%;width:45.5%;height:5.4%" onclick="openInput('신청곡 제목을 입력해 주세요.','song')"></button>

  <!-- guest cells -->
  <button class="hot" style="left:58.7%;top:12.4%;width:19.3%;height:12.2%" onclick="toast('게스트 1 참여 준비')"></button>
  <button class="hot" style="left:79.2%;top:12.4%;width:19.2%;height:12.2%" onclick="toast('게스트 2 참여 준비')"></button>
  <button class="hot" style="left:58.7%;top:25.4%;width:19.3%;height:12.2%" onclick="toast('게스트 3 참여 준비')"></button>
  <button class="hot" style="left:79.2%;top:25.4%;width:19.2%;height:12.2%" onclick="toast('게스트 4 참여 준비')"></button>
  <button class="hot" style="left:58.7%;top:38.5%;width:19.3%;height:12.2%" onclick="toast('게스트 5 참여 준비')"></button>
  <button class="hot" style="left:79.2%;top:38.5%;width:19.2%;height:12.2%" onclick="toast('대기방 확인')"></button>

  <!-- chat input / send / gift -->
  <button class="hot" style="left:3.5%;top:85.7%;width:34.5%;height:4.5%" onclick="openInput('메시지를 입력하세요.','chat')"></button>
  <button class="hot" style="left:39%;top:85.7%;width:8.5%;height:4.5%" onclick="toast('메시지 전송')"></button>
  <button class="hot" style="left:48%;top:85.7%;width:7%;height:4.5%" onclick="toast('선물창 열기')"></button>

  <!-- gift grid -->
  <button class="hot" style="left:57.6%;top:59.4%;width:13.3%;height:8.7%" onclick="toast('1송이 장미 선택 · 10코인')"></button>
  <button class="hot" style="left:71.7%;top:59.4%;width:13.3%;height:8.7%" onclick="toast('10송이 장미 선택 · 100코인')"></button>
  <button class="hot" style="left:85.7%;top:59.4%;width:13.3%;height:8.7%" onclick="toast('20송이 장미 선택 · 200코인')"></button>
  <button class="hot" style="left:57.6%;top:68.6%;width:13.3%;height:8.7%" onclick="toast('30송이 장미 선택 · 300코인')"></button>
  <button class="hot" style="left:71.7%;top:68.6%;width:13.3%;height:8.7%" onclick="toast('40송이 장미 선택 · 400코인')"></button>
  <button class="hot" style="left:85.7%;top:68.6%;width:13.3%;height:8.7%" onclick="toast('50송이 장미 선택 · 500코인')"></button>
  <button class="hot" style="left:57.6%;top:77.9%;width:10.3%;height:8.2%" onclick="toast('하트 선택 · 100코인')"></button>
  <button class="hot" style="left:68.3%;top:77.9%;width:10.3%;height:8.2%" onclick="toast('별 선택 · 200코인')"></button>
  <button class="hot" style="left:79.0%;top:77.9%;width:10.3%;height:8.2%" onclick="toast('풍선 선택 · 300코인')"></button>
  <button class="hot" style="left:89.6%;top:77.9%;width:9.5%;height:8.2%" onclick="toast('선물상자 선택 · 1,000코인')"></button>

  <!-- bottom nav -->
  <button class="hot" style="left:0%;top:90.2%;width:14.2%;height:9.3%" onclick="openInput('신청곡 제목을 입력해 주세요.','song')"></button>
  <button class="hot" style="left:14.2%;top:90.2%;width:14.2%;height:9.3%" onclick="openInput('신청곡 제목을 입력해 주세요.','song')"></button>
  <button class="hot" style="left:28.4%;top:90.2%;width:14.2%;height:9.3%" onclick="toast('장미 선택')"></button>
  <button class="hot" style="left:42.6%;top:90.2%;width:14.2%;height:9.3%" onclick="toast('선물 선택')"></button>
  <button class="hot" style="left:56.8%;top:90.2%;width:14.2%;height:9.3%" onclick="shareRoom()"></button>
  <button class="hot" style="left:71%;top:90.2%;width:14.2%;height:9.3%" onclick="toast('효과 메뉴')"></button>
  <button class="hot" style="left:85.2%;top:90.2%;width:14.8%;height:9.3%" onclick="toast('더보기 메뉴')"></button>
</div>

<div class="toast" id="toast"></div>
<div class="modal" id="modal">
  <div class="card">
    <h3 id="modalTitle">입력</h3>
    <input id="modalInput" autocomplete="off">
    <div class="actions">
      <button class="cancel" onclick="closeInput()">취소</button>
      <button class="ok" onclick="submitInput()">확인</button>
    </div>
  </div>
</div>

<script>
let mode='';
function toast(t){
  const x=document.getElementById('toast');
  x.textContent=t;
  x.style.display='block';
  clearTimeout(window.__tt);
  window.__tt=setTimeout(()=>x.style.display='none',1400);
}
function openInput(title,m){
  mode=m;
  document.getElementById('modalTitle').textContent=title;
  const input=document.getElementById('modalInput');
  input.value='';
  document.getElementById('modal').style.display='flex';
  setTimeout(()=>input.focus(),80);
}
function closeInput(){document.getElementById('modal').style.display='none'}
function submitInput(){
  const v=document.getElementById('modalInput').value.trim();
  if(!v)return;
  closeInput();
  toast(mode==='song' ? v+' 신청곡 접수 완료' : '메시지 전송 완료');
}
function shareRoom(){
  if(navigator.share){
    navigator.share({title:'K-Talk AI DJ',text:'K-Talk AI DJ 방송방',url:location.href}).catch(()=>{});
  }else toast('공유 준비 완료');
}
document.getElementById('modalInput').addEventListener('keydown',e=>{if(e.key==='Enter')submitInput()});
</script>
</body>
</html>
