<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>K-Talk AI DJ</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#030105;color:#fff;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}
body{min-height:100dvh;overflow-x:hidden}
.room{position:relative;width:100%;max-width:480px;margin:0 auto;background:#030105}
.room-bg{display:block;width:100%;height:auto;min-height:100dvh;object-fit:cover;object-position:top center;user-select:none;-webkit-user-drag:none}
.hot{position:absolute;border:0;background:transparent;padding:0;margin:0;z-index:20;cursor:pointer}
.hot:active{background:rgba(255,255,255,.06)}
#countdown{position:fixed;inset:0;z-index:9998;display:grid;place-items:center;background:rgba(0,0,0,.08);pointer-events:none}
#countNum{width:118px;height:118px;border-radius:50%;display:grid;place-items:center;background:rgba(8,8,12,.74);border:4px solid rgba(255,255,255,.96);color:#fff;font:900 64px/1 system-ui,-apple-system,sans-serif;box-shadow:0 0 32px rgba(255,44,180,.78);text-shadow:0 0 12px rgba(255,255,255,.78)}
#toast{position:fixed;left:50%;bottom:76px;z-index:10000;transform:translateX(-50%);display:none;max-width:86vw;padding:10px 14px;border-radius:999px;background:#17111eee;border:1px solid #ff55d1;color:#fff;font-size:12px;font-weight:900;text-align:center}
.sheet{position:fixed;inset:0;z-index:9999;display:none;align-items:flex-end;background:rgba(0,0,0,.5)}
.sheet .panel{width:100%;max-width:480px;margin:0 auto;border-radius:22px 22px 0 0;border:1px solid #ff4fd266;background:#100815;padding:16px 14px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -10px 35px #000b}
.sheet h3{margin:0 0 10px;font-size:17px}
.sheet input{width:100%;min-height:46px;padding:11px 12px;border-radius:12px;border:1px solid #ffffff24;background:#19111f;color:#fff;font-size:16px;outline:0}
.actions{display:flex;gap:8px;margin-top:10px}.actions button{flex:1;min-height:44px;border:0;border-radius:12px;font-weight:900;font-size:14px}.cancel{background:#2c2731;color:#fff}.ok{background:linear-gradient(135deg,#ff3fb2,#8a4cff);color:#fff}
.voice-indicator{position:absolute;left:43%;top:1.5%;z-index:25;padding:4px 8px;border-radius:999px;background:rgba(13,8,19,.72);border:1px solid #ff5fd455;color:#fff;font-size:9px;font-weight:900;pointer-events:none}
</style>
</head>
<body>
<div class="room" id="room">
  <img class="room-bg" src="/ai-dj-approved.jpg?v=20260927-target2" alt="K-Talk AI DJ 방송방">
  <div class="voice-indicator" id="voiceIndicator">AI 음성 준비</div>

  <!-- 출석 / 신청곡 -->
  <button class="hot" style="left:2%;top:6.1%;width:49%;height:5.4%" aria-label="출석체크" onclick="attendance()"></button>
  <button class="hot" style="left:52%;top:6.1%;width:46%;height:5.4%" aria-label="신청곡" onclick="openInput('신청곡 제목을 입력해 주세요.','song')"></button>

  <!-- 게스트 1~5 / 대기 -->
  <button class="hot" style="left:58.5%;top:12.2%;width:19.4%;height:12.3%" onclick="guestJoin(1)"></button>
  <button class="hot" style="left:79.0%;top:12.2%;width:19.4%;height:12.3%" onclick="guestJoin(2)"></button>
  <button class="hot" style="left:58.5%;top:25.2%;width:19.4%;height:12.3%" onclick="guestJoin(3)"></button>
  <button class="hot" style="left:79.0%;top:25.2%;width:19.4%;height:12.3%" onclick="guestJoin(4)"></button>
  <button class="hot" style="left:58.5%;top:38.2%;width:19.4%;height:12.3%" onclick="guestJoin(5)"></button>
  <button class="hot" style="left:79.0%;top:38.2%;width:19.4%;height:12.3%" onclick="sayAndToast('현재 대기 인원 6명입니다.')"></button>

  <!-- 채팅 입력 / 전송 -->
  <button class="hot" style="left:3%;top:85.4%;width:34%;height:4.8%" aria-label="채팅 입력" onclick="openInput('메시지를 입력하세요.','chat')"></button>
  <button class="hot" style="left:38.5%;top:85.4%;width:9%;height:4.8%" onclick="openInput('메시지를 입력하세요.','chat')"></button>

  <!-- 장미 6종 -->
  <button class="hot" style="left:56.5%;top:58.7%;width:14%;height:9.0%" onclick="gift('장미 1송이',10)"></button>
  <button class="hot" style="left:71.0%;top:58.7%;width:14%;height:9.0%" onclick="gift('장미 10송이',100)"></button>
  <button class="hot" style="left:85.5%;top:58.7%;width:14%;height:9.0%" onclick="gift('장미 20송이',200)"></button>
  <button class="hot" style="left:56.5%;top:68.2%;width:14%;height:9.0%" onclick="gift('장미 30송이',300)"></button>
  <button class="hot" style="left:71.0%;top:68.2%;width:14%;height:9.0%" onclick="gift('장미 40송이',400)"></button>
  <button class="hot" style="left:85.5%;top:68.2%;width:14%;height:9.0%" onclick="gift('장미 50송이',500)"></button>

  <!-- 하트 / 별 / 풍선 / 선물상자 -->
  <button class="hot" style="left:56.5%;top:77.7%;width:10.6%;height:8.5%" onclick="gift('하트',100)"></button>
  <button class="hot" style="left:67.2%;top:77.7%;width:10.6%;height:8.5%" onclick="gift('별',200)"></button>
  <button class="hot" style="left:77.9%;top:77.7%;width:10.6%;height:8.5%" onclick="gift('풍선',300)"></button>
  <button class="hot" style="left:88.6%;top:77.7%;width:10.8%;height:8.5%" onclick="gift('선물상자',1000)"></button>

  <!-- 하단 메뉴 -->
  <button class="hot" style="left:0%;top:90.0%;width:14.3%;height:9.7%" onclick="openInput('신청곡 제목을 입력해 주세요.','song')"></button>
  <button class="hot" style="left:14.3%;top:90.0%;width:14.3%;height:9.7%" onclick="speak('무엇을 말씀하시겠어요?')"></button>
  <button class="hot" style="left:28.6%;top:90.0%;width:14.3%;height:9.7%" onclick="gift('장미 1송이',10)"></button>
  <button class="hot" style="left:42.9%;top:90.0%;width:14.3%;height:9.7%" onclick="sayAndToast('선물 메뉴입니다.')"></button>
  <button class="hot" style="left:57.2%;top:90.0%;width:14.3%;height:9.7%" onclick="shareRoom()"></button>
  <button class="hot" style="left:71.5%;top:90.0%;width:14.3%;height:9.7%" onclick="sayAndToast('효과 메뉴입니다.')"></button>
  <button class="hot" style="left:85.8%;top:90.0%;width:14.2%;height:9.7%" onclick="sayAndToast('더보기 메뉴입니다.')"></button>
</div>

<div id="countdown"><div id="countNum">5</div></div>
<div id="toast"></div>

<div class="sheet" id="sheet">
  <div class="panel">
    <h3 id="sheetTitle">입력</h3>
    <input id="sheetInput" autocomplete="off">
    <div class="actions">
      <button class="cancel" type="button" onclick="closeInput()">취소</button>
      <button class="ok" type="button" onclick="submitInput()">확인</button>
    </div>
  </div>
</div>

<script>
(function(){
  let inputMode='';
  let speechQueue=[];
  let speaking=false;
  let nickname='';
  let audioCtx=null;
  let musicTimer=null;
  let musicStarted=false;
  let musicStep=0;

  function clean(v){return String(v||'').replace(/[<>]/g,'').trim()}
  function getNickname(){
    const keys=['ktalkNickname','nickname','userNickname','displayName','profileName','name'];
    for(const k of keys){
      try{const v=clean(localStorage.getItem(k));if(v && v.length<30)return v}catch(e){}
    }
    try{
      const u=new URL(location.href);
      const q=clean(u.searchParams.get('nickname'));
      if(q)return q;
    }catch(e){}
    return '대표님';
  }

  window.toast=function(t){
    const x=document.getElementById('toast');
    x.textContent=t;
    x.style.display='block';
    clearTimeout(window.__toastTimer);
    window.__toastTimer=setTimeout(()=>x.style.display='none',1700);
  };

  function chooseVoice(){
    if(!('speechSynthesis' in window))return null;
    const voices=speechSynthesis.getVoices();
    return voices.find(v=>/^ko(-|_)/i.test(v.lang) && /female|여성|yuna|sora|sunhi|heami/i.test(v.name))
      || voices.find(v=>/^ko(-|_)/i.test(v.lang))
      || voices[0] || null;
  }

  window.speak=function(text){
    text=clean(text);
    if(!text)return;
    speechQueue.push(text);
    pumpSpeech();
  };

  function pumpSpeech(){
    if(speaking || !speechQueue.length)return;
    if(!('speechSynthesis' in window)){toast('AI 음성을 지원하지 않는 브라우저입니다.');speechQueue=[];return}
    const text=speechQueue.shift();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='ko-KR';
    u.rate=.96;
    u.pitch=1.08;
    u.volume=1;
    const v=chooseVoice(); if(v)u.voice=v;
    speaking=true;
    const indicator=document.getElementById('voiceIndicator');
    if(indicator)indicator.textContent='AI DJ 말하는 중';
    lowerMusic(true);
    u.onend=u.onerror=function(){
      speaking=false;
      if(indicator)indicator.textContent='AI DJ 방송중';
      lowerMusic(false);
      setTimeout(pumpSpeech,180);
    };
    try{speechSynthesis.speak(u)}catch(e){speaking=false;lowerMusic(false)}
  }

  function initAudio(){
    if(audioCtx)return audioCtx;
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return null;
    try{
      audioCtx=new AC();
      window.__ktDjMaster=audioCtx.createGain();
      window.__ktDjMaster.gain.value=.035;
      window.__ktDjMaster.connect(audioCtx.destination);
      return audioCtx;
    }catch(e){return null}
  }

  function playTone(freq,dur,when){
    const ctx=initAudio(); if(!ctx)return;
    const osc=ctx.createOscillator();
    const gain=ctx.createGain();
    osc.type='sine';
    osc.frequency.value=freq;
    gain.gain.setValueAtTime(0.0001,when);
    gain.gain.exponentialRampToValueAtTime(.11,when+.025);
    gain.gain.exponentialRampToValueAtTime(.0001,when+dur);
    osc.connect(gain); gain.connect(window.__ktDjMaster);
    osc.start(when); osc.stop(when+dur+.03);
  }

  function scheduleMusicBar(){
    const ctx=initAudio(); if(!ctx || ctx.state!=='running')return;
    const chords=[
      [261.63,329.63,392.00],
      [220.00,261.63,329.63],
      [174.61,220.00,261.63],
      [196.00,246.94,293.66]
    ];
    const chord=chords[musicStep%chords.length];
    const t=ctx.currentTime+.04;
    chord.forEach((f,i)=>playTone(f,.72,t+i*.015));
    playTone(chord[1]*2,.20,t+.82);
    playTone(chord[2]*2,.20,t+1.18);
    musicStep++;
  }

  window.startDjMusic=function(){
    if(musicStarted)return;
    const ctx=initAudio(); if(!ctx)return;
    const go=function(){
      try{if(ctx.state==='suspended')ctx.resume()}catch(e){}
      musicStarted=true;
      scheduleMusicBar();
      musicTimer=setInterval(scheduleMusicBar,1600);
      const indicator=document.getElementById('voiceIndicator');
      if(indicator)indicator.textContent='♪ AI DJ 음악 재생중';
    };
    go();
  };

  function lowerMusic(low){
    if(!window.__ktDjMaster || !audioCtx)return;
    try{
      window.__ktDjMaster.gain.cancelScheduledValues(audioCtx.currentTime);
      window.__ktDjMaster.gain.linearRampToValueAtTime(low?.012:.035,audioCtx.currentTime+.12);
    }catch(e){}
  }

  window.sayAndToast=function(t){toast(t);speak(t)};

  window.attendance=function(){
    sayAndToast(nickname+'님, 출석체크 완료했어요. 오늘도 반갑습니다.');
  };

  window.guestJoin=function(n){
    sayAndToast('게스트 '+n+'번 자리 참여 신청이 들어왔어요.');
  };

  window.gift=function(name,coin){
    window.ktAiDjGift(nickname,name);
  };

  window.openInput=function(title,mode){
    inputMode=mode;
    document.getElementById('sheetTitle').textContent=title;
    const input=document.getElementById('sheetInput');
    input.value='';
    document.getElementById('sheet').style.display='flex';
    setTimeout(()=>input.focus(),80);
  };
  window.closeInput=function(){document.getElementById('sheet').style.display='none'};
  window.submitInput=function(){
    const input=document.getElementById('sheetInput');
    const v=clean(input.value);
    if(!v)return;
    closeInput();
    if(inputMode==='song'){
      window.ktAiDjSongRequest(nickname,v);
    }else{
      window.ktAiDjChat(nickname,v);
    }
  };

  window.shareRoom=function(){
    if(navigator.share){
      navigator.share({title:'K-Talk AI DJ',text:'K-Talk AI DJ 방송방',url:location.href}).catch(()=>{});
    }else{
      sayAndToast('공유 준비 완료했어요.');
    }
  };

  // 실제 입장/채팅/선물/신청곡 연동용 공개 함수
  window.ktAiDjMemberEnter=function(name){
    name=clean(name)||'손님';
    speak(name+'님 어서 오세요. 만나서 반갑습니다. 무슨 노래를 좋아하세요? 신청곡 말씀해 주세요.');
  };
  window.ktAiDjChat=function(name,text){
    name=clean(name)||'손님'; text=clean(text);
    if(!text)return;
    toast(name+' · '+text);
    speak(name+'님, '+text);
  };
  window.ktAiDjGift=function(name,giftName){
    name=clean(name)||'손님'; giftName=clean(giftName)||'선물';
    toast(name+'님 · '+giftName);
    speak(name+'님이 '+giftName+' 선물을 보내주셨어요. 감사합니다.');
  };
  window.ktAiDjSongRequest=function(name,song){
    name=clean(name)||'손님'; song=clean(song);
    if(!song)return;
    toast(song+' 신청곡 접수');
    speak(name+'님, '+song+' 신청곡 접수했어요. 잠시만 기다려 주세요.');
  };

  // 외부 실시간 기능이 CustomEvent로 연결될 경우 자동으로 읽기
  window.addEventListener('ktalk:member-enter',e=>window.ktAiDjMemberEnter(e.detail&&e.detail.nickname));
  window.addEventListener('ktalk:chat',e=>window.ktAiDjChat(e.detail&&e.detail.nickname,e.detail&&e.detail.text));
  window.addEventListener('ktalk:gift',e=>window.ktAiDjGift(e.detail&&e.detail.nickname,e.detail&&e.detail.gift));
  window.addEventListener('ktalk:song-request',e=>window.ktAiDjSongRequest(e.detail&&e.detail.nickname,e.detail&&e.detail.song));

  document.getElementById('sheetInput').addEventListener('keydown',function(e){
    if(e.key==='Enter')submitInput();
  });

  nickname=getNickname();

  // 입장 즉시 음악부터 시도.
  startDjMusic();

  // DJ방 화면이 보이는 상태에서 5초 카운트다운 후 인사.
  let n=5;
  const wrap=document.getElementById('countdown');
  const num=document.getElementById('countNum');
  function tick(){
    num.textContent=String(n);
    if(n===1){
      setTimeout(function(){
        wrap.style.display='none';
        speak('안녕하세요. AI DJ 수아예요. '+nickname+'님 어서 오세요. 만나서 반갑습니다. 무슨 노래를 좋아하세요? 신청곡 말씀해 주세요.');
      },1000);
      return;
    }
    n--;
    setTimeout(tick,1000);
  }
  setTimeout(tick,300);

  // 모바일에서 자동 음악/음성이 막히면 첫 터치에 즉시 활성화.
  function unlock(){
    const ctx=initAudio();
    if(ctx && ctx.state==='suspended')ctx.resume().then(()=>{if(!musicStarted)startDjMusic()}).catch(()=>{});
    if('speechSynthesis' in window){
      try{
        const u=new SpeechSynthesisUtterance('');
        u.lang='ko-KR';
        speechSynthesis.speak(u);
      }catch(e){}
    }
    document.removeEventListener('pointerdown',unlock,true);
    document.removeEventListener('touchstart',unlock,true);
  }
  document.addEventListener('pointerdown',unlock,true);
  document.addEventListener('touchstart',unlock,{capture:true,passive:true});

  if('speechSynthesis' in window){
    speechSynthesis.onvoiceschanged=function(){
      const i=document.getElementById('voiceIndicator');
      if(i)i.textContent=musicStarted?'♪ AI DJ 음악 재생중':'AI DJ 음성 준비';
    };
  }
})();
</script>
</body>
</html>
