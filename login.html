<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>K-Talk 로그인</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;background:#07080c;color:#fff}body{min-height:100dvh;display:grid;place-items:center;padding:22px}.wrap{width:min(440px,100%);background:linear-gradient(180deg,#14151c,#0b0c11);border:1px solid #ffffff1c;border-radius:28px;padding:26px 18px 22px;box-shadow:0 24px 70px #0009,inset 0 1px 0 #ffffff12}.brand{text-align:center;margin-bottom:24px}.brand b{font-size:29px;letter-spacing:-1px}.brand .crown{color:#ffd44a}.brand .talk{color:#ff58cc}.brand .live{color:#54a9ff}.sub{text-align:center;color:#cfd1d8;font-size:13px;margin-top:7px}.socials{display:grid;gap:11px}.social{width:100%;height:64px;border-radius:18px;border:1px solid #ffffff1d;background:#171820;color:#fff;display:flex;align-items:center;gap:15px;padding:0 18px;font-size:21px;font-weight:850;text-align:left;box-shadow:inset 0 0 16px #ffffff05}.icon{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:21px;font-weight:950;flex:none}.kakao{background:#fee500;color:#211}.naver{background:#03c75a;color:#fff}.google{background:#fff;color:#4285f4}.facebook{background:#4267b2;color:#fff}.wechat{background:#09b83e;color:#fff}.login{width:100%;height:68px;border:0;border-radius:20px;margin-top:18px;background:linear-gradient(135deg,#ff235f,#ff3c8d 55%,#a650ff);color:#fff;font-size:24px;font-weight:950;box-shadow:0 12px 30px #ff2b7060}.adult{margin-top:18px;padding:16px;border-radius:18px;background:#0d0e14;border:1px solid #ffffff18}.adult b{display:block;font-size:16px;margin-bottom:7px}.adult p{margin:0;color:#c7c9d1;font-size:12px;line-height:1.55}.adult button{width:100%;margin-top:12px;padding:13px;border-radius:14px;border:1px solid #ffffff22;background:#20222c;color:#fff;font-size:15px;font-weight:900}.preview{width:100%;margin-top:10px;padding:12px;border-radius:14px;border:1px dashed #ffffff30;background:transparent;color:#cfd1d8;font-weight:800}.note{margin-top:14px;text-align:center;color:#91949e;font-size:11px;line-height:1.5}.sheet{position:fixed;inset:0;display:none;place-items:end center;background:#0009;padding:18px}.sheet.show{display:grid}.panel{width:min(440px,100%);border-radius:24px;background:#15161d;border:1px solid #ffffff1f;padding:20px}.panel h3{margin:0 0 10px}.panel p{margin:0;color:#d4d6dc;line-height:1.55;font-size:13px}.panel button{width:100%;margin-top:14px;padding:13px;border:0;border-radius:14px;background:#2b2d38;color:#fff;font-weight:900}
</style>
</head>
<body>
<main class="wrap">
  <div class="brand"><b><span class="crown">♛</span> <span class="talk">K-Talk</span> <span class="live">LIVE</span></b><div class="sub">로그인 후 성인 인증을 진행합니다</div></div>
  <div class="socials">
    <button class="social" onclick="pick('카카오')"><span class="icon kakao">T</span>Kakao</button>
    <button class="social" onclick="pick('네이버')"><span class="icon naver">N</span>Naver</button>
    <button class="social" onclick="pick('Google')"><span class="icon google">G</span>Google</button>
    <button class="social" onclick="pick('Facebook')"><span class="icon facebook">f</span>Facebook</button>
    <button class="social" onclick="pick('WeChat')"><span class="icon wechat">◉</span>WeChat</button>
  </div>
  <button class="login" onclick="loginNext()">로그인</button>
  <section class="adult"><b>🔒 성인 인증</b><p>실제 서비스에서는 휴대폰 본인확인 또는 공인 연령확인 업체를 연결해 성인으로 확인된 계정만 성인 전용 기능에 들어갈 수 있게 해야 합니다.</p><button onclick="adultVerify()">성인 인증 진행</button></section>
  <button class="preview" onclick="preview()">관리자 안전 미리보기로 바로 들어가기</button>
  <div class="note">관리자 미리보기는 성인 기능이 없는 화면 확인용입니다. 한 번 들어가면 이 기기에서는 다음부터 바로 열립니다.</div>
</main>
<div id="sheet" class="sheet"><div class="panel"><h3 id="title">안내</h3><p id="msg"></p><button onclick="closeSheet()">확인</button></div></div>
<script>
let provider='';
function pick(name){provider=name;document.querySelectorAll('.social').forEach(b=>b.style.outline='none');event.currentTarget.style.outline='2px solid #fff';}
function show(title,msg){document.getElementById('title').textContent=title;document.getElementById('msg').textContent=msg;document.getElementById('sheet').classList.add('show')}
function closeSheet(){document.getElementById('sheet').classList.remove('show')}
function loginNext(){if(!provider){show('로그인','카카오, 네이버, Google, Facebook, WeChat 중 하나를 먼저 선택해 주세요.');return}show('로그인 연결',provider+' 로그인 화면을 실제로 연결하려면 해당 서비스의 OAuth 설정이 필요합니다.');}
function adultVerify(){show('성인 인증','성인 인증은 실제 본인확인/연령확인 업체가 성인으로 확인한 경우에만 통과하도록 연결해야 합니다. 현재 화면에서는 인증을 우회하거나 임의로 통과시키지 않습니다.');}
function preview(){try{localStorage.setItem('ktalk_admin_preview','1')}catch(e){} location.href='admin-preview.html';}
try{if(localStorage.getItem('ktalk_admin_preview')==='1')location.replace('admin-preview.html')}catch(e){}
</script>
</body>
</html>
