<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>K-Talk 비밀방</title><style>*{box-sizing:border-box}html,body{margin:0;background:#000;color:#fff;font-family:Arial,'Noto Sans KR',sans-serif}.app{min-height:100dvh;background:#020204;padding:10px 10px 84px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.logo{font-size:28px;font-weight:900;color:#ffd56a}.logo small{font-size:14px;color:#ff78c7}.status{font-weight:800}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.quick div,.panel{border:1px solid #5e5265;border-radius:12px;background:#09070d}.quick div{padding:10px;text-align:center;font-size:14px;font-weight:800}.main{display:grid;grid-template-columns:1.05fr 1.25fr;gap:10px}.host{min-height:430px;position:relative;background:radial-gradient(circle at 50% 35%,#5a1a63,#170819 58%,#08060b);overflow:hidden}.host .heart{font-size:110px;text-align:center;margin-top:70px;filter:drop-shadow(0 0 20px #ff4bcc)}.host .name{position:absolute;left:18px;bottom:18px;font-size:24px;font-weight:900}.host .wave{position:absolute;left:10px;right:10px;bottom:58px;height:18px;background:linear-gradient(90deg,#1597ff,#7a39ff,#ff2da0,#ff8a00,#d9ff00);border-radius:50%}.guests{padding:10px}.roomhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}.roomtitle{font-size:18px;font-weight:900;color:#6cf2ff}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.seat{min-height:118px;border:1px solid #5d5961;border-radius:10px;background:linear-gradient(#28222c,#0b0a0d);position:relative;padding:8px}.seat::before{content:'👤';position:absolute;inset:20% 0 22%;display:grid;place-items:center;font-size:44px;opacity:.5}.num{position:absolute;left:6px;top:6px;background:#eee;color:#222;border-radius:6px;padding:2px 7px;font-weight:900}.seat span:last-child{position:absolute;left:8px;bottom:8px}.info{margin-top:8px;padding:10px;text-align:center;color:#ff9bd5;font-weight:800}.below{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:10px;margin-top:10px}.box{padding:12px;min-height:170px}.box h3{margin:0 0 10px;text-align:center;color:#d9a8ff}.chat{font-size:14px;line-height:1.7}.gifts{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.gift{text-align:center;border:1px solid #4e4a51;border-radius:9px;padding:10px 4px}.gift b{display:block;font-size:30px}.nav{position:fixed;left:0;right:0;bottom:0;height:74px;background:#060508;border-top:1px solid #433d47;display:grid;grid-template-columns:1fr 1fr 1.6fr 1fr 1fr;align-items:center;z-index:20}.nav button{height:100%;background:none;border:0;color:#fff;font-size:16px;font-weight:900}.start{margin:7px;border:1px solid #ff56b8!important;border-radius:28px;background:#751346!important;box-shadow:0 0 14px #ff2a9b88;font-size:22px!important}.camera{display:none;position:fixed;inset:0;background:#000;z-index:50}.camera.open{display:block}.camera video{width:100%;height:100%;object-fit:cover}.close{position:absolute;left:12px;top:12px;width:46px;height:46px;border:0;border-radius:50%;background:#0009;color:#fff;font-size:28px}@media(max-width:700px){.logo{font-size:20px}.logo small{font-size:11px}.quick div{font-size:11px;padding:8px}.main{grid-template-columns:1fr 1.15fr}.host{min-height:360px}.host .heart{font-size:82px}.grid{grid-template-columns:repeat(2,1fr)}.seat{min-height:86px}.below{grid-template-columns:1fr 1fr}.below .panel:last-child{grid-column:1/3}.nav button{font-size:15px}.start{font-size:20px!important}}</style></head><body><main class="app"><div class="top"><div class="logo">👑 K-Talk <small>비밀방 · 최대 6명</small></div><div class="status">🔴 ON AIR</div></div><div class="quick"><div>★ 출석체크 ★</div><div>🎵 신청곡 5,000원</div><div>★ 광고 문의 환영 ★</div></div><section class="main"><div class="host panel"><div class="heart">💗</div><div class="wave"></div><div class="name">👑 DJ_E.An<br><small>💎 9,999,999 LIVE</small></div></div><div class="guests panel"><div class="roomhead"><div class="roomtitle">호스트 포함 6명 비밀방</div></div><div class="grid" id="grid"></div><div class="info panel">🔒 비밀번호를 아는 회원만 입장할 수 있습니다.</div></div></section><section class="below"><div class="panel box"><h3>채팅</h3><div class="chat">강민수 : 오늘 방송 좋아요! 💜<br>지수 : 매일 듣고 있어요~<br>관리자 : 환영합니다 😊</div></div><div class="panel box"><h3>출석 · 제비뽑기</h3><div style="text-align:center;font-size:18px;line-height:2">☀️ 아침　☀️ 점심　🌙 저녁<br>🎰 제비뽑기</div></div><div class="panel box"><h3>선물 / 후원</h3><div class="gifts"><div class="gift"><b>🌹</b>장미</div><div class="gift"><b>❤️</b>하트</div><div class="gift"><b>⭐</b>별</div><div class="gift"><b>🎈</b>풍선</div><div class="gift"><b>🎁</b>선물상자</div></div></div></section></main><nav class="nav"><button>🏠<br>홈</button><button>👤<br>마이페이지</button><button class="start" id="startBtn">▶ 방송 시작</button><button>🔔<br>알림</button><button>⚙️<br>설정</button></nav><section class="camera" id="camera"><video id="video" autoplay playsinline muted></video><button class="close" id="close">×</button></section><script>const names=['강민수','지수','도레미·비디','사라예','이태훈'];const grid=document.getElementById('grid');grid.innerHTML=names.map((n,i)=>`<div class="seat"><span class="num">${i+1}</span><span>${n} 🌹</span></div>`).join('');let stream=null;const camera=document.getElementById('camera'),video=document.getElementById('video');document.getElementById('startBtn').onclick=async()=>{camera.classList.add('open');try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:true});video.srcObject=stream}catch(e){alert('카메라와 마이크 권한을 허용해 주세요.')}};document.getElementById('close').onclick=()=>{if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;video.srcObject=null;camera.classList.remove('open')};</script></body></html>
