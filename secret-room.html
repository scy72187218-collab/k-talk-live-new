<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><title>K-Talk 비밀방 · 2번</title><style>*{box-sizing:border-box}html,body{margin:0;background:#000;color:#fff;font-family:Arial,'Noto Sans KR',sans-serif}body{overflow:hidden}.app{height:100dvh;background:#020204;padding:7px 7px 66px;overflow:hidden}.top{height:42px;display:flex;align-items:center;justify-content:space-between;gap:6px}.logo{font-size:clamp(16px,4.2vw,28px);font-weight:900;color:#ffd56a;white-space:nowrap}.logo small{font-size:clamp(9px,2.2vw,14px);color:#ff78c7}.status{font-size:clamp(12px,3vw,18px);font-weight:900;white-space:nowrap}.quick{height:48px;display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:4px 0 6px}.quick div,.panel{border:1px solid #5e5265;border-radius:9px;background:#09070d}.quick div{display:flex;align-items:center;justify-content:center;text-align:center;padding:3px;font-size:clamp(8px,2.1vw,13px);font-weight:900;line-height:1.15}.main{height:48%;display:grid;grid-template-columns:46% 54%;gap:5px}.host{position:relative;min-height:0;background:radial-gradient(circle at 50% 35%,#5a1a63,#170819 58%,#08060b);overflow:hidden}.host:before{content:'👑 호스트';position:absolute;left:6px;top:6px;padding:3px 6px;border:1px solid #78505d;border-radius:6px;background:#14090d;color:#ff9aaa;font-size:clamp(7px,1.8vw,11px);font-weight:900}.heart{font-size:clamp(54px,15vw,110px);text-align:center;margin-top:18%;filter:drop-shadow(0 0 12px #ff4bcc)}.name{position:absolute;left:9%;bottom:7%;font-size:clamp(12px,3.2vw,24px);font-weight:900;line-height:1.25}.name small{font-size:.72em}.wave{position:absolute;left:4%;right:4%;bottom:2%;height:8px;background:linear-gradient(90deg,#1597ff,#7a39ff,#ff2da0,#ff8a00,#d9ff00);border-radius:50%}.guests{padding:5px;min-width:0}.roomhead{height:24px;display:flex;align-items:center;justify-content:center}.roomtitle{font-size:clamp(9px,2.35vw,16px);font-weight:900;color:#6cf2ff;text-align:center;white-space:nowrap}.grid{height:calc(100% - 58px);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:4px}.seat{min-width:0;min-height:0;border:1px solid #5d5961;border-radius:7px;background:linear-gradient(#28222c,#0b0a0d);position:relative;padding:4px;overflow:hidden}.seat::before{content:'👤';position:absolute;inset:18% 0 20%;display:grid;place-items:center;font-size:clamp(20px,6vw,40px);opacity:.5}.num{position:absolute;left:3px;top:3px;background:#eee;color:#222;border-radius:4px;padding:1px 4px;font-size:clamp(8px,2vw,12px);font-weight:900}.seat span:last-child{position:absolute;left:4px;right:2px;bottom:4px;font-size:clamp(7px,1.9vw,11px);line-height:1.05}.info{height:30px;margin-top:4px;padding:4px;text-align:center;color:#ff9bd5;font-size:clamp(7px,1.75vw,10px);font-weight:800;display:flex;align-items:center;justify-content:center;line-height:1.1}.below{height:31%;display:grid;grid-template-columns:1fr 1fr 1.35fr;gap:5px;margin-top:5px}.box{padding:5px;min-width:0;min-height:0;overflow:hidden}.box h3{height:19px;margin:0;text-align:center;color:#d9a8ff;font-size:clamp(8px,2vw,12px)}.chat{font-size:clamp(7px,1.8vw,10px);line-height:1.6}.event{text-align:center;font-size:clamp(8px,2vw,12px);line-height:1.7}.gifts{height:calc(100% - 21px);display:grid;grid-template-columns:repeat(5,1fr);gap:3px}.gift{text-align:center;border:1px solid #4e4a51;border-radius:6px;padding:2px 1px;font-size:clamp(6px,1.6vw,9px);display:flex;flex-direction:column;align-items:center;justify-content:center}.gift b{display:block;font-size:clamp(18px,5vw,28px);line-height:1}.nav{position:fixed;left:0;right:0;bottom:0;height:62px;background:#060508;border-top:1px solid #433d47;display:grid;grid-template-columns:1fr 1fr 1.7fr 1fr 1fr;align-items:center;z-index:20}.nav button{height:100%;background:none;border:0;color:#fff;font-size:clamp(11px,3vw,16px);font-weight:900;line-height:1.15}.start{margin:5px;border:1px solid #ff56b8!important;border-radius:24px;background:#751346!important;box-shadow:0 0 12px #ff2a9b88;font-size:clamp(16px,4.3vw,23px)!important}.camera{display:none;position:fixed;inset:0;background:#000;z-index:50}.camera.open{display:block}.camera video{width:100%;height:100%;object-fit:cover}.close{position:absolute;left:12px;top:12px;width:46px;height:46px;border:0;border-radius:50%;background:#0009;color:#fff;font-size:28px}</style></head><body><main class="app"><div class="top"><div class="logo">👑 K-Talk <small>비밀방 · 최대 6명</small></div><div class="status">🔴 ON AIR</div></div><div class="quick"><div>★ 출석체크 ★</div><div>🎵 신청곡 5,000원</div><div>★ 광고 문의 환영 ★</div></div><section class="main"><div class="host panel"><div class="heart">💗</div><div class="wave"></div><div class="name">👑 DJ_E.An<br><small>💎 9,999,999 LIVE</small></div></div><div class="guests panel"><div class="roomhead"><div class="roomtitle">호스트 포함 6명 비밀방</div></div><div class="grid" id="grid"></div><div class="info panel">🔒 비밀번호를 아는 회원만 입장할 수 있습니다.</div></div></section><section class="below"><div class="panel box"><h3>채팅 · 참가자 6</h3><div class="chat">강민수 : 오늘 방송 좋아요! 💜<br>지수 : 매일 듣고 있어요~<br>사라예 : 추천곡 부탁드려요!<br>관리자 : 환영합니다 😊</div></div><div class="panel box"><h3>출석 · 제비뽑기</h3><div class="event">☀️ 아침　☀️ 점심　🌙 저녁<br>✅ 출석체크<br>🎰 제비뽑기</div></div><div class="panel box"><h3>선물 / 후원</h3><div class="gifts"><div class="gift"><b>🌹</b>장미</div><div class="gift"><b>❤️</b>하트</div><div class="gift"><b>⭐</b>별</div><div class="gift"><b>🎈</b>풍선</div><div class="gift"><b>🎁</b>선물상자</div></div></div></section></main><nav class="nav"><button>🏠<br>홈</button><button>👤<br>마이페이지</button><button class="start" id="startBtn">▶ 방송 시작</button><button>🔔<br>알림</button><button>⚙️<br>설정</button></nav><section class="camera" id="camera"><video id="video" autoplay playsinline muted></video><button class="close" id="close">×</button></section><script>const names=['강민수','지수','도레미·비디','사라예','이태훈'];const grid=document.getElementById('grid');grid.innerHTML=names.map((n,i)=>`<div class="seat"><span class="num">${i+1}</span><span>${n} 🌹</span></div>`).join('')+'<div class="seat"><span class="num">6</span><span>🔒 빈자리</span></div>';let stream=null;const camera=document.getElementById('camera'),video=document.getElementById('video');document.getElementById('startBtn').onclick=async()=>{camera.classList.add('open');try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:true});video.srcObject=stream}catch(e){alert('카메라와 마이크 권한을 허용해 주세요.')}};document.getElementById('close').onclick=()=>{if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;video.srcObject=null;camera.classList.remove('open')};</script></body></html>
