<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>K-Talk 실제 얼굴 AR 25</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif}
*{box-sizing:border-box}
#wrap{position:fixed;inset:0;background:#000}
#jeeFaceFilterCanvas{position:absolute;inset:0;width:100%;height:100%}
#top{position:absolute;z-index:30;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;display:flex;align-items:center;gap:8px}
#top b{flex:1;color:#fff;font-size:16px;text-shadow:0 2px 7px #000}
#top a{border:1px solid #ffffff40;border-radius:999px;background:#000a;color:#fff;padding:9px 13px;text-decoration:none;font-size:12px;font-weight:900;backdrop-filter:blur(8px)}
#status{position:absolute;z-index:26;left:50%;top:58px;transform:translateX(-50%);min-width:220px;max-width:86vw;text-align:center;padding:8px 12px;border-radius:999px;background:#0009;border:1px solid #ffffff22;color:#fff;font-weight:850;font-size:11px;backdrop-filter:blur(8px)}
#panel{position:absolute;z-index:28;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));padding:8px;border-radius:18px;background:linear-gradient(180deg,#17111ee8,#08070de8);border:1px solid #ffffff22;box-shadow:0 8px 30px #000a;backdrop-filter:blur(13px)}
#panelHead{display:flex;align-items:center;gap:8px;margin:0 2px 7px;color:#fff}
#panelHead b{font-size:12px}
#panelHead span{margin-left:auto;color:#ffd87a;font-size:9px;font-weight:800}
#effects{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;max-height:224px;overflow:auto}
.fx{min-width:0;height:55px;border:1px solid #ffffff18;border-radius:12px;background:#17131d;color:#fff;padding:4px 1px;font-size:9px;font-weight:850}
.fx i{display:block;font-style:normal;font-size:22px;line-height:25px;margin-bottom:2px}
.fx.on{border-color:#ff60d5;background:#40162f;box-shadow:0 0 0 1px #ff60d555 inset,0 0 12px #ff4fd633}
@media(max-width:390px){#effects{max-height:205px}.fx{height:51px;font-size:8px}.fx i{font-size:20px}}
</style>
<script src="https://cdn.jsdelivr.net/gh/jeeliz/jeelizFaceFilter@master/dist/jeelizFaceFilter.js"></script>
<script src="https://cdn.jsdelivr.net/gh/jeeliz/jeelizFaceFilter@master/libs/three/v97/three.js"></script>
<script src="https://cdn.jsdelivr.net/gh/jeeliz/jeelizFaceFilter@master/helpers/JeelizResizer.js"></script>
<script src="https://cdn.jsdelivr.net/gh/jeeliz/jeelizFaceFilter@master/helpers/JeelizThreeHelper.js"></script>
</head>
<body>
<div id="wrap">
  <canvas id="jeeFaceFilterCanvas"></canvas>
  <div id="top"><b>K-Talk · 실제 얼굴 AR 효과</b><a href="/">닫기</a></div>
  <div id="status">카메라 준비 중…</div>
  <div id="panel">
    <div id="panelHead"><b>얼굴에 붙어서 같이 움직이는 효과 25개</b><span>고개를 좌우로 움직여 보세요</span></div>
    <div id="effects"></div>
  </div>
</div>
<script>
(function(){
  var CAMERA=null, threeStuffs=null, faceObj=null, SPEC=null;
  var activeGroup=null, activeMask=null, maskGeometry=null, pendingEffect='';
  var status=document.getElementById('status');
  var effectsEl=document.getElementById('effects');

  var EFFECTS=[
    ['🐱','고양이 귀','cat'],
    ['🐶','강아지 귀','dogEars'],
    ['🐰','토끼 귀','bunny'],
    ['🐻','곰 귀','bear'],
    ['🦊','여우 귀','fox'],
    ['😈','악마 뿔','horns'],
    ['👑','왕관','crown'],
    ['😇','천사링','halo'],
    ['👓','안경','glasses'],
    ['🕶️','선글라스','sunglasses'],
    ['⭐','별안경','starGlasses'],
    ['🐕','강아지 코','dogNose'],
    ['😺','고양이 수염','whiskers'],
    ['🥸','콧수염','moustache'],
    ['🧔','수염','beard'],
    ['🌸','꽃머리','flowers'],
    ['✨','반짝이','sparkles'],
    ['💕','하트','hearts'],
    ['🥳','파티','party'],
    ['💡','네온 마스크','neon'],
    ['🐼','판다 눈','panda'],
    ['🐯','호랑이 무늬','tiger'],
    ['😊','볼터치','blush'],
    ['↕️','얼굴 길게','faceLong'],
    ['↔️','얼굴 넓게','faceWide']
  ];

  effectsEl.innerHTML=EFFECTS.map(function(e,i){
    return '<button class="fx'+(i===0?' on':'')+'" data-name="'+e[2]+'"><i>'+e[0]+'</i>'+e[1]+'</button>';
  }).join('');

  effectsEl.addEventListener('click',function(ev){
    var btn=ev.target.closest('.fx');
    if(!btn)return;
    effectsEl.querySelectorAll('.fx').forEach(function(b){b.classList.toggle('on',b===btn);});
    selectEffect(btn.getAttribute('data-name'));
  });

  function detected(a,b){
    var yes=(typeof b==='boolean')?b:a;
    status.textContent=yes?'얼굴 추적 중 · 효과가 얼굴 회전과 같이 움직입니다':'얼굴을 카메라에 보여주세요';
  }

  function phong(color,opacity){
    return new THREE.MeshPhongMaterial({
      color:color,
      transparent:typeof opacity==='number' && opacity<1,
      opacity:typeof opacity==='number'?opacity:1,
      shininess:65,
      specular:0xffffff,
      side:THREE.DoubleSide
    });
  }
  function basic(color,opacity){
    return new THREE.MeshBasicMaterial({
      color:color,
      transparent:typeof opacity==='number' && opacity<1,
      opacity:typeof opacity==='number'?opacity:1,
      side:THREE.DoubleSide
    });
  }
  function add(g,geo,mat,p,s,r){
    var m=new THREE.Mesh(geo,mat);
    p=p||[0,0,0];s=s||[1,1,1];r=r||[0,0,0];
    m.position.set(p[0],p[1],p[2]);
    m.scale.set(s[0],s[1],s[2]);
    m.rotation.set(r[0],r[1],r[2]);
    m.frustumCulled=false;
    m.renderOrder=10000;
    g.add(m);
    return m;
  }
  function coneEar(g,x,color,tilt){
    add(g,new THREE.ConeGeometry(.22,.56,3),phong(color),[x,.58,.24],[1,1,.55],[0,0,tilt]);
    add(g,new THREE.ConeGeometry(.11,.31,3),phong(0xf2a1b9),[x,.58,.29],[1,1,.4],[0,0,tilt]);
  }
  function floppyEar(g,x,flip){
    add(g,new THREE.SphereGeometry(.25,20,14),phong(0x6d4733),[x,.43,.19],[.65,1.45,.38],[0,0,flip*.35]);
  }
  function roundEar(g,x,color){
    add(g,new THREE.SphereGeometry(.24,20,14),phong(color),[x,.55,.20],[1,.92,.42]);
    add(g,new THREE.SphereGeometry(.13,20,14),phong(0xd29b80),[x,.55,.28],[1,.92,.28]);
  }
  function glasses(g,dark){
    var rim=dark?phong(0xe1c26f):phong(0x30333a);
    [-.29,.29].forEach(function(x){
      add(g,new THREE.TorusGeometry(.245,.035,10,28),rim,[x,.08,.50],[1,.78,1]);
      if(dark)add(g,new THREE.CircleGeometry(.215,30),basic(0x111722,.78),[x,.08,.485],[1,.78,1]);
    });
    add(g,new THREE.BoxGeometry(.18,.035,.03),rim,[0,.08,.50]);
  }
  function starShape(){
    var sh=new THREE.Shape();
    for(var i=0;i<10;i++){
      var a=Math.PI/2+i*Math.PI/5;
      var r=i%2===0?.25:.11;
      var x=Math.cos(a)*r,y=Math.sin(a)*r;
      if(i===0)sh.moveTo(x,y);else sh.lineTo(x,y);
    }
    sh.closePath();
    return sh;
  }
  function heartShape(){
    var sh=new THREE.Shape();
    for(var i=0;i<=60;i++){
      var t=i/60*Math.PI*2;
      var x=16*Math.pow(Math.sin(t),3)/34;
      var y=(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))/34;
      if(i===0)sh.moveTo(x,y);else sh.lineTo(x,y);
    }
    sh.closePath();
    return sh;
  }
  function makeGroup(name){
    var g=new THREE.Group();
    if(name==='cat'){
      coneEar(g,-.43,0x33252b,-.20);coneEar(g,.43,0x33252b,.20);
    }else if(name==='dogEars'){
      floppyEar(g,-.48,-1);floppyEar(g,.48,1);
    }else if(name==='bunny'){
      add(g,new THREE.SphereGeometry(.18,18,14),phong(0xf3edf3),[-.28,.76,.20],[.75,2.05,.34],[0,0,-.13]);
      add(g,new THREE.SphereGeometry(.18,18,14),phong(0xf3edf3),[.28,.76,.20],[.75,2.05,.34],[0,0,.13]);
      add(g,new THREE.SphereGeometry(.095,18,14),phong(0xf3a8c2),[-.28,.77,.27],[.7,1.7,.2],[0,0,-.13]);
      add(g,new THREE.SphereGeometry(.095,18,14),phong(0xf3a8c2),[.28,.77,.27],[.7,1.7,.2],[0,0,.13]);
    }else if(name==='bear'){
      roundEar(g,-.43,0x7b553d);roundEar(g,.43,0x7b553d);
    }else if(name==='fox'){
      coneEar(g,-.43,0xb65a2f,-.22);coneEar(g,.43,0xb65a2f,.22);
    }else if(name==='horns'){
      add(g,new THREE.ConeGeometry(.13,.5,16),phong(0xb72038),[-.38,.64,.25],[1,1,.65],[0,0,-.27]);
      add(g,new THREE.ConeGeometry(.13,.5,16),phong(0xb72038),[.38,.64,.25],[1,1,.65],[0,0,.27]);
    }else if(name==='crown'){
      add(g,new THREE.BoxGeometry(.88,.18,.10),phong(0xf6c339),[0,.61,.26]);
      [-.34,-.17,0,.17,.34].forEach(function(x,i){
        add(g,new THREE.ConeGeometry(.12,i===2?.45:.34,4),phong(0xffd75c),[x,.82+(i===2?.05:0),.26],[1,1,.7]);
      });
    }else if(name==='halo'){
      add(g,new THREE.TorusGeometry(.48,.045,12,36),phong(0xffe680),[0,.83,.22],[1,.36,1]);
    }else if(name==='glasses'){
      glasses(g,false);
    }else if(name==='sunglasses'){
      glasses(g,true);
    }else if(name==='starGlasses'){
      var geo=new THREE.ShapeGeometry(starShape());
      add(g,geo,phong(0xffd33f),[-.29,.09,.52],[1,.78,1]);
      add(g,geo,phong(0xffd33f),[.29,.09,.52],[1,.78,1]);
      add(g,new THREE.BoxGeometry(.16,.035,.03),phong(0xffd33f),[0,.09,.52]);
    }else if(name==='dogNose'){
      add(g,new THREE.SphereGeometry(.18,24,16),phong(0x1b1415),[0,-.04,.61],[1,.63,.72]);
      add(g,new THREE.BoxGeometry(.025,.20,.025),phong(0x332327),[0,-.16,.58]);
    }else if(name==='whiskers'){
      add(g,new THREE.SphereGeometry(.13,22,14),phong(0xd77991),[0,-.03,.61],[1,.68,.45]);
      [-1,1].forEach(function(side){
        [-.08,0,.08].forEach(function(dy,j){
          add(g,new THREE.BoxGeometry(.48,.012,.012),basic(0xf7f3ee,.9),[side*.35,-.13+dy,.58],[1,1,1],[0,0,side*(.04+(j-1)*.05)]);
        });
      });
    }else if(name==='moustache'){
      add(g,new THREE.SphereGeometry(.24,20,12),phong(0x2b1d18),[-.17,-.22,.59],[1.25,.42,.28],[0,0,.14]);
      add(g,new THREE.SphereGeometry(.24,20,12),phong(0x2b1d18),[.17,-.22,.59],[1.25,.42,.28],[0,0,-.14]);
    }else if(name==='beard'){
      add(g,new THREE.SphereGeometry(.48,24,16),phong(0x332219,.88),[0,-.37,.42],[1,.70,.22]);
    }else if(name==='flowers'){
      var cs=[0xff6fa8,0xffd56b,0xff8ac3,0xffffff,0xff72ad];
      [-.42,-.21,0,.21,.42].forEach(function(x,i){
        add(g,new THREE.SphereGeometry(.12,18,12),phong(cs[i]),[x,.60+(.04*Math.cos(i)),.30],[1,.8,.38]);
      });
    }else if(name==='sparkles'){
      [[-.55,.34],[.55,.24],[-.46,-.32],[.48,-.26],[0,.70],[.02,-.55]].forEach(function(p,i){
        add(g,new THREE.OctahedronGeometry(i%2?.09:.13),phong(i%2?0xbfefff:0xffe98d),[p[0],p[1],.55]);
      });
    }else if(name==='hearts'){
      var hgeo=new THREE.ShapeGeometry(heartShape());
      [[-.55,.28],[.55,.21],[-.45,-.34],[.45,-.31]].forEach(function(p,i){
        add(g,hgeo,phong(i%2?0xff5ea8:0xff86bd),[p[0],p[1],.55],[.85,.85,1],[0,0,i%2?.18:-.18]);
      });
    }else if(name==='party'){
      add(g,new THREE.ConeGeometry(.28,.72,24),phong(0x8f5cff),[0,.72,.20],[1,.85,.65],[0,0,-.10]);
      [[-.52,.25],[.52,.30],[-.42,-.25],[.40,-.23],[0,.08]].forEach(function(p,i){
        add(g,new THREE.OctahedronGeometry(.08),phong([0xff4f9c,0x5fe1ff,0xffe15b][i%3]),[p[0],p[1],.55]);
      });
    }else if(name==='neon'){
      add(g,new THREE.TorusGeometry(.55,.028,10,48),basic(0x55ffff,.95),[0,.02,.48],[1,1.18,1]);
      add(g,new THREE.TorusGeometry(.46,.018,10,48),basic(0xff63dd,.9),[0,.02,.50],[1,1.16,1]);
    }else if(name==='panda'){
      add(g,new THREE.SphereGeometry(.24,20,12),basic(0x15161a,.78),[-.28,.09,.54],[1.05,.55,.16],[0,0,.12]);
      add(g,new THREE.SphereGeometry(.24,20,12),basic(0x15161a,.78),[.28,.09,.54],[1.05,.55,.16],[0,0,-.12]);
    }else if(name==='tiger'){
      [-.46,-.34,.34,.46].forEach(function(x,i){
        add(g,new THREE.BoxGeometry(.10,.36,.025),basic(0x3b1d08,.60),[x,.08+(i%2?.12:-.05),.54],[1,1,1],[0,0,x<0?-.30:.30]);
      });
      [-.15,0,.15].forEach(function(x){
        add(g,new THREE.BoxGeometry(.07,.28,.025),basic(0x3b1d08,.55),[x,.43,.54],[1,1,1],[0,0,x*.9]);
      });
    }else if(name==='blush'){
      add(g,new THREE.SphereGeometry(.23,20,12),basic(0xff679a,.34),[-.39,-.08,.54],[1.15,.50,.12]);
      add(g,new THREE.SphereGeometry(.23,20,12),basic(0xff679a,.34),[.39,-.08,.54],[1.15,.50,.12]);
    }
    return g;
  }

  function buildDeformMaterial(defs){
    var code='';
    defs.forEach(function(d,i){
      code+='const vec2 TP'+i+'=vec2('+d[0]+','+d[1]+');\\n';
      code+='const vec2 DP'+i+'=vec2('+d[2]+','+d[3]+');\\n';
      code+='const float RR'+i+'='+d[4]+';\\n';
    });
    var apply='';
    defs.forEach(function(d,i){
      apply+='float f'+i+'=1.-smoothstep(0.0,RR'+i+',distance(TP'+i+',position.xy));\\n';
      apply+='positionDeformed.xy+=f'+i+'*DP'+i+';\\n';
    });
    var vs='uniform mat2 videoTransformMat2;\\n'
      +'varying vec2 vUVvideo;\\n'+code
      +'void main(){\\n'
      +'vec3 positionDeformed=position;\\n'+apply
      +'vec4 mvPosition=modelViewMatrix*vec4(positionDeformed,1.0);\\n'
      +'vec4 projectedPosition=projectionMatrix*mvPosition;\\n'
      +'gl_Position=projectedPosition;\\n'
      +'vec4 mvPosition0=modelViewMatrix*vec4(position,1.0);\\n'
      +'vec4 projectedPosition0=projectionMatrix*mvPosition0;\\n'
      +'vUVvideo=vec2(0.5)+videoTransformMat2*projectedPosition0.xy/projectedPosition0.w;\\n'
      +'}';
    var fs='precision mediump float;\\nuniform sampler2D samplerVideo;\\nvarying vec2 vUVvideo;\\nvoid main(){gl_FragColor=texture2D(samplerVideo,vUVvideo);}';
    return new THREE.ShaderMaterial({
      vertexShader:vs,
      fragmentShader:fs,
      uniforms:{
        samplerVideo:{value:JeelizThreeHelper.get_threeVideoTexture()},
        videoTransformMat2:{value:SPEC.videoTransformMat2}
      }
    });
  }

  function clearEffect(){
    if(faceObj&&activeGroup){faceObj.remove(activeGroup);activeGroup=null;}
    if(faceObj&&activeMask){faceObj.remove(activeMask);activeMask=null;}
  }

  function applyDeform(name){
    if(!maskGeometry){
      pendingEffect=name;
      status.textContent='얼굴 변형 효과 준비 중…';
      return;
    }
    var defs=name==='faceLong'
      ? [[0,-.48,0,-.16,.45],[-.28,-.18,.03,-.03,.32],[.28,-.18,-.03,-.03,.32]]
      : [[-.30,-.20,-.12,0,.38],[.30,-.20,.12,0,.38],[0,-.48,0,.03,.30]];
    activeMask=new THREE.Mesh(maskGeometry,buildDeformMaterial(defs));
    activeMask.frustumCulled=false;
    activeMask.scale.multiplyScalar(1.2);
    activeMask.position.set(0,.2,-.5);
    activeMask.renderOrder=9999;
    faceObj.add(activeMask);
  }

  function selectEffect(name){
    pendingEffect=name;
    if(!faceObj)return;
    clearEffect();
    if(name==='faceLong'||name==='faceWide'){
      applyDeform(name);
    }else{
      activeGroup=makeGroup(name);
      faceObj.add(activeGroup);
    }
  }

  function preloadMask(){
    var loader=new THREE.BufferGeometryLoader();
    loader.load(
      'https://cdn.jsdelivr.net/gh/jeeliz/jeelizFaceFilter@master/demos/threejs/faceDeform/models/faceLowPoly.json',
      function(g){
        g.computeVertexNormals();
        maskGeometry=g;
        if(pendingEffect==='faceLong'||pendingEffect==='faceWide'){
          clearEffect();
          applyDeform(pendingEffect);
        }
      }
    );
  }

  function initThree(spec){
    SPEC=spec;
    threeStuffs=JeelizThreeHelper.init(spec,detected);
    faceObj=threeStuffs.faceObject;

    threeStuffs.scene.add(new THREE.AmbientLight(0xffffff,.88));
    var dl=new THREE.DirectionalLight(0xffffff,.62);
    dl.position.set(100,1000,1000);
    threeStuffs.scene.add(dl);

    CAMERA=JeelizThreeHelper.create_camera();
    preloadMask();
    selectEffect('cat');
    status.textContent='얼굴을 카메라에 보여주세요';
  }

  function initFace(videoSettings){
    JEELIZFACEFILTER.init({
      canvasId:'jeeFaceFilterCanvas',
      NNCPath:'https://cdn.jsdelivr.net/gh/jeeliz/jeelizFaceFilter@master/neuralNets/',
      videoSettings:videoSettings,
      followZRot:true,
      maxFacesDetected:1,
      callbackReady:function(err,spec){
        if(err){status.textContent='AR 카메라 시작 실패: '+err;return;}
        initThree(spec);
      },
      callbackTrack:function(ds){
        if(threeStuffs&&CAMERA)JeelizThreeHelper.render(ds,CAMERA);
      }
    });
  }

  JeelizResizer.size_canvas({
    canvasId:'jeeFaceFilterCanvas',
    overSamplingFactor:1,
    callback:function(err,best){
      if(err){status.textContent='화면 준비 실패';return;}
      initFace(best);
    }
  });
})();
</script>
</body>
</html>
