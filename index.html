0;border-radius:6px;padding:0 10px;background:#8b39f0;color:#fff;font-weight:900}.nav{position:fixed;z-index:10;bottom:0;left:0;right:0;height:64px;background:#030305f5;border-top:1px solid #ffffff18;display:grid;grid-template-columns:repeat(5,1fr);align-items:center}.nav button{border:0;background:transparent;color:#ddd;font-size:9px;height:64px}.nav strong{display:block;font-size:18px}.plusBtn{width:54px!important;height:44px!important;border-radius:13px;background:#fff!important;color:#111!important;font-size:31px!important;margin:auto;box-shadow:inset 5px 0 #20d5ec,inset -5px 0 #fe2c55}.sheet{display:none;position:fixed;z-index:30;inset:0;background:#050505}.sheet.open{display:block}.camera{height:100%;overflow:hidden;padding:0 0 8px;display:flex;flex-direction:column}.camTop{height:48px;flex:0 0 48px;display:flex;align-items:center;justify-content:space-between;padding:4px 12px}.close{width:38px;height:38px;border:0;background:#171717;color:#fff;border-radius:50%;font-size:26px}.camTop b{font-size:15px}.preview{height:33vh;min-height:190px;max-height:300px;margin:0 10px;border-radius:16px;background:#171717;display:grid;place-items:center;font-size:50px;flex:0 0 auto}.captureRow{display:flex;align-items:center;justify-content:center;gap:24px;padding:8px 8px 3px;flex:0 0 auto}.round{width:42px;height:42px;border-radius:50%;border:0;background:#222;color:#fff;font-size:18px}.capture{width:62px;height:62px;border-radius:50%;border:5px solid #fff;background:#ef3340}.modes{display:flex;justify-content:center;gap:13px;margin:1px 0 5px;flex:0 0 auto}.modes button{border:0;background:none;color:#aaa;padding:5px 4px;font-size:14px}.modes .on{color:#fff;font-weight:900}.rooms{padding:0 10px 5px;flex:1;min-height:0}.rooms h3{font-size:14px;margin:3px 2px 6px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.room{min-height:55px;border:1px solid #ffffff22;background:#151515;color:#fff;border-radius:11px;font-weight:900;font-size:14px;padding:5px 2px}.room span{display:block;font-size:19px;line-height:21px}.toast{display:none;position:fixed;z-index:50;left:50%;bottom:90px;transform:translateX(-50%);background:#222;padding:9px 13px;border-radius:9px}.toast.show{display:block}@media(max-height:700px){.preview{height:29vh;min-height:155px}.capture{width:56px;height:56px}.round{width:38px;height:38px}.room{min-height:49px;font-size:12px}.room span{font-size:17px}}</style></head><body><main class="feed" id="feed"><section class="page female"><div class="photo"></div><div class="shade"></div><div class="top"><div class="host"><div class="avatar"></div><span>AI 소라</span><span class="live">● LIVE</span></div><span class="viewer">👤 125</span></div><aside class="side"><button class="gift">🌹<small>1</small></button><button class="gift">💐<small>5</small></button><button class="gift">🌹<small>10</small></button><button class="gift">🎁<small>선물</small></button></aside><div class="info"><h2>AI 소라 · 1인 방송</h2><div class="chatbox"><div class="messages">소라: 어서 오세요. 반갑습니다.<br>해피걸: 오늘 방송 좋아요 👍<br>지수: 반가워요 💕</div><div class="composer"><input placeholder="메시지 입력"><button>전송</button></div></div></div></section><section class="page male"><div class="photo"></div><div class="shade"></div><div class="top"><div class="host"><div class="avatar"></div><span>AI 준호</span><span class="live">● LIVE</span></div><span class="viewer">👤 98</span></div><aside class="side"><button class="gift">🌹<small>1</small></button><button class="gift">💐<small>5</small></button><button class="gift">🌹<small>10</small></button><button class="gift">🎁<small>선물</small></button></aside><div class="info"><h2>AI 준호 · 1인 방송</h2><div class="chatbox"><div class="messages">준호: 안녕하세요. 즐겁게 시청하세요.<br>민수: 반갑습니다 👋<br>태훈: 오늘도 왔어요 👍</div><div class="composer"><input placeholder="메시지 입력"><button>전송</button></div></div></div></section></main><nav class="nav"><button><strong>⌂</strong>홈</button><button><strong>♧</strong>친구</button><button class="plusBtn" id="plusBtn">＋</button><button><strong>▦</strong>알림</button><button><strong>♙</strong>프로필</button></nav><section class="sheet" id="sheet"><div class="camera"><div class="camTop"><button class="close" id="close">×</button><b>게시 · 촬영 · 라이브</b><div style="width:38px"></div></div><div class="preview">📷</div><div class="captureRow"><button class="round" id="flip">↻</button><button class="capture" id="capture"></button><button class="round" id="upload">▣</button></div><div class="modes"><button data-mode="15초">15초</button><button class="on" data-mode="60초">60초</button><button data-mode="사진">사진</button><button data-mode="게시물">게시물</button></div><div class="rooms"><h3>라이브 방송</h3><div class="grid"><button class="room"><span>🎙️</span>1인 방송</button><button class="room"><span>👥</span>13명 방송</button><button class="room"><span>👑</span>VIP 방송</button><button class="room"><span>🔒</span>비밀방</button><button class="room"><span>🎬</span>영화방</button><button class="room"><span>🎧</span>DJ방</button></div></div></div></section><div class="toast" id="toast"></div><script>const sheet=document.getElementById('sheet'),toast=document.getElementById('toast');plusBtn.onclick=()=>sheet.classList.add('open');close.onclick=()=>sheet.classList.remove('open');function msg(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1200)}document.querySelectorAll('.modes button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.modes button').forEach(x=>x.classList.remove('on'));b.classList.add('on');msg(b.dataset.mode)});capture.onclick=()=>msg('촬영 시작');upload.onclick=()=>msg('사진·동영상 올리기');flip.onclick=()=>msg('카메라 전환');document.querySelectorAll('.room').forEach(b=>b.onclick=()=>msg(b.textContent.trim()+' 선택'));</script></body></html>
