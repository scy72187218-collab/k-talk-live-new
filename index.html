<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>K-Talk LIVE</title><style>*{box-sizing:border-box}html,body{margin:0;background:#050507;color:#fff;font-family:Arial,"Noto Sans KR",sans-serif}button,input{font:inherit}.app{max-width:520px;height:100dvh;margin:auto;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 22%,#63307c,#160d20 42%,#050507 75%)}.shade{position:absolute;inset:0;background:linear-gradient(180deg,#0003,transparent 40%,#000c)}.top{position:absolute;z-index:3;top:14px;left:14px;right:14px;display:flex;justify-content:space-between}.live{background:#f0184d;padding:8px 12px;border-radius:10px;font-weight:900}.brand{position:absolute;z-index:3;top:66px;left:16px;color:#ffd46d;font-size:23px;font-weight:900}.led{position:absolute;z-index:3;top:105px;left:14px;right:14px;padding:10px 12px;border:1px solid #b47cff33;border-radius:12px;background:#170d26dd;color:#f2d9ff;font-weight:800;text-align:center;box-shadow:0 0 12px #8d36ff33}.chat{position:absolute;z-index:3;left:14px;right:90px;bottom:132px}.msg{margin:7px 0;font-size:13px;text-shadow:0 1px 3px #000}.msg b{color:#ffd05c}.gifts{position:absolute;z-index:4;right:12px;bottom:145px;display:grid;gap:8px}.gift{width:58px;min-height:55px;border:1px solid #ffffff1c;border-radius:18px;background:#0d0b13d9;color:#fff;font-size:22px}.gift small{display:block;font-size:10px}.composer{position:absolute;z-index:4;left:12px;right:12px;bottom:70px;display:grid;grid-template-columns:1fr 46px;gap:7px}.composer input{height:46px;border:1px solid #8752cc55;border-radius:24px;background:#111018e8;color:#fff;padding:0 16px}.composer button{border:1px solid #ffffff22;border-radius:50%;background:#17131f;color:#fff}.nav{position:absolute;z-index:5;bottom:0;left:0;right:0;height:64px;background:#08080bf2;border-top:1px solid #ffffff12;display:grid;grid-template-columns:1fr 1fr 78px 1fr 1fr;align-items:center}.nav button{border:0;background:transparent;color:#bbb;font-size:10px;height:100%}.nav span{display:block;font-size:19px}.plus{width:62px!important;height:62px!important;margin-top:-25px;border:2px solid #fff!important;border-radius:50%;background:linear-gradient(135deg,#ff3b87,#8d36ff)!important;color:#fff!important;font-size:32px!important;box-shadow:0 5px 24px #a442ff99,0 0 0 5px #08080b}.sheet{display:none;position:fixed;z-index:30;inset:0;background:#07030ff2;align-items:center;justify-content:center;padding:10px}.sheet.open{display:flex}.panel{width:min(500px,100%);max-height:calc(100dvh - 18px);overflow:hidden;position:relative;background:radial-gradient(circle at 50% -10%,#7b2ecf55,transparent 36%),radial-gradient(circle at 15% 30%,#ff2f8e33,transparent 30%),radial-gradient(circle at 90% 55%,#3c7dff2b,transparent 32%),linear-gradient(180deg,#1b1026 0%,#100b18 48%,#09070d 100%);border:1px solid #f2d48c24;border-radius:26px;padding:10px 12px 12px;box-shadow:0 0 38px #8d36ff30,inset 0 0 35px #ffffff08}.panel:before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(120deg,transparent 0 35%,#ffffff08 45%,transparent 55%);opacity:.45}.head{position:relative;text-align:center;padding-top:2px}.head .crown{font-size:22px;color:#ffd66e;filter:drop-shadow(0 0 8px #ffca4a66)}.head h2{color:#ffe0a3;margin:0;font-size:24px;text-shadow:0 0 12px #ffb84d33}.head small{font-size:11px;color:#efe6f3}.close{position:absolute;right:2px;top:0;background:#ffffff0b;border:1px solid #ffffff16;border-radius:50%;width:34px;height:34px;color:#fff;font-size:24px;line-height:30px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}.card{position:relative;overflow:hidden;border:1px solid #ffffff12;border-radius:16px;background:linear-gradient(145deg,#24152fdd,#15101cdd);color:#fff;padding:8px 6px;min-height:74px;box-shadow:inset 0 0 16px #ffffff08,0 5px 14px #0005}.card:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 0,#b85cff22,transparent 45%);pointer-events:none}.card:nth-child(2):before{background:radial-gradient(circle at 80% 0,#ff4b9a24,transparent 45%)}.card:nth-child(3):before{background:radial-gradient(circle at 25% 0,#ffb23f1f,transparent 45%)}.card:nth-child(4):before{background:radial-gradient(circle at 80% 0,#ff64cf22,transparent 45%)}.card:nth-child(5):before{background:radial-gradient(circle at 20% 0,#5aa5ff22,transparent 45%)}.card:nth-child(6):before{background:radial-gradient(circle at 80% 0,#9f7dff25,transparent 45%)}.card:active{transform:scale(.98);background:#2a1836}.card i{position:relative;font-size:21px;font-style:normal;filter:drop-shadow(0 0 7px #ffffff33)}.card b{position:relative;display:block;color:#ffe0a3;margin:3px;font-size:15px}.card small{position:relative;font-size:10px;color:#f3edf5}.wide{grid-column:1/-1;min-height:54px;display:grid;grid-template-columns:42px 1fr;align-items:center;text-align:left;padding:7px 12px;background:linear-gradient(100deg,#261535dd,#17101edd)}.wide i{font-size:24px;text-align:center}.wide b{margin:0 0 2px}.wide small{font-size:10px}.recharge{display:none;position:fixed;z-index:60;inset:0;background:#07030ff2;place-items:center}.recharge.open{display:grid}.box{width:min(390px,90%);background:linear-gradient(180deg,#21132d,#0d0912);border:1px solid #ffffff1c;border-radius:22px;padding:20px;text-align:center;box-shadow:0 0 26px #8d36ff33}.box h2{color:#ffd26b}.packs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pack{padding:14px;border:1px solid #ffffff18;border-radius:14px;background:#21152e;color:#fff}.balance{color:#ffd05c;font-weight:900}.toast{display:none;position:fixed;z-index:80;left:50%;bottom:90px;transform:translateX(-50%);background:#111;border:1px solid #555;border-radius:12px;padding:10px 14px;white-space:nowrap}.room{display:none;position:fixed;z-index:45;inset:0;background:radial-gradient(circle at 50% 15%,#3a1848,#09070c 62%);color:#fff}.room.open{display:block}.roomTop{height:70px;padding:18px 16px 8px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #ffffff0f}.back{width:40px;height:40px;border-radius:50%;border:1px solid #ffffff1a;background:#151019;color:#fff;font-size:23px}.roomTitle{font-size:20px;font-weight:900;color:#f5d798}.roomBody{padding:16px;height:calc(100dvh - 70px);overflow:auto}.hero{border:1px solid #ffffff12;border-radius:20px;background:linear-gradient(145deg,#211329,#110d15);padding:18px;text-align:center;min-height:160px;display:grid;place-items:center;box-shadow:0 0 24px #7a32aa20}.hero .big{font-size:54px}.slots{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.slot{min-height:95px;border:1px solid #ffffff10;border-radius:15px;background:#110d14;display:grid;place-items:center;color:#bdb4c0}.wave{font-size:30px;letter-spacing:5px;color:#d99cff;text-shadow:0 0 12px #8c4dff}.notice{margin-top:12px;padding:12px;border:1px solid #ffffff10;border-radius:14px;background:#130f16;text-align:center;color:#eee}@media(max-height:760px){.panel{padding:7px 10px 9px}.head .crown{font-size:18px}.head h2{font-size:21px}.grid{gap:5px;margin-top:6px}.card{min-height:63px;padding:5px}.card i{font-size:18px}.card b{font-size:14px;margin:2px}.card small{font-size:9px}.wide{min-height:46px;grid-template-columns:34px 1fr;padding:5px 10px}.wide i{font-size:20px}}</style></head><body><main class="app"><div class="shade"></div><div class="top"><span class="live">● LIVE</span><span class="balance">🌹 <b id="bal">8</b></span></div><div class="brand">♛ K-Talk LIVE</div><div class="led">✨ K-Talk LIVE · 즐거운 방송과 새로운 만남 ✨</div><div class="chat"><div class="msg"><b>사랑이 VIP</b> 노래 너무 좋아요 💕</div><div class="msg"><b>볼링사랑 중회원</b> 목소리 최고예요 👍</div><div class="msg"><b>행복이 일반</b> 한 곡 더 불러주세요 🎵</div></div><div class="gifts"><button class="gift" data-rose="1">🌹<small>1개</small></button><button class="gift" data-rose="5">💐<small>5개</small></button><button class="gift" data-rose="10">🌹<small>10개</small></button><button class="gift" data-rose="100">❤️<small>100개</small></button><button class="gift">🎁<small>선물</small></button></div><div class="composer"><input placeholder="채팅을 입력하세요..."><button>🎤</button></div><nav class="nav"><button><span>⌂</span>방송</button><button><span>⌕</span>탐색</button><button class="plus" id="plus">＋</button><button><span>🎁</span>이벤트</button><button><span>♙</span>내 정보</button></nav></main><div class="sheet" id="sheet"><section class="panel"><button class="close" id="close">×</button><div class="head"><div class="crown">♛</div><h2>방송 시작하기</h2><small>원하는 방송을 선택하세요</small></div><div class="grid"><button class="card" data-room="general"><i>👥</i><b>일반 방송</b><small>최대 13명</small></button><button class="card" data-room="solo"><i>🎙️</i><b>혼자 방송</b><small>1인 라이브</small></button><button class="card" data-room="secret"><i>🔒</i><b>비밀방</b><small>호스트 1 + 게스트 6</small></button><button class="card" data-room="female"><i>🎧</i><b>여자 DJ</b><small>음악 방송</small></button><button class="card" data-room="male"><i>🎧</i><b>남자 DJ</b><small>음악 방송</small></button><button class="card" data-room="movie"><i>🎬</i><b>영화방</b><small>입장 🌹5 · 6시간</small></button><button class="card wide" data-room="video"><i>🎞️</i><div><b>동영상 올리기</b><small>일반 동영상 · 판매/광고 제외</small></div></button><button class="card wide" data-room="shorts"><i>▣</i><div><b>쇼츠 올리기</b><small>쇼츠 · 상품/광고 등록 가능</small></div></button></div></section></div><section class="room" id="room"><div class="roomTop"><button class="back" id="back">‹</button><div class="roomTitle" id="roomTitle">방송</div></div><div class="roomBody" id="roomBody"></div></section><div class="recharge" id="recharge"><div class="box"><h2>🌹 장미 충전</h2><p>장미가 부족합니다.<br>충전 후 선물할 수 있어요.</p><p>장미 1개 = 30원</p><div class="packs"><button class="pack" data-add="100">100개<br>3,000원</button><button class="pack" data-add="500">500개<br>15,000원</button><button class="pack" data-add="1000">1,000개<br>30,000원</button><button class="pack" data-add="3500">3,500개<br>105,000원</button></div><p><button id="cancel" class="pack">닫기</button></p></div></div><div class="toast" id="toast"></div><script>let roses=8;const bal=document.getElementById('bal'),sheet=document.getElementById('sheet'),recharge=document.getElementById('recharge'),toast=document.getElementById('toast'),room=document.getElementById('room'),roomTitle=document.getElementById('roomTitle'),roomBody=document.getElementById('roomBody');function say(t){toast.textContent=t;toast.style.display='block';setTimeout(()=>toast.style.display='none',1600)}document.getElementById('plus').onclick=()=>sheet.classList.add('open');document.getElementById('close').onclick=()=>sheet.classList.remove('open');document.getElementById('back').onclick=()=>room.classList.remove('open');document.querySelectorAll('[data-rose]').forEach(b=>b.onclick=()=>{let n=+b.dataset.rose;if(roses<n){recharge.classList.add('open');return}roses-=n;bal.textContent=roses;say('🌹 '+n+'개를 선물했습니다')});document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{roses+=+b.dataset.add;bal.textContent=roses;recharge.classList.remove('open');say('장미가 충전되었습니다')});document.getElementById('cancel').onclick=()=>recharge.classList.remove('open');const data={general:['일반 방송','👑','호스트 + 게스트 방송','<div class="slots"><div class="slot">호스트</div><div class="slot">게스트 입장 대기</div></div><div class="notice">입장할 때마다 칸이 하나씩 늘어나는 방식 · 최대 13명</div>'],solo:['혼자 방송','🎙️','1인 라이브','<div class="notice">혼자 방송 화면 · 채팅과 선물 기능</div>'],secret:['비밀방','🔒','비밀 방송','<div class="slots"><div class="slot">호스트</div><div class="slot">게스트 1</div><div class="slot">게스트 2</div><div class="slot">게스트 3</div><div class="slot">게스트 4</div><div class="slot">게스트 5</div><div class="slot">게스트 6</div></div>'],female:['여자 DJ','🎧','여자 DJ 음악방','<div class="wave">▂▄▆█▆▄▂</div><div class="notice">DJ 음악 + 게스트 대화 화면</div>'],male:['남자 DJ','🎧','남자 DJ 음악방','<div class="wave">▂▄▆█▆▄▂</div><div class="notice">DJ 음악 + 게스트 대화 화면</div>'],movie:['영화방','🎬','영화 감상방','<div class="notice">입장 🌹5 · 6시간 이용<br>허가된 영상만 재생하는 화면</div>'],video:['동영상 올리기','🎞️','일반 동영상 업로드','<div class="notice">판매·광고 영상은 제외됩니다.<br><br><button class="pack" onclick="say(\'동영상 선택창 준비 화면입니다\')">동영상 선택</button></div>'],shorts:['쇼츠 올리기','▣','쇼츠 업로드','<div class="notice">상품 판매·광고 쇼츠 등록 가능<br><br><button class="pack" onclick="say(\'쇼츠 선택창 준비 화면입니다\')">쇼츠 선택</button></div>']};document.querySelectorAll('[data-room]').forEach(b=>b.onclick=()=>{const d=data[b.dataset.room];roomTitle.textContent=d[0];roomBody.innerHTML='<div class="hero"><div><div class="big">'+d[1]+'</div><h2>'+d[2]+'</h2></div></div>'+d[3];sheet.classList.remove('open');room.classList.add('open')});</script></body></html>
