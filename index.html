<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>K-Talk LIVE</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#020204;color:#fff;font-family:Arial,'Noto Sans KR',sans-serif;overflow:hidden}button,input{font:inherit}.home{height:100dvh;max-width:520px;margin:auto;position:relative;padding:10px 12px 66px;background:radial-gradient(circle at 50% 0,#2a0c42 0,#09040f 42%,#020204 78%);display:flex;flex-direction:column;gap:8px}.header{height:42px;display:flex;align-items:center;justify-content:space-between}.logo{font-size:23px;font-weight:900;color:#ffd45f;text-shadow:0 0 10px #ff3bb5}.logo em{font-style:normal;color:#ff56cf}.tools{display:flex;gap:5px}.pill{border:1px solid #8565bd66;border-radius:18px;background:#090811;padding:6px 9px;font-size:11px}.notice{height:42px;border:1px solid #e449ff;border-radius:13px;background:#12071a;display:flex;align-items:center;justify-content:center;text-align:center;font-size:11px;font-weight:800;box-shadow:0 0 12px #d33cff44}.liveTitle{display:flex;align-items:center;justify-content:space-between;height:34px}.liveTitle b{font-size:17px;color:#ffd97d}.liveTitle span{font-size:11px;color:#ff5f84}.aiGrid{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:9px}.aiCard{position:relative;overflow:hidden;border:1px solid var(--c);border-radius:20px;background:linear-gradient(180deg,var(--bg),#09070d 75%);box-shadow:0 0 18px color-mix(in srgb,var(--c) 26%,transparent);padding:12px 9px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.pink{--c:#ff45bb;--bg:#2b0c22}.blue{--c:#31b4ff;--bg:#071d2c}.live{position:absolute;top:9px;left:9px;background:#ff194f;border-radius:9px;padding:4px 7px;font-size:9px;font-weight:900}.aiFace{width:112px;height:112px;border-radius:50%;display:grid;place-items:center;font-size:72px;background:#120d18;border:2px solid var(--c);box-shadow:0 0 22px color-mix(in srgb,var(--c) 35%,transparent)}.aiCard h2{margin:10px 0 3px;font-size:20px}.aiCard p{font-size:10px;color:#ddd;line-height:1.45;margin:4px 0 10px}.enter{width:100%;border:0;border-radius:13px;padding:11px 8px;background:linear-gradient(135deg,var(--c),#7c37ff);color:#fff;font-weight:900}.nav{position:absolute;left:0;right:0;bottom:0;height:58px;background:#050507f7;border-top:1px solid #251b30;display:grid;grid-template-columns:repeat(3,1fr)}.nav button{border:0;background:transparent;color:#d4cedd;font-size:11px}.nav strong{display:block;font-size:19px;margin-bottom:2px}.nav .active{color:#ff61d7}.screen{display:none;position:fixed;inset:0;z-index:30;background:radial-gradient(circle at 50% 0,#28103d,#07050a 56%,#020203)}.screen.open{display:block}.topbar{height:56px;display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid #ffffff12}.back{width:38px;height:38px;border:1px solid #ffffff22;border-radius:50%;background:#120d18;color:#fff;font-size:22px}.title{font-weight:900;color:#ffe19a}.body{height:calc(100dvh - 56px);padding:12px;overflow:auto}.aiStage{text-align:center}.stageFace{font-size:82px;margin:18px}.on{color:#ff4d72;font-weight:900;font-size:12px}.speech{margin:12px 0;padding:13px;border:1px solid #b84cff55;border-radius:14px;background:#160d20}.aiChat{display:grid;grid-template-columns:1fr auto;gap:7px;margin-top:12px}.aiChat input{border:1px solid #7e4eb1;border-radius:20px;background:#0c0910;color:#fff;padding:11px}.aiChat button{border:0;border-radius:18px;background:#8d36ff;color:#fff;padding:0 16px}.box{padding:16px;border:1px solid #ffffff18;border-radius:17px;background:#100c14;text-align:center}.list{display:grid;gap:10px}.listItem{border:1px solid #ffffff18;border-radius:16px;background:#100c14;padding:13px}.listItem .enter{margin-top:8px}.tiny{font-size:11px;color:#bbb}</style></head><body><main class="home"><header class="header"><div class="logo">♛ K-Talk <em>LIVE</em></div><div class="tools"><div class="pill">🪙 1,250 +</div><div class="pill">💎 VIP</div><div class="pill">🔔</div></div></header><div class="notice">📢 AI 남자·여자 방송이 지금 바로 방송 중입니다</div><div class="liveTitle"><b>지금 방송 중</b><span>● 2 LIVE</span></div><section class="aiGrid"><article class="aiCard pink"><span class="live">● LIVE · AI</span><div class="aiFace">👩</div><h2>AI 소라</h2><p>들어오면 자동 인사<br>채팅 읽기 · 자동 대화</p><button class="enter" onclick="enterAI('소라','female')">방송 들어가기</button></article><article class="aiCard blue"><span class="live">● LIVE · AI</span><div class="aiFace">👨</div><h2>AI 준호</h2><p>들어오면 자동 인사<br>채팅 읽기 · 자동 대화</p><button class="enter" onclick="enterAI('준호','male')">방송 들어가기</button></article></section><nav class="nav"><button class="active" id="homeBtn"><strong>⌂</strong>홈</button><button id="listBtn"><strong>▦</strong>방송목록</button><button id="myBtn"><strong>♙</strong>마이페이지</button></nav></main><section class="screen" id="screen"><div class="topbar"><button class="back" id="back">‹</button><div class="title" id="screenTitle">방송</div></div><div class="body" id="screenBody"></div></section><script>const screen=document.getElementById('screen'),screenTitle=document.getElementById('screenTitle'),screenBody=document.getElementById('screenBody');function speak(t){if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';speechSynthesis.speak(u)}}function openScreen(t,h){screenTitle.textContent=t;screenBody.innerHTML=h;screen.classList.add('open')}window.enterAI=function(name,sex){openScreen('AI '+name+' · LIVE','<div class="aiStage"><div class="on">● LIVE · AI 진행자</div><div class="stageFace">'+(sex==='female'?'👩':'👨')+'</div><h2>AI '+name+'</h2><div class="speech" id="speech">어서 오세요! K-Talk LIVE에 오신 것을 환영합니다.</div><div class="aiChat"><input id="aiInput" placeholder="AI에게 말을 입력하세요"><button onclick="chatAI(\''+name+'\')">보내기</button></div><div class="box tiny">입장하면 자동 인사가 나오고 입력한 채팅을 읽어 줍니다.</div></div>');speak('어서 오세요. '+name+' AI 방송입니다. 반갑습니다.')}window.chatAI=function(name){const i=document.getElementById('aiInput');const t=i.value.trim();if(!t)return;const a=t.includes('안녕')?'안녕하세요. 반갑습니다.':t.includes('이름')?'저는 AI '+name+'입니다.':'네, 잘 들었습니다. '+t;document.getElementById('speech').textContent=a;speak(t+'. '+a);i.value=''};document.getElementById('back').onclick=()=>screen.classList.remove('open');document.getElementById('homeBtn').onclick=()=>screen.classList.remove('open');document.getElementById('listBtn').onclick=()=>openScreen('방송목록','<div class="list"><div class="listItem"><span class="on">● LIVE · AI</span><h3>AI 소라</h3><button class="enter" onclick="enterAI(\'소라\',\'female\')">들어가기</button></div><div class="listItem"><span class="on">● LIVE · AI</span><h3>AI 준호</h3><button class="enter" onclick="enterAI(\'준호\',\'male\')">들어가기</button></div></div>');document.getElementById('myBtn').onclick=()=>openScreen('마이페이지','<div class="box">내 프로필 · 내 동영상 · 내 쇼츠 · 내 방송 기록</div>');</script></body></html>
