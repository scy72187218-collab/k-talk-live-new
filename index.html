<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>K-Talk LIVE</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#050507;color:#fff;font-family:Arial,"Noto Sans KR",sans-serif}button,input{font:inherit}.app{max-width:520px;min-height:100dvh;margin:auto;background:#07070a;position:relative;overflow:hidden}.feed{height:100dvh;position:relative;background:radial-gradient(circle at 50% 25%,#71358d 0,#24102e 32%,#08080c 72%)}#mainVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:linear-gradient(160deg,#54245f,#111 52%,#050507)}.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.18),transparent 28%,transparent 56%,rgba(0,0,0,.9))}.topbar{position:absolute;top:max(14px,env(safe-area-inset-top));left:14px;right:14px;display:flex;justify-content:space-between;align-items:center;z-index:4}.live{background:#ff174c;padding:9px 13px;border-radius:10px;font-weight:900;box-shadow:0 0 18px #ff174c66}.view{background:#17151bcc;padding:9px 12px;border-radius:10px;margin-left:6px}.topright{display:flex;gap:9px}.circle{width:42px;height:42px;border:1px solid #ffffff44;border-radius:50%;background:#121117cc;color:#fff;font-size:20px}.brand{position:absolute;top:72px;left:18px;color:#ffd36a;font-weight:900;font-size:21px;z-index:4}.brand small{display:block;color:#fff;font-size:10px;opacity:.8;margin-top:2px}.chat{position:absolute;left:15px;right:92px;bottom:126px;z-index:5}.msg{display:flex;gap:7px;align-items:center;margin:8px 0;text-shadow:0 1px 3px #000}.avatar{width:31px;height:31px;border-radius:50%;display:grid;place-items:center;background:#fff;color:#333}.msg b{color:#ffd05c;font-size:13px}.msg span{font-size:13px}.gifts{position:absolute;right:12px;bottom:145px;z-index:6;display:grid;gap:10px}.gift{width:58px;min-height:58px;border:1px solid #ffffff33;border-radius:20px;background:#0c0b12cc;color:#fff;font-size:23px;padding:6px}.gift small{display:block;font-size:10px;margin-top:2px}.composer{position:absolute;left:12px;right:12px;bottom:70px;z-index:7;display:grid;grid-template-columns:1fr 48px 48px;gap:7px}.composer input{height:48px;border:1px solid #8d4cff;border-radius:24px;background:#111018dd;color:#fff;padding:0 18px}.composer button{border-radius:50%;border:1px solid #ffffff44;background:#15131dcc;color:#fff}.nav{position:absolute;bottom:0;left:0;right:0;height:64px;background:#08080bf2;border-top:1px solid #ffffff17;display:grid;grid-template-columns:1fr 1fr 78px 1fr 1fr;z-index:8;align-items:center}.nav button{border:0;background:transparent;color:#bbb;font-size:10px;height:100%}.nav button span{display:block;font-size:20px;margin-bottom:2px}.nav .active{color:#ffd05c}.navStart{display:flex!important;align-items:center;justify-content:center}.start{position:relative;width:62px;height:62px;margin-top:-25px;border:2px solid #fff;border-radius:50%;background:linear-gradient(135deg,#ff3b87,#8d36ff);color:#fff;font-size:29px;box-shadow:0 5px 24px #a442ff99,0 0 0 5px #08080b;display:grid;place-items:center}.start:active{transform:scale(.95)}.sheet{display:none;position:fixed;z-index:50;inset:0;background:#000b;align-items:flex-end;justify-content:center}.sheet.open{display:flex}.panel{width:min(520px,100%);max-height:92dvh;overflow:auto;background:linear-gradient(180deg,#100d14,#070709);border:1px solid #80622d;border-radius:28px 28px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px #000}.panelhead{text-align:center;position:relative}.crown{color:#ffd05c;font-size:28px}.panel h1{margin:3px 0 4px;color:#f5d79a;font-size:27px}.panelhead p{margin:0 0 16px;color:#ddd;font-size:13px}.close{position:absolute;right:0;top:0;border:0;background:transparent;color:#e7c98e;font-size:30px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{min-height:132px;border:1px solid #8a6a31;border-radius:20px;background:linear-gradient(145deg,#2a180a,#0d0b0d);color:#fff;padding:15px 10px;text-align:center}.card.purple{border-color:#d45cff;background:linear-gradient(145deg,#43104c,#100b17);box-shadow:0 0 16px #c343ff55}.card.pink{border-color:#9c3c72;background:linear-gradient(145deg,#35101f,#0d0b0d)}.card.blue{border-color:#347bd7;background:linear-gradient(145deg,#071d3d,#0d0b0d)}.ico{font-size:31px}.card b{display:block;color:#f7d899;font-size:18px;margin:8px 0 5px}.card p{margin:0;color:#ddd;font-size:11px;line-height:1.4}.wide{grid-column:1/-1;min-height:92px;display:grid;grid-template-columns:62px 1fr 115px;align-items:center;text-align:left;padding:12px 14px}.wide b{font-size:20px}.uploadBtn{border:0;border-radius:18px;background:linear-gradient(135deg,#a02be5,#e44aa9);color:#fff;padding:13px 8px;font-weight:900}.short{border-color:#a83269;background:linear-gradient(145deg,#36101e,#100b10)}#fileInput{display:none}.toast{display:none;position:fixed;left:50%;bottom:85px;transform:translateX(-50%);z-index:100;background:#111;border:1px solid #555;border-radius:12px;padding:10px 14px;font-size:12px;white-space:nowrap}
</style>
</head>
<body>
<div class="app"><section class="feed">
<video id="mainVideo" autoplay muted playsinline loop></video><div class="shade"></div>
<div class="topbar"><div><span class="live">● LIVE</span><span class="view">◉ 128</span></div><div class="topright"><button class="circle">♫</button><button class="circle">•••</button></div></div>
<div class="brand">♛ K-Talk<small>LIVE · CHAT · SING</small></div>
<div class="chat"><div class="msg"><i class="avatar">👤</i><div><b>사랑이 VIP</b><br><span>노래 너무 좋아요~ 💕</span></div></div><div class="msg"><i class="avatar">👤</i><div><b>볼링사랑 중회원</b><br><span>목소리도 최고예요! 👍</span></div></div><div class="msg"><i class="avatar">👤</i><div><b>행복이 일반</b><br><span>노래 한곡 불러주세요~ 🎵</span></div></div></div>
<div class="gifts"><button class="gift">🌹<small>1</small></button><button class="gift">💐<small>5</small></button><button class="gift">🌹<small>10</small></button><button class="gift">❤️<small>100</small></button><button class="gift">🎁<small>선물</small></button></div>
<div class="composer"><input placeholder="채팅을 입력하세요..."><button>🎤</button><button>📹</button></div>
<nav class="nav"><button class="active"><span>⌂</span>방송</button><button><span>⌕</span>탐색</button><div class="navStart"><button class="start" id="startBtn" aria-label="방송 시작">📹</button></div><button><span>🎁</span>이벤트</button><button><span>♙</span>내 정보</button></nav>
</section></div>
<div class="sheet" id="sheet"><div class="panel"><div class="panelhead"><div class="crown">♛</div><h1>방송 시작하기</h1><p>원하는 방송을 가볍게 눌러주세요!</p><button class="close" id="closeBtn">×</button></div><div class="grid">
<button class="card" data-action="camera"><div class="ico">👥</div><b>기본 12명 방송</b><p>모든 회원이 열 수 있어요</p></button><button class="card" data-action="solo"><div class="ico">🎙️</div><b>혼자 방송</b><p>중회원 이상 열 수 있어요</p></button><button class="card purple" data-action="vip"><div class="ico">♛</div><b>VIP 함께 방송</b><p>중회원 · VIP 함께 방송하기</p></button><button class="card" data-action="movie"><div class="ico">🎬</div><b>AI 영화방</b><p>허가 영화 감상</p></button><button class="card pink" data-action="female"><div class="ico">♀</div><b>여자 DJ 소희</b><p>소희의 음악 방송</p></button><button class="card blue" data-action="male"><div class="ico">♂</div><b>남자 DJ 민호</b><p>민호의 음악 방송</p></button>
<div class="card wide purple"><div class="ico">🎞️</div><div><b>동영상 올리기</b><p>내 동영상을 업로드해 보세요!</p></div><button class="uploadBtn" id="videoUpload">업로드하기 ⬆</button></div><div class="card wide short"><div class="ico">▣</div><div><b>쇼츠 올리기</b><p>짧은 동영상을 등록해 보세요!</p></div><button class="uploadBtn" id="shortUpload">쇼츠 등록＋</button></div>
</div></div></div><input id="fileInput" type="file" accept="video/*"><div class="toast" id="toast"></div>
<script>
const sheet=document.getElementById('sheet'),toast=document.getElementById('toast'),video=document.getElementById('mainVideo'),file=document.getElementById('fileInput');function say(t){toast.textContent=t;toast.style.display='block';setTimeout(()=>toast.style.display='none',1800)}document.getElementById('startBtn').onclick=()=>sheet.classList.add('open');document.getElementById('closeBtn').onclick=()=>sheet.classList.remove('open');sheet.onclick=e=>{if(e.target===sheet)sheet.classList.remove('open')};async function camera(){try{const s=await navigator.mediaDevices.getUserMedia({video:true,audio:true});video.srcObject=s;video.muted=true;await video.play();sheet.classList.remove('open');say('카메라 방송 준비가 되었습니다')}catch(e){say('카메라 권한을 허용해 주세요')}}document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{const a=b.dataset.action;if(a==='camera'||a==='solo'||a==='vip')camera();else say(b.querySelector('b').textContent+' 선택')});function choose(){file.click()}document.getElementById('videoUpload').onclick=choose;document.getElementById('shortUpload').onclick=choose;file.onchange=()=>{const f=file.files&&file.files[0];if(!f)return;if(video.srcObject){video.srcObject.getTracks().forEach(t=>t.stop());video.srcObject=null}video.src=URL.createObjectURL(f);video.muted=false;video.controls=false;video.play().catch(()=>{});sheet.classList.remove('open');say('동영상이 화면에 표시되었습니다')};
</script></body></html>
