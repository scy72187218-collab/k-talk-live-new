<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>K-Talk LIVE</title>
<link rel="stylesheet" href="styles.css" />
<style>
.app:has(.refSolo) .header,.app:has(.refSolo) .bottom{display:none!important}
.app:has(.refSolo){height:100dvh!important;min-height:100dvh!important;overflow:hidden!important;background:#000!important}
#screen:has(.refSolo){height:100dvh!important;min-height:100dvh!important;padding:0!important;margin:0!important;overflow:hidden!important}
#screen:has(.refSolo) .refSolo{height:100dvh!important;min-height:100dvh!important;border-radius:0!important;padding:0!important;margin:0!important}
#screen:has(.refSolo) .refStage{border-radius:0!important}
.refGift{background:#09090ddd!important;border:1px solid #ffffff32!important;border-radius:10px!important;box-shadow:inset 0 0 10px #ffffff08,0 3px 8px #0008!important;min-width:0!important;width:auto!important;padding:4px 2px!important}
.refGift strong{display:flex!important;align-items:center!important;justify-content:center!important;width:100%!important;height:36px!important;font-size:0!important}
.giftPhoto{display:block;width:48px;height:36px;background:url('gifts-reference.jpg') no-repeat;background-size:400% 100%;border-radius:5px}
.giftPhoto0{background-position:0% 50%}.giftPhoto1{background-position:33.333% 50%}.giftPhoto2{background-position:66.666% 50%}.giftPhoto3{background-position:100% 50%}
.refGifts{display:grid!important;grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:4px!important;width:100%!important;overflow:hidden!important;padding:0 4px!important}
.refGift b{font-size:9px!important;color:#fff!important;white-space:nowrap!important}.refGift em{font-size:7px!important;color:#ff5b99!important;white-space:nowrap!important}
.refReward{min-height:74px!important;grid-template-columns:74px repeat(5,1fr)!important;background:#08080be8!important;border:1px solid #ffffff26!important;border-radius:16px!important;padding:7px!important}
.refReward>span{font-size:11px!important;line-height:1.15!important;color:#ff5f99!important}
.refReward i{display:flex!important;flex-direction:column!important;gap:2px!important;font-size:8px!important;border-left:1px solid #ffffff20!important;padding:2px 0!important}
.refReward i b{font-size:10px!important;color:#fff!important}.refReward i .giftPhoto{width:24px;height:28px;background-size:400% 100%}.refReward i .rewardText{font-size:8px!important;font-weight:700!important;color:#ddd!important;white-space:nowrap!important}
</style>
</head>
<body>
<div class="app">
<header class="header">
  <div class="brand"><div class="logo">♛ K-Talk</div><div class="live">LIVE</div></div>
  <div class="led" onclick="openAd()">♛ K-Talk · 신곡 광고 신청하세요! 🎵 🎤</div>
  <div class="tabs">
    <button class="active" data-tab="home">홈</button><button data-tab="shorts">쇼츠</button><button data-tab="video">동영상</button><button data-tab="profile">프로필</button>
  </div>
</header>
<main id="screen"></main>
<nav class="bottom">
  <button data-bottom="home"><b>⌂</b>홈</button><button data-bottom="friends"><b>👥</b>친구</button><button class="plus" data-bottom="plus"><b>＋</b>방송하기</button><button data-bottom="help"><b>?</b>사용방법</button><button data-bottom="profile"><b>♙</b>내 정보</button>
</nav>
</div>
<div id="creator" class="creator">
  <video id="camera" autoplay playsinline muted></video><div class="shade"></div>
  <div class="creator-top"><button class="circle" onclick="closeCreator()">×</button><button class="sound">♪ 사운드 추가</button><button class="circle">↻</button></div>
  <div class="creator-tools"><button>✦</button><button>◔</button><button>▦</button><button>☺</button></div>
  <div class="creator-bottom"><div class="modes"><span>10분</span><span>60초</span><span>15초</span><span class="on">라이브</span></div><div class="recordrow"><div class="fx">✨</div><button class="record" onclick="startBroadcast()"></button><div class="fx">🎭</div></div><div class="creator-foot"><span>게시</span><span>창작하기</span><span class="on">라이브</span></div></div>
</div>
<div id="sheet" class="sheet"><div class="sheet-inner"><div class="sheet-head"><h3 id="sheetTitle">메뉴</h3><button onclick="closeSheet()">닫기</button></div><div id="sheetBody"></div></div></div>
<script src="app.js"></script>
<script>
(function(){
  window.startBroadcast=function(){
    closeCreator();
    home();
  };
  function applyApprovedGifts(){
    const gifts=document.querySelectorAll('.refGift');
    if(gifts.length>=4){
      const labels=['장미 1송이','장미 50송이','장미 100송이','선물 상자'];
      gifts.forEach((g,i)=>{if(i<4){const strong=g.querySelector('strong');if(strong)strong.innerHTML='<span class="giftPhoto giftPhoto'+i+'"></span>';const b=g.querySelector('b');if(b)b.textContent=labels[i];}});
    }
    const rewards=document.querySelectorAll('.refReward i');
    const likes=['♥ 3,000','♥ 6,000','♥ 9,000','♥ 12,000','♥ 15,000'];
    rewards.forEach((el,i)=>{if(i<5)el.innerHTML='<b>'+likes[i]+'</b><span class="giftPhoto giftPhoto0"></span><span class="rewardText">지급 완료</span>';});
  }
  applyApprovedGifts();
  new MutationObserver(applyApprovedGifts).observe(document.getElementById('screen'),{childList:true,subtree:true});
})();
</script>
</body>
</html>
