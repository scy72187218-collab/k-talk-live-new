      <button>10분</button><button>60초</button><button>15초</button><button class="active">라이브</button>
    </div>
    <div class="creatorRooms">
      <button class="active" data-create-room="1" onclick="chooseCreatorRoom('1',this)">1인 방송</button>
      <button data-create-room="2" onclick="chooseCreatorRoom('2',this)">13명 방송</button>
      <button data-create-room="3" onclick="chooseCreatorRoom('3',this)">구독자방</button>
      <button data-create-room="4" onclick="chooseCreatorRoom('4',this)">비밀방</button>
    </div>
    <div class="recordWrap">
      <div class="effectThumb">✨</div>
      <button class="recordBtn" onclick="creatorStart()"></button>
      <div class="effectThumb">🎭</div>
    </div>
    <div class="creatorFooterTabs"><span>게시</span><span>창작하기</span><span class="active">라이브</span></div>
  </div>
</div>
<div id="sheet" class="sheet hidden"><div class="sheetin"><div class="sheethead"><h3 id="sheetTitle">메뉴</h3><button id="sheetClose" class="close">닫기</button></div><div id="sheetBody"></div></div></div>
<script>
var state={joined:false,adult:false,camera:false,ai:true,following:30,raffle:3,selectedRoom:'1'}; var creatorView=document.getElementById('creatorView');
var view=document.getElementById('view'),sheet=document.getElementById('sheet'),sheetTitle=document.getElementById('sheetTitle'),sheetBody=document.getElementById('sheetBody');
function showSheet(t,h){sheetTitle.textContent=t;sheetBody.innerHTML=h;sheet.classList.remove('hidden')}
function closeSheet(){sheet.classList.add('hidden')}
document.getElementById('sheetClose').onclick=closeSheet;
sheet.onclick=function(e){if(e.target===sheet)closeSheet()};
document.addEventListener('click',function(e){
 var v=e.target.closest('[data-view]');if(v){setView(v.dataset.view);return}
 var a=e.target.closest('[data-action]');if(!a)return;
 if(a.dataset.action==='broadcast')openCreator();
 if(a.dataset.action==='messages'){if(!state.joined)showJoin('댓글·쪽지를 사용하려면 가입해 주세요.');else openMessages();}
 if(a.dataset.action==='help')openHelp();
 if(a.dataset.action==='report')openReport();
 if(a.dataset.action==='like'){if(!state.joined){showJoin('좋아요를 누르려면 가입해 주세요.')}else{a.style.color=a.style.color?'':'#ff5575'}};
 if(a.dataset.action==='save')a.style.color=a.style.color?'':'#6fb4ff';
 if(a.dataset.action==='share'){if(navigator.share){navigator.share({title:'K-Talk LIVE',text:'K-Talk 방송을 확인해 보세요'}).catch(function(){})}else{alert('공유 기능을 열었습니다.')}}
});
function setView(n){
 document.querySelectorAll('.tab').forEach(function(b){b.classList.toggle('active',b.dataset.view===n)});
 if(n==='home')home();if(n==='shorts'||n==='video')media(n);if(n==='rooms')rooms();if(n==='profile')profile();
}
function home(){
 var ps=[['하늘별',1],['미소',1],['태권',0],['달빛',0],['행복이',1]];
 var people=ps.map(function(p){return '<div class="person"><div class="avatar '+(p[1]?'on':'off')+'">'+p[0].charAt(0)+'</div><small>'+p[0]+'</small></div>'}).join('');
 view.innerHTML='<section class="homeStage"><div class="hero"><div class="liveFeedBadge"><span class="onair" style="position:static">ON AIR</span><span class="liveType">1인 방송</span></div><div class="followStrip"><div class="people">'+people+'</div></div><div class="heroIcon">🎙️</div><div class="profileline"><div class="crown">♛ 태권</div><div class="muted">현재 방송 중</div></div><div class="actions"><button class="round" data-action="like">♡<small>좋아요</small></button><button class="round" data-action="messages">💬<small>댓글</small></button><button class="round" data-action="save">☆<small>저장</small></button><button class="round" data-action="share">↗<small>공유</small></button></div><div class="liveJoinHint">방송을 보다가 참여 기능을 누르면 가입 안내</div></div><div class="miniLinks"><button class="btn grow" data-action="help">사용방법·혜택</button><button class="btn grow" data-action="report">신고</button></div></section>';
}
function media(kind){
 var label=kind==='shorts'?'쇼츠':'동영상';
 view.innerHTML='<section class="hero"><div class="heroIcon">▶</div><div class="profileline"><div class="crown">♛ 태권</div><div>'+label+'을 올리면 이곳에 표시됩니다.</div></div><div class="actions"><button class="round" data-action="like">♡<small>좋아요</small></button><button class="round" data-action="messages">💬<small>댓글</small></button><button class="round" data-action="save">☆<small>저장</small></button><button class="round" data-action="share">↗<small>공유</small></button></div></section><section class="card"><button class="btn primary" style="width:100%" onclick="uploadMedia(\''+kind+'\')">'+label+' 올리기</button><div class="notice">동영상·쇼츠에는 선물과 보상을 표시하지 않습니다.</div></section>';
}
function rooms(){
 var cards=[
  ['1','1인 방송','호스트 1명','one',1],
  ['2','일반방','총 13명','thirteen',13],
  ['3','구독자방','총 9명','nine',9],
  ['4','비밀방','총 6명','six',6]
 ];
 var html=cards.map(function(r){
   var count=r[4],mini='';
   for(var i=0;i<count;i++) mini+='<i class="'+(i===0?'hostMini':'')+'"></i>';
   return '<button class="roomPreview" onclick="enterRoom(\''+r[0]+'\')"><b>'+r[0]+'번 · '+r[1]+'</b><small>'+r[2]+' · 호스트 포함</small><span class="roomMiniGrid '+r[3]+'">'+mini+'</span></button>';
 }).join('');
 view.innerHTML='<section class="roomSelect">'+html+'</section>';
}
function enterRoom(id){
 if((id==='3'||id==='4')&&!state.joined){showJoin('이 방은 가입 후 이용할 수 있습니다.');return}
 var cfg=id==='1'?{name:'1인 방송',total:1,kind:'solo',guests:0,grid:''}:id==='2'?{name:'일반방',total:13,kind:'general',guests:12,grid:'g12'}:id==='3'?{name:'구독자방',total:9,kind:'subscriber',guests:8,grid:'g8'}:{name:'비밀방',total:6,kind:'secret',guests:5,grid:'g5'};
 var guests='';
 for(var i=1;i<=cfg.guests;i++) guests+='<div class="guestTile">참여자 '+i+'</div>';
 var gate=id==='4'?'<div class="secretGate"><input placeholder="비밀번호 입력"><button>비밀방 입장</button></div>':'';
 var sub=id==='3'?'<span class="badge">구독자 전용</span>':'';
 view.innerHTML=
 '<section class="liveRoom">'+
   '<div class="roomBar"><button class="back" onclick="rooms()">←</button><div class="roomBarTitle"><b>'+cfg.name+' '+sub+'</b><small>총 '+cfg.total+'명 · 호스트 포함</small></div><button class="btn" data-action="messages" style="padding:7px 9px;font-size:10px">✉ 쪽지</button></div>'+
   '<div class="roomLed">♛ K-Talk · 신곡 광고 신청하세요! 🎵 🎤</div>'+
   '<div class="roomStage '+cfg.kind+'">'+
     '<div class="hostPanel"><div class="hostTag">ON AIR</div><div class="hostIcon">🎙️</div><div class="hostName">♛ 태권 · HOST</div></div>'+
     (cfg.guests?'<div class="guestGrid '+cfg.grid+'">'+guests+'</div>':'')+
     '<div class="roomChat"><div>하늘별 · 안녕하세요 💕</div><div>미소 · 오늘 방송 좋아요!</div><div>행복이 · 응원합니다 👍</div></div>'+
     '<div class="roomRightActions"><button data-action="like">♡</button><button data-action="messages">💬</button><button data-action="report">⚑</button></div>'+
     gate+
   '</div>'+
   '<div class="roomTools"><button id="camBtn" onclick="toggleCamera()">📷 카메라</button><button id="aiBtn" onclick="toggleAI()">🔊 AI 읽기</button><button id="songBtn" onclick="songMode()">🎵 노래</button><button>🎤 마이크</button></div>'+
   '<div class="roomGiftStrip"><button class="roomGift"><span>🌹</span>장미 1</button><button class="roomGift"><span>🌹</span>장미 10</button><button class="roomGift"><span>🌹</span>장미 50</button><button class="roomGift"><span>🎁</span>보물상자</button><button class="roomGift"><span>💖</span>하트 100</button><button class="roomGift"><span>💞</span>하트 500</button><button class="roomGift"><span>👑</span>프리미엄</button></div>'+
 '</section>';
}
async function toggleCamera(){
 var b=document.getElementById('camBtn');
 try{if(!state.camera){state.stream=await navigator.mediaDevices.getUserMedia({video:true,audio:false});state.camera=true;b.textContent='📷 카메라 닫기'}else{state.stream.getTracks().forEach(function(t){t.stop()});state.camera=false;b.textContent='📷 카메라 열기'}}catch(e){alert('카메라 권한을 허용해 주세요.')}
}
function toggleAI(){state.ai=!state.ai;document.getElementById('aiBtn').textContent=state.ai?'🔊 AI 읽기 켜짐':'🔇 AI 읽기 꺼짐'}
function songMode(){var b=document.getElementById('songBtn');b.classList.toggle('gold');b.textContent=b.classList.contains('gold')?'🎵 노래 중 · 참여자 마이크 잠금':'🎵 노래 모드'}
function openCreator(){creatorView.classList.add('show')}
function closeCreator(){creatorView.classList.remove('show')}
function chooseCreatorRoom(id,btn){state.selectedRoom=id;document.querySelectorAll('[data-create-room]').forEach(function(b){b.classList.toggle('active',b===btn)})}
function creatorStart(){
 if(!state.joined){closeCreator();showJoin('방송을 시작하려면 먼저 가입과 성인 인증이 필요합니다.');return}
 closeCreator();startBroadcast(state.selectedRoom)
}
function openBroadcast(){
 if(!state.joined){showJoin('방송하려면 먼저 가입과 성인 인증이 필요합니다.');return}
 showSheet('방송 준비','<div class="prepHero"><div class="prepCam">◉</div></div><div class="prepSection"><span class="prepLabel">방 선택</span><div class="choiceGrid"><button class="roomChoice active" data-roomchoice="1" onclick="selectBroadcastRoom(\'1\',this)">1인 방송</button><button class="roomChoice" data-roomchoice="2" onclick="selectBroadcastRoom(\'2\',this)">일반방 13명</button><button class="roomChoice" data-roomchoice="3" onclick="selectBroadcastRoom(\'3\',this)">구독자방 9명</button><button class="roomChoice" data-roomchoice="4" onclick="selectBroadcastRoom(\'4\',this)">비밀방 6명</button></div></div><div class="prepSection"><span class="prepLabel">보정</span><input class="field" type="range" min="1" max="100" value="50"></div><div class="prepSection"><span class="prepLabel">배경</span><div class="chips"><button class="chip">기본</button><button class="chip">무대</button><button class="chip">콘서트</button><button class="chip">산</button><button class="chip">바다</button><button class="chip">야경</button></div></div><div class="prepSection"><span class="prepLabel">효과</span><div class="chips"><button class="chip">효과 없음</button><button class="chip">하트 100</button><button class="chip">하트 500</button><button class="chip">하트 1000</button></div></div><button class="startBroadcast" onclick="startSelectedBroadcast()">방송 시작</button>');
}
function selectBroadcastRoom(id,btn){state.selectedRoom=id;document.querySelectorAll('[data-roomchoice]').forEach(function(b){b.classList.toggle('active',b===btn)})}
function startSelectedBroadcast(){startBroadcast(state.selectedRoom)}
function startBroadcast(id){closeSheet();setView('rooms');enterRoom(id);alert('방송 시작 알림 30명 공유는 서버 연결 후 실제 발송됩니다.')}
function showJoin(msg){showSheet('가입하기','<div class="notice">'+msg+'</div><button class="broadcast-btn" onclick="joinStep(\'네이버\')">네이버로 계속하기</button><button class="broadcast-btn" onclick="joinStep(\'카카오\')">카카오로 계속하기</button><button class="broadcast-btn" onclick="joinStep(\'Google\')">Google로 계속하기</button><div class="notice">실제 소셜 로그인·성인 인증은 각 서비스 키를 연결해야 합니다.</div>')}
function joinStep(p){state.joined=true;showSheet('성인 인증','<div class="notice">'+p+' 로그인 연결 자리입니다.</div><button class="broadcast-btn" onclick="finishAdult()">휴대폰 본인인증 완료 처리</button>')}
function finishAdult(){state.adult=true;closeSheet();alert('가입 흐름이 완료되었습니다.')}
function openMessages(){showSheet('쪽지','<div class="notice"><b>하늘별</b><br>방송 잘 보고 있어요.</div><div class="notice"><b>미소</b><br>오늘도 방송하시나요?</div><input class="field" id="msg" placeholder="쪽지 내용을 입력하세요"><button class="broadcast-btn" onclick="sendMsg()">쪽지 보내기</button>')}
function sendMsg(){var i=document.getElementById('msg');if(!i.value.trim())return alert('내용을 입력해 주세요.');i.value='';alert('쪽지 전송 화면이 작동합니다. 실제 전송은 서버 연결 후 활성화됩니다.')}
function openHelp(){showSheet('K-Talk 사용방법·혜택','<div class="notice"><b>처음 오셨나요?</b><br>동영상·쇼츠·방송은 먼저 볼 수 있습니다. ＋방송하기를 누르면 미가입자는 가입 → 성인 인증 → 프로필 설정 순서입니다.<br><br>빨간색 = 방송 중 / 파란색 = 방송 안 함<br>방 종류: 1인 / 일반 13명 / 구독자 9명 / 비밀 6명<br>쇼츠·동영상: 좋아요·댓글·저장·공유만 표시<br>방송방: 쪽지·카메라·AI 읽기·선물·신고</div><div class="notice"><b>구독</b><br>일반 5,000원 · 중회원 14,900원 · VIP 19,900원<br>500개 이상 충전 시 구독자 15% 할인</div><div class="notice"><b>레벨</b><br>Lv1 1,000 · Lv2 2,000 · Lv3 3,000 · Lv4 4,000 · Lv5 5,000 · Lv6 6,500 · Lv7 8,000 · Lv8 9,500 · Lv9 11,000 · Lv10 12,500 장미 누적</div><button class="broadcast-btn" onclick="raffle()">제비뽑기 · 하루 3회</button>')}
function raffle(){if(state.raffle<=0)return alert('오늘 참여 횟수를 모두 사용했습니다.');state.raffle--;var p=[0,0,1,2,3,4,5],x=p[Math.floor(Math.random()*p.length)];alert(x?'장미 '+x+'개 당첨!':'꽝입니다. 다음 기회에!')}
function openReport(){showSheet('회사 관리 신고 게시판','<input class="field" id="target" placeholder="신고 대상 닉네임"><select class="field"><option>위험한 행동</option><option>욕설·괴롭힘</option><option>사칭</option><option>불법 판매</option><option>기타</option></select><input class="field" placeholder="신고 내용을 적어 주세요"><button class="broadcast-btn" onclick="submitReport()">신고 접수</button><div class="notice">접수 → 확인 중 → 경고/이용정지 → 처리 완료</div>')}
function submitReport(){if(!document.getElementById('target').value.trim())return alert('신고 대상을 입력해 주세요.');alert('신고가 접수되었습니다.');closeSheet()}
function profile(){view.innerHTML='<section class="card" style="text-align:center"><div class="avatar" style="width:86px;height:86px;font-size:28px;border-color:var(--gold)">태</div><h2><span class="crown">♛</span> 태권</h2><div class="muted">K-Talk LIVE 프로필</div><div class="row" style="justify-content:center;margin-top:10px"><b>팔로워 0</b><b>팔로잉 '+state.following+'</b><b>Lv.1</b></div></section><section class="card"><h3 class="title">프로필 링크</h3><input class="field" placeholder="홈페이지·블로그·SNS 주소"><button class="broadcast-btn" onclick="alert(\'링크 저장은 서버 연결 후 계정에 저장됩니다.\')">링크 저장</button></section><section class="card"><h3 class="title">내 콘텐츠</h3><div class="row"><button class="btn grow" onclick="setView(\'video\')">동영상</button><button class="btn grow" onclick="setView(\'shorts\')">쇼츠</button><button class="btn grow" onclick="setView(\'rooms\')">방송</button></div></section><section class="card"><h3 class="title">정산 기준</h3><div class="notice">일반 회원 30% / 회사 70% · 구독자 35% / 회사 65% · 소속사 60% / 회사 40%. 한 방송 30분 이상 정상 종료 시 일반·구독자 호스트 +5%p 기준.</div></section>'}
function uploadMedia(k){var label=k==='shorts'?'쇼츠':'동영상';showSheet(label+' 올리기','<input class="field" type="file" accept="video/*"><label class="muted">보정 강도 1~100</label><input class="field" type="range" min="1" max="100" value="50"><select class="field"><option>기본 피부 보정</option><option>밝기 보정</option><option>얼굴 또렷하게</option><option>눈 강조</option><option>윤곽 보정</option><option>반짝이</option><option>하트</option><option>별빛</option><option>무대 조명</option><option>재미 필터</option></select><button class="broadcast-btn" onclick="alert(\'실제 영상 업로드 저장소 연결 후 게시됩니다.\')">미리보기 후 올리기</button>')}
home();
</script>
</body>
</html>
