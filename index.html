<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>K-Talk LIVE</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="app">
<header class="header">
  <div class="brand"><div class="logo">♛ K-Talk</div><div class="live">LIVE</div></div>
  <div class="led" onclick="openAd()">♛ K-Talk · 신곡 광고 신청하세요! 🎵 🎤</div>
  <div class="tabs">
    <button class="active" data-tab="home">홈</button><button data-tab="shorts">쇼츠</button><button data-tab="video">동영상</button><button data-tab="rooms">방송방</button><button data-tab="profile">프로필</button>
  </div>
</header>
<main id="screen"></main>
<nav class="bottom">
  <button data-bottom="home"><b>⌂</b>홈</button><button data-bottom="message"><b>✉</b>쪽지</button><button class="plus" data-bottom="plus"><b>＋</b>방송하기</button><button data-bottom="help"><b>?</b>사용방법</button><button data-bottom="profile"><b>♙</b>내 정보</button>
</nav>
</div>
<div id="broadcastMenu" class="broadcast-menu">
  <div class="broadcast-menu-bg"></div>
  <div class="broadcast-menu-panel">
    <div class="broadcast-menu-head">
      <div>
        <div class="broadcast-crown">♛</div>
        <h2>방송 시작하기</h2>
        <p>방송할 방을 선택하세요</p>
      </div>
      <button class="broadcast-close" onclick="closeBroadcastMenu()">×</button>
    </div>
    <div class="broadcast-options">
      <button class="broadcast-option gold" onclick="selectRoomAndCamera('1')">
        <span class="bo-icon">◉</span><b>1인 방송</b><small>혼자 방송하기</small>
      </button>
      <button class="broadcast-option orange" onclick="selectRoomAndCamera('2')">
        <span class="bo-icon">▦</span><b>13명 방송</b><small>호스트 포함 총 13명</small>
      </button>
      <button class="broadcast-option purple" onclick="selectRoomAndCamera('3')">
        <span class="bo-icon">♛</span><b>구독자방</b><small>구독자 전용 방송</small>
      </button>
      <button class="broadcast-option blue" onclick="selectRoomAndCamera('4')">
        <span class="bo-icon">🔒</span><b>비밀방</b><small>비밀번호 방송</small>
      </button>
      <button class="broadcast-option pink" onclick="openMediaFromBroadcast('shorts')">
        <span class="bo-icon">▣</span><b>쇼츠 올리기</b><small>짧은 동영상 등록</small>
      </button>
      <button class="broadcast-option cyan" onclick="openMediaFromBroadcast('video')">
        <span class="bo-icon">▶</span><b>동영상 올리기</b><small>내 동영상 등록</small>
      </button>
    </div>
    <div class="broadcast-menu-bottom">
      <button onclick="openMenu()">사용방법·혜택</button>
      <button onclick="openAd()">광고 문의</button>
    </div>
  </div>
</div>
<div id="creator" class="creator">
  <video id="camera" autoplay playsinline muted></video><div class="shade"></div>
  <div class="creator-top"><button class="circle" onclick="closeCreator()">×</button><button class="sound">♪ 사운드 추가</button><button class="circle">↻</button></div>
  <div class="creator-tools"><button>✦</button><button>◔</button><button>▦</button><button>☺</button></div>
  <div class="creator-bottom"><div class="modes"><span>10분</span><span>60초</span><span>15초</span><span class="on">라이브</span></div><div class="roomchips"><button class="on" data-roompick="1">1인 방송</button><button data-roompick="2">13명 방송</button><button data-roompick="3">구독자방</button><button data-roompick="4">비밀방</button></div><div class="recordrow"><div class="fx">✨</div><button class="record" onclick="startBroadcast()"></button><div class="fx">🎭</div></div><div class="creator-foot"><span>게시</span><span>창작하기</span><span class="on">라이브</span></div></div>
</div>
<div id="sheet" class="sheet"><div class="sheet-inner"><div class="sheet-head"><h3 id="sheetTitle">메뉴</h3><button onclick="closeSheet()">닫기</button></div><div id="sheetBody"></div></div></div>
<script src="app.js"></script>
</body>
</html>
