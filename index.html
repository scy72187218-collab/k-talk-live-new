<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>K-Talk LIVE</title><style>*{box-sizing:border-box}html,body{margin:0;background:#000;color:#fff;font-family:Arial,'Noto Sans KR',sans-serif;overflow:hidden}button,input{font:inherit}.feed{height:100dvh;overflow-y:auto;scroll-snap-type:y mandatory}.page{height:100dvh;scroll-snap-align:start;position:relative;overflow:hidden;background:#07050a}.photo{position:absolute;inset:0 0 180px;background-size:cover;background-position:center top;transform:scale(1.02);animation:cameraMove 7s ease-in-out infinite alternate;transform-origin:center center}.female .photo{background-image:url('https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=900&q=88')}.male .photo{background-image:url('https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=900&q=88')}@keyframes cameraMove{0%{transform:scale(1.02) translateY(0)}100%{transform:scale(1.045) translateY(-4px)}}.shade{position:absolute;inset:0;background:linear-gradient(180deg,#0006 0,#0000 44%,#000 84%)}.top{position:absolute;z-index:3;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:center}.host{display:flex;align-items:center;gap:7px;font-weight:900}.avatar{width:36px;height:36px;border-radius:50%;border:1px solid #fff;background-size:cover;background-position:center}.female .avatar{background-image:url('https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=150&q=80')}.male .avatar{background-image:url('https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=150&q=80')}.ai{background:#7d37e8;border-radius:5px;padding:2px 5px;font-size:9px}.live{background:#ff174f;border-radius:7px;padding:5px 8px;font-size:10px}.viewer{font-size:11px}.wave{position:absolute;z-index:3;left:22px;right:78px;bottom:205px;height:42px;display:flex;align-items:center;justify-content:center;gap:2px;opacity:.92}.wave i{width:2px;border-radius:4px;background:linear-gradient(#ff30d2,#ff4141,#ffe330,#35ff7e,#35c9ff,#833cff);height:var(--h);animation:bounce .68s ease-in-out infinite alternate;animation-delay:var(--d);box-shadow:0 0 5px currentColor}@keyframes bounce{to{height:calc(var(--h) * .35)}}.side{position:absolute;z-index:4;right:9px;bottom:102px;display:grid;gap:7px}.gift{width:54px;min-height:55px;border:1px solid #ffffff25;border-radius:14px;background:#08080cdd;color:#fff;font-size:20px}.gift small{display:block;font-size:9px}.info{position:absolute;z-index:4;left:12px;right:72px;bottom:92px}.info h2{font-size:18px;margin:0 0 5px}.speech{font-size:11px;background:#08080bbb;border-radius:12px;padding:8px;border-left:3px solid #ff4dc7}.chat{font-size:10px;margin-top:7px}.chat b{color:#ffd35d}.composer{display:flex;gap:5px;margin-top:8px}.composer input{min-width:0;flex:1;height:36px;border:1px solid #ffffff2d;border-radius:18px;background:#0b0a0ddd;color:#fff;padding:0 11px;font-size:10px}.composer button{border:0;border-radius:18px;padding:0 12px;background:#8b39f0;color:#fff;font-weight:900;font-size:10px}.nav{position:fixed;z-index:10;bottom:0;left:0;right:0;height:56px;background:#030305f5;border-top:1px solid #ffffff18;display:grid;grid-template-columns:repeat(3,1fr)}.nav button{border:0;background:transparent;color:#ddd;font-size:10px}.nav strong{display:block;font-size:18px}.nav .active{color:#ff59d3}.screen{display:none;position:fixed;z-index:20;inset:0;background:#08050b}.screen.open{display:block}.bar{height:55px;padding:8px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #ffffff18}.back{border:0;border-radius:50%;width:38px;height:38px;background:#17121c;color:#fff;font-size:22px}.body{padding:12px}.item{padding:13px;border:1px solid #ffffff20;border-radius:15px;margin-bottom:9px;background:#110c15}.enter{width:100%;padding:9px;border:0;border-radius:11px;background:#8438e9;color:#fff;font-weight:900}</style></head><body><main class="feed" id="feed"><section class="page female"><div class="photo"></div><div class="shade"></div><div class="top"><div class="host"><div class="avatar"></div><span>AI 소라</span><span class="ai">AI</span><span class="live">● LIVE</span></div><span class="viewer">👤 125</span></div><div class="wave" id="wave1"></div><aside class="side"><button class="gift" onclick="gift('소라','장미 1개')">🌹<small>1</small></button><button class="gift" onclick="gift('소라','장미 5개')">💐<small>5</small></button><button class="gift" onclick="gift('소라','장미 10개')">🌹<small>10</small></button><button class="gift" onclick="gift('소라','장미 100개')">💐<small>100</small></button><button class="gift" onclick="gift('소라','선물')">🎁<small>선물상자</small></button></aside><div class="info"><h2>AI 소라 · 1인 방송</h2><div class="speech" id="soraSpeech">어서 오세요. 소라 방송입니다. 반갑습니다.</div><div class="chat"><b>행복이:</b> 안녕하세요 👋</div><div class="composer"><input id="soraInput" placeholder="채팅을 입력하세요"><button onclick="chat('소라','soraInput','soraSpeech')">보내기</button></div></div></section><section class="page male"><div class="photo"></div><div class="shade"></div><div class="top"><div class="host"><div class="avatar"></div><span>AI 준호</span><span class="ai">AI</span><span class="live">● LIVE</span></div><span class="viewer">👤 98</span></div><div class="wave" id="wave2"></div><aside class="side"><button class="gift" onclick="gift('준호','장미 1개')">🌹<small>1</small></button><button class="gift" onclick="gift('준호','장미 5개')">💐<small>5</small></button><button class="gift" onclick="gift('준호','장미 10개')">🌹<small>10</small></button><button class="gift" onclick="gift('준호','장미 100개')">💐<small>100</small></button><button class="gift" onclick="gift('준호','선물')">🎁<small>선물상자</small></button></aside><div class="info"><h2>AI 준호 · 1인 방송</h2><div class="speech" id="junhoSpeech">어서 오세요. 준호 방송입니다. 즐겁게 이야기해요.</div><div class="chat"><b>볼링사랑:</b> 반갑습니다 👍</div><div class="composer"><input id="junhoInput" placeholder="채팅을 입력하세요"><button onclick="chat('준호','junhoInput','junhoSpeech')">보내기</button></div></div></section></main><nav class="nav"><button class="active" id="home"><strong>⌂</strong>홈</button><button id="list"><strong>▦</strong>방송목록</button><button id="mypage"><strong>♙</strong>마이페이지</button></nav><section class="screen" id="screen"><div class="bar"><button class="back" id="back">‹</button><b id="title">방송목록</b></div><div class="body" id="body"></div></section><script>function makeWave(id){let e=document.getElementById(id);for(let n=0;n<58;n++){let i=document.createElement('i');i.style.setProperty('--h',(7+Math.random()*27)+'px');i.style.setProperty('--d',(-Math.random())+'s');e.appendChild(i)}}makeWave('wave1');makeWave('wave2');function speak(t){if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';speechSynthesis.speak(u)}}function gift(n,g){speak(n+' 방송에 '+g+' 선물이 도착했습니다. 감사합니다.')}function chat(n,i,s){let el=document.getElementById(i),t=el.value.trim();if(!t)return;let r=t.includes('안녕')?'안녕하세요. 반가워요.':'네, '+t+'라고 하셨네요. 같이 이야기해요.';document.getElementById(s).textContent=r;speak(t+'. '+r);el.value=''}const screen=document.getElementById('screen'),body=document.getElementById('body'),title=document.getElementById('title');function openScreen(t,h){title.textContent=t;body.innerHTML=h;screen.classList.add('open')}back.onclick=()=>screen.classList.remove('open');home.onclick=()=>{screen.classList.remove('open');feed.scrollTo({top:0,behavior:'smooth'})};list.onclick=()=>openScreen('방송목록','<div class="item"><b>● LIVE · AI 소라</b><p>여자 AI 1인 방송</p><button class="enter" onclick="go(0)">방송 보기</button></div><div class="item"><b>● LIVE · AI 준호</b><p>남자 AI 1인 방송</p><button class="enter" onclick="go(1)">방송 보기</button></div>');mypage.onclick=()=>openScreen('마이페이지','<div class="item"><h2>내 홈</h2><p>내 프로필 · 내 동영상 · 내 쇼츠 · 내 방송 기록</p></div>');window.go=n=>{screen.classList.remove('open');feed.scrollTo({top:n*innerHeight,behavior:'smooth'})};setTimeout(()=>speak('어서 오세요. AI 소라 방송입니다.'),900);</script></body></html>
