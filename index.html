<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>K-Talk LIVE</title><style>*{box-sizing:border-box}html,body{margin:0;background:#000;color:#fff;font-family:Arial,'Noto Sans KR',sans-serif;overflow:hidden}button{font:inherit;color:inherit}.feed{height:100dvh;overflow-y:auto;scroll-snap-type:y mandatory}.page{height:100dvh;scroll-snap-align:start;position:relative;background:#09070d;overflow:hidden}.hero{position:absolute;inset:0 0 64px;background:radial-gradient(circle at 50% 25%,#42304e 0,#17101d 42%,#08070a 75%)}.face{position:absolute;left:50%;top:17%;transform:translateX(-50%);width:205px;height:205px;border-radius:50%;background:linear-gradient(145deg,#5c4a66,#241d2b);border:3px solid #ffffff22;display:grid;place-items:center;font-size:70px}.shade{position:absolute;inset:0;background:linear-gradient(180deg,#0004,#0000 45%,#000 92%)}.top{position:absolute;z-index:3;top:12px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:center}.host{font-weight:900}.live{background:#ff174f;border-radius:6px;padding:4px 7px;font-size:11px;margin-left:6px}.info{position:absolute;z-index:4;left:14px;right:80px;bottom:82px}.info h2{font-size:18px;margin:0 0 6px}.info p{font-size:12px;color:#ddd;margin:0}.side{position:absolute;z-index:4;right:10px;bottom:92px;display:grid;gap:10px}.side button{width:54px;height:54px;border-radius:50%;border:1px solid #ffffff25;background:#141018dd;font-size:22px}.nav{position:fixed;z-index:10;bottom:0;left:0;right:0;height:64px;background:#030305f7;border-top:1px solid #ffffff16;display:grid;grid-template-columns:repeat(5,1fr);align-items:center}.nav button{border:0;background:transparent;font-size:10px;height:64px}.nav strong{display:block;font-size:18px}.nav .plusBtn{width:54px;height:42px;border-radius:13px;background:#fff;color:#111;font-size:31px;line-height:40px;margin:auto;box-shadow:inset 5px 0 #20d5ec,inset -5px 0 #fe2c55}.sheet{display:none;position:fixed;z-index:30;inset:0;background:#050505}.sheet.open{display:block}.camera{position:relative;height:100%;min-height:560px;background:linear-gradient(180deg,#151515,#050505 72%);overflow-y:auto;padding-bottom:26px}.camTop{height:54px;display:flex;align-items:center;justify-content:space-between;padding:6px 14px}.close{width:42px;height:42px;border:0;background:#0009;border-radius:50%;font-size:30px}.camTitle{font-size:13px;font-weight:800}.preview{height:48vh;min-height:285px;margin:0 10px;border-radius:18px;background:radial-gradient(circle at 50% 35%,#343434,#111 52%,#070707);position:relative;display:grid;place-items:center;overflow:hidden}.preview .person{width:154px;height:154px;border-radius:50%;background:#2a2a2a;display:grid;place-items:center;font-size:58px}.captureRow{display:flex;align-items:center;justify-content:center;gap:28px;padding:14px 8px 6px}.roundSmall{width:48px;height:48px;border-radius:50%;border:0;background:#1c1c1c;font-size:22px}.capture{width:74px;height:74px;border-radius:50%;border:5px solid #fff;background:#ef3340;box-shadow:0 0 0 3px #ef3340}.modes{display:flex;justify-content:center;gap:25px;font-size:12px;font-weight:800;margin:4px 0 12px}.modes button{background:none;border:0;color:#aaa;padding:6px}.modes .on{color:#fff}.rooms{padding:0 12px 18px}.rooms h3{font-size:13px;margin:6px 2px 9px}.roomGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.room{min-height:60px;border:1px solid #ffffff1c;background:#151515;border-radius:13px;padding:8px 4px;font-size:11px;font-weight:800}.room span{display:block;font-size:21px;margin-bottom:3px}.roomView{display:none;position:fixed;z-index:40;inset:0;background:#070707;overflow:auto}.roomView.open{display:block}.roomHead{height:58px;position:sticky;top:0;background:#0b0b0bf5;display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid #ffffff18}.roomHead button{width:40px;height:40px;border-radius:50%;border:0;background:#1b1b1b;font-size:24px}.roomHead b{font-size:16px}.roomBody{padding:14px}.stage{border:1px solid #ffffff20;border-radius:16px;padding:12px;background:#101010}.grid13{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.tile{aspect-ratio:3/4;border-radius:12px;background:linear-gradient(145deg,#242424,#111);display:grid;place-items:center;font-size:10px;color:#bbb;border:1px solid #ffffff10}.tile.hostTile{grid-column:span 3;aspect-ratio:16/7;color:#fff;font-size:13px}.solo{height:58vh;display:grid;place-items:center;font-size:20px}.movie{height:55vh;display:grid;place-items:center;font-size:30px;background:#111}.toast{position:fixed;z-index:60;left:50%;bottom:92px;transform:translateX(-50%);background:#222;padding:10px 14px;border-radius:10px;font-size:12px;display:none}.toast.show{display:block}</style></head><body><main class="feed" id="feed"><section class="page"><div class="hero"><div class="face">🎤</div></div><div class="shade"></div><div class="top"><div class="host">K-Talk LIVE <span class="live">● LIVE</span></div><div>👤 125</div></div><aside class="side"><button>❤</button><button>💬</button><button>🎁</button></aside><div class="info"><h2>라이브 방송</h2><p>아래 + 버튼을 누르면 촬영·사진·라이브방 메뉴가 바로 열립니다.</p></div></section><section class="page"><div class="hero"><div class="face">🎧</div></div><div class="shade"></div><div class="top"><div class="host">DJ LIVE <span class="live">● LIVE</span></div><div>👤 98</div></div><div class="info"><h2>DJ 방송</h2><p>위아래로 넘겨 방송을 볼 수 있습니다.</p></div></section></main><nav class="nav"><button id="home"><strong>⌂</strong>홈</button><button><strong>♧</strong>친구</button><button class="plusBtn" id="plusBtn" aria-label="촬영 및 방송 메뉴">＋</button><button><strong>▦</strong>알림</button><button><strong>♙</strong>프로필</button></nav><section class="sheet" id="createSheet"><div class="camera"><div class="camTop"><button class="close" id="closeCreate">×</button><div class="camTitle">촬영 · 사진 · 라이브 방송</div><div style="width:42px"></div></div><div class="preview"><div class="person">👤</div></div><div class="captureRow"><button class="roundSmall" id="flip">↻</button><button class="capture" id="capture" aria-label="촬영"></button><button class="roundSmall" id="upload">▣</button></div><div class="modes"><button data-mode="15초">15초</button><button class="on" data-mode="60초">60초</button><button data-mode="사진">사진</button></div><div class="rooms"><h3>라이브 방송 바로가기</h3><div class="roomGrid"><button class="room" data-room="13명 방송"><span>👥</span>13명 방송</button><button class="room" data-room="1인 방송"><span>🎙️</span>1인 방송</button><button class="room" data-room="VIP 방송"><span>👑</span>VIP 방송</button><button class="room" data-room="비밀방"><span>🔒</span>비밀방</button><button class="room" data-room="영화방"><span>🎬</span>영화방</button><button class="room" data-room="DJ방"><span>🎧</span>DJ방</button></div></div></div></section><section class="roomView" id="roomView"><div class="roomHead"><button id="roomBack">‹</button><b id="roomTitle">방송</b></div><div class="roomBody" id="roomBody"></div></section><div class="toast" id="toast"></div><script>const createSheet=document.getElementById('createSheet'),roomView=document.getElementById('roomView'),roomTitle=document.getElementById('roomTitle'),roomBody=document.getElementById('roomBody'),toast=document.getElementById('toast');function showToast(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1300)}document.getElementById('plusBtn').onclick=()=>createSheet.classList.add('open');document.getElementById('closeCreate').onclick=()=>createSheet.classList.remove('open');document.getElementById('roomBack').onclick=()=>roomView.classList.remove('open');document.getElementById('home').onclick=()=>{createSheet.classList.remove('open');roomView.classList.remove('open');feed.scrollTo({top:0,behavior:'smooth'})};document.querySelectorAll('.modes button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.modes button').forEach(x=>x.classList.remove('on'));b.classList.add('on');showToast(b.dataset.mode+' 모드')});document.getElementById('capture').onclick=()=>{let m=document.querySelector('.modes .on').dataset.mode;showToast(m==='사진'?'사진 촬영':'영상 촬영 시작')};document.getElementById('upload').onclick=()=>showToast('사진 올리기');document.getElementById('flip').onclick=()=>showToast('카메라 전환');function openRoom(name){roomTitle.textContent=name;let html='';if(name==='13명 방송'){html='<div class="stage"><div class="grid13"><div class="tile hostTile">👑 호스트</div>'+Array.from({length:12},(_,i)=>'<div class="tile">게스트 '+(i+1)+'</div>').join('')+'</div></div>'}else if(name==='영화방'){html='<div class="stage movie">🎬<br><small>영화방</small></div>'}else{let icon=name==='DJ방'?'🎧':name==='비밀방'?'🔒':name==='VIP 방송'?'👑':'🎙️';html='<div class="stage solo">'+icon+' '+name+'</div>'}roomBody.innerHTML=html;createSheet.classList.remove('open');roomView.classList.add('open')}document.querySelectorAll('.room').forEach(b=>b.onclick=()=>openRoom(b.dataset.room));</script></body></html>
