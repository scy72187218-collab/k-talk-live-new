<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>K-Talk LIVE</title><style>*{box-sizing:border-box}html,body{margin:0;background:#000;color:#fff;font-family:Arial,'Noto Sans KR',sans-serif;overflow:hidden}button,input{font:inherit}.feed{height:100dvh;overflow-y:auto;scroll-snap-type:y mandatory}.page{height:100dvh;scroll-snap-align:start;position:relative;overflow:hidden;background:#07050a}.photo{position:absolute;inset:0 0 180px;background-size:cover;background-position:center top}.female .photo,.female .avatar{background-image:url('./female-host.svg')}.male .photo,.male .avatar{background-image:url('./male-host.svg')}.shade{position:absolute;inset:0;background:linear-gradient(180deg,#0006 0,#0000 44%,#000 84%)}.top{position:absolute;z-index:3;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:center}.host{display:flex;align-items:center;gap:7px;font-weight:900}.avatar{width:36px;height:36px;border-radius:50%;border:1px solid #fff;background-size:cover;background-position:center}.live{background:#ff174f;border-radius:7px;padding:5px 8px;font-size:10px}.viewer{font-size:11px}.side{position:absolute;z-index:4;right:9px;bottom:102px;display:grid;gap:7px}.gift{width:54px;min-height:55px;border:1px solid #ffffff25;border-radius:14px;background:#08080cf0;color:#fff;font-size:20px}.gift small{display:block;font-size:9px}.info{position:absolute;z-index:4;left:12px;right:72px;bottom:72px}.info h2{font-size:18px;margin:0 0 5px}.chatbox{margin-top:5px;background:#050507e8;border:1px solid #ff4dc755;border-radius:7px;overflow:hidden}.messages{height:92px;overflow:auto;padding:7px;font-size:10px;line-height:1.5}.composer{display:flex;gap:4px;padding:4px;border-top:1px solid #ffffff18}.composer input{min-width:0;flex:1;height:30px;border:1px solid #ffffff2d;border-radius:6px;background:#0b0a0ddd;color:#fff;padding:0 8px}.composer button{border:0;border-radius:6px;padding:0 10px;background:#8b39f0;color:#fff;font-weight:900}.nav{position:fixed;z-index:10;bottom:0;left:0;right:0;height:64px;background:#030305f5;border-top:1px solid #ffffff18;display:grid;grid-template-columns:repeat(5,1fr);align-items:center}.nav button{border:0;background:transparent;color:#ddd;font-size:9px;height:64px}.nav strong{display:block;font-size:18px}.plusBtn{width:54px!important;height:44px!important;border-radius:13px;background:#fff!important;color:#111!important;font-size:31px!important;margin:auto;box-shadow:inset 5px 0 #20d5ec,inset -5px 0 #fe2c55}.sheet{display:none;position:fixed;z-index:30;inset:0;background:#000}.sheet.open{display:block}.camera{position:relative;width:100%;height:100%;overflow:hidden;background:#000}.cameraVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#080808;display:block}.cameraFallback{position:absolute;inset:0;display:grid;place-items:center;color:#ddd;font-size:14px;text-align:center;padding:20px;background:#111}.bgFx{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:.42;background:transparent}.cameraShade{position:absolute;z-index:3;inset:0;background:linear-gradient(180deg,#0008 0,#0000 25%,#0001 48%,#000b 100%);pointer-events:none}.camTop{position:absolute;z-index:8;top:0;left:0;right:0;height:58px;display:flex;align-items:center;justify-content:center;padding:8px 14px}.close{position:absolute;left:14px;width:42px;height:42px;border:0;background:#0009;color:#fff;border-radius:50%;font-size:28px}.soundBtn{max-width:58%;border:0;border-radius:20px;background:#0009;color:#fff;padding:8px 14px;font-size:13px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.toolRail{position:absolute;z-index:8;right:12px;top:72px;display:grid;gap:8px}.toolBtn{width:58px;min-height:48px;border:0;border-radius:15px;background:#0009;color:#fff;font-size:11px;font-weight:900;padding:5px 3px}.toolBtn span{display:block;font-size:18px}.panel{display:none;position:absolute;z-index:10;left:12px;right:12px;bottom:164px;max-height:46vh;overflow:auto;background:#090909eF;border:1px solid #ffffff30;border-radius:18px;padding:12px;backdrop-filter:blur(8px)}.panel.open{display:block}.panelHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;font-weight:900}.panelClose{border:0;background:#222;color:#fff;width:32px;height:32px;border-radius:50%}.tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:10px}.tabs button{border:0;background:#202020;color:#bbb;border-radius:14px;padding:7px 12px;white-space:nowrap}.tabs button.on{background:#fff;color:#111;font-weight:900}.choiceGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.choice{border:1px solid #ffffff22;background:#161616;color:#fff;border-radius:12px;min-height:70px;padding:7px 3px;font-size:11px}.choice .thumb{display:grid;place-items:center;margin:auto auto 5px;width:42px;height:42px;border-radius:50%;background:linear-gradient(145deg,#444,#181818);font-size:20px}.choice.on{border-color:#fff;box-shadow:0 0 0 2px #fff inset}.rangeRow{margin-top:12px;padding-top:10px;border-top:1px solid #ffffff20}.rangeTop{display:flex;justify-content:space-between;font-weight:900;font-size:12px}.rangeRow input{width:100%;accent-color:#fff}.controls{position:absolute;z-index:7;left:0;right:0;bottom:14px;padding:0 12px}.captureRow{display:flex;align-items:center;justify-content:center;gap:28px;margin-bottom:2px}.round{width:44px;height:44px;border-radius:50%;border:0;background:#111b;color:#fff;font-size:18px}.capture{width:68px;height:68px;border-radius:50%;border:5px solid #fff;background:#ef3340}.modes{display:flex;justify-content:center;gap:12px;margin:5px 0 8px}.modes button{border:0;background:none;color:#ddd;padding:5px 3px;font-size:14px;text-shadow:0 2px 4px #000}.modes .on{color:#fff;font-weight:900}.rooms h3{font-size:15px;margin:0 0 7px;text-shadow:0 2px 4px #000}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.room{min-height:58px;border:1px solid #ffffff55;background:#0008;color:#fff;border-radius:12px;font-weight:900;font-size:14px;padding:6px 3px;text-shadow:0 1px 3px #000;backdrop-filter:blur(2px)}.room span{display:block;font-size:20px;line-height:22px}.toast{display:none;position:fixed;z-index:50;left:50%;bottom:90px;transform:translateX(-50%);background:#222;padding:9px 13px;border-radius:9px}.toast.show{display:block}@media(max-height:720px){.controls{bottom:8px}.capture{width:58px;height:58px}.round{width:38px;height:38px}.room{min-height:49px;font-size:12px}.room span{font-size:17px}.panel{bottom:145px;max-height:42vh}}</style></head><body><main class="feed" id="feed"><section class="page female"><div class="photo"></div><div class="shade"></div><div class="top"><div class="host"><div class="avatar"></div><span>AI 소라</span><span class="live">● LIVE</span></div><span class="viewer">👤 125</span></div><aside class="side"><button class="gift">🌹<small>1</small></button><button class="gift">💐<small>5</small></button><button class="gift">🌹<small>10</small></button><button class="gift">🎁<small>선물</small></button></aside><div class="info"><h2>AI 소라 · 1인 방송</h2><div class="chatbox"><div class="messages">소라: 어서 오세요. 반갑습니다.<br>해피걸: 오늘 방송 좋아요 👍<br>지수: 반가워요 💕</div><div class="composer"><input placeholder="메시지 입력"><button>전송</button></div></div></div></section><section class="page male"><div class="photo"></div><div class="shade"></div><div class="top"><div class="host"><div class="avatar"></div><span>AI 준호</span><span class="live">● LIVE</span></div><span class="viewer">👤 98</span></div><aside class="side"><button class="gift">🌹<small>1</small></button><button class="gift">💐<small>5</small></button><button class="gift">🌹<small>10</small></button><button class="gift">🎁<small>선물</small></button></aside><div class="info"><h2>AI 준호 · 1인 방송</h2><div class="chatbox"><div class="messages">준호: 안녕하세요. 즐겁게 시청하세요.<br>민수: 반갑습니다 👋<br>태훈: 오늘도 왔어요 👍</div><div class="composer"><input placeholder="메시지 입력"><button>전송</button></div></div></div></section></main><nav class="nav"><button><strong>⌂</strong>홈</button><button><strong>♧</strong>친구</button><button class="plusBtn" id="plusBtn">＋</button><button><strong>▦</strong>알림</button><button><strong>♙</strong>프로필</button></nav><section class="sheet" id="sheet"><div class="camera"><video id="cameraVideo" class="cameraVideo" autoplay playsinline muted></video><div class="cameraFallback" id="cameraFallback">카메라를 켜는 중입니다.</div><div class="bgFx" id="bgFx"></div><div class="cameraShade"></div><div class="camTop"><button class="close" id="close">×</button><button class="soundBtn" id="soundBtn">🎵 사운드 추가</button></div><div class="toolRail"><button class="toolBtn" id="filterBtn"><span>✨</span>보정</button><button class="toolBtn" id="bgBtn"><span>🖼️</span>배경</button><button class="toolBtn" id="flip"><span>↻</span>전환</button></div><div class="panel" id="filterPanel"><div class="panelHead"><span>보정 · 효과</span><button class="panelClose" data-close="filterPanel">×</button></div><div class="tabs" id="filterTabs"><button class="on" data-cat="인기">인기</button><button data-cat="만들기">만들기</button><button data-cat="AI">AI</button><button data-cat="New">New</button></div><div class="choiceGrid" id="filterGrid"></div><div class="rangeRow"><div class="rangeTop"><span>보정 강도</span><span id="beautyValue">50</span></div><input id="beautyRange" type="range" min="1" max="100" value="50"></div></div><div class="panel" id="bgPanel"><div class="panelHead"><span>배경 변경</span><button class="panelClose" data-close="bgPanel">×</button></div><div class="choiceGrid" id="bgGrid"></div></div><div class="panel" id="soundPanel"><div class="panelHead"><span>사운드 선택</span><button class="panelClose" data-close="soundPanel">×</button></div><div class="choiceGrid" id="soundGrid"></div></div><div class="controls"><div class="captureRow"><button class="round" id="beautyQuick">✨</button><button class="capture" id="capture" aria-label="촬영"></button><button class="round" id="upload">▣</button></div><div class="modes"><button data-mode="10분">10분</button><button data-mode="60초">60초</button><button class="on" data-mode="15초">15초</button><button data-mode="사진">사진</button><button data-mode="텍스트">텍스트</button></div><div class="rooms"><h3>라이브 방송</h3><div class="grid"><button class="room"><span>🎙️</span>1인 방송</button><button class="room"><span>👥</span>13명 방송</button><button class="room"><span>👑</span>VIP 방송</button><button class="room"><span>🔒</span>비밀방</button><button class="room"><span>🎬</span>영화방</button><button class="room"><span>🎧</span>DJ방</button></div></div></div></div></section><div class="toast" id="toast"></div><script>const $=id=>document.getElementById(id),sheet=$('sheet'),toast=$('toast'),video=$('cameraVideo'),fallback=$('cameraFallback'),filterPanel=$('filterPanel'),bgPanel=$('bgPanel'),soundPanel=$('soundPanel'),bgFx=$('bgFx');let stream=null,facing='user';let beauty=Math.max(1,Math.min(100,parseInt(localStorage.getItem('ktalkBeauty')||'50',10)||50));let effect=localStorage.getItem('ktalkEffect')||'자연';let bg=localStorage.getItem('ktalkBg')||'없음';let sound=localStorage.getItem('ktalkSound')||'사운드 추가';const effects={인기:[['자연','🙂'],['밝게','☀️'],['화사','🌸'],['부드럽게','🫧'],['선명','✨'],['흑백','⚫'],['빈티지','📷'],['따뜻','🌅']],만들기:[['하트','💗'],['안경','🕶️'],['꽃','🌺'],['무지개','🌈'],['곰','🐻'],['별','⭐'],['토끼','🐰'],['반짝','💫']],AI:[['AI 얼굴','AI'],['AI 만화','🧑‍🎨'],['AI 영화','🎬'],['AI 여행','✈️'],['AI 꽃','🌷'],['AI 포스터','🖼️'],['AI 꿈','🌙'],['AI 파티','🎉']],New:[['핑크','💖'],['블루','💙'],['골드','💛'],['쿨','🧊'],['봄','🌼'],['여름','🏖️'],['가을','🍁'],['겨울','❄️']]};const bgs=[['없음','⬛'],['무대','🎤'],['바다','🌊'],['노을','🌅'],['숲','🌲'],['야경','🌃'],['카페','☕'],['별밤','🌌'],['그림','🖼️']];const sounds=[['사운드 없음','🔇'],['신나는 음악','🎵'],['트로트','🎤'],['댄스','💃'],['감성','🎧'],['피아노','🎹'],['DJ','🎚️'],['잔잔한 음악','🌙']];function msg(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1200)}function closePanels(){filterPanel.classList.remove('open');bgPanel.classList.remove('open');soundPanel.classList.remove('open')}function applyBeauty(){const n=beauty/100;let brightness=1+.15*n,sat=1+.10*n,contrast=1-.05*n,blur=0;let extra='';if(effect==='밝게')brightness+=.12;if(effect==='화사'){brightness+=.08;sat+=.2}if(effect==='부드럽게'){blur=.35;contrast-=.04}if(effect==='선명')contrast+=.16;if(effect==='흑백')extra=' grayscale(1)';if(effect==='빈티지')extra=' sepia(.35)';if(effect==='따뜻')extra=' sepia(.16) saturate(1.15)';if(effect==='핑크')extra=' hue-rotate(330deg) saturate(1.2)';if(effect==='블루')extra=' hue-rotate(175deg) saturate(1.1)';if(effect==='골드')extra=' sepia(.25) saturate(1.25)';if(effect==='쿨')extra=' hue-rotate(190deg) saturate(.9)';video.style.filter=`brightness(${brightness}) saturate(${sat}) contrast(${contrast}) blur(${blur}px)${extra}`;$('beautyRange').value=beauty;$('beautyValue').textContent=beauty;localStorage.setItem('ktalkBeauty',beauty);localStorage.setItem('ktalkEffect',effect)}function applyBg(){const map={없음:'transparent',무대:'radial-gradient(circle at 50% 30%,#7a38ff66,#17002099 55%,#0008)',바다:'linear-gradient(180deg,#2ebcff77 0 45%,#0077b688 46% 65%,#003f5f99 66%)',노을:'linear-gradient(180deg,#ffb34777,#ff5f6d77 50%,#2c1b4a88)',숲:'linear-gradient(135deg,#0d5f2b88,#194d2f88,#051c1099)',야경:'radial-gradient(circle at 20% 20%,#ffe06688 0 1%,transparent 2%),radial-gradient(circle at 70% 35%,#fff5 0 1%,transparent 2%),linear-gradient(180deg,#08152c88,#10102099)',카페:'linear-gradient(135deg,#6f4e3788,#caa47266,#2b1a1299)',별밤:'radial-gradient(circle at 20% 20%,#fff 0 1px,transparent 2px),radial-gradient(circle at 70% 30%,#fff 0 1px,transparent 2px),radial-gradient(circle at 45% 10%,#fff 0 1px,transparent 2px),linear-gradient(#06122988,#110b2a99)',그림:'linear-gradient(135deg,#7dd3fc66,#f9a8d466,#fde68a66,#86efac66)'};bgFx.style.background=map[bg]||'transparent';localStorage.setItem('ktalkBg',bg)}function renderEffects(cat){const g=$('filterGrid');g.innerHTML='';effects[cat].forEach(([name,ico])=>{const b=document.createElement('button');b.className='choice'+(name===effect?' on':'');b.innerHTML=`<span class="thumb">${ico}</span>${name}`;b.onclick=()=>{effect=name;applyBeauty();renderEffects(cat);msg(name+' 효과 선택')};g.appendChild(b)})}function renderBg(){const g=$('bgGrid');g.innerHTML='';bgs.forEach(([name,ico])=>{const b=document.createElement('button');b.className='choice'+(name===bg?' on':'');b.innerHTML=`<span class="thumb">${ico}</span>${name}`;b.onclick=()=>{bg=name;applyBg();renderBg();msg(name+' 배경 선택')};g.appendChild(b)})}function renderSounds(){const g=$('soundGrid');g.innerHTML='';sounds.forEach(([name,ico])=>{const b=document.createElement('button');b.className='choice'+(name===sound?' on':'');b.innerHTML=`<span class="thumb">${ico}</span>${name}`;b.onclick=()=>{sound=name;localStorage.setItem('ktalkSound',sound);$('soundBtn').textContent='🎵 '+sound;renderSounds();msg(sound+' 선택')};g.appendChild(b)})}renderEffects('인기');renderBg();renderSounds();applyBeauty();applyBg();$('soundBtn').textContent='🎵 '+sound;async function startCamera(){if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){fallback.textContent='이 브라우저에서는 카메라 미리보기를 지원하지 않습니다.';return}if(stream)stream.getTracks().forEach(t=>t.stop());try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing},audio:false});video.srcObject=stream;fallback.style.display='none';applyBeauty();applyBg()}catch(e){fallback.style.display='grid';fallback.textContent='카메라 권한을 허용하면 화면 전체에 카메라가 보입니다.'}}function stopCamera(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}video.srcObject=null;fallback.style.display='grid';fallback.textContent='카메라를 켜는 중입니다.'}$('plusBtn').onclick=()=>{sheet.classList.add('open');startCamera()};$('close').onclick=()=>{sheet.classList.remove('open');closePanels();stopCamera()};$('filterBtn').onclick=()=>{const o=filterPanel.classList.contains('open');closePanels();if(!o)filterPanel.classList.add('open')};$('beautyQuick').onclick=$('filterBtn').onclick;$('bgBtn').onclick=()=>{const o=bgPanel.classList.contains('open');closePanels();if(!o)bgPanel.classList.add('open')};$('soundBtn').onclick=()=>{const o=soundPanel.classList.contains('open');closePanels();if(!o)soundPanel.classList.add('open')};document.querySelectorAll('.panelClose').forEach(b=>b.onclick=()=>$(b.dataset.close).classList.remove('open'));$('beautyRange').oninput=e=>{beauty=parseInt(e.target.value,10);applyBeauty()};document.querySelectorAll('#filterTabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#filterTabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');renderEffects(b.dataset.cat)});document.querySelectorAll('.modes button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.modes button').forEach(x=>x.classList.remove('on'));b.classList.add('on');msg(b.dataset.mode)});$('capture').onclick=()=>msg('촬영 시작');$('upload').onclick=()=>msg('사진·동영상 올리기');$('flip').onclick=async()=>{facing=facing==='user'?'environment':'user';await startCamera()};document.querySelectorAll('.room').forEach(b=>b.onclick=()=>msg(b.textContent.trim()+' 선택'));</script></body></html>
