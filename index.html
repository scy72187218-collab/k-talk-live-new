<style id="ktRoomWaveOnly">
/* 방송 파장만: 1인/13명/구독자/비밀방 모두 동일 */
.kt-room-live-wave{
  position:absolute;left:12px;right:12px;bottom:150px;height:70px;z-index:4;
  display:flex;align-items:center;justify-content:center;gap:2px;
  pointer-events:none;
  filter:drop-shadow(0 0 5px rgba(255,255,255,.18));
  overflow:hidden;
}
.kt-room-live-wave span{
  flex:1 1 0;min-width:2px;max-width:5px;height:100%;
  border-radius:999px;
  transform:scaleY(.18);
  transform-origin:center;
  animation:ktRoomWavePulse .82s ease-in-out infinite;
  box-shadow:0 0 7px currentColor;
}
.kt-room-live-wave span:nth-child(8n+1){background:#ff2dbd;color:#ff2dbd}
.kt-room-live-wave span:nth-child(8n+2){background:#ff4f78;color:#ff4f78}
.kt-room-live-wave span:nth-child(8n+3){background:#ff9e35;color:#ff9e35}
.kt-room-live-wave span:nth-child(8n+4){background:#ffe448;color:#ffe448}
.kt-room-live-wave span:nth-child(8n+5){background:#62ef73;color:#62ef73}
.kt-room-live-wave span:nth-child(8n+6){background:#3ee7ed;color:#3ee7ed}
.kt-room-live-wave span:nth-child(8n+7){background:#4d83ff;color:#4d83ff}
.kt-room-live-wave span:nth-child(8n){background:#b84cff;color:#b84cff}
.kt-room-live-wave span:nth-child(3n){animation-delay:-.18s}
.kt-room-live-wave span:nth-child(4n){animation-delay:-.34s}
.kt-room-live-wave span:nth-child(5n){animation-delay:-.50s}
.kt-room-live-wave span:nth-child(7n){animation-delay:-.66s}
@keyframes ktRoomWavePulse{
  0%,100%{transform:scaleY(.16)}
  22%{transform:scaleY(.58)}
  48%{transform:scaleY(.96)}
  72%{transform:scaleY(.36)}
}
</style>


<style id="ktLiveAttendanceClockOnly">
/* 라이브 4개 방: 시간 옆에 작은 출석체크만 표시 */
.kt-live-airclock{

  display:flex;align-items:center;gap:8px;

  background:rgba(8,8,12,.64);

}
.kt-live-airclock .air{
  color:#ff4a63;

}
.kt-live-airclock .clock{
  color:#fff;
  font-variant-numeric:tabular-nums;
  letter-spacing:.5px;
}
.kt-live-attendance{
  position:absolute;left:170px;top:64px;transform:none;
  z-index:7;border:0;background:transparent;color:#ffd34d;
  font-weight:950;font-size:12px;white-space:nowrap;
  display:flex;align-items:center;gap:3px;
  text-shadow:0 0 5px #ff4bc9;
}
.kt-live-attendance .badge{
  padding:6px 9px;border-radius:999px;
  background:rgba(26,10,25,.68);
  border:1px solid #ff4fc6;

}
.kt-live-attendance .wing{
  color:#ff64cf;font-size:15px;line-height:1;
  filter:drop-shadow(0 0 3px #ff4fc6);

.kt-live-attendance .heart{

<body>

<nav class="bottom"><button data-bottom="home"><b>⌂</b>홈</button><button data-bottom="friends"><b>👥</b>친구</button><button class="plus" type="button" onclick="return quickStartBroadcast(event)"><b>＋</b>방송하기</button><button data-bottom="help"><b>?</b>사용방법</button><button data-bottom="profile"><b>♙</b>프로필</button></nav>

<button id="ktCreatorStopTap" class="kt-creator-stop-tap" onclick="stopCreatorRecording()" aria-label="촬영 종료"><b>■</b><span>중지</span></button>
<button id="ktCreatorConfirmTap" class="kt-creator-confirm-tap" onclick="confirmCreatorRecording()" aria-label="촬영 확인">✓<span>확인</span></button>

<script>
(function(){
 const originalFriends=window.friends,originalProfile=window.openProfile,originalMenu=window.openMenu,originalCloseCreator=window.closeCreator;
 function leaveDash(){document.body.classList.remove('kt-home','kt-video-mode')}
 if(originalFriends)window.friends=function(){leaveDash();return originalFriends()};
 if(originalProfile)window.openProfile=function(){leaveDash();return originalProfile()};
 if(originalMenu)window.openMenu=function(){leaveDash();return originalMenu()};
 window.openCreator=async function(){
   if(window.ktStopBackgroundMedia)window.ktStopBackgroundMedia();
   creator.classList.remove('live-prep-open','creator-review','creator-recording');
   creator.classList.add('show');
   if(window.ensureLiveCamera){
     try{await ensureLiveCamera(state.cameraFacing||'user');}catch(e){}
   }else if(window.ensureCreatorPreviewCamera){
     try{await ensureCreatorPreviewCamera(state.cameraFacing||'user');}catch(e){}
   }else{
     creator.classList.remove('camera-on');
   }
 };
 window.quickStartBroadcast=async function(ev){
   try{
     if(ev){
       if(ev.preventDefault)ev.preventDefault();
       if(ev.stopPropagation)ev.stopPropagation();
     }
   }catch(e){}
   try{
     if(window.ktStopBackgroundMedia)window.ktStopBackgroundMedia();
   }catch(e){}
   try{
   if(window.openCreator)await window.openCreator();
 }catch(e){}
   return false;
 };
 window.openTikLivePrep=function(){creator.classList.add('live-prep-open');};
 window.closeTikLivePrep=function(){creator.classList.remove('live-prep-open');};
 window.closeCreator=function(){if(originalCloseCreator)return originalCloseCreator();creator.classList.remove('show');if(state.stream){state.stream.getTracks().forEach(t=>t.stop());state.stream=null;camera.srcObject=null;}};
 window.startBroadcast=async function(){
   if(window.__ktLiveStarting)return;
   window.__ktLiveStarting=true;
   var overlay=null;
   try{
     var hasLiveVideo=!!(window.state&&state.stream&&state.stream.getVideoTracks&&state.stream.getVideoTracks().some(function(t){return t.readyState==='live';}));
     if(!hasLiveVideo&&window.ensureLiveCamera){
       await ensureLiveCamera(state.cameraFacing||'user');
     }

     var host=window.creator||document.getElementById('creator');
     if(!host)throw new Error('creator not found');

     var oldOverlay=document.getElementById('ktLiveStartCountdown');
     if(oldOverlay)oldOverlay.remove();

     overlay=document.createElement('div');
     overlay.id='ktLiveStartCountdown';
     overlay.style.cssText='position:absolute;inset:0;z-index:9999;display:grid;place-items:center;background:rgba(0,0,0,.28);pointer-events:none;color:#fff;text-align:center;text-shadow:0 3px 16px rgba(0,0,0,.72)';
     host.appendChild(overlay);

     var n=5;
     function drawCountdown(){
       overlay.innerHTML='<div><b style="display:block;font-size:112px;line-height:1;font-weight:950">'+n+'</b><span style="display:block;margin-top:14px;font-size:20px;font-weight:900">잠시 후 방송이 시작됩니다</span></div>';
     }
     drawCountdown();

     await new Promise(function(resolve){
       var timer=setInterval(function(){
         n--;
         if(n<=0){
           clearInterval(timer);
           resolve();
           return;
         }
         drawCountdown();
       },1000);
     });

     if(overlay){
       overlay.innerHTML='<div><b style="display:block;font-size:62px;line-height:1;font-weight:950">LIVE</b></div>';
       await new Promise(function(resolve){setTimeout(resolve,260);});
       overlay.remove();
       overlay=null;
     }

     if(window.startTestBroadcast){
       await window.startTestBroadcast();
     }else{
       throw new Error('broadcast screen not available');
     }
   }catch(e){
     try{if(overlay)overlay.remove();}catch(_e){}
     alert('방송 시작 화면을 불러오지 못했습니다. 다시 눌러 주세요.');
   }finally{

   }
 };

<!-- KTALK_PERSONAL_EARNINGS_V4 -->
<script>
(function(){
  var ROSE_WON=30;
  var earnTimer=null;
  var liveClockTimer=null;
  var toastTimer=null;
  var session={active:false,start:0,roses:0,gifts:0,likes:0,likeRewarded:{},title:'',memberType:'general',rate:0.35};

  function updateLiveClock(){
    var el=document.getElementById('ktLiveClock');
    if(!el||!session.active)return;
    var sec=Math.max(0,Math.floor((Date.now()-session.start)/1000));
    var h=Math.floor(sec/3600);
    var m=Math.floor((sec%3600)/60);
    var s=sec%60;
    el.textContent=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  }

  function money(n){return Math.round(n||0).toLocaleString('ko-KR')+'원';}
  function total(){return session.roses*ROSE_WON;}
  function currentMemberType(){
    try{
      var saved=localStorage.getItem('ktalk_member_type');
      if(saved==='subscriber')return 'subscriber';
    }catch(e){}
    if(window.state){
      if(state.memberType==='subscriber'||state.subscribed===true||state.subscriptionActive===true)return 'subscriber';
    }
    return 'general';
  }
  function rateFor(type){return type==='subscriber'?0.40:0.35;}
  function labelFor(type){return type==='subscriber'?'구독자':'일반회원';}
  function myNet(){return Math.round(total()*session.rate);}

  window.setKTalkMemberType=function(type){
    var v=type==='subscriber'?'subscriber':'general';
    try{localStorage.setItem('ktalk_member_type',v);}catch(e){}
    if(window.state)state.memberType=v;
    return v;
  };

  function updateEarn(){
    var net=money(myNet());
    var roses=session.roses.toLocaleString('ko-KR')+'송이';
    var rate=labelFor(session.memberType)+' · '+Math.round(session.rate*100)+'%';

    var a=document.getElementById('earnNet');
    var b=document.getElementById('earnRoses');
    var r=document.getElementById('earnRate');
    var h1=document.getElementById('hudEarnNet');
    var h2=document.getElementById('hudEarnRoses');
    var h3=document.getElementById('hudEarnRate');

    if(a)a.textContent=net;
    if(b)b.textContent=roses;
    if(r)r.textContent=rate;
    if(h1)h1.textContent=net;
    if(h2)h2.textContent='🌹 '+roses;
    if(h3)h3.textContent=rate;
  }

  window.toggleMyEarnings=function(){
    var d=document.getElementById('myEarnDetail');
    if(!d)return;
    d.style.display=d.style.display==='none'?'grid':'none';
  };

  window.showPrivate30mEarnings=function(){
    if(!session.active)return;
    var old=document.getElementById('privateEarnToast');
    if(old)old.remove();

    var toast=document.createElement('div');
    toast.id='privateEarnToast';
    toast.style.cssText='position:fixed;top:78px;left:50%;transform:translateX(-50%);z-index:9998;width:min(92vw,430px);padding:12px 14px;border-radius:16px;border:1px solid #ffe07166;background:rgba(12,10,18,.94);box-shadow:0 10px 30px #0008,0 0 18px #ffd85a22;color:#fff;text-align:center;font-weight:900;pointer-events:none';
    toast.innerHTML='<div style="font-size:11px;color:#9eeeff">🔒 본인에게만 보이는 30분 수익 확인</div>'
      +'<div style="margin-top:5px;font-size:18px;color:#ffe071">🌹 '+session.roses.toLocaleString('ko-KR')+'송이 · '+money(myNet())+'</div>';
    document.body.appendChild(toast);

    clearTimeout(toastTimer);
    toastTimer=setTimeout(function(){if(toast&&toast.parentNode)toast.remove();},7000);
  };

  window.addMyEarnedRoses=function(count){
    var n=parseInt(count,10)||0;
    if(!session.active||n<=0)return;
    session.roses+=n;
    session.gifts++;
    updateEarn();
  };

  function updateHostLikeUI(){
    var a=document.getElementById('hostLikeCount');
    if(a)a.textContent=(session.likes||0).toLocaleString('ko-KR');
  }

  function checkHostLikeReward(){
    var milestones=[5000,10000,15000,20000,25000];
    milestones.forEach(function(m){
      if((session.likes||0)>=m && !session.likeRewarded[m]){
        session.likeRewarded[m]=true;
        session.roses+=1;
        updateEarn();
        if(window.ktAnnounceEvent)ktAnnounceEvent('reward',{text:'좋아요 '+m.toLocaleString('ko-KR')+'개 달성. 호스트에게 장미 1송이를 지급했습니다.'});
        var toast=document.createElement('div');
        toast.className='kt-like-reward-toast';
        toast.innerHTML='💗 좋아요 '+m.toLocaleString('ko-KR')+'개 달성<br><b>🌹 장미 1송이 지급</b>';
        document.body.appendChild(toast);
        setTimeout(function(){if(toast&&toast.parentNode)toast.remove();},3200);
      }
    });
  }

  window.addHostLike=function(count){
    if(!session.active)return;
    var n=parseInt(count,10)||1;
    if(n<1)n=1;
    session.likes=(session.likes||0)+n;
    if(session.likes>25000)session.likes=25000;
    updateHostLikeUI();
    checkHostLikeReward();
  };


  var liveFaceTimer=null;
  var liveFaceDetector=null;

  function appliedEffectMarkup(){
    try{
      var applied=(window.state&&state.appliedEditEffect)||'off';
      if(window.renderFaceEffect)renderFaceEffect(applied);
      var a=document.getElementById('ktFaceAnchor');
      return a?a.innerHTML:'';
    }catch(e){return '';}
  }

  function applyLiveVideoFilter(name){
    var v=document.getElementById('ktLiveVideo');
    if(!v)return;
    var base='brightness(1.12) contrast(.95) saturate(1.02)';
    if(name==='mono')v.style.filter='grayscale(1) contrast(1.05) brightness(1.08)';
    else if(name==='warm')v.style.filter='brightness(1.12) contrast(.95) saturate(1.10) sepia(.12)';
    else if(name==='cool')v.style.filter='brightness(1.10) contrast(.95) saturate(.98) hue-rotate(170deg)';
    else if(name==='soft')v.style.filter='brightness(1.14) contrast(.92) saturate(.98)';
    else if(name==='studio')v.style.filter='brightness(1.16) contrast(.94) saturate(.98)';
    else if(name==='night')v.style.filter='brightness(.88) contrast(1.04) saturate(.92)';
    else v.style.filter=base;
  }

  function placeLiveFaceFallback(){
    var layer=document.getElementById('ktLiveEffectLayer');
    var anchor=document.getElementById('ktLiveFaceAnchor');
    var v=document.getElementById('ktLiveVideo');
    if(!layer||!anchor||!v)return;
    var lr=layer.getBoundingClientRect();
    var vr=v.getBoundingClientRect();
    var w=Math.min(vr.width*.44,220);
    var h=w*1.18;
    anchor.style.left=((vr.left-lr.left)+(vr.width*.50))+'px';
    anchor.style.top=((vr.top-lr.top)+(vr.height*.40))+'px';
    anchor.style.width=w+'px';
    anchor.style.height=h+'px';
  }

  async function trackLiveFaceOnce(){
    var v=document.getElementById('ktLiveVideo');
    var layer=document.getElementById('ktLiveEffectLayer');
    var anchor=document.getElementById('ktLiveFaceAnchor');
    if(!v||!layer||!anchor||!v.videoWidth||!v.videoHeight){placeLiveFaceFallback();return;}
    if(!('FaceDetector' in window)){placeLiveFaceFallback();return;}
    try{
      if(!liveFaceDetector)liveFaceDetector=new FaceDetector({fastMode:true,maxDetectedFaces:1});
      var faces=await liveFaceDetector.detect(v);
      if(!faces||!faces.length){placeLiveFaceFallback();return;}
      var box=faces[0].boundingBox;
      var lr=layer.getBoundingClientRect();
      var vr=v.getBoundingClientRect();
      var scale=Math.max(vr.width/v.videoWidth,vr.height/v.videoHeight);
      var drawW=v.videoWidth*scale,drawH=v.videoHeight*scale;
      var offX=(vr.width-drawW)/2,offY=(vr.height-drawH)/2;
      var bw=box.width*scale,bh=box.height*scale;
      var bx=offX+(box.x*scale);
      if((state.cameraFacing||'user')!=='environment'){
        bx=vr.width-offX-((box.x+box.width)*scale);
      }
      var by=offY+(box.y*scale);
      anchor.style.left=((vr.left-lr.left)+bx+(bw/2))+'px';
      anchor.style.top=((vr.top-lr.top)+by+(bh/2))+'px';
      anchor.style.width=Math.max(120,bw)+'px';
      anchor.style.height=Math.max(145,bh)+'px';
    }catch(e){placeLiveFaceFallback();}
  }

  function applySelectedEffectToLive(){
    var name=(window.state&&state.appliedEditEffect)||'off';
    var anchor=document.getElementById('ktLiveFaceAnchor');
    if(anchor)anchor.innerHTML=appliedEffectMarkup();
    applyLiveVideoFilter(name);
    clearInterval(liveFaceTimer);
    if(name!=='off'&&['mono','warm','cool','soft'].indexOf(name)===-1){
      trackLiveFaceOnce();
      liveFaceTimer=setInterval(trackLiveFaceOnce,260);
    }
  }

  window.leaveBroadcastToDashboard=function(){
    clearInterval(earnTimer);
    earnTimer=null;
    clearInterval(liveClockTimer);
    liveClockTimer=null;
    clearInterval(liveFaceTimer);
    liveFaceTimer=null;
    try{
      if(window.state&&state.stream){
        state.stream.getTracks().forEach(function(t){t.stop();});
        state.stream=null;
      }
    }catch(e){}
    session.active=false;
    if(window.state){
      state.currentLiveRoomTitle='';
      state.currentViewRoomTitle='';
    }
    try{history.replaceState({ktVideoHome:true},'',location.href);}catch(e){}
    if(window.home)window.home();
    else if(window.openDashboard)window.openDashboard();
  };

  window.addEventListener('popstate',function(){
    if(session.active)window.leaveBroadcastToDashboard();
  });

  window.ktLiveStartCountdown=async function(){
    var old=document.getElementById('ktLiveCountdown');
    if(old)old.remove();

    var wrap=document.createElement('div');
    wrap.id='ktLiveCountdown';
    wrap.style.cssText='position:fixed;inset:0;z-index:99999;display:grid;place-items:center;background:rgba(0,0,0,.22);pointer-events:none;';
    var num=document.createElement('div');
    num.style.cssText='width:116px;height:116px;border-radius:50%;display:grid;place-items:center;background:rgba(10,10,14,.72);border:4px solid rgba(255,255,255,.92);color:#fff;font:900 64px/1 system-ui,-apple-system,sans-serif;box-shadow:0 0 28px rgba(255,44,130,.7);text-shadow:0 0 12px rgba(255,255,255,.7);';
    wrap.appendChild(num);
    document.body.appendChild(wrap);

    for(var n=5;n>=1;n--){
      num.textContent=String(n);
      num.style.transform='scale(1)';
      await new Promise(function(resolve){
        setTimeout(function(){num.style.transform='scale(.92)';},650);
        setTimeout(resolve,1000);
      });
    }
    wrap.remove();
  };

  window.startBroadcast=async function(){
    if(window.ktLiveStartCountdown)await window.ktLiveStartCountdown();
    var t=document.getElementById('liveTitle');
    var memberType=currentMemberType();
    session={
      active:true,
      start:Date.now(),
      roses:0,
      gifts:0,
      likes:0,
      likeRewarded:{},
      title:t&&t.value?t.value:'K-Talk LIVE',
      memberType:memberType,
      rate:rateFor(memberType)
    };
    window.ktGuestRewards={};
    var liveRoomType=(window.state&&state.liveRoomType)||'general';
    var guestStrip='';
    if(liveRoomType!=='solo'){
      guestStrip='';
    }
    var waveBars='';
    for(var wi=0;wi<64;wi++){
      waveBars+='<span style="animation-duration:'+(0.60+(wi%9)*0.055).toFixed(3)+'s"></span>';
    }
    var liveWave=(['solo','general','group','group13','subscriber','password'].indexOf(liveRoomType)>-1)
      ?'<div class="kt-room-live-wave" aria-hidden="true">'+waveBars+'</div>'
      :'';
    if(window.state){
      state.currentLiveRoomTitle=session.title;
      state.currentViewRoomTitle=session.title;
    }

    var ok=true;
    if(window.ensureLiveCamera){
      try{ok=await ensureLiveCamera((window.state&&state.cameraFacing)||'user');}catch(e){ok=false;}
    }

    if(window.creator)creator.classList.remove('show','live-prep-open');
    document.body.classList.remove('kt-home');
    try{history.pushState({ktLiveBroadcast:true},'',location.href);}catch(e){}

    screen.innerHTML='<section style="height:100dvh;min-height:620px;position:relative;overflow:hidden;background:#050309;color:#fff">'
      +'<video id="ktLiveVideo" autoplay playsinline muted style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#09070d;transform:scaleX(-1);filter:brightness(1.14) contrast(.90) saturate(1.02) blur(.72px)"></video>'
      +'<div style="position:absolute;inset:0;background:linear-gradient(180deg,#00000045,transparent 34%,#00000018 62%,#000000d9 100%);pointer-events:none"></div>'
      +'<div id="ktLiveEffectLayer" style="position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden"><div id="ktLiveFaceAnchor" class="kt-face-anchor"></div></div>'
      +liveWave
      +'<div id="ktLiveTreasureZone" class="kt-live-treasure-zone"></div>'
      +'<div class="kt-live-airclock"><span class="air">● ON AIR</span><span id="ktLiveClock" class="clock">00:00:00</span></div>'
      +'<button class="kt-live-attendance" onclick="if(window.openAttendanceBenefits)openAttendanceBenefits()" aria-label="출석체크"><span class="wing">🪽</span><span class="badge">출석체크 <span class="heart">♥</span></span><span class="wing">🪽</span></button>'

      +'<button onclick="leaveBroadcastToDashboard()" aria-label="방송 나가기" style="position:absolute;left:10px;top:12px;z-index:7;width:42px;height:42px;border-radius:50%;border:1px solid #ffffff33;background:#08080b99;color:#fff;font-size:32px;font-weight:700;line-height:36px;display:grid;place-items:center">‹</button>'
      +'<div style="position:absolute;left:58px;right:10px;top:12px;z-index:5;display:grid;gap:7px">'
        +'<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border:1px solid #ffffff22;border-radius:14px;background:#08080b77">'
          +'<b style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">🔴 '+session.title+'</b>'
          +'<span style="color:#ff6788;font-weight:900;white-space:nowrap">K-Talk LIVE</span>'
        +'</div>'
        +guestStrip
        +'<button id="myEarnHud" onclick="toggleMyEarnings()" style="position:fixed;left:50%;bottom:68px;transform:translateX(-50%);z-index:9;width:116px;padding:5px 8px;border:1px solid #ffe07155;border-radius:999px;background:linear-gradient(135deg,#241b08e8,#16131ee8);color:#fff;text-align:center">'
          +'<div style="display:flex;align-items:center;justify-content:center;gap:5px">'
            +'<span style="font-size:7px;color:#8fe8ff;font-weight:950;white-space:nowrap">🔒 내 수익</span>'
            +'<b id="hudEarnNet" style="font-size:10px;color:#ffe071;white-space:nowrap">0원</b>'
          +'</div>'
          +'<div id="myEarnDetail" style="display:none;grid-template-columns:1fr 1fr;gap:2px;margin-top:3px;font-size:7px;color:#ddd">'
            +'<span id="hudEarnRoses">🌹 0송이</span><span id="hudEarnRate" style="text-align:right">35%</span>'
          +'</div>'
        +'</button>'
      +'</div>'

      +'<div style="position:absolute;right:10px;bottom:112px;z-index:5;display:grid;gap:9px">'
        +'<button onclick="addHostLike(1)" style="width:54px;min-height:62px;border-radius:18px;border:1px solid #ff65b788;background:#321024dd;color:#fff;font-size:22px;font-weight:950;line-height:1">💗<small style="display:block;margin-top:4px;font-size:9px;color:#ffd8ef">좋아요</small><b id="hostLikeCount" style="display:block;margin-top:3px;font-size:10px;color:#fff">0</b></button>'
        +'<button onclick="openGifts()" style="width:54px;height:54px;border-radius:50%;border:1px solid #ffd65a88;background:#2b1c08dd;color:#fff;font-size:23px">🎁</button>'
        +'<button onclick="if(window.openHostMatchArena)openHostMatchArena(\'1대1\')" style="width:54px;height:54px;border-radius:50%;border:1px solid #a85cff88;background:linear-gradient(145deg,#2e1450dd,#12091fdd);color:#fff;font-size:10px;font-weight:950;line-height:1.15">⚔<small style="display:block;margin-top:3px;font-size:9px;color:#e8c8ff">매치</small></button>'
        +'<button onclick="if(window.openEditEffectPanel){creator.classList.add(\'show\');openEditEffectPanel();}" style="width:54px;height:54px;border-radius:50%;border:1px solid #ffffff38;background:#09090ddd;color:#fff;font-size:11px;font-weight:900">✨ 효과</button>'
      +'</div>'

      +'<div style="position:absolute;left:10px;right:10px;bottom:14px;z-index:5;display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px">'
        +'<button onclick="openGifts()" style="padding:12px 5px;border:1px solid #ffd86b66;border-radius:15px;background:linear-gradient(135deg,#332707,#7a5310);color:#ffe075;font-weight:950;font-size:12px">🎁 선물</button>'
        +'<button onclick="openTreasure()" style="padding:12px 5px;border:1px solid #f2b94f88;border-radius:15px;background:linear-gradient(135deg,#48260d,#8c5512);color:#fff3a7;font-weight:950;font-size:12px">🗝️ 보물상자</button>'
        +'<button onclick="endBroadcastEarnings()" style="padding:12px 5px;border:0;border-radius:15px;background:linear-gradient(135deg,#ff315f,#ff4e91);color:#fff;font-weight:950;font-size:12px">■ 방송 종료</button>'
      +'</div>'
      +'</section>';

    var liveVideo=document.getElementById('ktLiveVideo');
    if(ok&&liveVideo&&window.state&&state.stream){
      liveVideo.srcObject=state.stream;
      try{await liveVideo.play();}catch(e){}
      applySelectedEffectToLive();
    }else if(liveVideo){
      liveVideo.style.display='none';
    }
    if(window.ktRenderTreasure)ktRenderTreasure();
    if(window.ktUpdateTreasureLed)ktUpdateTreasureLed();

    updateEarn();
    clearInterval(liveClockTimer);
    updateLiveClock();
    liveClockTimer=setInterval(updateLiveClock,1000);
    clearInterval(earnTimer);
    earnTimer=setInterval(function(){
      if(session.active)showPrivate30mEarnings();
    },30*60*1000);
  };

  var oldGiftSend=window.giftSend;
  window.giftSend=function(name,cost){
    var n=parseInt(String(cost).replace(/,/g,''),10)||0;
    if(session.active&&n>0){
      session.roses+=n;
      session.gifts++;
      updateEarn();
    }
    if(oldGiftSend)oldGiftSend(name,cost);
  };

  function currentMemberKey(){
    var key='local-member';
    try{
      if(window.state)key=state.userId||state.memberId||state.uid||key;
      if(key==='local-member'){
        key=localStorage.getItem('ktalk_member_key')||key;
        if(key==='local-member'){
          key='member-'+Math.random().toString(36).slice(2,10);
          localStorage.setItem('ktalk_member_key',key);
        }
      }
    }catch(e){}
    return String(key);
  }

  function saveMyLastEarnings(summary){
    try{localStorage.setItem('ktalk_last_earnings_'+currentMemberKey(),JSON.stringify(summary));}catch(e){}
  }

  window.endBroadcastEarnings=function(){
    if(!session.active)return;
    clearInterval(earnTimer);
    earnTimer=null;
    clearInterval(liveClockTimer);
    liveClockTimer=null;
    clearInterval(liveFaceTimer);
    liveFaceTimer=null;
    try{
      if(window.state&&state.stream){
        state.stream.getTracks().forEach(function(t){t.stop();});
        state.stream=null;
      }
    }catch(e){}

    var gross=total();
    var mine=myNet();
    var ratePct=Math.round(session.rate*100);
    var summary={
      memberKey:currentMemberKey(),
      endedAt:Date.now(),
      memberType:session.memberType,
      roses:session.roses,
      gross:gross,
      rate:ratePct,
      mine:mine
    };

    saveMyLastEarnings(summary);
    session.active=false;
    if(window.state){
      state.currentLiveRoomTitle='';
      state.currentViewRoomTitle='';
    }
    if(window.ktSaveTreasure)ktSaveTreasure(null);
    if(window.ktSaveTreasureQueue)ktSaveTreasureQueue([]);

    showSheet('💰 방송 종료 · 내 수익',
      '<div class="rowbox" style="text-align:center;border:2px solid #ffd85a88;background:#3a2b071f;padding:20px 12px">'
      +'<div style="font-size:15px;color:#fff3b0;font-weight:900">회사 수수료 차감 후</div>'
      +'<div style="margin-top:5px;font-size:16px;font-weight:950;color:#ffe075">내가 받는 금액</div>'
      +'<div style="margin-top:8px;font-size:40px;font-weight:950;color:#ffe075">'+money(summary.mine)+'</div>'
      +'</div>'
      +'<div class="rowbox"><b>🌹 받은 장미</b><br>'+summary.roses.toLocaleString('ko-KR')+'송이 × 30원</div>'
      +'<div class="rowbox"><b>회원 구분 · 내 정산율</b><br>'+labelFor(summary.memberType)+' · '+summary.rate+'%</div>'
      +'<div class="note">이 수익 정보는 본인 화면에서만 확인합니다. 일반회원은 35%, 구독자는 40% 기준으로 계산합니다.</div>'
      +'<button class="act" onclick="closeSheet();home()">확인</button>'
    );
  };
})();
</script>
