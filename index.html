<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>K-Talk LIVE</title><style>*{box-sizing:border-box}html,body{margin:0;background:#050507;color:#fff;font-family:Arial,"Noto Sans KR",sans-serif}button,input{font:inherit}.app{max-width:520px;height:100dvh;margin:auto;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 22%,#63307c,#160d20 42%,#050507 75%)}.shade{position:absolute;inset:0;background:linear-gradient(180deg,#0003,transparent 40%,#000c)}.top{position:absolute;z-index:3;top:14px;left:14px;right:14px;display:flex;justify-content:space-between}.live{background:#f0184d;padding:8px 12px;border-radius:10px;font-weight:900}.brand{position:absolute;z-index:3;top:66px;left:16px;color:#ffd46d;font-size:23px;font-weight:900}.led{position:absolute;z-index:3;top:105px;left:14px;right:14px;padding:10px 12px;border:1px solid #b47cff66;border-radius:12px;background:#170d26dd;color:#f2d9ff;font-weight:800;text-align:center;box-shadow:0 0 12px #8d36ff33}.chat{position:absolute;z-index:3;left:14px;right:90px;bottom:132px}.msg{margin:7px 0;font-size:13px;text-shadow:0 1px 3px #000}.msg b{color:#ffd05c}.gifts{position:absolute;z-index:4;right:12px;bottom:145px;display:grid;gap:8px}.gift{width:58px;min-height:55px;border:1px solid #ffffff2b;border-radius:18px;background:#0d0b13d9;color:#fff;font-size:22px}.gift small{display:block;font-size:10px}.composer{position:absolute;z-index:4;left:12px;right:12px;bottom:70px;display:grid;grid-template-columns:1fr 46px;gap:7px}.composer input{height:46px;border:1px solid #8752cc;border-radius:24px;background:#111018e8;color:#fff;padding:0 16px}.composer button{border:1px solid #ffffff33;border-radius:50%;background:#17131f;color:#fff}.nav{position:absolute;z-index:5;bottom:0;left:0;right:0;height:64px;background:#08080bf2;border-top:1px solid #ffffff17;display:grid;grid-template-columns:1fr 1fr 78px 1fr 1fr;align-items:center}.nav button{border:0;background:transparent;color:#bbb;font-size:10px;height:100%}.nav span{display:block;font-size:19px}.plus{width:62px!important;height:62px!important;margin-top:-25px;border:2px solid #fff!important;border-radius:50%;background:linear-gradient(135deg,#ff3b87,#8d36ff)!important;color:#fff!important;font-size:32px!important;box-shadow:0 5px 24px #a442ff99,0 0 0 5px #08080b}.sheet{display:none;position:fixed;z-index:30;inset:0;background:#000b;align-items:flex-end;justify-content:center;padding-bottom:42px}.sheet.open{display:flex}.panel{width:min(520px,100%);max-height:calc(100dvh - 62px);overflow:auto;background:#0b0910;border:1px solid #7d6538;border-radius:25px 25px 8px 8px;padding:12px 14px 14px}.head{text-align:center}.head h2{color:#f1d291;margin:2px}.head small{font-size:12px}.close{float:right;background:none;border:0;color:#fff;font-size:28px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}.card{border:1px solid #8a6a3155;border-radius:15px;background:#171119;color:#fff;padding:9px 6px;min-height:82px}.card i{font-size:23px;font-style:normal}.card b{display:block;color:#f5d798;margin:4px;font-size:16px}.card small{font-size:11px}.wide{grid-column:1/-1;min-height:60px}.recharge{display:none;position:fixed;z-index:60;inset:0;background:#000c;place-items:center}.recharge.open{display:grid}.box{width:min(390px,90%);background:#121019;border:1px solid #9b65e5;border-radius:22px;padding:20px;text-align:center}.box h2{color:#ffd26b}.packs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pack{padding:14px;border:1px solid #ffffff25;border-radius:14px;background:#21152e;color:#fff}.balance{color:#ffd05c;font-weight:900}.toast{display:none;position:fixed;z-index:80;left:50%;bottom:90px;transform:translateX(-50%);background:#111;border:1px solid #555;border-radius:12px;padding:10px 14px;white-space:nowrap}@media(max-height:760px){.sheet{padding-bottom:28px}.panel{max-height:calc(100dvh - 42px);padding:9px 12px 11px}.grid{gap:6px;margin-top:7px}.card{min-height:72px;padding:7px 5px}.card i{font-size:20px}.card b{font-size:15px;margin:3px}.wide{min-height:52px}}</style></head><body><main class="app"><div class="shade"></div><div class="top"><span class="live">● LIVE</span><span class="balance">🌹 <b id="bal">8</b></span></div><div class="brand">♛ K-Talk LIVE</div><div class="led">✨ K-Talk LIVE · 즐거운 방송과 새로운 만남 ✨</div><div class="chat"><div class="msg"><b>사랑이 VIP</b> 노래 너무 좋아요 💕</div><div class="msg"><b>볼링사랑 중회원</b> 목소리 최고예요 👍</div><div class="msg"><b>행복이 일반</b> 한 곡 더 불러주세요 🎵</div></div><div class="gifts"><button class="gift" data-rose="1">🌹<small>1개</small></button><button class="gift" data-rose="5">💐<small>5개</small></button><button class="gift" data-rose="10">🌹<small>10개</small></button><button class="gift" data-rose="100">❤️<small>100개</small></button><button class="gift">🎁<small>선물</small></button></div><div class="composer"><input placeholder="채팅을 입력하세요..."><button>🎤</button></div><nav class="nav"><button><span>⌂</span>방송</button><button><span>⌕</span>탐색</button><button class="plus" id="plus">＋</button><button><span>🎁</span>이벤트</button><button><span>♙</span>내 정보</button></nav></main><div class="sheet" id="sheet"><section class="panel"><button class="close" id="close">×</button><div class="head"><div style="font-size:24px;color:#ffd05c">♛</div><h2>방송 시작하기</h2><small>원하는 방송을 선택하세요</small></div><div class="grid"><button class="card"><i>👥</i><b>일반 방송</b><small>최대 13명</small></button><button class="card"><i>🎙️</i><b>혼자 방송</b><small>1인 라이브</small></button><button class="card"><i>🔒</i><b>비밀방</b><small>호스트 1 + 게스트 6</small></button><button class="card"><i>🎧</i><b>여자 DJ</b><small>음악 방송</small></button><button class="card"><i>🎧</i><b>남자 DJ</b><small>음악 방송</small></button><button class="card"><i>🎬</i><b>영화방</b><small>입장 🌹5 · 6시간</small></button><button class="card wide"><i>🎞️</i><b>동영상 올리기</b><small>일반 동영상 · 판매/광고 제외</small></button><button class="card wide"><i>▣</i><b>쇼츠 올리기</b><small>쇼츠 · 상품/광고 등록 가능</small></button></div></section></div><div class="recharge" id="recharge"><div class="box"><h2>🌹 장미 충전</h2><p>장미가 부족합니다.<br>충전 후 선물할 수 있어요.</p><p>장미 1개 = 30원</p><div class="packs"><button class="pack" data-add="100">100개<br>3,000원</button><button class="pack" data-add="500">500개<br>15,000원</button><button class="pack" data-add="1000">1,000개<br>30,000원</button><button class="pack" data-add="3500">3,500개<br>105,000원</button></div><p><button id="cancel" class="pack">닫기</button></p></div></div><div class="toast" id="toast"></div><script>let roses=8;const bal=document.getElementById('bal'),sheet=document.getElementById('sheet'),recharge=document.getElementById('recharge'),toast=document.getElementById('toast');function say(t){toast.textContent=t;toast.style.display='block';setTimeout(()=>toast.style.display='none',1600)}document.getElementById('plus').onclick=()=>sheet.classList.add('open');document.getElementById('close').onclick=()=>sheet.classList.remove('open');document.querySelectorAll('[data-rose]').forEach(b=>b.onclick=()=>{let n=+b.dataset.rose;if(roses<n){recharge.classList.add('open');return}roses-=n;bal.textContent=roses;say('🌹 '+n+'개를 선물했습니다')});document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{roses+=+b.dataset.add;bal.textContent=roses;recharge.classList.remove('open');say('장미가 충전되었습니다')});document.getElementById('cancel').onclick=()=>recharge.classList.remove('open');</script></body></html>
