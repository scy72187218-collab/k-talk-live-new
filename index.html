<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>K-Talk LIVE</title><style>*{box-sizing:border-box}html,body{margin:0;background:#000;color:#fff;font-family:Arial,'Noto Sans KR',sans-serif}body{overflow:hidden}button,input{font:inherit}.feed{height:100dvh;overflow-y:auto;scroll-snap-type:y mandatory}.page{height:100dvh;scroll-snap-align:start;position:relative;overflow:hidden;background:#020204;padding:8px 8px 72px}.female{--host:url('./female-host.svg')}.male{--host:url('./male-host.svg')}.topline{height:52px;display:flex;align-items:center;justify-content:space-between;gap:8px}.host{display:flex;align-items:center;gap:8px;font-weight:900}.avatar{width:42px;height:42px;border-radius:50%;border:2px solid #ff76da;background-image:var(--host);background-size:cover;background-position:center}.live{background:#ff174f;border-radius:7px;padding:5px 8px;font-size:11px}.viewer{font-weight:800}.headTools{position:absolute;left:50%;top:7px;transform:translateX(-50%);display:flex;gap:5px;z-index:5}.attendance,.treasure,.miniTool{border:1px solid #ff4dc7;border-radius:12px;background:#09060df2;color:#fff;min-height:45px;text-align:center;padding:5px 8px}.attendance{min-width:122px;box-shadow:0 0 10px #b731ff88}.attendance b,.treasure b{display:block;font-size:10px}.attendance strong{display:block;font-size:17px;line-height:1.1}.treasure{border-color:#d69b35;min-width:86px}.treasure span{display:block;font-size:11px}.miniTool{border:0;min-width:46px;background:transparent;font-size:18px;padding:2px}.miniTool small{display:block;font-size:9px}.led{height:48px;margin:5px auto;width:76%;border:1px solid #d84cff;border-radius:13px;background:#08040cf0;color:#ffc23d;text-align:center;font-weight:900;font-size:15px;display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden;box-shadow:0 0 13px #b731ff99}.status{height:32px;border:1px solid #ff4dc755;border-radius:7px;display:grid;grid-template-columns:1.1fr 1.1fr 1.5fr 1.3fr;align-items:center;text-align:center;font-size:10px;margin-bottom:6px;background:#050407}.status span{border-right:1px solid #ffffff1b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status span:last-child{border-right:0}.main{height:calc(100dvh - 223px);display:grid;grid-template-columns:minmax(0,2fr) minmax(150px,1fr);gap:6px}.leftcol,.rightcol{min-height:0;display:grid;gap:6px}.leftcol{grid-template-rows:minmax(0,1fr) 180px}.rightcol{grid-template-rows:minmax(0,1fr) 112px}.video{position:relative;min-height:0;border:1px solid #ff4dc755;border-radius:9px;overflow:hidden;background-image:var(--host);background-size:cover;background-position:center top;background-repeat:no-repeat}.wave{position:absolute;left:18px;right:50px;bottom:13px;height:30px;display:flex;align-items:end;gap:2px}.wave i{flex:1;min-width:2px;border-radius:3px;background:linear-gradient(#f0f,#0af,#0f8,#ff0,#f30);animation:w 1s ease-in-out infinite alternate}.wave i:nth-child(3n){height:65%}.wave i:nth-child(3n+1){height:92%}.wave i:nth-child(3n+2){height:45%}@keyframes w{from{transform:scaleY(.45)}to{transform:scaleY(1)}}.chatbox,.giftpanel,.notice{border:1px solid #ff4dc755;border-radius:9px;background:#050507e8;overflow:hidden}.messages{height:128px;overflow:auto;padding:8px 10px;font-size:11px;line-height:1.55}.composer{display:flex;gap:5px;padding:5px;border-top:1px solid #ffffff18}.composer input{min-width:0;flex:1;height:36px;border:1px solid #ffffff2d;border-radius:6px;background:#0b0a0ddd;color:#fff;padding:0 8px}.composer button{border:0;border-radius:6px;padding:0 14px;background:#7c17df;color:#fff;font-weight:900}.giftpanel{padding:7px}.giftTitle{font-size:12px;font-weight:900;margin-bottom:5px}.giftTitle em{font-style:normal;color:#ffd332;font-size:10px}.giftgrid{height:calc(100% - 24px);display:grid;grid-template-columns:1fr 1fr;gap:5px;overflow:auto}.gift{border:1px solid #ffffff25;border-radius:7px;background:#08080c;color:#fff;min-height:70px;font-size:24px;padding:5px}.gift small{display:block;font-size:10px;margin-top:2px;line-height:1.2}.gift .cost{color:#ffd95b}.heart{opacity:.9}.notice{padding:8px;font-size:10px;line-height:1.55}.notice b{display:block;color:#c777ff;font-size:12px;margin-bottom:4px}.nav{position:fixed;z-index:10;bottom:0;left:0;right:0;height:64px;background:#030305f5;border-top:1px solid #ffffff18;display:grid;grid-template-columns:repeat(5,1fr);align-items:center}.nav button{border:0;background:transparent;color:#ddd;font-size:9px;height:64px}.nav strong{display:block;font-size:18px}.plusBtn{width:58px!important;height:46px!important;border-radius:14px;background:#fff!important;color:#111!important;font-size:32px!important;margin:auto;box-shadow:inset 6px 0 #20d5ec,inset -6px 0 #fe2c55}.sheet{display:none;position:fixed;z-index:30;inset:0;background:#000}.sheet.open{display:block}.camera{position:relative;width:100%;height:100%}.cameraVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#111}.cameraFallback{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px}.close{position:absolute;z-index:5;top:12px;left:12px;width:44px;height:44px;border:0;border-radius:50%;background:#0009;color:#fff;font-size:28px}.toolRail{position:absolute;z-index:5;right:12px;top:72px;display:grid;gap:8px}.toolBtn{width:58px;min-height:48px;border:0;border-radius:15px;background:#0009;color:#fff;font-size:11px}.controls{position:absolute;z-index:5;left:0;right:0;bottom:20px;text-align:center}.capture{width:68px;height:68px;border-radius:50%;border:5px solid #fff;background:#ef3340}.rooms{padding:10px}.rooms .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.room{min-height:58px;border:1px solid #ffffff55;background:#0008;color:#fff;border-radius:12px;font-weight:900;font-size:13px}@media(max-width:600px){body{overflow:hidden}.feed{height:100dvh;overflow-y:auto;scroll-snap-type:none;padding-bottom:64px}.page{height:auto;min-height:1320px;scroll-snap-align:none;overflow:visible;padding:8px 8px 78px}.topline{height:54px}.avatar{width:42px;height:42px}.host{font-size:15px}.headTools{top:56px;left:8px;right:8px;transform:none;justify-content:center;gap:7px}.attendance{min-width:146px;min-height:68px;padding:7px 10px}.attendance b{font-size:11px}.attendance strong{font-size:21px}.treasure{min-width:110px;min-height:68px;padding:7px 10px}.treasure b{font-size:11px}.treasure span{font-size:14px}.miniTool{display:none}.led{margin-top:76px;width:96%;font-size:15px;height:58px}.status{height:38px;font-size:9px;margin-bottom:7px}.main{height:965px;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:6px}.leftcol{grid-template-rows:650px 309px}.rightcol{grid-template-rows:748px 211px}.video{background-size:cover;background-position:center top;background-repeat:no-repeat}.wave{left:16px;right:32px;bottom:14px;height:34px}.messages{height:247px;font-size:11px;padding:9px;line-height:1.55}.composer{height:52px}.composer input{height:42px;font-size:13px}.composer button{height:42px;min-width:64px}.giftpanel{padding:6px}.giftTitle{font-size:11px;line-height:1.25}.giftTitle em{font-size:9px}.giftgrid{height:calc(100% - 34px);gap:5px}.gift{min-height:96px;font-size:27px;padding:6px 3px}.gift small{font-size:10px;line-height:1.2}.notice{font-size:10px;padding:8px;line-height:1.6}.notice b{font-size:13px}.nav{height:64px}}@media(max-width:390px){.page{min-height:1280px}.main{height:925px;grid-template-columns:minmax(0,2fr) minmax(0,1fr)}.leftcol{grid-template-rows:620px 299px}.rightcol{grid-template-rows:720px 199px}.gift{min-height:90px}.attendance{min-width:136px}.treasure{min-width:100px}.led{font-size:14px}}</style></head><body><main class="feed" id="feed"></main><nav class="nav"><button><strong>⌂</strong>홈</button><button><strong>♧</strong>친구</button><button class="plusBtn" id="plusBtn">＋</button><button><strong>▦</strong>알림</button><button><strong>♙</strong>프로필</button></nav><section class="sheet" id="sheet"><div class="camera"><video id="cameraVideo" class="cameraVideo" autoplay playsinline muted></video><div class="cameraFallback" id="cameraFallback">카메라를 켜는 중입니다.</div><button class="close" id="close">×</button><div class="toolRail"><button class="toolBtn">✨<br>보정</button><button class="toolBtn">🖼️<br>배경</button><button class="toolBtn" id="flip">↻<br>전환</button></div><div class="controls"><button class="capture" aria-label="촬영"></button><div class="rooms"><div class="grid"><button class="room">🎙️<br>1인 방송</button><button class="room">👥<br>13명 방송</button><button class="room">👑<br>VIP 방송</button><button class="room">🔒<br>비밀방</button><button class="room">🎬<br>영화방</button><button class="room">🎧<br>DJ방</button></div></div></div></div></section><script>const rooms=[{cls:'female',gender:'female',name:'소라',viewer:125,msg:['소라: 대표님 안녕하세요. 어서 오세요. 반갑습니다.','해피걸: 오늘 방송 좋아요 👍','지수: 반가워요 💕']},{cls:'male',gender:'female2',name:'유리',viewer:98,msg:['유리: 대표님 안녕하세요. 어서 오세요. 반갑습니다.','민수는 1위~: 즐겁게 듣고 있어요! ❤️','지수: 목소리 너무 좋아요 👍','이태훈: 신청곡 이벤트도 최고! 🎵','유리팬: 우와~ 노래 최고예요! 👏']}];const feed=document.getElementById('feed');function giftPanel(){return `<div class="giftpanel"><div class="giftTitle">장미 선물 <em>(장미 1송이 = 30원)</em></div><div class="giftgrid"><button class="gift">⭐<small>별</small><small class="cost">🌹 장미 5송이</small></button><button class="gift">🎈<small>풍선</small><small class="cost">🌹 장미 5송이</small></button><button class="gift">🌹<small>1송이</small></button><button class="gift">💐<small>5송이</small></button><button class="gift">🌹<small>10송이</small></button><button class="gift">💐<small>50송이</small></button><button class="gift">🌹<small>100송이</small></button><button class="gift heart" disabled>❤️<small>출석체크 전용</small><small class="cost">🌹 장미 2송이</small></button><button class="gift">🎁<small>선물상자</small></button><button class="gift">🎰<small>제비뽑기</small></button></div></div>`}rooms.forEach((r,i)=>{const sec=document.createElement('section');sec.className='page '+r.cls;sec.dataset.gender=r.gender;const id=i?'yuri':'sora';sec.innerHTML=`<div class="topline"><div class="host"><div class="avatar"></div><span>AI ${r.name}</span><span class="live">LIVE</span></div><span class="viewer">👤 ${r.viewer}</span></div><div class="headTools"><div class="attendance"><b>오늘의 출석체크 ❤️</b><strong>0/3</strong></div><div class="treasure"><b>🎁 보물상자</b><span>02:35</span></div><button class="miniTool">🎆<small>00:30</small></button><button class="miniTool">📢<small>공지</small></button></div><div class="led">방송에 오신 여러분 환영합니다! ★ 🎵</div><div class="status"><span>🔴 ON AIR 02:35:48</span><span>👑 출석체크</span><span>🎵 신청곡 5,000원</span><span>⭐ 광고 문의 환영합니다</span></div><div class="main"><div class="leftcol"><div class="video"><div class="wave">${'<i></i>'.repeat(34)}</div></div><div class="chatbox"><div class="messages" id="${id}Messages">${r.msg.join('<br>')}</div><div class="composer"><input id="${id}Input" placeholder="메시지를 입력하세요..." autocomplete="off"><button id="${id}Send">전송</button></div></div></div><div class="rightcol">${giftPanel()}<div class="notice"><b>📢 공지사항</b>1인 방송은 하루 3번 참여 가능합니다.<br>신청곡은 하단 2번(아침/저녁) 가능합니다.<br>선물은 호스트에게 큰 힘이 됩니다! 🥰</div></div></div>`;feed.appendChild(sec)});let voices=[];const nickname='대표';function loadVoices(){if('speechSynthesis'in window)voices=speechSynthesis.getVoices()}if('speechSynthesis'in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}function speakText(text,gender){if(!('speechSynthesis'in window))return;const ko=(voices.length?voices:speechSynthesis.getVoices()).filter(v=>String(v.lang||'').toLowerCase().startsWith('ko'));const u=new SpeechSynthesisUtterance(text);u.voice=gender==='female2'?(ko[1]||ko[0]||null):(ko[0]||null);u.lang='ko-KR';u.volume=1;u.pitch=gender==='female2'?.92:1.08;u.rate=gender==='female2'?.86:.94;speechSynthesis.cancel();speechSynthesis.speak(u)}function replyFor(text){const t=text.replace(/\s+/g,'');if(t.includes('음악')||t.includes('노래'))return '대표님, 어떤 음악이나 노래를 듣고 싶으세요? 제목을 말씀해 주세요.';if(t.includes('안녕'))return '안녕하세요. 대표님, 오늘 방송도 즐겁게 봐주세요.';if(t.includes('반가'))return '저도 반갑습니다. 대표님.';if(t.includes('고마워')||t.includes('감사'))return '네, 대표님. 감사합니다.';return '대표님, 무슨 뜻인지 조금 더 자세히 말씀해 주세요.'}function wire(id,host,gender){const input=document.getElementById(id+'Input'),send=document.getElementById(id+'Send'),box=document.getElementById(id+'Messages');send.onclick=e=>{e.preventDefault();const text=input.value.trim();if(!text)return;box.innerHTML+=`<br>${nickname}: ${text}`;input.value='';const reply=replyFor(text);box.innerHTML+=`<br>${host}: ${reply}`;box.scrollTop=box.scrollHeight;speakText(reply,gender)};input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();send.click()}})}wire('sora','소라','female');wire('yuri','유리','female2');const sheet=document.getElementById('sheet'),video=document.getElementById('cameraVideo'),fallback=document.getElementById('cameraFallback');let stream=null,facing='user';async function startCamera(){if(!navigator.mediaDevices?.getUserMedia){fallback.textContent='이 브라우저에서는 카메라 미리보기를 지원하지 않습니다.';return}if(stream)stream.getTracks().forEach(t=>t.stop());try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing},audio:false});video.srcObject=stream;fallback.style.display='none'}catch(e){fallback.style.display='grid';fallback.textContent='카메라 권한을 허용해 주세요.'}}function stopCamera(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;video.srcObject=null;fallback.style.display='grid'}document.getElementById('plusBtn').onclick=()=>{sheet.classList.add('open');startCamera()};document.getElementById('close').onclick=()=>{sheet.classList.remove('open');stopCamera()};document.getElementById('flip').onclick=async()=>{facing=facing==='user'?'environment':'user';await startCamera()};</script></body></html>
