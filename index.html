<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>K-Talk LIVE</title><style>*{box-sizing:border-box}html,body{margin:0;background:#000;color:#fff;font-family:Arial,'Noto Sans KR',sans-serif;overflow:hidden}button,input{font:inherit}.feed{height:100dvh;overflow-y:auto;scroll-snap-type:y mandatory}.page{height:100dvh;scroll-snap-align:start;position:relative;overflow:hidden;background:#07050a}.photo{position:absolute;inset:0 0 180px;background-size:cover;background-position:center top}.female .photo,.female .avatar{background-image:url('./female-host.svg')}.male .photo,.male .avatar{background-image:url('./male-host.svg')}.shade{position:absolute;inset:0;background:linear-gradient(180deg,#0006 0,#0000 44%,#000 84%)}.top{position:absolute;z-index:3;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:center}.host{display:flex;align-items:center;gap:7px;font-weight:900}.avatar{width:36px;height:36px;border-radius:50%;border:1px solid #fff;background-size:cover;background-position:center}.live{background:#ff174f;border-radius:7px;padding:5px 8px;font-size:10px}.viewer{font-size:11px}.side{position:absolute;z-index:4;right:9px;bottom:102px;display:grid;gap:7px}.gift{width:54px;min-height:55px;border:1px solid #ffffff25;border-radius:14px;background:#08080cf0;color:#fff;font-size:20px}.gift small{display:block;font-size:9px}.info{position:absolute;z-index:4;left:12px;right:72px;bottom:72px}.info h2{font-size:18px;margin:0 0 5px}.chatbox{margin-top:5px;background:#050507e8;border:1px solid #ff4dc755;border-radius:7px;overflow:hidden}.messages{height:92px;overflow:auto;padding:7px;font-size:10px;line-height:1.5}.composer{display:flex;gap:4px;padding:4px;border-top:1px solid #ffffff18}.composer input{min-width:0;flex:1;height:34px;border:1px solid #ffffff2d;border-radius:6px;background:#0b0a0ddd;color:#fff;padding:0 8px;font-size:14px}.composer button{border:0;border-radius:6px;padding:0 13px;background:#8b39f0;color:#fff;font-weight:900;min-width:58px}.nav{position:fixed;z-index:10;bottom:0;left:0;right:0;height:64px;background:#030305f5;border-top:1px solid #ffffff18;display:grid;grid-template-columns:repeat(5,1fr);align-items:center}.nav button{border:0;background:transparent;color:#ddd;font-size:9px;height:64px}.nav strong{display:block;font-size:18px}.plusBtn{width:54px!important;height:44px!important;border-radius:13px;background:#fff!important;color:#111!important;font-size:31px!important;margin:auto;box-shadow:inset 5px 0 #20d5ec,inset -5px 0 #fe2c55}.sheet{display:none;position:fixed;z-index:30;inset:0;background:#000}.sheet.open{display:block}.camera{position:relative;width:100%;height:100%;overflow:hidden;background:#000}.cameraVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#080808}.cameraFallback{position:absolute;inset:0;display:grid;place-items:center;color:#ddd;text-align:center;padding:20px;background:#111}.cameraShade{position:absolute;inset:0;background:linear-gradient(180deg,#0008,#0000 35%,#000a);pointer-events:none}.camTop{position:absolute;z-index:8;top:0;left:0;right:0;height:58px;display:flex;align-items:center;justify-content:center;padding:8px 14px}.close{position:absolute;left:14px;width:42px;height:42px;border:0;background:#0009;color:#fff;border-radius:50%;font-size:28px}.soundBtn{border:0;border-radius:20px;background:#0009;color:#fff;padding:8px 14px;font-size:13px;font-weight:900}.toolRail{position:absolute;z-index:8;right:12px;top:72px;display:grid;gap:8px}.toolBtn{width:58px;min-height:48px;border:0;border-radius:15px;background:#0009;color:#fff;font-size:11px;font-weight:900}.controls{position:absolute;z-index:7;left:0;right:0;bottom:14px;padding:0 12px}.captureRow{display:flex;align-items:center;justify-content:center;gap:28px}.round{width:44px;height:44px;border-radius:50%;border:0;background:#111b;color:#fff;font-size:18px}.capture{width:68px;height:68px;border-radius:50%;border:5px solid #fff;background:#ef3340}.modes{display:flex;justify-content:center;gap:12px;margin:5px 0 8px}.modes button{border:0;background:none;color:#ddd;padding:5px 3px;font-size:14px}.modes .on{color:#fff;font-weight:900}.rooms h3{font-size:15px;margin:0 0 7px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.room{min-height:58px;border:1px solid #ffffff55;background:#0008;color:#fff;border-radius:12px;font-weight:900;font-size:14px;padding:6px 3px}.room span{display:block;font-size:20px}.toast{display:none;position:fixed;z-index:50;left:50%;bottom:90px;transform:translateX(-50%);background:#222;padding:9px 13px;border-radius:9px}.toast.show{display:block}</style></head><body><main class="feed" id="feed"><section class="page female" data-gender="female"><div class="photo"></div><div class="shade"></div><div class="top"><div class="host"><div class="avatar"></div><span>AI 소라</span><span class="live">● LIVE</span></div><span class="viewer">👤 125</span></div><aside class="side"><button class="gift" type="button">🌹<small>1</small></button><button class="gift" type="button">💐<small>5</small></button><button class="gift" type="button">🌹<small>10</small></button><button class="gift" type="button">🎁<small>선물</small></button></aside><div class="info"><h2>AI 소라 · 1인 방송</h2><div class="chatbox"><div class="messages" id="soraMessages">소라: 대표님 안녕하세요. 어서 오세요. 반갑습니다.<br>해피걸: 오늘 방송 좋아요 👍<br>지수: 반가워요 💕</div><div class="composer"><input id="soraInput" placeholder="메시지 입력" autocomplete="off"><button id="soraSend" type="button">전송</button></div></div></div></section><section class="page male" data-gender="male"><div class="photo"></div><div class="shade"></div><div class="top"><div class="host"><div class="avatar"></div><span>AI 준호</span><span class="live">● LIVE</span></div><span class="viewer">👤 98</span></div><aside class="side"><button class="gift" type="button">🌹<small>1</small></button><button class="gift" type="button">💐<small>5</small></button><button class="gift" type="button">🌹<small>10</small></button><button class="gift" type="button">🎁<small>선물</small></button></aside><div class="info"><h2>AI 준호 · 1인 방송</h2><div class="chatbox"><div class="messages" id="junhoMessages">준호: 대표님 안녕하세요. 어서 오세요. 반갑습니다.<br>민수: 반갑습니다 👋<br>태훈: 오늘도 왔어요 👍</div><div class="composer"><input id="junhoInput" placeholder="메시지 입력" autocomplete="off"><button id="junhoSend" type="button">전송</button></div></div></div></section></main><nav class="nav"><button type="button"><strong>⌂</strong>홈</button><button type="button"><strong>♧</strong>친구</button><button class="plusBtn" id="plusBtn" type="button">＋</button><button type="button"><strong>▦</strong>알림</button><button type="button"><strong>♙</strong>프로필</button></nav><section class="sheet" id="sheet"><div class="camera"><video id="cameraVideo" class="cameraVideo" autoplay playsinline muted></video><div class="cameraFallback" id="cameraFallback">카메라를 켜는 중입니다.</div><div class="cameraShade"></div><div class="camTop"><button class="close" id="close" type="button">×</button><button class="soundBtn" type="button">🎵 사운드 추가</button></div><div class="toolRail"><button class="toolBtn" type="button">✨<br>보정</button><button class="toolBtn" type="button">🖼️<br>배경</button><button class="toolBtn" id="flip" type="button">↻<br>전환</button></div><div class="controls"><div class="captureRow"><button class="round" type="button">✨</button><button class="capture" type="button" aria-label="촬영"></button><button class="round" type="button">▣</button></div><div class="modes"><button type="button">10분</button><button type="button">60초</button><button class="on" type="button">15초</button><button type="button">사진</button><button type="button">텍스트</button></div><div class="rooms"><h3>라이브 방송</h3><div class="grid"><button class="room" type="button"><span>🎙️</span>1인 방송</button><button class="room" type="button"><span>👥</span>13명 방송</button><button class="room" type="button"><span>👑</span>VIP 방송</button><button class="room" type="button"><span>🔒</span>비밀방</button><button class="room" type="button"><span>🎬</span>영화방</button><button class="room" type="button"><span>🎧</span>DJ방</button></div></div></div></div></section><div class="toast" id="toast"></div><script>const $=id=>document.getElementById(id);const nickname='대표';let voices=[];function loadVoices(){if('speechSynthesis'in window)voices=speechSynthesis.getVoices()}if('speechSynthesis'in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}function speakFemale(text){if(!('speechSynthesis'in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);const ko=(voices.length?voices:speechSynthesis.getVoices()).filter(v=>String(v.lang||'').toLowerCase().startsWith('ko'));u.voice=ko.find(v=>/female|woman|유나|서연|여성|sora/i.test(v.name))||ko[0]||null;u.lang='ko-KR';u.rate=.94;u.pitch=1.03;u.volume=1;speechSynthesis.speak(u)}catch(e){}}function appendLine(box,text){const d=document.createElement('div');d.textContent=text;box.appendChild(d);box.scrollTop=box.scrollHeight}function sendChat(host,inputId,boxId,gender){const input=$(inputId),box=$(boxId);const text=input.value.trim();if(!text)return;appendLine(box,nickname+': '+text);input.value='';const reply=text.includes('안녕')?nickname+'님 반가워요.':'네, '+nickname+'님. 잘 들었어요.';appendLine(box,host+': '+reply);if(gender==='female')speakFemale(reply)}function wireChat(){const soraSend=$('soraSend'),junhoSend=$('junhoSend');soraSend.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();sendChat('소라','soraInput','soraMessages','female')});junhoSend.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();sendChat('준호','junhoInput','junhoMessages','male')});$('soraInput').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();soraSend.click()}});$('junhoInput').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();junhoSend.click()}})}wireChat();let greeted=false;function greetOnce(){if(greeted)return;greeted=true;speakFemale(nickname+'님 안녕하세요. 어서 오세요. 반갑습니다.')}document.addEventListener('pointerdown',greetOnce,{once:true});document.addEventListener('touchstart',greetOnce,{once:true,passive:true});const sheet=$('sheet'),video=$('cameraVideo'),fallback=$('cameraFallback');let stream=null,facing='user';async function startCamera(){if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){fallback.textContent='이 브라우저에서는 카메라 미리보기를 지원하지 않습니다.';return}if(stream)stream.getTracks().forEach(t=>t.stop());try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing},audio:false});video.srcObject=stream;fallback.style.display='none'}catch(e){fallback.style.display='grid';fallback.textContent='카메라 권한을 허용해 주세요.'}}function stopCamera(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}video.srcObject=null;fallback.style.display='grid'}$('plusBtn').onclick=()=>{sheet.classList.add('open');startCamera()};$('close').onclick=()=>{sheet.classList.remove('open');stopCamera()};$('flip').onclick=async()=>{facing=facing==='user'?'environment':'user';await startCamera()};</script></body></html>
