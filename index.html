<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>K-Talk LIVE</title><style>*{box-sizing:border-box}html,body{margin:0;background:#050507;color:#fff;font-family:Arial,"Noto Sans KR",sans-serif}button,input{font:inherit}.app{max-width:520px;height:100dvh;margin:auto;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 18%,#602874,#160c20 42%,#050507 76%)}.top{position:absolute;z-index:4;top:14px;left:14px;right:14px;display:flex;justify-content:space-between}.live{background:#ef174f;padding:8px 12px;border-radius:10px;font-weight:900}.balance{color:#ffd66e;font-weight:900}.brand{position:absolute;z-index:4;top:66px;left:16px;color:#ffd66e;font-size:23px;font-weight:900}.led{position:absolute;z-index:4;top:105px;left:14px;right:14px;padding:8px;border:1px solid #b47cff55;border-radius:12px;background:#160d25f0;color:#f7dcff;font-weight:900;text-align:center}.chat{position:absolute;left:14px;right:80px;bottom:125px}.msg{margin:7px 0;font-size:13px}.msg b{color:#ffd05c}.gifts{position:absolute;right:12px;bottom:140px;display:grid;gap:7px}.gift{width:56px;min-height:50px;border:1px solid #ffffff20;border-radius:16px;background:#0d0b13e8;color:#fff;font-size:21px}.gift small{display:block;font-size:10px}.composer{position:absolute;left:12px;right:12px;bottom:70px;display:grid;grid-template-columns:1fr 46px;gap:7px}.composer input{height:44px;border:1px solid #8752cc55;border-radius:22px;background:#111018e8;color:#fff;padding:0 16px}.composer button{border:0;border-radius:50%;background:#17131f;color:#fff}.nav{position:absolute;bottom:0;left:0;right:0;height:62px;background:#08080bf2;border-top:1px solid #ffffff12;display:grid;grid-template-columns:repeat(3,1fr)}.nav button{border:0;background:transparent;color:#bbb}.nav span{display:block;font-size:19px}.overlay{display:none;position:fixed;z-index:30;inset:0;background:#020205fb;align-items:center;justify-content:center;padding:6px}.overlay.open{display:flex}.panel{width:min(500px,100%);max-height:calc(100dvh - 8px);overflow:auto;background:#07060b;border:1px solid #8f3cff55;border-radius:22px;padding:10px}.head{text-align:center}.head h2{color:#ffe5aa;margin:4px}.noticeBar{margin:7px 0;padding:7px 9px;border:1px solid #a93fff;border-radius:12px;background:#100916;text-align:center;font-size:11px}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.card{grid-column:span 2;border:1px solid var(--c,#944cff);border-radius:15px;background:#100d16;color:#fff;padding:8px 4px;min-height:86px}.card i{font-size:25px;font-style:normal;display:block}.card b{display:block;color:var(--txt,#f3d9ff);margin:5px 2px;font-size:14px}.card small{font-size:9px}.purple{--c:#914dff;--txt:#dcbcff}.pink{--c:#ff2f8e;--txt:#ff9ac5}.gold{--c:#d9a300;--txt:#ffe36d}.blue{--c:#33a7ff;--txt:#83d5ff}.violet{--c:#b04aff;--txt:#e3adff}.wide{grid-column:1/-1;min-height:55px}.half{grid-column:span 3;min-height:55px}.room{display:none;position:fixed;z-index:45;inset:0;background:radial-gradient(circle at 50% 15%,#3a1848,#09070c 62%)}.room.open{display:block}.roomTop{height:64px;padding:14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #ffffff0f}.back{width:38px;height:38px;border-radius:50%;border:1px solid #ffffff1a;background:#151019;color:#fff;font-size:23px}.roomTitle{font-size:19px;font-weight:900;color:#f5d798}.roomBody{padding:14px;height:calc(100dvh - 64px);overflow:auto}.aiList{display:grid;gap:12px}.aiRoom{border:1px solid #b84cff88;border-radius:20px;background:linear-gradient(145deg,#211329,#100c15);padding:14px;box-shadow:0 0 18px #8d36ff33}.aiTop{display:flex;gap:12px;align-items:center}.avatar{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font-size:42px;background:#25152f;border:2px solid #ff4ccf}.maleA{border-color:#42baff}.on{color:#ff4d72;font-weight:900;font-size:12px}.aiRoom h3{margin:2px 0 5px}.aiRoom p{margin:8px 0;color:#ddd;font-size:12px}.enter{width:100%;border:0;border-radius:13px;padding:11px;background:linear-gradient(135deg,#ff3b87,#8d36ff);color:white;font-weight:900}.aiStage{text-align:center}.aiFace{font-size:74px;margin:16px}.speech{margin:12px 0;padding:13px;border:1px solid #b84cff55;border-radius:14px;background:#160d20}.aiChat{display:grid;grid-template-columns:1fr auto;gap:7px;margin-top:12px}.aiChat input{border:1px solid #7e4eb1;border-radius:20px;background:#0c0910;color:#fff;padding:11px}.aiChat button{border:0;border-radius:18px;background:#8d36ff;color:#fff;padding:0 16px}.notice{margin-top:10px;padding:11px;border:1px solid #ffffff10;border-radius:13px;background:#130f16;text-align:center}.slots{display:grid;grid-template-columns:1fr 1fr;gap:8px}.slot{min-height:80px;border:1px solid #ffffff10;border-radius:14px;background:#110d14;display:grid;place-items:center}.wave{text-align:center;font-size:28px;color:#d99cff}.close{float:right;border:0;border-radius:50%;background:#18151d;color:#fff;width:34px;height:34px}.coinPanel{width:min(480px,100%);background:#111;border-radius:20px;padding:14px}.packs{display:grid;gap:8px}.pack{padding:10px;border:1px solid #333;border-radius:12px}.toast{display:none;position:fixed;z-index:90;left:50%;bottom:90px;transform:translateX(-50%);background:#111;border:1px solid #555;border-radius:12px;padding:10px 14px;white-space:nowrap}</style></head><body><main class="app"><div class="top"><span class="live">● LIVE</span><span class="balance">🪙 <b id="bal">8850</b></span></div><div class="brand">♛ K-Talk LIVE</div><div class="led" id="led">✨ K-Talk LIVE · 즐거운 방송과 새로운 만남 ✨</div><div class="chat"><div class="msg"><b>AI 소라</b> 어서 오세요 💕</div><div class="msg"><b>AI 준호</b> 오늘도 즐겁게 이야기해요 🎵</div></div><div class="gifts"><button class="gift">🌹<small>1</small></button><button class="gift">💐<small>5</small></button><button class="gift">🎁<small>선물</small></button></div><div class="composer"><input placeholder="채팅을 입력하세요..."><button>🎤</button></div><nav class="nav"><button id="homeBtn"><span>⌂</span>홈</button><button id="listBtn"><span>▦</span>방송목록</button><button id="myBtn"><span>♙</span>마이페이지</button></nav></main><div class="overlay open" id="sheet"><section class="panel"><div class="head"><div>♛</div><h2>K-Talk LIVE</h2><small>원하는 방송을 선택하세요</small></div><div class="noticeBar">✨ 환영합니다 · AI 방송 2개가 지금 방송 중입니다 ✨</div><div class="grid"><button class="card purple" data-room="general"><i>👥</i><b>일반 방송</b><small>AI 방송 2개 ON AIR</small></button><button class="card pink" data-room="solo"><i>🎙️</i><b>1인 방송</b><small>나만의 방송</small></button><button class="card gold" data-room="secret"><i>🔒</i><b>비밀방</b><small>호스트 + 게스트</small></button><button class="card pink" data-room="subscriber"><i>💎</i><b>구독자방</b><small>구독 회원 전용</small></button><button class="card blue" data-room="female"><i>🎧</i><b>여자 DJ</b><small>음악 방송</small></button><button class="card blue" data-room="male"><i>🎧</i><b>남자 DJ</b><small>음악 방송</small></button><button class="card violet" data-room="movie"><i>🎬</i><b>영화방</b><small>영화 감상</small></button><button class="card wide blue" data-room="video"><i>🎞️</i><b>동영상 올리기</b></button><button class="card half purple" data-room="shorts"><i>▣</i><b>쇼츠 올리기</b></button><button class="card half gold" id="coinBtn"><i>🪙</i><b>코인 충전</b></button></div></section></div><section class="room" id="room"><div class="roomTop"><button class="back" id="back">‹</button><div class="roomTitle" id="roomTitle">방송</div></div><div class="roomBody" id="roomBody"></div></section><div class="overlay" id="coinOverlay"><section class="coinPanel"><button class="close" id="coinClose">×</button><h2>🪙 코인 충전</h2><div class="packs"><div class="pack">100 코인 · 3,000원</div><div class="pack">500 코인 · 15,000원</div><div class="pack">1,700 코인 · 51,000원</div><div class="pack">3,333 코인 · 99,990원</div></div><p>현재 화면 확인용입니다.</p></section></div><div class="toast" id="toast"></div><script>const sheet=document.getElementById('sheet'),room=document.getElementById('room'),roomTitle=document.getElementById('roomTitle'),roomBody=document.getElementById('roomBody'),coinOverlay=document.getElementById('coinOverlay');function speak(t){if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';speechSynthesis.speak(u)}}function aiList(){roomTitle.textContent='일반 방송 · 지금 방송 중';roomBody.innerHTML='<div class="aiList"><div class="aiRoom"><div class="aiTop"><div class="avatar">👩</div><div><span class="on">● LIVE · AI</span><h3>AI 소라</h3><p>인사 · 채팅 읽기 · 자동 대화</p></div></div><button class="enter" onclick="enterAI(\'소라\',\'female\')">방송 들어가기</button></div><div class="aiRoom"><div class="aiTop"><div class="avatar maleA">👨</div><div><span class="on">● LIVE · AI</span><h3>AI 준호</h3><p>인사 · 채팅 읽기 · 자동 대화</p></div></div><button class="enter" onclick="enterAI(\'준호\',\'male\')">방송 들어가기</button></div></div>';sheet.classList.remove('open');room.classList.add('open')}window.enterAI=function(name,sex){roomTitle.textContent='AI '+name+' · LIVE';roomBody.innerHTML='<div class="aiStage"><div class="on">● LIVE · AI 진행자</div><div class="aiFace">'+(sex==='female'?'👩':'👨')+'</div><h2>AI '+name+'</h2><div class="speech" id="speech">어서 오세요! K-Talk LIVE에 오신 것을 환영합니다.</div><div class="aiChat"><input id="aiInput" placeholder="AI에게 인사나 말을 입력하세요"><button onclick="chatAI(\''+name+'\')">보내기</button></div><div class="notice">입장 인사와 입력한 채팅 읽기는 휴대폰 음성 기능으로 바로 테스트할 수 있습니다.<br>자유로운 AI 자동 답변은 서버 AI 연결 단계에서 추가됩니다.</div></div>';speak('어서 오세요. '+name+' AI 방송입니다. 반갑습니다.')}window.chatAI=function(name){let i=document.getElementById('aiInput');let t=i.value.trim();if(!t)return;let answer=t.includes('안녕')?'안녕하세요. 반갑습니다.':t.includes('이름')?'저는 AI '+name+'입니다.':'채팅을 읽었습니다. '+t;document.getElementById('speech').textContent=answer;speak(t+'. '+answer);i.value=''};const generic={solo:['1인 방송','🎙️ 혼자 방송 화면'],secret:['비밀방','🔒 비밀방 화면'],subscriber:['구독자방','💎 구독 회원 전용 방송'],female:['여자 DJ','🎧 여자 DJ 음악방'],male:['남자 DJ','🎧 남자 DJ 음악방'],movie:['영화방','🎬 영화 감상방'],video:['동영상 올리기','🎞️ 동영상 업로드'],shorts:['쇼츠 올리기','▣ 쇼츠 업로드']};document.querySelectorAll('[data-room]').forEach(b=>b.onclick=()=>{if(b.dataset.room==='general'){aiList();return}let d=generic[b.dataset.room];roomTitle.textContent=d[0];roomBody.innerHTML='<div class="notice">'+d[1]+'</div>';sheet.classList.remove('open');room.classList.add('open')});document.getElementById('back').onclick=()=>{room.classList.remove('open');sheet.classList.add('open')};document.getElementById('coinBtn').onclick=()=>coinOverlay.classList.add('open');document.getElementById('coinClose').onclick=()=>coinOverlay.classList.remove('open');document.getElementById('homeBtn').onclick=()=>sheet.classList.add('open');document.getElementById('listBtn').onclick=()=>{aiList()};document.getElementById('myBtn').onclick=()=>{roomTitle.textContent='마이페이지';roomBody.innerHTML='<div class="notice">내 프로필 · 내 동영상 · 내 쇼츠 · 내 방송 기록</div>';sheet.classList.remove('open');room.classList.add('open')};</script></body></html>
