<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>K-Talk LIVE</title><style>*{box-sizing:border-box}html,body{margin:0;background:#000;color:#fff;font-family:Arial,'Noto Sans KR',sans-serif;overflow:hidden}button,input{font:inherit}.feed{height:100dvh;overflow-y:auto;scroll-snap-type:y mandatory}.page{height:100dvh;scroll-snap-align:start;position:relative;overflow:hidden;background:#07050a}.photo{position:absolute;inset:0 0 180px;background-size:cover;background-position:center top;transform:scale(1.02);animation:cameraMove 7s ease-in-out infinite alternate;transform-origin:center center}.female .photo,.female .avatar{background-image:url('https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=900&q=88')}.male .photo,.male .avatar{background-image:url('https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=900&q=88')}@keyframes cameraMove{0%{transform:scale(1.02) translateY(0)}100%{transform:scale(1.045) translateY(-4px)}}.shade{position:absolute;inset:0;background:linear-gradient(180deg,#0006 0,#0000 44%,#000 84%)}.top{position:absolute;z-index:3;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:center}.host{display:flex;align-items:center;gap:7px;font-weight:900}.avatar{width:36px;height:36px;border-radius:50%;border:1px solid #fff;background-size:cover;background-position:center}.ai{background:#7d37e8;border-radius:5px;padding:2px 5px;font-size:9px}.live{background:#ff174f;border-radius:7px;padding:5px 8px;font-size:10px}.viewer{font-size:11px}.wave{position:absolute;z-index:3;left:22px;right:78px;bottom:260px;height:42px;display:flex;align-items:center;justify-content:center;gap:2px;opacity:.92}.wave i{width:2px;border-radius:4px;background:linear-gradient(#ff30d2,#ff4141,#ffe330,#35ff7e,#35c9ff,#833cff);height:var(--h);animation:bounce .68s ease-in-out infinite alternate;animation-delay:var(--d);box-shadow:0 0 5px currentColor}@keyframes bounce{to{height:calc(var(--h) * .35)}}.side{position:absolute;z-index:4;right:9px;bottom:102px;display:grid;gap:7px}.gift{width:54px;min-height:55px;border:1px solid #ffffff25;border-radius:14px;background:#08080cf0;color:#fff;font-size:20px}.gift small{display:block;font-size:9px}.info{position:absolute;z-index:4;left:12px;right:72px;bottom:72px}.info h2{font-size:18px;margin:0 0 5px}.speech{font-size:11px;background:#08080bbb;border-radius:12px;padding:8px;border-left:3px solid #ff4dc7}.chatbox{margin-top:7px;background:#060609ed;border:1px solid #ffffff20;border-radius:12px;overflow:hidden}.chatTabs{height:30px;display:grid;grid-template-columns:1fr 1fr 1fr;border-bottom:1px solid #ffffff18}.chatTabs button{border:0;background:transparent;color:#aaa;font-size:10px}.chatTabs .on{color:#ff59d3;border-bottom:2px solid #ff4dc7;font-weight:900}.messages{height:88px;overflow-y:auto;padding:6px 8px;font-size:10px;line-height:1.55}.msg{white-space:normal}.badge{display:inline-block;padding:1px 4px;border-radius:4px;margin-right:4px;font-size:8px;font-weight:900}.vip{background:#ffcf2f;color:#211900}.mid{background:#2ea9ff;color:#061821}.normal{background:#555;color:#fff}.msg b{color:#ffd35d}.composer{display:flex;gap:5px;padding:6px;border-top:1px solid #ffffff18}.composer input{min-width:0;flex:1;height:34px;border:1px solid #ffffff2d;border-radius:17px;background:#0b0a0ddd;color:#fff;padding:0 11px;font-size:10px}.composer button{border:0;border-radius:17px;padding:0 12px;background:#8b39f0;color:#fff;font-weight:900;font-size:10px}.nav{position:fixed;z-index:10;bottom:0;left:0;right:0;height:64px;background:#030305f5;border-top:1px solid #ffffff18;display:grid;grid-template-columns:repeat(5,1fr);align-items:center}.nav button{border:0;background:transparent;color:#ddd;font-size:9px;height:64px;padding:0 2px}.nav strong{display:block;font-size:18px}.nav .active{color:#ff59d3}.nav .broadcastPlus{width:52px;height:52px;min-width:52px;border-radius:16px;background:#fff;color:#111;font-size:32px;font-weight:700;line-height:52px;padding:0;margin:auto;box-shadow:inset -3px 0 #ff3b8d,inset 3px 0 #31e8ff}.screen{display:none;position:fixed;z-index:20;inset:0;background:#08050b}.screen.open{display:block}.bar{height:55px;padding:8px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #ffffff18}.bar b{flex:1}.back,.plus{border:0;border-radius:50%;width:38px;height:38px;background:#17121c;color:#fff;font-size:22px}.plus{display:none;background:#8438e9;font-size:28px;line-height:38px}.body{padding:12px}.item{padding:13px;border:1px solid #ffffff20;border-radius:15px;margin-bottom:9px;background:#110c15}.enter{width:100%;padding:9px;border:0;border-radius:11px;background:#8438e9;color:#fff;font-weight:900}</style></head><body><main class="feed" id="feed"><section class="page female"><div class="photo"></div><div class="shade"></div><div class="top"><div class="host"><div class="avatar"></div><span>AI 소라</span><span class="ai">AI</span><span class="live">● LIVE</span></div><span class="viewer">👤 125</span></div><div class="wave" id="wave1"></div><aside class="side"><button class="gift" onclick="gift('소라','장미 1개','female')">🌹<small>1</small></button><button class="gift" onclick="gift('소라','장미 5개','female')">💐<small>5</small></button><button class="gift" onclick="gift('소라','장미 10개','female')">🌹<small>10</small></button><button class="gift" onclick="gift('소라','장미 100개','female')">💐<small>100</small></button><button class="gift" onclick="gift('소라','선물','female')">🎁<small>선물상자</small></button></aside><div class="info"><h2>AI 소라 · 1인 방송</h2><div class="speech" id="soraSpeech">대표님, 어서 오세요. 안녕하세요. 만나서 반갑습니다.</div><div class="chatbox"><div class="chatTabs"><button class="on">채팅</button><button>참가자(12)</button><button>신고</button></div><div class="messages" id="soraMessages"><div class="msg"><span class="badge vip">VIP</span><b>해피걸:</b> 오늘 방송 좋아요 👍</div><div class="msg"><span class="badge mid">중회원</span><b>지수:</b> 반가워요 💕</div><div class="msg"><span class="badge normal">일반</span><b>루이:</b> 즐거운 방송 감사합니다 😊</div></div><div class="composer"><input id="soraInput" placeholder="메시지를 입력하세요"><button onclick="chat('소라','soraInput','soraSpeech','female','soraMessages')">전송</button></div></div></div></section><section class="page male"><div class="photo"></div><div class="shade"></div><div class="top"><div class="host"><div class="avatar"></div><span>AI 준호</span><span class="ai">AI</span><span class="live">● LIVE</span></div><span class="viewer">👤 98</span></div><div class="wave" id="wave2"></div><aside class="side"><button class="gift" onclick="gift('준호','장미 1개','male')">🌹<small>1</small></button><button class="gift" onclick="gift('준호','장미 5개','male')">💐<small>5</small></button><button class="gift" onclick="gift('준호','장미 10개','male')">🌹<small>10</small></button><button class="gift" onclick="gift('준호','장미 100개','male')">💐<small>100</small></button><button class="gift" onclick="gift('준호','선물','male')">🎁<small>선물상자</small></button></aside><div class="info"><h2>AI 준호 · 1인 방송</h2><div class="speech" id="junhoSpeech">대표님, 어서 오세요. 안녕하세요. 만나서 반갑습니다.</div><div class="chatbox"><div class="chatTabs"><button class="on">채팅</button><button>참가자(12)</button><button>신고</button></div><div class="messages" id="junhoMessages"><div class="msg"><span class="badge vip">VIP</span><b>민수:</b> 반갑습니다 👋</div><div class="msg"><span class="badge mid">중회원</span><b>태훈:</b> 오늘도 왔어요 👍</div><div class="msg"><span class="badge normal">일반</span><b>루이:</b> 즐거운 방송 감사합니다 😊</div></div><div class="composer"><input id="junhoInput" placeholder="메시지를 입력하세요"><button onclick="chat('준호','junhoInput','junhoSpeech','male','junhoMessages')">전송</button></div></div></div></section></main><nav class="nav"><button class="active" id="home"><strong>⌂</strong>홈</button><button id="friendShare"><strong>♧</strong>친구공유</button><button class="broadcastPlus" id="broadcastPlus" aria-label="방송하기">＋</button><button id="list"><strong>▦</strong>방송목록</button><button id="mypage"><strong>♙</strong>마이페이지</button></nav><section class="screen" id="screen"><div class="bar"><button class="back" id="back">‹</button><b id="title">방송목록</b><button class="plus" id="plus">＋</button></div><div class="body" id="body"></div></section><script>function makeWave(id){let e=document.getElementById(id);for(let n=0;n<58;n++){let i=document.createElement('i');i.style.setProperty('--h',(7+Math.random()*27)+'px');i.style.setProperty('--d',(-Math.random())+'s');e.appendChild(i)}}makeWave('wave1');makeWave('wave2');let cachedVoices=[];function loadVoices(){cachedVoices=speechSynthesis.getVoices()}if('speechSynthesis'in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}function speak(t,gender='female'){if(!('speechSynthesis'in window))return;let u=new SpeechSynthesisUtterance(t),voices=(cachedVoices.length?cachedVoices:speechSynthesis.getVoices()).filter(v=>v.lang&&v.lang.toLowerCase().startsWith('ko'));if(gender==='male'){let male=voices.find(v=>/male|man|준우|민준|인준|우진|남성|google.*한국어/i.test(v.name));u.voice=male||voices.find(v=>!/female|woman|유나|서연|여성/i.test(v.name))||voices[voices.length-1]||null;u.pitch=.45;u.rate=.9}else{let female=voices.find(v=>/female|woman|유나|서연|여성/i.test(v.name));u.voice=female||voices[0]||null;u.pitch=1.05;u.rate=.95}u.lang='ko-KR';u.volume=1;speechSynthesis.cancel();speechSynthesis.speak(u)}let nickname='대표';localStorage.setItem('ktalkNickname',nickname);function welcome(host,speechId,gender){let msg=nickname+'님, 어서 오세요. 안녕하세요. 만나서 반갑습니다.';document.getElementById(speechId).textContent=msg;speak(msg,gender)}function gift(n,g,gender){speak(n+' 방송에 '+g+' 선물이 도착했습니다. 감사합니다.',gender)}function chat(n,i,s,gender,messagesId){let el=document.getElementById(i),t=el.value.trim();if(!t)return;let box=document.getElementById(messagesId);if(box){let d=document.createElement('div');d.className='msg';d.innerHTML='<span class="badge vip">VIP</span><b>'+nickname+':</b> '+t;box.appendChild(d);box.scrollTop=box.scrollHeight}let r=t.includes('안녕')?'반가워요.':'네, '+t+'라고 하셨네요. 같이 이야기해요.';document.getElementById(s).textContent=r;speak(r,gender);el.value=''}const screen=document.getElementById('screen'),body=document.getElementById('body'),title=document.getElementById('title'),plus=document.getElementById('plus'),broadcastPlus=document.getElementById('broadcastPlus'),friendShare=document.getElementById('friendShare');function openScreen(t,h,showPlus=false){title.textContent=t;body.innerHTML=h;plus.style.display=showPlus?'block':'none';screen.classList.add('open')}function openBroadcastStart(){openScreen('방송 시작','<div class="item"><h2>＋ 방송 시작</h2><p>원하는 방송 종류를 선택하는 화면으로 연결됩니다.</p></div>',false)}back.onclick=()=>screen.classList.remove('open');home.onclick=()=>{screen.classList.remove('open');feed.scrollTo({top:0,behavior:'smooth'});setTimeout(()=>welcome('소라','soraSpeech','female'),250)};friendShare.onclick=async()=>{let data={title:'K-Talk LIVE',text:'K-Talk LIVE 같이 보세요',url:'https://k-talk-live-final.vercel.app'};if(navigator.share){try{await navigator.share(data)}catch(e){}}else{openScreen('친구공유','<div class="item"><h2>친구에게 공유하기</h2><p>https://k-talk-live-final.vercel.app</p></div>',false)}};list.onclick=()=>openScreen('방송목록','<div class="item"><b>● LIVE · AI 소라</b><p>여자 AI 1인 방송</p><button class="enter" onclick="go(0)">방송 보기</button></div><div class="item"><b>● LIVE · AI 준호</b><p>남자 AI 1인 방송</p><button class="enter" onclick="go(1)">방송 보기</button></div>',true);plus.onclick=openBroadcastStart;broadcastPlus.onclick=openBroadcastStart;mypage.onclick=()=>openScreen('마이페이지','<div class="item"><h2>내 홈</h2><p>닉네임: 대표</p><p>내 프로필 · 내 동영상 · 내 쇼츠 · 내 방송 기록</p></div>',false);window.go=n=>{screen.classList.remove('open');feed.scrollTo({top:n*innerHeight,behavior:'smooth'});setTimeout(()=>welcome(n===0?'소라':'준호',n===0?'soraSpeech':'junhoSpeech',n===0?'female':'male'),350)};function firstGreeting(){welcome('소라','soraSpeech','female')}if(document.readyState==='complete'){setTimeout(firstGreeting,350)}else{window.addEventListener('load',()=>setTimeout(firstGreeting,350),{once:true})}document.addEventListener('click',function unlock(){firstGreeting()},{once:true});</script></body></html>
