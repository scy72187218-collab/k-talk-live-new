<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>K-Talk LIVE</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#030306;color:#fff;font-family:Arial,'Noto Sans KR',sans-serif;overflow:hidden}button,input{font:inherit}.home{height:100dvh;max-width:520px;margin:auto;background:radial-gradient(circle at 50% 0,#28103d 0,#09050f 38%,#020204 78%);padding:10px 12px 66px;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}.header{height:44px;display:flex;align-items:center;justify-content:space-between;flex:0 0 auto}.logo{font-weight:900;font-size:24px;letter-spacing:-1px;text-shadow:0 0 12px #ff3cac;color:#ffd86b}.logo em{font-style:normal;color:#ff55ce}.tools{display:flex;gap:6px;align-items:center}.pill{border:1px solid #8b7fff66;background:#090a12;color:#fff;border-radius:18px;padding:7px 10px;font-size:12px}.coin{color:#ffd45d;font-weight:900}.notice{height:48px;flex:0 0 auto;border:1px solid #e34cff;border-radius:14px;background:linear-gradient(90deg,#170522,#0b0715,#170522);display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;font-size:12px;box-shadow:0 0 12px #d33cff55;padding:5px 10px}.rooms{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,minmax(0,1fr));gap:7px}.roomCard{position:relative;border:1px solid var(--c);border-radius:16px;background:linear-gradient(180deg,var(--bg1),#09070d 78%);color:#fff;padding:8px 5px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:inset 0 0 18px #0006,0 0 10px color-mix(in srgb,var(--c) 26%,transparent)}.roomCard:active{transform:scale(.97)}.roomCard .ico{font-size:29px;line-height:1}.roomCard b{font-size:14px;margin-top:7px;color:var(--txt);text-shadow:0 0 8px var(--c)}.roomCard small{font-size:8px;color:#eee;margin-top:4px;line-height:1.25}.liveDot{position:absolute;top:6px;left:6px;background:#ff174f;border-radius:7px;padding:2px 5px;font-size:7px;font-weight:900}.purple{--c:#9b4dff;--txt:#ddb8ff;--bg1:#1c0e2b}.pink{--c:#ff3b9d;--txt:#ff9ed0;--bg1:#2a0b1f}.gold{--c:#e4b02c;--txt:#ffe16d;--bg1:#2a1d05}.blue{--c:#38aaff;--txt:#8bd7ff;--bg1:#071d2c}.cyan{--c:#31d7f0;--txt:#8ef2ff;--bg1:#062127}.violet{--c:#c54cff;--txt:#ebb1ff;--bg1:#210b29}.red{--c:#ff496f;--txt:#ff9aad;--bg1:#2a0911}.magenta{--c:#ff4bc8;--txt:#ffb4ea;--bg1:#27091f}.actions{height:64px;flex:0 0 auto;display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:7px}.action{border:1px solid #6848a6;border-radius:14px;background:#0c0912;color:#fff;display:flex;align-items:center;justify-content:center;gap:7px;font-weight:900;font-size:12px}.action span{font-size:22px}.nav{position:absolute;left:0;right:0;bottom:0;height:58px;background:#050508f7;border-top:1px solid #282133;display:grid;grid-template-columns:repeat(3,1fr);z-index:10}.nav button{border:0;background:transparent;color:#d6d1de;font-size:11px}.nav button strong{display:block;font-size:20px;margin-bottom:2px}.nav .active{color:#ff62db}.screen{display:none;position:fixed;inset:0;z-index:30;background:radial-gradient(circle at 50% 0,#28103d,#07050a 56%,#020203)}.screen.open{display:block}.topbar{height:56px;display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid #ffffff12}.back{width:38px;height:38px;border:1px solid #ffffff22;border-radius:50%;background:#120d18;color:#fff;font-size:22px}.title{font-weight:900;color:#ffe19a}.body{height:calc(100dvh - 56px);padding:12px;overflow:auto}.aiList{display:grid;gap:12px}.aiRoom{border:1px solid #b84cff88;border-radius:20px;background:linear-gradient(145deg,#211329,#100c15);padding:14px;box-shadow:0 0 18px #8d36ff33}.aiTop{display:flex;gap:12px;align-items:center}.avatar{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;font-size:44px;background:#25152f;border:2px solid #ff4ccf}.maleA{border-color:#42baff}.on{color:#ff4d72;font-weight:900;font-size:12px}.aiRoom h3{margin:2px 0 5px}.aiRoom p{margin:8px 0;color:#ddd;font-size:12px}.enter{width:100%;border:0;border-radius:13px;padding:11px;background:linear-gradient(135deg,#ff3b87,#8d36ff);color:white;font-weight:900}.aiStage{text-align:center}.aiFace{font-size:78px;margin:18px}.speech{margin:12px 0;padding:13px;border:1px solid #b84cff55;border-radius:14px;background:#160d20}.aiChat{display:grid;grid-template-columns:1fr auto;gap:7px;margin-top:12px}.aiChat input{border:1px solid #7e4eb1;border-radius:20px;background:#0c0910;color:#fff;padding:11px}.aiChat button{border:0;border-radius:18px;background:#8d36ff;color:#fff;padding:0 16px}.box{padding:18px;border:1px solid #ffffff18;border-radius:18px;background:#100c14;text-align:center}.coinPanel{display:grid;gap:8px}.pack{padding:12px;border:1px solid #ffffff18;border-radius:13px;background:#100d13}.tiny{font-size:11px;color:#bbb}.toast{display:none;position:fixed;z-index:80;left:50%;bottom:76px;transform:translateX(-50%);background:#111;border:1px solid #555;border-radius:12px;padding:10px 14px;white-space:nowrap}@media(max-height:700px){.home{padding-top:6px;gap:5px}.header{height:38px}.logo{font-size:21px}.notice{height:40px;font-size:10px}.actions{height:54px}.roomCard{padding:5px 3px}.roomCard .ico{font-size:24px}.roomCard b{font-size:12px;margin-top:4px}.roomCard small{font-size:7px}.nav{height:54px}.home{padding-bottom:60px}}</style></head><body><main class="home" id="home"><header class="header"><div class="logo">♛ K-Talk <em>LIVE</em></div><div class="tools"><div class="pill coin">🪙 1,250 +</div><div class="pill">💎 VIP</div><div class="pill">🔔</div></div></header><div class="notice">📢 K-Talk LIVE에 오신 것을 환영합니다 · AI 방송 2개 ON AIR</div><section class="rooms"><button class="roomCard purple" data-room="general"><span class="liveDot">● LIVE</span><span class="ico">👥</span><b>일반 방송</b><small>AI 남/여 2개 방송 중</small></button><button class="roomCard pink" data-room="solo"><span class="ico">🎙️</span><b>1인 방송</b><small>나만의 라이브</small></button><button class="roomCard gold" data-room="secret"><span class="ico">🔒</span><b>비밀방</b><small>비밀번호 입장</small></button><button class="roomCard magenta" data-room="subscriber"><span class="ico">💎</span><b>구독자방</b><small>구독 회원 전용</small></button><button class="roomCard blue" data-room="male"><span class="ico">🎧</span><b>남자 DJ</b><small>음악 방송</small></button><button class="roomCard magenta" data-room="female"><span class="ico">🎧</span><b>여자 DJ</b><small>음악 방송</small></button><button class="roomCard red" data-room="movie"><span class="ico">🎬</span><b>영화방</b><small>영화 감상</small></button><button class="roomCard cyan" id="liveListCard"><span class="ico">📺</span><b>방송목록</b><small>지금 방송 중인 방</small></button></section><section class="actions"><button class="action" data-room="video"><span>🎞️</span>동영상 올리기</button><button class="action" data-room="shorts"><span>▣</span>쇼츠</button><button class="action" id="coinBtn"><span>🪙</span>코인 충전</button></section><nav class="nav"><button class="active" id="homeBtn"><strong>⌂</strong>홈</button><button id="listBtn"><strong>▦</strong>방송목록</button><button id="myBtn"><strong>♙</strong>마이페이지</button></nav></main><section class="screen" id="screen"><div class="topbar"><button class="back" id="back">‹</button><div class="title" id="screenTitle">방송</div></div><div class="body" id="screenBody"></div></section><div class="toast" id="toast"></div><script>const screen=document.getElementById('screen'),screenTitle=document.getElementById('screenTitle'),screenBody=document.getElementById('screenBody'),toast=document.getElementById('toast');function speak(t){if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';speechSynthesis.speak(u)}}function openScreen(title,html){screenTitle.textContent=title;screenBody.innerHTML=html;screen.classList.add('open')}function aiList(){openScreen('일반 방송 · 지금 방송 중','<div class="aiList"><div class="aiRoom"><div class="aiTop"><div class="avatar">👩</div><div><span class="on">● LIVE · AI</span><h3>AI 소라</h3><p>입장 인사 · 채팅 읽기 · 자동 대화 테스트</p></div></div><button class="enter" onclick="enterAI(\'소라\',\'female\')">방송 들어가기</button></div><div class="aiRoom"><div class="aiTop"><div class="avatar maleA">👨</div><div><span class="on">● LIVE · AI</span><h3>AI 준호</h3><p>입장 인사 · 채팅 읽기 · 자동 대화 테스트</p></div></div><button class="enter" onclick="enterAI(\'준호\',\'male\')">방송 들어가기</button></div></div>')}window.enterAI=function(name,sex){openScreen('AI '+name+' · LIVE','<div class="aiStage"><div class="on">● LIVE · AI 진행자</div><div class="aiFace">'+(sex==='female'?'👩':'👨')+'</div><h2>AI '+name+'</h2><div class="speech" id="speech">어서 오세요! K-Talk LIVE에 오신 것을 환영합니다.</div><div class="aiChat"><input id="aiInput" placeholder="AI에게 말을 입력하세요"><button onclick="chatAI(\''+name+'\')">보내기</button></div><div class="box tiny">현재는 입장 인사와 채팅 읽기 음성 테스트가 됩니다. 자유 대화형 AI는 서버 연결이 추가로 필요합니다.</div></div>');speak('어서 오세요. '+name+' AI 방송입니다. 반갑습니다.')}window.chatAI=function(name){const i=document.getElementById('aiInput');const t=i.value.trim();if(!t)return;const a=t.includes('안녕')?'안녕하세요. 반갑습니다.':t.includes('이름')?'저는 AI '+name+'입니다.':'말씀하신 내용을 들었습니다. '+t;document.getElementById('speech').textContent=a;speak(t+'. '+a);i.value=''};const generic={solo:['1인 방송','🎙️ 1인 라이브 방송 화면'],secret:['비밀방','🔒 비밀번호로 입장하는 비밀방'],subscriber:['구독자방','💎 구독 회원 전용 방송'],male:['남자 DJ','🎧 남자 DJ 음악 방송'],female:['여자 DJ','🎧 여자 DJ 음악 방송'],movie:['영화방','🎬 영화 감상방'],video:['동영상 올리기','🎞️ 동영상 업로드 화면'],shorts:['쇼츠 올리기','▣ 쇼츠 업로드 화면']};document.querySelectorAll('[data-room]').forEach(b=>b.onclick=()=>{if(b.dataset.room==='general')return aiList();const d=generic[b.dataset.room];openScreen(d[0],'<div class="box">'+d[1]+'</div>')});function showList(){openScreen('방송목록','<div class="aiList"><div class="aiRoom"><span class="on">● LIVE</span><h3>AI 소라 방송</h3><button class="enter" onclick="enterAI(\'소라\',\'female\')">들어가기</button></div><div class="aiRoom"><span class="on">● LIVE</span><h3>AI 준호 방송</h3><button class="enter" onclick="enterAI(\'준호\',\'male\')">들어가기</button></div></div>')}document.getElementById('liveListCard').onclick=showList;document.getElementById('listBtn').onclick=showList;document.getElementById('myBtn').onclick=()=>openScreen('마이페이지','<div class="box">내 프로필 · 내 동영상 · 내 쇼츠 · 내 방송 기록</div>');document.getElementById('coinBtn').onclick=()=>openScreen('코인 충전','<div class="coinPanel"><div class="pack">100 코인 · 3,000원</div><div class="pack">500 코인 · 15,000원</div><div class="pack">1,700 코인 · 51,000원</div><div class="pack">3,333 코인 · 99,990원</div><div class="tiny">현재는 화면 확인용입니다.</div></div>');document.getElementById('back').onclick=()=>screen.classList.remove('open');document.getElementById('homeBtn').onclick=()=>screen.classList.remove('open');</script></body></html>
