<body>
<div class="app">
<header class="header"><div class="brand"><div class="logo">♛ K-Talk</div><div class="live">LIVE</div></div><div id="globalLed" class="led" onclick="handleLedClick()">♛ K-Talk · 신곡 광고 신청하세요! 🎵 🎤</div></header>
<main id="screen"></main>
<nav class="bottom"><button data-bottom="home"><b>⌂</b>홈</button><button data-bottom="friends"><b>👥</b>친구</button><button class="plus" onclick="openCreator()"><b>＋</b>방송하기</button><button data-bottom="help"><b>?</b>사용방법</button><button data-bottom="profile"><b>♙</b>내 정보</button></nav>
</div>
<div id="creator" class="creator">
<video id="camera" autoplay playsinline muted></video>
<video id="ktCreatorPreview" class="kt-creator-preview" playsinline></video>
<button id="ktCreatorSoundPlay" class="kt-creator-sound-play" onclick="playCreatorPreviewWithSound()">▶ 음악 재생</button>
<input id="ktMyVideoInput" type="file" accept="video/*" hidden onchange="handleMyVideoPick(this)">
<div id="ktCreatorPreviewFallback" class="kt-creator-preview-fallback"><b>촬영 완료</b><span>미리보기 대신 저장하거나 삭제할 수 있습니다.</span></div>
<button id="ktCreatorStopTap" class="kt-creator-stop-tap" onclick="stopCreatorRecording()" aria-label="촬영 종료"></button>
<div class="kt-creator-review-actions"><button class="delete" onclick="deleteCreatorRecording()">삭제하기</button><button class="save" onclick="saveCreatorRecording()">저장하기</button><button class="post" onclick="postCreatorRecording()">게시하기</button></div>
<div class="shade"></div>
<div class="creator-top"><button class="circle" onclick="closeCreator()">×</button><button class="sound" id="creatorSoundBtn" onclick="openSoundPanel()">♪ 사운드 추가</button><button class="circle creator-rotate" onclick="if(window.toggleCreatorCamera)toggleCreatorCamera()">↻</button></div>
<div class="creator-tools"><button aria-label="플래시">⚡</button><button aria-label="타이머">◔</button><button aria-label="방송 선택" onclick="if(window.openRoomTypeChooser)openRoomTypeChooser()">▦</button><button aria-label="보정" onclick="if(window.prepTap)prepTap(this,'보정')">✨</button><button aria-label="더보기">⌄</button></div>
<div class="creator-bottom"><div class="modes"><span class="on" onclick="setCreatorDuration(this,600)">10분</span><span onclick="setCreatorDuration(this,60)">60초</span><span onclick="setCreatorDuration(this,15)">15초</span><span onclick="if(window.openTikLivePrep)openTikLivePrep()">라이브</span></div><div class="recordrow"><button class="fx myvideo" onclick="openMyVideoPicker()" aria-label="내 동영상"><span>🎬</span><small>내 동영상</small></button><button class="record" onclick="startCreatorRecording()"></button><div class="fx">🎭</div></div><div class="creator-foot"><span class="on" onclick="setCreatorMode(this,'게시')">게시</span><span onclick="setCreatorMode(this,'창작하기')">창작하기</span><span onclick="if(window.openTikLivePrep)openTikLivePrep()">라이브</span></div></div>
<div class="live-prep"><div class="prep-top"><button class="prep-close" onclick="closeCreator()">×</button><div class="prep-title">K-Talk 라이브 준비</div><button class="prep-mini prep-reward" onclick="prepTap(this,'코인 리워드')">★ 코인 리워드</button></div><div class="prep-topic"><input id="liveTitle" value="오늘 라이브 제목을 입력하세요" aria-label="라이브 제목"></div><div class="prep-grid"><button class="prep-item" onclick="prepTap(this,'전환')"><b>↻</b>전환</button><button class="prep-item" onclick="prepTap(this,'보정')"><b>✦</b>보정</button><button class="prep-item" onclick="prepTap(this,'편집효과')"><b>✺</b>편집효과</button><button class="prep-item" onclick="prepTap(this,'설정')"><b>⚙</b>설정</button><button class="prep-item" onclick="prepTap(this,'멀티게스트')"><b>▦</b>멀티게스트</button><button class="prep-item" onclick="prepTap(this,'서비스')"><b>▣</b>서비스+</button><button class="prep-item" onclick="prepTap(this,'팬클럽')"><b>♡</b>팬클럽</button><button class="prep-item" onclick="prepTap(this,'소통하기')"><b>☵</b>소통하기</button><button class="prep-item" onclick="prepTap(this,'공유')"><b>↗</b>공유</button></div><div class="prep-goal"><label for="liveGoal">방송 목표</label><input id="liveGoal" type="text" value="" placeholder="오늘 방송 목표를 입력하세요" aria-label="방송 목표"></div><div class="prep-card"><div class="room-switch-row"><button class="room-switch on" onclick="selectPrepRoom(this,'solo','1인 방송',1)">1인 방송</button><button class="room-switch" onclick="selectPrepRoom(this,'group','13명 방송',13)">13명 방송</button><button class="room-switch" onclick="selectPrepRoom(this,'subscriber','구독자 방송',10)">구독자 방송</button><button class="room-switch" onclick="selectPrepRoom(this,'password','비밀방',7)">비밀방</button></div><button class="prep-start" onclick="startBroadcast()">● 라이브 시작</button></div><div class="prep-bottom"><span onclick="prepBottomTap(this,'게시')">게시</span><span onclick="prepBottomTap(this,'창작하기')">창작하기</span><span class="on" onclick="prepBottomTap(this,'라이브')">라이브</span></div></div>
</div>
<div id="sheet" class="sheet"><div class="sheet-inner"><div class="sheet-head"><h3 id="sheetTitle">메뉴</h3><button onclick="closeSheet()">닫기</button></div><div id="sheetBody"></div></div></div>

.ktgf button{font-family:inherit;touch-action:manipulation;pointer-events:auto!important}
.ktgf-head{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:94px;padding:8px 4px 15px;border-bottom:1px solid #81355f55}
.ktgf-brand{display:flex;align-items:center;gap:12px;min-width:0}
.ktgf-logo{width:66px;height:66px;flex:0 0 66px;display:grid;place-items:center;border-radius:20px;font-size:38px;background:linear-gradient(145deg,#78247d,#2c1134);border:1px solid #dc5bc8;box-shadow:0 0 24px #e156c33d,inset 0 0 18px #ffffff0d}
.ktgf-brand h2{margin:0;color:#ffe27c;font-size:28px;line-height:1;font-weight:950;letter-spacing:-1px;white-space:nowrap;text-shadow:0 0 12px #f2c15325}
.ktgf-brand p{margin:8px 0 0;color:#f0d8bc;font-size:11px;font-weight:900;white-space:nowrap}
.ktgf-close{flex:0 0 auto;min-width:86px;height:52px;border-radius:18px;border:1px solid #a14587;background:linear-gradient(180deg,#1d101f,#0d0910);color:#fff;font-size:18px;font-weight:950}
.ktgf-main{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;margin-top:12px;align-items:start}
.ktgf-side{display:flex;flex-direction:column;gap:5px;padding:6px;border-radius:20px;border:1px solid #57294a;background:linear-gradient(180deg,#0d0910,#060507);box-shadow:inset 0 0 24px #000c}
.ktgf-cat{min-height:82px;padding:7px 3px;border-radius:17px;border:1px solid transparent;background:transparent;color:#d8a8dc;font-weight:950}
.ktgf-cat i{display:block;font-style:normal;font-size:30px;line-height:1}
.ktgf-cat span{display:block;margin-top:7px;font-size:10.5px;line-height:1.15;font-weight:950}
.ktgf-cat.on{color:#fff;border-color:#ff60c8;background:radial-gradient(circle at 50% 20%,rgba(255,85,207,.19),transparent 45%),linear-gradient(145deg,#491435,#1b0c1a);box-shadow:0 0 18px #ff53bf45,inset 0 0 15px #ff64c41c}
.ktgf-cat.vip{color:#ffd968}.ktgf-cat.vip.on{color:#fff1a4;border-color:#ffd658;background:linear-gradient(145deg,#342408,#130e04)}
.ktgf-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;align-content:start}
.ktgf-card{position:relative;min-width:0;height:158px;padding:7px 4px 8px;border-radius:14px;border:1px solid #815536;background:radial-gradient(circle at 50% 27%,rgba(115,42,87,.19),transparent 43%),linear-gradient(180deg,#100b10,#070607);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;box-shadow:inset 0 0 20px #000d,0 0 10px #d5922812;overflow:hidden}
.ktgf-card.hide{display:none!important}.ktgf-card:active{transform:scale(.97);border-color:#ff68c8}
.ktgf-no{position:absolute;left:5px;top:5px;min-width:21px;height:21px;padding:0 4px;display:grid;place-items:center;border-radius:7px;background:#531a48;border:1px solid #873773;color:#ffd8f5;font-size:10px;font-weight:950;z-index:2}
.ktgf-art{width:100%;height:90px;margin:0 auto 7px;display:grid;place-items:center;border-radius:13px;font-family:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif;font-size:55px;line-height:1;background:radial-gradient(circle at 50% 43%,rgba(126,47,105,.43),rgba(52,21,47,.58) 48%,#080608 80%);box-shadow:inset 0 0 18px #000b,0 0 0 1px #6f452d;filter:drop-shadow(0 4px 8px #0009)}
.ktgf-art{background:none!important;overflow:hidden}
.ktgf-art svg{display:block;width:100%;height:100%;border-radius:inherit}
.ktgf-card b{width:100%;min-height:28px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:9.5px;line-height:1.15;font-weight:950;word-break:keep-all}
.ktgf-card strong{display:block;margin-top:5px;color:#ffd65e;font-size:13px;line-height:1;font-weight:950;white-space:nowrap}
.ktgf-foot{display:flex;align-items:center;justify-content:center;margin-top:12px;padding:10px;border-radius:14px;border:1px solid #663052;background:#100a0f;color:#d8c6d3;font-size:10px;font-weight:900}
@media(max-width:410px){
  .ktgf{padding:5px 5px 6px}.ktgf-head{min-height:62px;padding-bottom:6px}.ktgf-brand{gap:6px}.ktgf-logo{width:44px;height:44px;flex-basis:44px;font-size:26px;border-radius:13px}.ktgf-brand h2{font-size:19px}.ktgf-brand p{font-size:7.5px;margin-top:3px}.ktgf-close{min-width:58px;height:38px;font-size:14px;padding:0 8px}
  .ktgf-main{grid-template-columns:62px minmax(0,1fr);gap:4px;margin-top:5px}.ktgf-side{padding:3px;gap:2px}.ktgf-cat{min-height:57px;padding:3px 1px;border-radius:11px}.ktgf-cat i{font-size:19px}.ktgf-cat span{font-size:7px;margin-top:3px}
  .ktgf-grid{gap:3px}.ktgf-card{height:92px;padding:2px 1px 3px;border-radius:9px}.ktgf-art{height:50px;font-size:28px;margin-bottom:1px;border-radius:8px}.ktgf-no{display:none}.ktgf-card b{font-size:6.2px;min-height:17px;line-height:1.02}.ktgf-card strong{position:static;display:block;font-size:8.8px;line-height:10px;height:10px;margin:0;color:#ffe06b;overflow:visible}.ktgf-foot{display:none}
}

<script>
(function(){
  var ROSE_WON=30;
  var earnTimer=null;
  var toastTimer=null;
  var session={active:false,start:0,roses:0,gifts:0,likes:0,likeRewarded:{},title:'',memberType:'general',rate:0.35};

  function money(n){return Math.round(n||0).toLocaleString('ko-KR')+'원';}
  function total(){return session.roses*ROSE_WON;}
  function currentMemberType(){
    try{
      var saved=localStorage.getItem('ktalk_member_type');
      if(saved==='subscriber')return 'subscriber';
    }catch(e){}
    if(window.state){
      if(state.memberType==='subscriber'||state.subscribed===true||state.subscriptionActive===true)return 'subscriber';
    }
    return 'general';
  }
  function rateFor(type){return type==='subscriber'?0.40:0.35;}
  function labelFor(type){return type==='subscriber'?'구독자':'일반회원';}
  function myNet(){return Math.round(total()*session.rate);}

  window.setKTalkMemberType=function(type){
    var v=type==='subscriber'?'subscriber':'general';
    try{localStorage.setItem('ktalk_member_type',v);}catch(e){}
    if(window.state)state.memberType=v;
    return v;
  };

  function updateEarn(){
    var net=money(myNet());
    var roses=session.roses.toLocaleString('ko-KR')+'송이';
    var rate=labelFor(session.memberType)+' · '+Math.round(session.rate*100)+'%';

    var a=document.getElementById('earnNet');
    var b=document.getElementById('earnRoses');
    var r=document.getElementById('earnRate');
    var h1=document.getElementById('hudEarnNet');
    var h2=document.getElementById('hudEarnRoses');
    var h3=document.getElementById('hudEarnRate');

    if(a)a.textContent=net;
    if(b)b.textContent=roses;
    if(r)r.textContent=rate;
    if(h1)h1.textContent=net;
    if(h2)h2.textContent='🌹 '+roses;
    if(h3)h3.textContent=rate;
  }

  window.toggleMyEarnings=function(){
    var d=document.getElementById('myEarnDetail');
    if(!d)return;
    d.style.display=d.style.display==='none'?'grid':'none';
  };

  window.showPrivate30mEarnings=function(){
    if(!session.active)return;
    var old=document.getElementById('privateEarnToast');
    if(old)old.remove();

    var toast=document.createElement('div');
    toast.id='privateEarnToast';
    toast.style.cssText='position:fixed;top:78px;left:50%;transform:translateX(-50%);z-index:9998;width:min(92vw,430px);padding:12px 14px;border-radius:16px;border:1px solid #ffe07166;background:rgba(12,10,18,.94);box-shadow:0 10px 30px #0008,0 0 18px #ffd85a22;color:#fff;text-align:center;font-weight:900;pointer-events:none';

      +'<div style="margin-top:5px;font-size:18px;color:#ffe071">🌹 '+session.roses.toLocaleString('ko-KR')+'송이 · '+money(myNet())+'</div>';

  window.addMyEarnedRoses=function(count){

  function updateHostLikeUI(){
    var a=document.getElementById('hostLikeCount');
    if(a)a.textContent=(session.likes||0).toLocaleString('ko-KR');
  }

  function checkHostLikeReward(){

    milestones.forEach(function(m){
      if((session.likes||0)>=m && !session.likeRewarded[m]){
        session.likeRewarded[m]=true;
        session.roses+=1;
        updateEarn();
        if(window.ktAnnounceEvent)ktAnnounceEvent('reward',{text:'좋아요 '+m.toLocaleString('ko-KR')+'개 달성. 호스트에게 장미 1송이를 지급했습니다.'});
        var toast=document.createElement('div');
        toast.className='kt-like-reward-toast';
        toast.innerHTML='💗 좋아요 '+m.toLocaleString('ko-KR')+'개 달성<br><b>🌹 장미 1송이 지급</b>';

        setTimeout(function(){if(toast&&toast.parentNode)toast.remove();},3200);

  window.addHostLike=function(count){
    if(!session.active)return;
    var n=parseInt(count,10)||1;
    if(n<1)n=1;
    session.likes=(session.likes||0)+n;
    if(session.likes>25000)session.likes=25000;
    updateHostLikeUI();
    checkHostLikeReward();

  var liveFaceTimer=null;
  var liveFaceDetector=null;

  function appliedEffectMarkup(){
    try{
      var applied=(window.state&&state.appliedEditEffect)||'off';
      if(window.renderFaceEffect)renderFaceEffect(applied);
      var a=document.getElementById('ktFaceAnchor');
      return a?a.innerHTML:'';
    }catch(e){return '';}
  }

  function applyLiveVideoFilter(name){
    var v=document.getElementById('ktLiveVideo');
    if(!v)return;
    var base='brightness(1.12) contrast(.95) saturate(1.02)';
    if(name==='mono')v.style.filter='grayscale(1) contrast(1.05) brightness(1.08)';
    else if(name==='warm')v.style.filter='brightness(1.12) contrast(.95) saturate(1.10) sepia(.12)';
    else if(name==='cool')v.style.filter='brightness(1.10) contrast(.95) saturate(.98) hue-rotate(170deg)';
    else if(name==='soft')v.style.filter='brightness(1.14) contrast(.92) saturate(.98)';
    else if(name==='studio')v.style.filter='brightness(1.16) contrast(.94) saturate(.98)';
    else if(name==='night')v.style.filter='brightness(.88) contrast(1.04) saturate(.92)';
    else v.style.filter=base;
  }

  function placeLiveFaceFallback(){
    var layer=document.getElementById('ktLiveEffectLayer');
    var anchor=document.getElementById('ktLiveFaceAnchor');
    var v=document.getElementById('ktLiveVideo');
    if(!layer||!anchor||!v)return;
    var lr=layer.getBoundingClientRect();
    var vr=v.getBoundingClientRect();
    var w=Math.min(vr.width*.44,220);
    var h=w*1.18;
    anchor.style.left=((vr.left-lr.left)+(vr.width*.50))+'px';
    anchor.style.top=((vr.top-lr.top)+(vr.height*.40))+'px';
    anchor.style.width=w+'px';
    anchor.style.height=h+'px';
  }

  async function trackLiveFaceOnce(){
    var v=document.getElementById('ktLiveVideo');
    var layer=document.getElementById('ktLiveEffectLayer');
    var anchor=document.getElementById('ktLiveFaceAnchor');
    if(!v||!layer||!anchor||!v.videoWidth||!v.videoHeight){placeLiveFaceFallback();return;}
    if(!('FaceDetector' in window)){placeLiveFaceFallback();return;}
    try{
      if(!liveFaceDetector)liveFaceDetector=new FaceDetector({fastMode:true,maxDetectedFaces:1});
      var faces=await liveFaceDetector.detect(v);
      if(!faces||!faces.length){placeLiveFaceFallback();return;}
      var box=faces[0].boundingBox;
      var lr=layer.getBoundingClientRect();
      var vr=v.getBoundingClientRect();
      var scale=Math.max(vr.width/v.videoWidth,vr.height/v.videoHeight);
      var drawW=v.videoWidth*scale,drawH=v.videoHeight*scale;
      var offX=(vr.width-drawW)/2,offY=(vr.height-drawH)/2;
      var bw=box.width*scale,bh=box.height*scale;
      var bx=offX+(box.x*scale);
      if((state.cameraFacing||'user')!=='environment'){
        bx=vr.width-offX-((box.x+box.width)*scale);
      }
      var by=offY+(box.y*scale);
      anchor.style.left=((vr.left-lr.left)+bx+(bw/2))+'px';
      anchor.style.top=((vr.top-lr.top)+by+(bh/2))+'px';
      anchor.style.width=Math.max(120,bw)+'px';
      anchor.style.height=Math.max(145,bh)+'px';
    }catch(e){placeLiveFaceFallback();}
  }

  function applySelectedEffectToLive(){
    var name=(window.state&&state.appliedEditEffect)||'off';
    var anchor=document.getElementById('ktLiveFaceAnchor');
    if(anchor)anchor.innerHTML=appliedEffectMarkup();
    applyLiveVideoFilter(name);
    clearInterval(liveFaceTimer);
    if(name!=='off'&&['mono','warm','cool','soft'].indexOf(name)===-1){
      trackLiveFaceOnce();
      liveFaceTimer=setInterval(trackLiveFaceOnce,150);
    }
  }

    var t=document.getElementById('liveTitle');
    var memberType=currentMemberType();
    session={
      active:true,
      start:Date.now(),
      roses:0,
      gifts:0,
      likes:0,
      likeRewarded:{},
      title:t&&t.value?t.value:'K-Talk LIVE',
      memberType:memberType,
      rate:rateFor(memberType)
    };

    var guestStrip='';

      }).join('')+'</div>';

    document.body.classList.remove('kt-home');

    screen.innerHTML='<section style="height:100dvh;min-height:620px;position:relative;overflow:hidden;background:#050309;color:#fff">'
      +'<video id="ktLiveVideo" autoplay playsinline muted style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#09070d;transform:scaleX(-1);filter:brightness(1.12) contrast(.95) saturate(1.02)"></video>'
      +'<div style="position:absolute;inset:0;background:linear-gradient(180deg,#00000045,transparent 34%,#00000018 62%,#000000d9 100%);pointer-events:none"></div>'
      +'<div id="ktLiveEffectLayer" style="position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden"><div id="ktLiveFaceAnchor" class="kt-face-anchor"></div></div>'
      +'<div id="ktLiveTreasureZone" class="kt-live-treasure-zone"></div>'
      +'<div class="kt-attendance-wrap"><button id="ktAttendanceHeart" class="kt-attendance-heart" onclick="ktAttendanceCheck()"><span class="kt-attendance-label">출석체크</span><span class="kt-attendance-sub">하트 1개 · 30원</span><i class="kt-attendance-miniheart">💗</i></button></div>'
      +'<div class="kt-like-milestones">💗 5천 · 1만 · 1만5천 · 2만 · 2만5천 <b>달성마다 🌹 1송이</b></div>'

      +'<div style="position:absolute;left:10px;right:10px;top:12px;z-index:5;display:grid;gap:7px">'
        +'<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border:1px solid #ffffff22;border-radius:14px;background:#08080b77">'
          +'<b style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">🔴 '+session.title+'</b>'
          +'<span style="color:#ff6788;font-weight:900;white-space:nowrap">K-Talk LIVE</span>'
        +'</div>'
        +guestStrip
        +'<button id="myEarnHud" onclick="toggleMyEarnings()" style="width:100%;padding:8px 10px;border:1px solid #ffe07155;border-radius:14px;background:linear-gradient(135deg,#241b08d9,#16131ed9);color:#fff;text-align:left">'
          +'<div style="display:flex;align-items:center;justify-content:space-between;gap:8px">'
            +'<span style="font-size:10px;color:#8fe8ff;font-weight:950">🔒 내 수익 · 본인만 표시</span>'
            +'<b id="hudEarnNet" style="font-size:18px;color:#ffe071">0원</b>'
          +'</div>'
          +'<div id="myEarnDetail" style="display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:5px;font-size:10px;color:#ddd">'
            +'<span id="hudEarnRoses">🌹 0송이</span><span id="hudEarnRate" style="text-align:right">일반회원 · 35%</span>'
          +'</div>'
        +'</button>'
      +'</div>'

      +'<div style="position:absolute;right:10px;bottom:112px;z-index:5;display:grid;gap:9px">'
        +'<button onclick="addHostLike(1)" style="width:54px;min-height:62px;border-radius:18px;border:1px solid #ff65b788;background:#321024dd;color:#fff;font-size:22px;font-weight:950;line-height:1">💗<small style="display:block;margin-top:4px;font-size:9px;color:#ffd8ef">좋아요</small><b id="hostLikeCount" style="display:block;margin-top:3px;font-size:10px;color:#fff">0</b></button>'
        +'<button onclick="openGifts()" style="width:54px;height:54px;border-radius:50%;border:1px solid #ffd65a88;background:#2b1c08dd;color:#fff;font-size:23px">🎁</button>'
        +'<button onclick="if(window.openEditEffectPanel){creator.classList.add(\'show\');openEditEffectPanel();}" style="width:54px;height:54px;border-radius:50%;border:1px solid #ffffff38;background:#09090ddd;color:#fff;font-size:11px;font-weight:900">✨ 효과</button>'
      +'</div>'

      +'<div style="position:absolute;left:10px;right:10px;bottom:14px;z-index:5;display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px">'
        +'<button onclick="openGifts()" style="padding:12px 5px;border:1px solid #ffd86b66;border-radius:15px;background:linear-gradient(135deg,#332707,#7a5310);color:#ffe075;font-weight:950;font-size:12px">🎁 선물</button>'
        +'<button onclick="openTreasure()" style="padding:12px 5px;border:1px solid #f2b94f88;border-radius:15px;background:linear-gradient(135deg,#48260d,#8c5512);color:#fff3a7;font-weight:950;font-size:12px">🗝️ 보물상자</button>'
        +'<button onclick="endBroadcastEarnings()" style="padding:12px 5px;border:0;border-radius:15px;background:linear-gradient(135deg,#ff315f,#ff4e91);color:#fff;font-weight:950;font-size:12px">■ 방송 종료</button>'
      +'</div>'

    var liveVideo=document.getElementById('ktLiveVideo');

    if(window.ktRenderTreasure)ktRenderTreasure();
    if(window.ktUpdateTreasureLed)ktUpdateTreasureLed();
    if(window.ktRenderAttendance)ktRenderAttendance();

    updateEarn();
    clearInterval(earnTimer);
    earnTimer=setInterval(function(){
      if(session.active)showPrivate30mEarnings();

  var oldGiftSend=window.giftSend;
  window.giftSend=function(name,cost){
    var n=parseInt(String(cost).replace(/,/g,''),10)||0;
    if(session.active&&n>0){
      session.roses+=n;
      session.gifts++;
      updateEarn();
    }
    if(oldGiftSend)oldGiftSend(name,cost);
  };

  function currentMemberKey(){
    var key='local-member';
    try{
      if(window.state)key=state.userId||state.memberId||state.uid||key;
      if(key==='local-member'){
        key=localStorage.getItem('ktalk_member_key')||key;
        if(key==='local-member'){
          key='member-'+Math.random().toString(36).slice(2,10);
          localStorage.setItem('ktalk_member_key',key);
        }
      }
    }catch(e){}
    return String(key);
  }

  function saveMyLastEarnings(summary){
    try{localStorage.setItem('ktalk_last_earnings_'+currentMemberKey(),JSON.stringify(summary));}catch(e){}
  }

  window.endBroadcastEarnings=function(){
    if(!session.active)return;
    clearInterval(earnTimer);
    earnTimer=null;
    clearInterval(liveFaceTimer);
    liveFaceTimer=null;
    try{
      if(window.state&&state.stream){
        state.stream.getTracks().forEach(function(t){t.stop();});
        state.stream=null;
      }
    }catch(e){}

    var gross=total();
    var mine=myNet();
    var ratePct=Math.round(session.rate*100);
    var summary={
      memberKey:currentMemberKey(),
      endedAt:Date.now(),
      memberType:session.memberType,
      roses:session.roses,
      gross:gross,
      rate:ratePct,
      mine:mine
    };

    saveMyLastEarnings(summary);
    session.active=false;
    if(window.state){
      state.currentLiveRoomTitle='';
      state.currentViewRoomTitle='';

    if(window.ktSaveTreasure)ktSaveTreasure(null);

      +'<div class="note">이 수익 정보는 본인 화면에서만 확인합니다. 일반회원은 35%, 구독자는 40% 기준으로 계산합니다.</div>'
      +'<button class="act" onclick="closeSheet();home()">확인</button>'
