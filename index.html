<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>K-Talk LIVE · 1번</title><style>*{box-sizing:border-box}html,body{margin:0;background:#000}body{font-family:Arial,'Noto Sans KR',sans-serif}.stage{position:relative;width:min(100vw,1024px);margin:0 auto;background:#000}.design{display:block;width:100%;height:auto}.hot{position:absolute;border:0;background:transparent;cursor:pointer}.camera{left:36.5%;bottom:2.3%;width:10.5%;height:5.3%}.mic{left:28.1%;bottom:2.3%;width:9%;height:5.3%}.join{left:46.7%;bottom:2.3%;width:10%;height:5.3%}.manage{left:59.8%;bottom:2.3%;width:12%;height:5.3%}.raffle{left:76.8%;bottom:2.3%;width:10%;height:5.3%}.gift{left:88.3%;bottom:2.3%;width:10%;height:5.3%}.charge{left:0.5%;bottom:2.3%;width:26.5%;height:5.3%}.camLayer{display:none;position:fixed;inset:0;z-index:99;background:#000}.camLayer.open{display:block}.camLayer video{width:100%;height:100%;object-fit:cover}.closeCam{position:absolute;left:14px;top:14px;width:46px;height:46px;border:0;border-radius:50%;background:#0009;color:#fff;font-size:28px}.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);z-index:120;background:#111e;color:#fff;border:1px solid #ffffff40;border-radius:12px;padding:10px 16px;font-size:14px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}@media(max-width:600px){.stage{width:100vw}}</style></head><body><main class="stage"><img class="design" alt="K-Talk 13명방 1번 디자인" src="data:image/png;base64,"+""+""> <button class="hot charge" aria-label="충전"></button><button class="hot mic" aria-label="마이크"></button><button class="hot camera" id="cameraBtn" aria-label="카메라"></button><button class="hot join" aria-label="같이보기"></button><button class="hot manage" aria-label="방 관리자"></button><button class="hot raffle" aria-label="제비뽑기"></button><button class="hot gift" aria-label="선물함"></button></main><section class="camLayer" id="camLayer"><video id="cam" autoplay playsinline muted></video><button class="closeCam" id="closeCam">×</button></section><div class="toast" id="toast"></div><script>const toast=document.getElementById('toast');function msg(t){toast.textContent=t;toast.classList.add('show');clearTimeout(window.__tt);window.__tt=setTimeout(()=>toast.classList.remove('show'),1500)}document.querySelectorAll('.hot').forEach(b=>{if(b.id!=='cameraBtn')b.addEventListener('click',()=>msg(b.getAttribute('aria-label')+' 버튼'))});const layer=document.getElementById('camLayer'),video=document.getElementById('cam');let stream=null;document.getElementById('cameraBtn').onclick=async()=>{layer.classList.add('open');try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});video.srcObject=stream}catch(e){msg('카메라 권한을 허용해 주세요.')}};document.getElementById('closeCam').onclick=()=>{if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;video.srcObject=null;layer.classList.remove('open')};</script></body></html>
