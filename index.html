-height:300px;border:1px solid #8d39e9;border-radius:12px;background:linear-gradient(#241133,#08050d);display:grid;place-items:center;text-align:center;padding:16px}.roomslots{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:100%;margin-top:9px}.roomslot{aspect-ratio:1;border:1px dashed #ffffff35;border-radius:8px;background:#130d18;display:grid;place-items:center;font-size:10px;color:#888}.secret{width:100%;height:44px;margin-top:10px;border:1px solid #ffffff35;border-radius:9px;background:#08060b;color:#fff;padding:0 12px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.actions button{height:46px;border:0;border-radius:10px;color:#fff;font-weight:900}.create{background:#7c17df}.enter{background:#e51c72}.roommsg{text-align:center;color:#ffd95b;min-height:26px;margin-top:8px}@media(max-width:390px){.led{width:68%;font-size:12px}.roomWrap{grid-template-columns:minmax(0,1.9fr) minmax(0,1.05fr)}.slot{font-size:8px}.gi{font-size:23px}}</style></head><body><main class="app"><div class="top"><div class="profile"><div class="avatar"></div><div><div class="name">AI 소라 <span class="live">LIVE</span></div><div class="rtype">13명 방송 · 현재 1명</div></div></div><div class="headbox"><div class="noticeTop">📢</div><div class="viewtop">👤 98</div></div></div><div class="led">방송에 오신 여러분 환영합니다! ★ 🎵</div><div class="status"><span>🔴 ON AIR 02:35:48</span><span>👑 출석체크</span><span>🎵 신청곡 5,000원</span><span>★ 광고 문의 환영합니다</span><span>👤 98</span></div><div class="roomWrap"><div class="left"><div class="host"><div class="viewer">👤 98</div><div class="wave" id="wave"></div></div><div class="guests"><div class="guestTitle">게스트 0/12 · 올리지 않으면 혼자 방송</div><div class="slots" id="guestSlots"></div></div></div><div class="right"><div class="gifts"><div class="gtitle">장미 선물 <em>(1송이=30원)</em></div><div class="grid"><button class="gift"><span class="gi">⭐</span><small>별 5송이</small></button><button class="gift"><span class="gi">🎈</span><small>풍선 5송이</small></button>< iv class="roommsg" id="roommsg"></div></div></section><script>document.getElementById('wave').innerHTML='<i></i>'.repeat(36);document.getElementById('guestSlots').innerHTML=Array.from({length:12},(_,i)=>'<div class="slot"><div><b>＋</b>빈 자리 '+(i+1)+'</div></div>').join('');const sheet=document.getElementById('sheet'),video=document.getElementById('camVideo'),fallback=document.getElementById('fallback');let stream=null,facing='user';async function startCamera(){if(!navigator.mediaDevices?.getUserMedia){fallback.textContent='카메라를 지원하지 않는 브라우저입니다.';return}if(stream)stream.getTracks().forEach(t=>t.stop());try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing},audio:false});video.srcObject=stream;fallback.style.display='none'}catch(e){fallback.style.display='grid';fallback.textContent='카메라 권한을 허용해 주세요.'}}function stopCamera(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;video.srcObject=null;fallback.style.display='grid'}document.getElementById('plus').onclick=()=>{sheet.classList.add('open');startCamera()};document.getElementById('close').onclick=()=>{sheet.classList.remove('open');stopCamera()};document.getElementById('flip').onclick=()=>{facing=facing==='user'?'environment':'user';startCamera()};const info={group13:['👥','13명 방송','호스트 1명 + 게스트 최대 12명'],vip:['👑','VIP 방송','VIP 회원을 위한 방송입니다.'],secret:['🔒','비밀방','비밀번호를 입력해서 들어가는 방입니다.'],movie:['🎬','영화방','함께 영상을 보는 방입니다.'],dj:['🎧','DJ방','음악과 신청곡을 함께 즐기는 방입니다.']};let current='group13';const rv=document.getElementById('roomview'),preview=document.getElementById('preview'),sw=document.getElementById('secretwrap'),rm=document.getElementById('roommsg');function openRoom(k){current=k;const r=info[k];document.getElementById('roomtitle').textContent=r[0]+' '+r[1];let slots=k==='group13'?'<div class="roomslots">'+Array.from({length:13},(_,i)=>'<div class="roomslot">'+(i?'빈 자리 '+i:'호스트')+'</div>').join('')+'</div>':'';preview.innerHTML='<div><strong>'+r[0]+' '+r[1]+'</strong><p>'+r[2]+'</p>'+slots+'</div>';sw.innerHTML=k==='secret'?'<input class="secret" id="pw" type="password" placeholder="비밀번호를 입력하세요">':'';rm.textContent='';sheet.classList.remove('open');stopCamera();rv.classList.add('open')}document.querySelectorAll('.room').forEach(b=>b.onclick=()=>openRoom(b.dataset.room));document.getElementById('back').onclick=()=>rv.classList.remove('open');document.getElementById('create').onclick=()=>rm.textContent=info[current][1]+' 만들기 화면이 열렸습니다.';document.getElementById('enter').onclick=()=>{if(current==='secret'&&!document.getElementById('pw')?.value.trim()){rm.textContent='비밀번호를 입력해 주세요.';return}rm.textContent=info[current][1]+'에 입장했습니다.'};</script></body></html>
