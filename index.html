<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>K-Talk LIVE</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:Arial,'Noto Sans KR',sans-serif;overflow:hidden}button,input{font:inherit}.feed{height:100dvh;overflow-y:auto;scroll-snap-type:y mandatory;background:#000}.livePage{height:100dvh;scroll-snap-align:start;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 26%,var(--glow),#16091d 45%,#030305 78%)}.malePage{--glow:#123c62}.femalePage{--glow:#5a174b}.top{position:absolute;z-index:8;top:10px;left:12px;right:12px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:20px;font-weight:900;color:#ffd85f;text-shadow:0 0 11px #ff3cb8}.brand em{font-style:normal;color:#ff54d5}.tools{display:flex;gap:5px}.pill{border:1px solid #ffffff32;background:#08070dcc;border-radius:18px;padding:6px 9px;font-size:10px}.hostVisual{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding-bottom:80px}.stageGlow{width:min(78vw,350px);height:min(78vw,350px);border-radius:50%;display:grid;place-items:center;border:2px solid var(--accent);box-shadow:0 0 28px var(--accent),0 0 80px #000 inset;background:radial-gradient(circle,#33203d,#0b0710 70%);animation:pulse 2.2s ease-in-out infinite}.face{font-size:min(31vw,150px);filter:drop-shadow(0 8px 20px #0008);animation:talk 1.3s ease-in-out infinite}.femalePage{--accent:#ff43be}.malePage{--accent:#37b8ff}@keyframes pulse{50%{transform:scale(1.025);box-shadow:0 0 42px var(--accent),0 0 80px #000 inset}}@keyframes talk{50%{transform:translateY(-5px) scale(1.02)}}.liveBadge{position:absolute;z-index:8;top:60px;left:14px;background:#ff174f;border-radius:9px;padding:5px 8px;font-size:10px;font-weight:900}.aiBadge{position:absolute;z-index:8;top:60px;left:86px;border:1px solid #ffffff35;background:#0d0a12cc;border-radius:9px;padding:5px 8px;font-size:10px}.side{position:absolute;z-index:8;right:12px;bottom:118px;display:grid;gap:13px;text-align:center}.side button{width:48px;height:48px;border:1px solid #ffffff25;border-radius:50%;background:#0b0910d9;color:#fff;font-size:21px}.side small{display:block;font-size:8px;margin-top:2px}.info{position:absolute;z-index:8;left:14px;right:72px;bottom:105px}.info h2{margin:0 0 6px;font-size:22px}.info p{margin:0 0 8px;font-size:11px;color:#ddd;line-height:1.45}.speech{border-left:3px solid var(--accent);padding:7px 9px;background:#09070dbb;border-radius:0 10px 10px 0;font-size:11px}.chatline{margin-top:8px;font-size:10px;color:#f4eaff}.chatline b{color:#ffd15e}.composer{position:absolute;z-index:9;left:12px;right:72px;bottom:61px;display:flex;gap:6px}.composer input{flex:1;height:38px;border:1px solid #ffffff2b;border-radius:20px;background:#0b0910dd;color:#fff;padding:0 12px;font-size:11px}.composer button{width:50px;border:0;border-radius:18px;background:linear-gradient(135deg,var(--accent),#7e3cff);color:#fff;font-weight:900;font-size:10px}.nav{position:fixed;z-index:20;left:0;right:0;bottom:0;height:54px;background:#030305f4;border-top:1px solid #ffffff18;display:grid;grid-template-columns:repeat(3,1fr)}.nav button{border:0;background:transparent;color:#d5cfdb;font-size:10px}.nav strong{display:block;font-size:18px;margin-bottom:1px}.nav .active{color:#ff60d9}.screen{display:none;position:fixed;z-index:30;inset:0;background:radial-gradient(circle at 50% 0,#28103d,#08050b 56%,#020203)}.screen.open{display:block}.bar{height:56px;display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid #ffffff14}.back{width:38px;height:38px;border:1px solid #ffffff22;border-radius:50%;background:#120d18;color:#fff;font-size:22px}.title{font-weight:900;color:#ffe19a}.body{height:calc(100dvh - 56px);padding:12px;overflow:auto}.list{display:grid;gap:10px}.item{border:1px solid #ffffff18;border-radius:16px;background:#100c14;padding:13px}.item .row{display:flex;gap:12px;align-items:center}.mini{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:40px;border:2px solid #ff45bb;background:#170d1c}.mini.m{border-color:#37b8ff}.enter{width:100%;margin-top:10px;border:0;border-radius:12px;padding:10px;background:linear-gradient(135deg,#ff3b99,#7c37ff);color:#fff;font-weight:900}.roomGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.roomBtn{min-height:94px;border:1px solid #8448c9;border-radius:16px;background:#110c17;color:#fff;font-weight:900}.box{padding:16px;border:1px solid #ffffff18;border-radius:16px;background:#100c14;text-align:center}</style></head><body><main class="feed" id="feed"><section class="livePage femalePage"><div class="top"><div class="brand">♛ K-Talk <em>LIVE</em></div><div class="tools"><div class="pill">🪙 1,250 +</div><div class="pill">💎 VIP</div></div></div><div class="liveBadge">● LIVE</div><div class="aiBadge">AI 진행자</div><div class="hostVisual"><div class="stageGlow"><div class="face">👩</div></div></div><div class="side"><div><button onclick="gift('소라')">🎁</button><small>선물</small></div><div><button onclick="speak('소라 AI 방송입니다. 반갑습니다.')">🔊</button><small>음성</small></div></div><div class="info"><h2>AI 소라</h2><p>지금 실제 방송 화면처럼 진행 중 · 입장 인사 · 채팅 읽기</p><div class="speech" id="speechSora">“어서 오세요! 소라 방송입니다. 편하게 채팅해 주세요.”</div><div class="chatline"><b>행복이:</b> 안녕하세요 👋</div></div><div class="composer"><input id="inputSora" placeholder="채팅을 입력하세요"><button onclick="chat('소라','inputSora','speechSora')">보내기</button></div></section><section class="livePage malePage"><div class="top"><div class="brand">♛ K-Talk <em>LIVE</em></div><div class="tools"><div class="pill">🪙 1,250 +</div><div class="pill">💎 VIP</div></div></div><div class="liveBadge">● LIVE</div><div class="aiBadge">AI 진행자</div><div class="hostVisual"><div class="stageGlow"><div class="face">👨</div></div></div><div class="side"><div><button onclick="gift('준호')">🎁</button><small>선물</small></div><div><button onclick="speak('준호 AI 방송입니다. 어서 오세요.')">🔊</button><small>음성</small></div></div><div class="info"><h2>AI 준호</h2><p>위로 넘겨서 보는 두 번째 AI LIVE 방송</p><div class="speech" id="speechJunho">“어서 오세요! 준호 방송입니다. 오늘도 즐겁게 이야기해요.”</div><div class="chatline"><b>볼링사랑:</b> 반갑습니다 👍</div></div><div class="composer"><input id="inputJunho" placeholder="채팅을 입력하세요"><button onclick="chat('준호','inputJunho','speechJunho')">보내기</button></div></section></main><nav class="nav"><button class="active" id="homeBtn"><strong>⌂</strong>홈</button><button id="listBtn"><strong>▦</strong>방송목록</button><button id="myBtn"><strong>♙</strong>마이페이지</button></nav><section class="screen" id="screen"><div class="bar"><button class="back" id="back">‹</button><div class="title" id="title">방송목록</div></div><div class="body" id="body"></div></section><script>const screen=document.getElementById('screen'),title=document.getElementById('title'),body=document.getElementById('body');function speak(t){if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';speechSynthesis.speak(u)}}function chat(name,inputId,speechId){const i=document.getElementById(inputId);const t=i.value.trim();if(!t)return;const r=t.includes('안녕')?'안녕하세요. '+name+'입니다. 반가워요!':t.includes('이름')?'제 이름은 AI '+name+'입니다.':'네, '+t+'라고 하셨군요. 같이 이야기해요.';document.getElementById(speechId).textContent='“'+r+'”';speak(t+'. '+r);i.value=''}function gift(name){speak(name+' 방송에 선물이 도착했습니다. 감사합니다.')}function openScreen(t,h){title.textContent=t;body.innerHTML=h;screen.classList.add('open')}document.getElementById('back').onclick=()=>screen.classList.remove('open');document.getElementById('homeBtn').onclick=()=>{screen.classList.remove('open');document.getElementById('feed').scrollTo({top:0,behavior:'smooth'})};document.getElementById('listBtn').onclick=()=>openScreen('방송목록','<div class="list"><div class="item"><div class="row"><div class="mini">👩</div><div><b>● LIVE · AI 소라</b><p>지금 방송 중</p></div></div><button class="enter" onclick="goFeed(0)">방송 보기</button></div><div class="item"><div class="row"><div class="mini m">👨</div><div><b>● LIVE · AI 준호</b><p>지금 방송 중</p></div></div><button class="enter" onclick="goFeed(1)">방송 보기</button></div><h3>방 종류</h3><div class="roomGrid"><button class="roomBtn">일반 방송</button><button class="roomBtn">1인 방송</button><button class="roomBtn">비밀방</button><button class="roomBtn">구독자방</button><button class="roomBtn">남자 DJ</button><button class="roomBtn">여자 DJ</button><button class="roomBtn">영화방</button><button class="roomBtn">동영상</button></div></div>');document.getElementById('myBtn').onclick=()=>openScreen('마이페이지','<div class="box"><h2>내 홈</h2><p>내 프로필 · 내 동영상 · 내 쇼츠 · 내 방송 기록</p></div>');window.goFeed=function(n){screen.classList.remove('open');document.getElementById('feed').scrollTo({top:n*innerHeight,behavior:'smooth'})};setTimeout(()=>speak('어서 오세요. AI 소라 방송입니다.'),900);</script></body></html>
