<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>K-Talk LIVE</title>
<link rel="stylesheet" href="styles.css" />
<style>
.app:has(.refSolo) .header,.app:has(.refSolo) .bottom{display:none!important}
.app:has(.refSolo){height:100dvh!important;min-height:100dvh!important;overflow:hidden!important;background:#000!important}
#screen:has(.refSolo){height:100dvh!important;min-height:100dvh!important;padding:0!important;margin:0!important;overflow:hidden!important}
#screen:has(.refSolo) .refSolo{height:100dvh!important;min-height:100dvh!important;border-radius:0!important;padding:0!important;margin:0!important}
#screen:has(.refSolo) .refStage{border-radius:0!important}
.refGift{background:#09090ddd!important;border:1px solid #ffffff32!important;border-radius:10px!important;box-shadow:inset 0 0 10px #ffffff08,0 3px 8px #0008!important;min-width:0!important;width:auto!important;padding:4px 2px!important}
.refGift strong{display:flex!important;align-items:center!important;justify-content:center!important;width:100%!important;height:36px!important;font-size:0!important}
.giftPhoto{display:block;width:48px;height:36px;background:url('gifts-reference.jpg') no-repeat;background-size:400% 100%;border-radius:5px}
.giftPhoto0{background-position:0% 50%}.giftPhoto1{background-position:33.333% 50%}.giftPhoto2{background-position:66.666% 50%}.giftPhoto3{background-position:100% 50%}
.refGifts{display:grid!important;grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:4px!important;width:100%!important;overflow:hidden!important;padding:0 4px!important}
.refGift b{font-size:9px!important;color:#fff!important;white-space:nowrap!important}.refGift em{font-size:7px!important;color:#ff5b99!important;white-space:nowrap!important}
.refReward{min-height:74px!important;grid-template-columns:74px repeat(5,1fr)!important;background:#08080be8!important;border:1px solid #ffffff26!important;border-radius:16px!important;padding:7px!important}
.refReward>span{font-size:11px!important;line-height:1.15!important;color:#ff5f99!important}
.refReward i{display:flex!important;flex-direction:column!important;gap:2px!important;font-size:8px!important;border-left:1px solid #ffffff20!important;padding:2px 0!important}
.refReward i b{font-size:10px!important;color:#fff!important}.refReward i .giftPhoto{width:24px;height:28px;background-size:400% 100%}.refReward i .rewardText{font-size:8px!important;font-weight:700!important;color:#ddd!important;white-space:nowrap!important}
.creator .shade{pointer-events:none!important}
.creator-top,.creator-tools,.creator-bottom,.live-prep{z-index:3!important;pointer-events:auto!important}
.creator button,.creator .modes span,.creator .fx,.creator-foot span,.live-prep button,.live-prep input{pointer-events:auto!important;touch-action:manipulation!important}
.creator .test-active{outline:2px solid #fff!important;transform:scale(.96)}
.creator-top,.creator-tools,.creator-bottom{display:none!important}
.creator{background:radial-gradient(circle at 22% 16%,rgba(255,63,143,.26),transparent 28%),radial-gradient(circle at 82% 26%,rgba(53,169,255,.22),transparent 30%),radial-gradient(circle at 50% 82%,rgba(139,92,255,.28),transparent 38%),linear-gradient(155deg,#171421,#0a0b12 60%,#08070d)!important}
.creator video{display:none!important}
.live-prep{position:absolute;inset:0;padding:18px 14px 20px;display:flex;flex-direction:column;color:#fff}
.prep-top{display:flex;align-items:center;gap:10px}.prep-close,.prep-mini{width:44px;height:44px;border:0;border-radius:50%;background:rgba(0,0,0,.38);color:#fff;font-size:24px}.prep-title{flex:1;text-align:center;font-size:18px;font-weight:900;text-shadow:0 2px 8px #000}.prep-topic{margin:38px 8px 0;padding:14px;border-radius:16px;background:rgba(0,0,0,.28);backdrop-filter:blur(8px)}.prep-topic input{width:100%;border:0;outline:0;background:transparent;color:#fff;font-size:22px;font-weight:900}.prep-topic input::placeholder{color:#fff}.prep-grid{margin-top:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:14px 8px;padding:14px 4px;border-radius:18px;background:rgba(0,0,0,.24);backdrop-filter:blur(7px)}.prep-item{border:0;background:none;color:#fff;text-align:center;font-size:11px;font-weight:800}.prep-item b{display:grid;place-items:center;width:52px;height:52px;margin:auto auto 5px;border-radius:50%;background:rgba(0,0,0,.28);font-size:24px}.prep-card{margin-top:14px;padding:12px;border-radius:18px;background:rgba(0,0,0,.35);backdrop-filter:blur(8px)}.prep-card-top{display:flex;align-items:center;justify-content:space-between;font-weight:900}.prep-card-top button{border:0;border-radius:999px;padding:8px 11px;background:rgba(255,255,255,.14);color:#fff}.prep-start{width:100%;margin-top:12px;padding:17px;border:0;border-radius:999px;background:linear-gradient(135deg,#ff315f,#ff3f8f 58%,#8b5cff);color:#fff;font-size:20px;font-weight:950}.prep-bottom{display:flex;justify-content:space-around;margin-top:12px;font-weight:900}.prep-bottom span{opacity:.62}.prep-bottom .on{opacity:1;border-bottom:3px solid #fff;padding-bottom:5px}
.live-prep{padding:20px 18px 18px!important;background:linear-gradient(180deg,rgba(0,0,0,.10),rgba(0,0,0,.04) 28%,rgba(0,0,0,.58) 72%,rgba(0,0,0,.86))!important}
.prep-top{gap:12px!important}.prep-close,.prep-mini{width:42px!important;height:42px!important;background:rgba(12,12,18,.48)!important;border:1px solid rgba(255,255,255,.12)!important;backdrop-filter:blur(14px)!important;box-shadow:0 8px 24px rgba(0,0,0,.18)!important;font-size:22px!important}.prep-title{font-size:19px!important;font-weight:850!important;letter-spacing:-.4px!important}
.prep-topic{margin:34px 6px 0!important;padding:13px 16px!important;border-radius:20px!important;background:rgba(20,20,26,.34)!important;border:1px solid rgba(255,255,255,.10)!important;backdrop-filter:blur(18px)!important;box-shadow:0 10px 28px rgba(0,0,0,.14)!important}.prep-topic input{font-size:18px!important;font-weight:760!important;letter-spacing:-.3px!important}.prep-topic input::placeholder{color:rgba(255,255,255,.72)!important}
.prep-grid{margin-top:auto!important;grid-template-columns:repeat(5,minmax(0,1fr))!important;gap:16px 6px!important;padding:16px 8px!important;border-radius:24px!important;background:rgba(18,18,24,.34)!important;border:1px solid rgba(255,255,255,.09)!important;backdrop-filter:blur(18px)!important;box-shadow:0 14px 36px rgba(0,0,0,.16)!important}.prep-item{font-size:10px!important;font-weight:720!important;letter-spacing:-.2px!important;opacity:.96}.prep-item b{width:48px!important;height:48px!important;margin-bottom:7px!important;background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.07))!important;border:1px solid rgba(255,255,255,.10)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 7px 18px rgba(0,0,0,.16)!important;font-size:21px!important}.prep-item:active b{transform:scale(.94)!important}
.prep-card{margin-top:12px!important;padding:14px!important;border-radius:24px!important;background:rgba(14,14,20,.46)!important;border:1px solid rgba(255,255,255,.10)!important;backdrop-filter:blur(20px)!important;box-shadow:0 14px 34px rgba(0,0,0,.20)!important}.prep-card-top{font-size:15px!important;letter-spacing:-.2px!important}.prep-card-top button{padding:8px 13px!important;background:rgba(255,255,255,.10)!important;border:1px solid rgba(255,255,255,.10)!important;font-size:12px!important}.prep-start{margin-top:12px!important;padding:15px!important;border-radius:18px!important;background:linear-gradient(135deg,#ff315f 0%,#ff3f8f 55%,#9b63ff 100%)!important;box-shadow:0 12px 30px rgba(255,49,95,.26)!important;font-size:18px!important;letter-spacing:-.3px!important}
.prep-bottom{margin-top:13px!important;padding:0 18px!important;font-size:14px!important}.prep-bottom span{opacity:.50!important}.prep-bottom .on{opacity:1!important;border-bottom:2px solid #fff!important;padding-bottom:6px!important}
@media(max-height:760px){.prep-topic{margin-top:20px!important}.prep-grid{gap:11px 4px!important;padding:12px 6px!important}.prep-item b{width:44px!important;height:44px!important}.prep-card{padding:11px!important}.prep-start{padding:13px!important}.prep-bottom{margin-top:9px!important}}
</style>
</head>
<body>
<div class="app">
<header class="header">
  <div class="brand"><div class="logo">♛ K-Talk</div><div class="live">LIVE</div></div>
  <div class="led" onclick="openAd()">♛ K-Talk · 신곡 광고 신청하세요! 🎵 🎤</div>
  <div class="tabs">
    <button class="active" data-tab="home">홈</button><button data-tab="shorts">쇼츠</button><button data-tab="video">동영상</button><button data-tab="profile">프로필</button>
  </div>
</header>
<main id="screen"></main>
<nav class="bottom">
  <button data-bottom="home"><b>⌂</b>홈</button><button data-bottom="friends"><b>👥</b>친구</button><button class="plus" data-bottom="plus"><b>＋</b>방송하기</button><button data-bottom="help"><b>?</b>사용방법</button><button data-bottom="profile"><b>♙</b>내 정보</button>
</nav>
</div>
<div id="creator" class="creator">
  <video id="camera" autoplay playsinline muted></video><div class="shade"></div>
  <div class="creator-top"><button class="circle" onclick="closeCreator()">×</button><button class="sound">♪ 사운드 추가</button><button class="circle creator-rotate">↻</button></div>
  <div class="creator-tools"><button>✦</button><button>◔</button><button>▦</button><button>☺</button></div>
  <div class="creator-bottom"><div class="modes"><span>10분</span><span>60초</span><span>15초</span><span class="on">라이브</span></div><div class="recordrow"><div class="fx">✨</div><button class="record" onclick="startBroadcast()"></button><div class="fx">🎭</div></div><div class="creator-foot"><span>게시</span><span>창작하기</span><span class="on">라이브</span></div></div>
  <div class="live-prep">
    <div class="prep-top"><button class="prep-close" onclick="closeCreator()">×</button><div class="prep-title">K-Talk 라이브 준비</div><button class="prep-mini" onclick="prepTap(this,'라이브 보상')">★</button></div>
    <div class="prep-topic"><input id="liveTitle" value="오늘 라이브 제목을 입력하세요" aria-label="라이브 제목"></div>
    <div class="prep-grid">
      <button class="prep-item" onclick="prepTap(this,'카메라 전환')"><b>↻</b>전환</button>
      <button class="prep-item" onclick="prepTap(this,'뷰티')"><b>✦</b>뷰티</button>
      <button class="prep-item" onclick="prepTap(this,'편집효과')"><b>✺</b>편집효과</button>
      <button class="prep-item" onclick="prepTap(this,'설정')"><b>⚙</b>설정</button>
      <button class="prep-item" onclick="prepTap(this,'멀티게스트')"><b>▦</b>멀티게스트</button>
      <button class="prep-item" onclick="prepTap(this,'서비스')"><b>□</b>서비스</button>
      <button class="prep-item" onclick="prepTap(this,'팬클럽')"><b>♡</b>팬클럽</button>
      <button class="prep-item" onclick="prepTap(this,'소통하기')"><b>☵</b>소통하기</button>
      <button class="prep-item" onclick="prepTap(this,'공유')"><b>↗</b>공유</button>
      <button class="prep-item" onclick="prepTap(this,'프로모션')"><b>♨</b>프로모션</button>
    </div>
    <div class="prep-card"><div class="prep-card-top"><span>🎯 라이브 목표</span><button onclick="prepTap(this,'목표 설정')">목표 설정</button></div><button class="prep-start" onclick="startBroadcast()">● 라이브 시작</button></div>
    <div class="prep-bottom"><span>게시</span><span>창작하기</span><span class="on">라이브</span></div>
  </div>
</div>
<div id="sheet" class="sheet"><div class="sheet-inner"><div class="sheet-head"><h3 id="sheetTitle">메뉴</h3><button onclick="closeSheet()">닫기</button></div><div id="sheetBody"></div></div></div>
<script src="app.js"></script>
<script>
(function(){
  window.openCreator=function(){
    creator.classList.add('show');
    if(state.stream){state.stream.getTracks().forEach(t=>t.stop());state.stream=null;camera.srcObject=null;}
  };
  window.closeCreator=function(){
    creator.classList.remove('show');
    if(state.stream){state.stream.getTracks().forEach(t=>t.stop());state.stream=null;camera.srcObject=null;}
  };
  window.startBroadcast=function(){
    alert('라이브 시작 버튼이 정상 작동합니다. 현재는 시험 모드라 실제 외부 송출은 하지 않습니다.');
  };
  window.prepTap=function(el,name){
    el.classList.add('test-active');
    setTimeout(()=>el.classList.remove('test-active'),180);
    alert(name+' 버튼이 정상 작동합니다.');
  };
  function applyApprovedGifts(){
    const gifts=document.querySelectorAll('.refGift');
    if(gifts.length>=4){
      const labels=['장미 1송이','장미 50송이','장미 100송이','선물 상자'];
      gifts.forEach((g,i)=>{if(i<4){const strong=g.querySelector('strong');if(strong)strong.innerHTML='<span class="giftPhoto giftPhoto'+i+'"></span>';const b=g.querySelector('b');if(b)b.textContent=labels[i];}});
    }
    const rewards=document.querySelectorAll('.refReward i');
    const likes=['♥ 3,000','♥ 6,000','♥ 9,000','♥ 12,000','♥ 15,000'];
    rewards.forEach((el,i)=>{if(i<5)el.innerHTML='<b>'+likes[i]+'</b><span class="giftPhoto giftPhoto0"></span><span class="rewardText">지급 완료</span>';});
  }
  applyApprovedGifts();
  new MutationObserver(applyApprovedGifts).observe(document.getElementById('screen'),{childList:true,subtree:true});
})();
</script>
</body>
</html>
