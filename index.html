<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>K-Talk LIVE</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:Arial,'Noto Sans KR',sans-serif}body{overflow:hidden}button,input{font:inherit}.feed{height:100dvh;overflow-y:auto;scroll-snap-type:y mandatory}.page{height:100dvh;scroll-snap-align:start;overflow:hidden;padding:7px 7px 60px;background:#020204}.female{--host:url('./female-host.svg')}.male{--host:url('./male-host.svg')}.top{height:82px;display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:start}.profile{display:flex;gap:7px;align-items:center;min-width:0;padding-top:4px}.avatar{width:46px;height:46px;flex:0 0 46px;border-radius:50%;border:2px solid #e8a437;background-image:var(--host);background-size:cover;background-position:center}.profileText{min-width:0}.profileLine{display:flex;gap:6px;align-items:center;font-weight:900;font-size:14px;white-space:nowrap}.live{background:#ed1549;padding:4px 7px;border-radius:6px;font-size:10px}.roomType{font-size:10px;color:#ddd;margin-top:4px}.headTools{display:flex;gap:5px}.attendance,.treasure{height:76px;border:1px solid #ff4dc7;border-radius:11px;background:#09050b;text-align:center;padding:5px 8px;box-shadow:0 0 12px #9f26ff66}.attendance{min-width:126px}.treasure{min-width:88px;border-color:#d99a2c}.attendance b,.treasure b{display:block;font-size:10px}.attendance strong{display:block;font-size:23px;line-height:1.1;margin:4px 0}.attendance small,.treasure small{font-size:9px;color:#ddd}.treasure strong{display:block;font-size:23px;line-height:1.1;margin:3px 0}.rightTop{display:flex;justify-content:flex-end;align-items:flex-start;gap:8px;padding-top:3px}.mini{border:0;background:transparent;color:#fff;text-align:center;font-size:21px;min-width:40px;padding:0}.mini small{display:block;font-size:8px}.viewer{font-weight:900;font-size:13px;white-space:nowrap;margin-top:37px}.led{height:44px;width:58%;margin:0 auto 5px;border:1px solid #d84cff;border-radius:11px;background:#08040c;color:#ffb52d;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;box-shadow:0 0 13px #b731ff88;white-space:nowrap;overflow:hidden}.status{height:31px;display:grid;grid-template-columns:1.15fr 1fr 1.35fr 1.55fr .65fr;border:1px solid #ff4dc755;border-radius:7px;background:#050407;margin-bottom:5px;font-size:9px;text-align:center;align-items:center}.status span{padding:0 3px;border-right:1px solid #ffffff1a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status span:last-child{border-right:0}.main{height:calc(100dvh - 229px);display:grid;grid-template-columns:minmax(0,1.92fr) minmax(0,1.08fr);gap:5px}.leftcol,.rightcol{display:grid;gap:5px;min-height:0}.leftcol{grid-template-rows:minmax(0,1fr) 182px}.rightcol{grid-template-rows:minmax(0,1fr) 124px}.video{position:relative;min-height:0;border:1px solid #ff4dc755;border-radius:9px;overflow:hidden;background:#08070a var(--host) center top/contain no-repeat}.videoBadge{position:absolute;right:9px;top:9px;font-weight:900;font-size:13px}.hello{position:absolute;left:13px;top:17px;border:1px solid #c94cff;border-radius:50%;padding:12px 9px;color:#f1a6ff;font-style:italic;box-shadow:0 0 10px #b731ff66}.notes{position:absolute;right:14px;top:62px;color:#f232ff;font-size:25px;line-height:1.8}.wave{position:absolute;left:16px;right:65px;bottom:10px;height:28px;display:flex;align-items:end;gap:2px}.wave i{flex:1;min-width:2px;border-radius:2px;background:linear-gradient(#f0f,#0af,#0f8,#ff0,#f30);animation:w .9s ease-in-out infinite alternate}.wave i:nth-child(3n){height:55%}.wave i:nth-child(3n+1){height:90%}.wave i:nth-child(3n+2){height:35%}@keyframes w{from{transform:scaleY(.45)}to{transform:scaleY(1)}}.camIcon{position:absolute;right:9px;bottom:8px;width:38px;height:38px;border:1px solid #fff8;border-radius:50%;display:grid;place-items:center;background:#0009}.chatbox,.giftpanel,.notice{border:1px solid #ff4dc755;border-radius:9px;background:#050507;overflow:hidden}.messages{height:134px;overflow:auto;padding:7px 9px;font-size:10px;line-height:1.46}.messages .admin{color:#ffd55c}.messages .u{color:#6be6ff}.composer{height:48px;display:flex;gap:5px;padding:5px;border-top:1px solid #ffffff18}.composer input{min-width:0;flex:1;border:1px solid #ffffff2d;border-radius:6px;background:#0b0a0d;color:#fff;padding:0 8px;font-size:10px}.composer button{border:0;border-radius:6px;background:#7b18df;color:#fff;font-weight:900;padding:0 12px}.giftpanel{padding:6px}.giftTitle{height:29px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:11px}.giftTitle em{font-style:normal;color:#ffd331;font-size:9px;margin-left:5px}.giftgrid{height:calc(100% - 29px);display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(5,minmax(0,1fr));gap:4px}.gift{border:1px solid #ffffff27;border-radius:7px;background:#09090d;color:#fff;min-height:0;overflow:hidden;padding:3px 2px;font-size:23px}.gift small{display:block;font-size:9px;line-height:1.15;margin-top:1px}.gift .cost{color:#ffd95b}.notice{padding:8px;font-size:9px;line-height:1.5}.notice b{display:block;color:#c777ff;font-size:12px;margin-bottom:4px}.nav{position:fixed;z-index:20;bottom:0;left:0;right:0;height:58px;background:#030305f7;border-top:1px solid #ffffff18;display:grid;grid-template-columns:repeat(5,1fr);align-items:center}.nav button{height:58px;border:0;background:transparent;color:#ddd;font-size:8px}.nav strong{display:block;font-size:18px;line-height:1.05}.plusBtn{width:58px!important;height:43px!important;border-radius:13px;background:#fff!important;color:#111!important;font-size:32px!important;margin:auto;box-shadow:inset 6px 0 #20d5ec,inset -6px 0 #fe2c55}.sheet{display:none;position:fixed;z-index:40;inset:0;background:#000}.sheet.open{display:block}.camera{position:relative;width:100%;height:100%}.cameraVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#111}.cameraFallback{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px}.close{position:absolute;z-index:5;top:12px;left:12px;width:44px;height:44px;border:0;border-radius:50%;background:#0009;color:#fff;font-size:28px}.toolRail{position:absolute;z-index:5;right:12px;top:72px;display:grid;gap:8px}.toolBtn{width:58px;min-height:48px;border:0;border-radius:15px;background:#0009;color:#fff;font-size:11px}.controls{position:absolute;z-index:5;left:0;right:0;bottom:18px;text-align:center}.capture{width:66px;height:66px;border-radius:50%;border:5px solid #fff;background:#ef3340}.rooms{padding:10px}.rooms .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.room{min-height:58px;border:1px solid #ffffff55;background:#000b;color:#fff;border-radius:12px;font-weight:900;font-size:13px}.roomView{display:none;position:fixed;z-index:60;inset:0;background:#050308;padding:14px;overflow:auto}.roomView.open{display:block}.roomHead{display:flex;align-items:center;gap:10px;margin-bottom:12px}.roomBack{width:44px;height:44px;border:0;border-radius:50%;background:#21162c;color:#fff;font-size:24px}.roomHead h2{margin:0;font-size:20px}.roomCard{border:1px solid #ff4dc755;border-radius:14px;background:#0b0711;padding:12px}.roomPreview{min-height:300px;border:1px solid #8d39e9;border-radius:12px;background:linear-gradient(180deg,#241133,#08050d);display:grid;place-items:center;text-align:center;padding:16px}.roomPreview strong{font-size:24px}.roomPreview p{color:#ddd}.slotGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:100%;margin-top:9px}.slot{aspect-ratio:1/1;border:1px solid #ffffff2d;border-radius:8px;background:#130d18;display:grid;place-items:center;font-size:10px}.secretInput{width:100%;height:44px;border:1px solid #ffffff35;border-radius:9px;background:#08060b;color:#fff;padding:0 12px;margin-top:10px}.roomActions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.roomActions button{height:46px;border:0;border-radius:10px;color:#fff;font-weight:900}.createRoom{background:#7c17df}.enterRoom{background:#e51c72}.roomMsg{min-height:26px;margin-top:8px;text-align:center;color:#ffd95b;font-weight:800}@media(max-width:600px){.page{padding:5px 5px 58px}.top{height:78px;grid-template-columns:minmax(91px,1fr) auto minmax(69px,1fr);gap:4px}.avatar{width:39px;height:39px;flex-basis:39px}.profile{gap:5px}.profileLine{font-size:10px;gap:4px}.live{font-size:8px;padding:3px 5px}.roomType{font-size:8px}.attendance,.treasure{height:71px;padding:4px 5px}.attendance{min-width:112px}.treasure{min-width:75px}.attendance strong{font-size:21px}.treasure strong{font-size:20px}.rightTop{gap:2px}.mini{font-size:17px;min-width:30px}.viewer{font-size:10px;margin-top:34px}.led{height:40px;width:56%;font-size:12px;margin-bottom:4px}.status{height:28px;font-size:7px;margin-bottom:4px}.main{height:calc(100dvh - 212px);grid-template-columns:minmax(0,1.82fr) minmax(0,1.18fr);gap:4px}.leftcol,.rightcol{gap:4px}.leftcol{grid-template-rows:minmax(0,1fr) 158px}.rightcol{grid-template-rows:minmax(0,1fr) 104px}.video{background-size:contain;background-position:center top}.messages{height:114px;font-size:8.5px;padding:5px 6px}.composer{height:44px;padding:4px}.composer input{font-size:9px}.composer button{font-size:10px;padding:0 9px}.giftpanel{padding:4px}.giftTitle{height:25px;font-size:9px}.giftTitle em{font-size:7px}.giftgrid{height:calc(100% - 25px);gap:3px}.gift{font-size:18px}.gift small{font-size:7.5px}.notice{font-size:7.5px;padding:5px;line-height:1.42}.notice b{font-size:9px}.hello{font-size:10px;padding:9px 7px}.notes{font-size:18px;right:8px}.videoBadge{font-size:10px}.wave{left:9px;right:48px;height:23px}.camIcon{width:31px;height:31px}.nav{height:56px}.nav button{height:56px}.roomView{padding:10px}.roomPreview{min-height:330px}}@media(max-width:390px){.top{grid-template-columns:minmax(86px,1fr) auto minmax(62px,1fr)}.attendance{min-width:104px}.treasure{min-width:70px}.led{width:56%;font-size:11px}.main{grid-template-columns:minmax(0,1.78fr) minmax(0,1.22fr)}.leftcol{grid-template-rows:minmax(0,1fr) 152px}.rightcol{grid-template-rows:minmax(0,1fr) 100px}.messages{height:108px}.gift small{font-size:7px}}</style></head><body><main class="feed" id="feed"></main><nav class="nav"><button><strong>⌂</strong>홈</button><button><strong>♧</strong>친구</button><button class="plusBtn" id="plusBtn">＋</button><button><strong>♧</strong>알림</button><button><strong>♙</strong>프로필</button></nav><section class="sheet" id="sheet"><div class="camera"><video id="cameraVideo" class="cameraVideo" autoplay playsinline muted></video><div class="cameraFallback" id="cameraFallback">카메라를 켜는 중입니다.</div><button class="close" id="close">×</button><div class="toolRail"><button class="toolBtn">✨<br>보정</button><button class="toolBtn">🖼️<br>배경</button><button class="toolBtn" id="flip">↻<br>전환</button></div><div class="controls"><button class="capture" aria-label="촬영"></button><div class="rooms"><div class="grid"><button class="room" data-room="solo">🎙️<br>1인 방송</button><button class="room" data-room="group13">👥<br>13명 방송</button><button class="room" data-room="vip">👑<br>VIP 방송</button><button class="room" data-room="secret">🔒<br>비밀방</button><button class="room" data-room="movie">🎬<br>영화방</button><button class="room" data-room="dj">🎧<br>DJ방</button></div></div></div></div></section><section class="roomView" id="roomView"><div class="roomHead"><button class="roomBack" id="roomBack">←</button><h2 id="roomTitle">방송방</h2></div><div class="roomCard"><div class="roomPreview" id="roomPreview"></div><div id="secretWrap"></div><div class="roomActions"><button class="createRoom" id="createRoom">방 만들기</button><button class="enterRoom" id="enterRoom">입장하기</button></div><div class="roomMsg" id="roomMsg"></div></div></section><script>const rooms=[{cls:'female',gender:'female',name:'소라',viewer:125,msg:['관리자 : 방송에 오신 여러분 환영합니다! 💜','민수는 1위~ : 즐겁게 듣고 있어요! ❤️','지수 : 목소리 너무 좋아요 👍','이태훈 : 신청곡 이벤트도 최고! 🎵','소라팬 : 우와~ 노래 최고예요! 👏','강민수 : 추천곡~ 늘 믿고있어요 😍','쭈이 : 즐거운 방송 감사합니다! 😊']},{cls:'male',gender:'female2',name:'유리',viewer:98,msg:['관리자 : 방송에 오신 여러분 환영합니다! 💜','민수는 1위~ : 즐겁게 듣고 있어요! ❤️','지수 : 목소리 너무 좋아요 👍','이태훈 : 신청곡 이벤트도 최고! 🎵','유리팬 : 우와~ 노래 최고예요! 👏','강민수 : 추천곡~ 늘 믿고있어요 😍','쭈이 : 즐거운 방송 감사합니다! 😊']}];const feed=document.getElementById('feed');function giftPanel(){return `<div class="giftpanel"><div class="giftTitle">장미 선물 <em>(장미 1송이 = 30원)</em></div><div class="giftgrid"><button class="gift">⭐<small>별</small><small class="cost">장미 5송이</small></button><button class="gift">🎈<small>풍선</small><small class="cost">장미 5송이</small></button><button class="gift">🌹<small>1송이</small></button><button class="gift">💐<small>5송이</small></button><button class="gift">💐<small>10송이</small></button><button class="gift">🌹<small>50송이</small></button><button class="gift">🌹<small>100송이</small></button><button class="gift">💗<small>하트 (출석체크 전용)</small><small class="cost">장미 2송이</small></button><button class="gift">🎁<small>선물상자</small></button><button class="gift">🎰<small>제비뽑기</small></button></div></div>`}rooms.forEach((r,i)=>{const sec=document.createElement('section');sec.className='page '+r.cls;sec.dataset.gender=r.gender;const id=i?'yuri':'sora';sec.innerHTML=`<div class="top"><div class="profile"><div class="avatar"></div><div class="profileText"><div class="profileLine"><span>AI ${r.name}</span><span class="live">LIVE</span></div><div class="roomType">1인 방송</div></div></div><div class="headTools"><div class="attendance"><b>오늘의 출석체크</b><strong>0/3</strong><small>출석체크</small></div><div class="treasure"><b>보물상자</b><strong>🎁</strong><small>02:35</small></div></div><div class="rightTop"><button class="mini">🎆<small>00:30</small></button><button class="mini">📢<small>공지</small></button><span class="viewer">👤 ${r.viewer}</span></div></div><div class="led">방송에 오신 여러분 환영합니다! ★ 🎵</div><div class="status"><span>🔴 ON AIR 02:35:48</span><span>👑 출석체크</span><span>🎵 신청곡 5,000원</span><span>★ 광고 문의 환영합니다</span><span>👤 ${r.viewer}</span></div><div class="main"><div class="leftcol"><div class="video"><div class="hello">hello</div><div class="videoBadge">👤 ${r.viewer}</div><div class="notes">♫<br>♪</div><div class="wave">${'<i></i>'.repeat(36)}</div><div class="camIcon">◉</div></div><div class="chatbox"><div class="messages" id="${id}Messages">${r.msg.map((m,n)=>`<div class="${n===0?'admin':'u'}">${m}</div>`).join('')}</div><div class="composer"><input id="${id}Input" placeholder="메시지를 입력하세요..." autocomplete="off"><button id="${id}Send">전송</button></div></div></div><div class="rightcol">${giftPanel()}<div class="notice"><b>📢 공지사항</b>1인 방송은 하루 3번 참여 가능합니다.<br>신청곡은 하루 2번(아침/저녁) 가능합니다.<br>선물은 호스트에게 큰 힘이 됩니다! 🥰</div></div></div>`;feed.appendChild(sec)});let voices=[];const nickname='대표';function loadVoices(){if('speechSynthesis'in window)voices=speechSynthesis.getVoices()}if('speechSynthesis'in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}function speakText(text,gender){if(!('speechSynthesis'in window))return;const ko=(voices.length?voices:speechSynthesis.getVoices()).filter(v=>String(v.lang||'').toLowerCase().startsWith('ko'));const u=new SpeechSynthesisUtterance(text);u.voice=gender==='female2'?(ko[1]||ko[0]||null):(ko[0]||null);u.lang='ko-KR';u.volume=1;u.pitch=gender==='female2'?.92:1.08;u.rate=gender==='female2'?.86:.94;speechSynthesis.cancel();speechSynthesis.speak(u)}function replyFor(text){const t=text.replace(/\s+/g,'');if(t.includes('음악')||t.includes('노래'))return '대표님, 어떤 음악이나 노래를 듣고 싶으세요? 제목을 말씀해 주세요.';if(t.includes('안녕'))return '안녕하세요. 대표님, 오늘 방송도 즐겁게 봐주세요.';if(t.includes('반가'))return '저도 반갑습니다. 대표님.';if(t.includes('고마워')||t.includes('감사'))return '네, 대표님. 감사합니다.';return '대표님, 무슨 뜻인지 조금 더 자세히 말씀해 주세요.'}function wire(id,host,gender){const input=document.getElementById(id+'Input'),send=document.getElementById(id+'Send'),box=document.getElementById(id+'Messages');send.onclick=e=>{e.preventDefault();const text=input.value.trim();if(!text)return;box.innerHTML+=`<div>${nickname}: ${text}</div>`;input.value='';const reply=replyFor(text);box.innerHTML+=`<div>${host}: ${reply}</div>`;box.scrollTop=box.scrollHeight;speakText(reply,gender)};input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();send.click()}})}wire('sora','소라','female');wire('yuri','유리','female2');const sheet=document.getElementById('sheet'),video=document.getElementById('cameraVideo'),fallback=document.getElementById('cameraFallback');let stream=null,facing='user';async function startCamera(){if(!navigator.mediaDevices?.getUserMedia){fallback.textContent='이 브라우저에서는 카메라 미리보기를 지원하지 않습니다.';return}if(stream)stream.getTracks().forEach(t=>t.stop());try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing},audio:false});video.srcObject=stream;fallback.style.display='none'}catch(e){fallback.style.display='grid';fallback.textContent='카메라 권한을 허용해 주세요.'}}function stopCamera(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;video.srcObject=null;fallback.style.display='grid'}document.getElementById('plusBtn').onclick=()=>{sheet.classList.add('open');startCamera()};document.getElementById('close').onclick=()=>{sheet.classList.remove('open');stopCamera()};document.getElementById('flip').onclick=async()=>{facing=facing==='user'?'environment':'user';await startCamera()};const roomInfo={solo:{title:'1인 방송',icon:'🎙️',desc:'호스트 1명이 진행하는 방송입니다.'},group13:{title:'13명 방송',icon:'👥',desc:'호스트 1명 + 게스트 12명이 함께하는 방입니다.'},vip:{title:'VIP 방송',icon:'👑',desc:'VIP 회원을 위한 방송입니다.'},secret:{title:'비밀방',icon:'🔒',desc:'비밀번호를 입력해서 들어가는 비밀방입니다.'},movie:{title:'영화방',icon:'🎬',desc:'함께 영상을 보는 영화방입니다.'},dj:{title:'DJ방',icon:'🎧',desc:'음악과 신청곡을 함께 즐기는 DJ방입니다.'}};let currentRoom='solo';const roomView=document.getElementById('roomView'),roomTitle=document.getElementById('roomTitle'),roomPreview=document.getElementById('roomPreview'),secretWrap=document.getElementById('secretWrap'),roomMsg=document.getElementById('roomMsg');function openRoom(type){currentRoom=type;const r=roomInfo[type];roomTitle.textContent=r.icon+' '+r.title;let extra='';if(type==='group13')extra=`<div class="slotGrid">${Array.from({length:13},(_,i)=>`<div class="slot">${i===0?'호스트':'게스트 '+i}</div>`).join('')}</div>`;roomPreview.innerHTML=`<div><strong>${r.icon} ${r.title}</strong><p>${r.desc}</p>${extra}</div>`;secretWrap.innerHTML=type==='secret'?'<input class="secretInput" id="secretPassword" type="password" placeholder="비밀번호를 입력하세요">':'';roomMsg.textContent='';sheet.classList.remove('open');stopCamera();roomView.classList.add('open')}document.querySelectorAll('.room').forEach(btn=>btn.onclick=()=>openRoom(btn.dataset.room));document.getElementById('roomBack').onclick=()=>roomView.classList.remove('open');document.getElementById('createRoom').onclick=()=>{roomMsg.textContent=roomInfo[currentRoom].title+' 만들기 화면이 열렸습니다.'};document.getElementById('enterRoom').onclick=()=>{if(currentRoom==='secret'){const pw=document.getElementById('secretPassword')?.value.trim();if(!pw){roomMsg.textContent='비밀번호를 입력해 주세요.';return}}roomMsg.textContent=roomInfo[currentRoom].title+'에 입장했습니다.'};</script></body></html>
