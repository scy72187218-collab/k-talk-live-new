<script>
(function(){
 const originalFriends=window.friends,originalProfile=window.openProfile,originalMenu=window.openMenu;
 function leaveDash(){document.body.classList.remove('kt-home')}

 window.openCreator=function(){
   creator.classList.add('show');
   const live=state.stream&&state.stream.getTracks&&state.stream.getTracks().some(t=>t.readyState==='live');
   if(live){camera.srcObject=state.stream;creator.classList.add('camera-on');camera.play().catch(()=>{});}
 };
 window.closeCreator=function(){creator.classList.remove('show');if(state.stream){state.stream.getTracks().forEach(t=>t.stop());state.stream=null;camera.srcObject=null;}};
 window.startBroadcast=async function(){
   if(window.ensureLiveCamera)await ensureLiveCamera(state.cameraFacing||'user');
 };
 window.openRoomPrep=function(name,max){document.getElementById('liveTitle').value=name+' · 최대 '+max+'명';openCreator();};
 window.openLiveRoom=function(){showSheet('라이브룸','<div class="aux-grid"><button class="aux-card" onclick="closeSheet();openRoomPrep(\'일반 13명방\',13)"><b>👥 일반 13명방</b><small>최대 13명</small></button><button class="aux-card" onclick="closeSheet();openRoomPrep(\'1인 방송\',1)"><b>🎙️ 1인 방송</b><small>나만의 방송</small></button><button class="aux-card" onclick="closeSheet();openRoomPrep(\'비밀방\',7)"><b>🔒 비밀방</b><small>호스트 1 + 게스트 6</small></button><button class="aux-card" onclick="closeSheet();openRoomPrep(\'구독자 전용방\',10)"><b>👑 구독자 전용방</b><small>최대 10명</small></button></div>');};
 window.openProfileVideos=function(){leaveDash();if(originalProfile)originalProfile();};
 window.openMatch=function(){showSheet('🏆 매치전','<div class="note">주간 랭킹 매치전 화면입니다.</div>');};

 window.openDashboard=function(){document.body.classList.add('kt-home');screen.innerHTML=`<section class="kt-dashboard"><div class="kt-dash-top"><div class="kt-dash-logo"><span class="crown">♛</span> <span class="talk">K-Talk</span> <span class="liveword">LIVE</span></div><div class="kt-dash-actions"><button class="kt-pill coin" onclick="openCharge()">🪙 코인 1,250 ＋</button><button class="kt-pill vip" onclick="openSubs()">💎 VIP</button><button class="kt-iconbtn" onclick="openMessages()">🔔</button></div></div><button onclick="needJoin('K-Talk 가입/로그인을 진행해 주세요.')" style="width:100%;margin:0 0 14px;padding:15px 18px;border-radius:18px;border:2px solid #ff62cf;background:linear-gradient(135deg,#54105f,#e82891 55%,#763dff);color:#fff;font-size:18px;font-weight:950;box-shadow:0 0 20px #ff40c766,inset 0 0 18px #ffffff18">👤 가입 / 로그인</button><div class="kt-notice"><div class="kt-notice-row"><div class="kt-notice-icon">📣</div><div class="kt-notice-copy"><b>공지 · 장미 100송이 선물!</b><span>오늘의 매치전 1등 상금 500코인! 도전하세요! 🏆</span></div></div></div><div class="kt-room-grid"><button class="kt-room purple" onclick="openRoomPrep('일반 13명방',13)"><span class="ri">👥</span><b>일반 13명방</b><small>최대 13명<br>다양한 사람들과 즐겁게!</small><span class="enter">입장하기 ›</span></button><button class="kt-room pink" onclick="openRoomPrep('1인 방송',1)"><span class="ri">🎙️</span><b>1인 방송</b><small>나만의 방송<br>지금 시작해보세요!</small><span class="enter">입장하기 ›</span></button><button class="kt-room gold" onclick="openRoomPrep('비밀방',7)"><span class="ri">🔒</span><b>비밀방</b><small>호스트 1 + 게스트 6<br>비밀번호로 입장!</small><span class="enter">입장하기 ›</span></button><button class="kt-room blue" onclick="openRoomPrep('구독자 전용방',10)"><span class="ri">♛</span><b>구독자 전용방</b><small>구독자만 입장 가능<br>최대 10명 입장</small><span class="enter">입장하기 ›</span></button><button class="kt-room green" onclick="openMatch()"><span class="ri">🏆</span><b>매치전</b><small>주간 랭킹 경쟁!<br>상위 랭커 도전하세요!</small><span class="enter">바로가기 ›</span></button><button class="kt-room cyan" onclick="openProfileVideos()"><span class="ri">🎬</span><b>내 프로필 동영상</b><small>내가 올린 쇼츠/영상<br>프로필에서 확인하세요!</small><span class="enter">바로가기 ›</span></button></div><div class="kt-shortcuts" style="grid-template-columns:repeat(2,1fr)"><button class="kt-short purple" onclick="openRaffle()"><strong>🎡</strong><b>제비뽑기</b><small>하루 2~3회<br>장미 당첨!</small></button><button class="kt-short pink" onclick="openGifts()"><strong>🎁</strong><b>선물하기</b><small>다양한 선물로<br>마음을 전하세요</small></button></div><div class="kt-wide"><button class="blue" onclick="home();activate('shorts')"><b>▣ 쇼츠 올리기</b><small>쇼츠 · 상품/광고 등록 가능</small></button><button class="gold" onclick="openCharge()"><b>🪙 코인 충전</b><small>100개부터 충전 가능</small></button></div></section><nav class="kt-bottom"><button class="homebtn" onclick="home()"><b>⌂</b>홈</button><button onclick="openBroadcastList()"><b>▣</b>방송목록</button><button class="livebtn" onclick="openCreator()"><b>＋</b>라이브룸</button><button onclick="openMessages()"><b>☵</b>채팅</button><button onclick="openProfile()"><b>♙</b>마이페이지</button></nav>`;};
 function showVideoHome(label){leaveDash();screen.innerHTML=`<section class="video-home"><video id="homeVideo" autoplay muted loop playsinline controls poster="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=900&q=80"><source src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4" type="video/mp4"></video><div class="vh-shade"></div><div class="vh-title"><b>♛ K-Talk</b><span>${label||'추천 동영상'} · 화면을 눌러 재생하거나 멈출 수 있습니다.</span></div><div class="vh-actions"><button onclick="needJoin('좋아요를 누르려면 가입해 주세요.')">♡<small>좋아요</small></button><button onclick="openComments()">💬<small>댓글</small></button><button onclick="openGifts()">🎁<small>선물</small></button><button onclick="shareApp()">↗<small>공유</small></button></div></section>`;const v=document.getElementById('homeVideo');if(v)v.play().catch(()=>{});}
 window.home=function(){activate('home');showVideoHome('추천 동영상')};
 window.media=function(type){activate(type);showVideoHome(type==='shorts'?'쇼츠':'동영상')};
 function applyApprovedGifts(){const gifts=document.querySelectorAll('.refGift');if(gifts.length>=4){const labels=['장미 1송이','장미 50송이','장미 100송이','보물상자'];gifts.forEach((g,i)=>{if(i<4){const strong=g.querySelector('strong');if(strong)strong.innerHTML='<span class="giftPhoto giftPhoto'+i+'"></span>';const b=g.querySelector('b');if(b)b.textContent=labels[i];}});}const rewards=document.querySelectorAll('.refReward i');const likes=['♥ 3,000','♥ 6,000','♥ 9,000','♥ 12,000','♥ 15,000'];rewards.forEach((el,i)=>{if(i<5)el.innerHTML='<b>'+likes[i]+'</b><span class="giftPhoto giftPhoto0"></span><span class="rewardText">지급 완료</span>';});}
 new MutationObserver(applyApprovedGifts).observe(screen,{childList:true,subtree:true});

<!-- KTALK_HOST_EARNINGS_V3 -->
<script>
(function(){
  var ROSE_WON=30;
  var session={active:false,start:0,roses:0,gifts:0,title:'',memberType:'general',rate:0.35};

  function money(n){return Math.round(n||0).toLocaleString('ko-KR')+'원';}
  function total(){return session.roses*ROSE_WON;}
  function currentMemberType(){
    try{
      var saved=localStorage.getItem('ktalk_member_type');
      if(saved==='subscriber')return 'subscriber';
    }catch(e){}
    if(window.state){
      if(state.memberType==='subscriber'||state.subscribed===true||state.subscriptionActive===true)return 'subscriber';
    }
    return 'general';
  }
  function rateFor(type){return type==='subscriber'?0.40:0.35;}
  function labelFor(type){return type==='subscriber'?'구독자':'일반회원';}
  function hostNet(){return Math.round(total()*session.rate);}

  window.setKTalkMemberType=function(type){
    var v=type==='subscriber'?'subscriber':'general';
    try{localStorage.setItem('ktalk_member_type',v);}catch(e){}
    if(window.state)state.memberType=v;
    return v;
  };

  function updateEarn(){
    var a=document.getElementById('earnNet'),b=document.getElementById('earnRoses'),r=document.getElementById('earnRate');
    if(a)a.textContent=money(hostNet());
    if(b)b.textContent=session.roses.toLocaleString('ko-KR')+'송이';
    if(r)r.textContent=labelFor(session.memberType)+' · '+Math.round(session.rate*100)+'%';
  }

  window.startBroadcast=function(){
    var t=document.getElementById('liveTitle');
    var memberType=currentMemberType();
    session={
      active:true,
      start:Date.now(),
      roses:0,
      gifts:0,
      title:t&&t.value?t.value:'K-Talk LIVE',
      memberType:memberType,
      rate:rateFor(memberType)
    };
    if(window.closeCreator)window.closeCreator();
    document.body.classList.remove('kt-home');
    screen.innerHTML='<section style="height:100%;padding:14px;color:#fff;background:linear-gradient(180deg,#120b1c,#030305)">'
      +'<div style="display:flex;justify-content:space-between;align-items:center;padding:12px;border:1px solid #ffffff22;border-radius:16px"><b>🔴 '+session.title+'</b><span style="color:#ff6788;font-weight:900">방송 중</span></div>'
      +'<div style="margin-top:12px;padding:18px;border-radius:20px;background:#ffffff0b;border:1px solid #ffffff18"><small style="color:#bbb">지금까지 내가 번 돈</small><div id="earnNet" style="font-size:34px;font-weight:950;color:#ffe075;margin-top:6px">0원</div><div id="earnRate" style="margin-top:5px;color:#8fe8ff;font-weight:900"></div><div style="margin-top:10px">🌹 받은 장미 <b id="earnRoses">0송이</b></div></div>'
      +'<div style="height:48%;min-height:190px;margin-top:12px;border-radius:22px;display:grid;place-items:center;font-size:78px;background:radial-gradient(circle,#532061,#12101a 55%,#08080c)">🎙️</div>'
      +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px">'
      +'<button onclick="openGifts()" style="padding:15px;border:1px solid #ffd86b66;border-radius:17px;background:linear-gradient(135deg,#332707,#7a5310);color:#ffe075;font-weight:950;font-size:16px">🎁 선물</button>'
      +'<button onclick="endBroadcastEarnings()" style="padding:15px;border:0;border-radius:17px;background:linear-gradient(135deg,#ff315f,#ff4e91);color:#fff;font-weight:950;font-size:17px">■ 방송 종료</button>'
      +'</div>'
      +'</section>';
    updateEarn();
  };

  var oldGiftSend=window.giftSend;
  window.giftSend=function(name,cost){
    var n=parseInt(String(cost).replace(/,/g,''),10)||0;
    if(session.active&&n>0){session.roses+=n;session.gifts++;updateEarn();}
    if(oldGiftSend)oldGiftSend(name,cost);
  };

  function currentMemberKey(){
    var key='local-member';
    try{
      if(window.state){
        key=state.userId||state.memberId||state.uid||key;
      }
      if(key==='local-member'){
        key=localStorage.getItem('ktalk_member_key')||key;
        if(key==='local-member'){
          key='member-'+Math.random().toString(36).slice(2,10);
          localStorage.setItem('ktalk_member_key',key);
        }
      }
    }catch(e){}
    return String(key);
  }

  function saveMyLastEarnings(summary){
    try{
      localStorage.setItem('ktalk_last_earnings_'+currentMemberKey(),JSON.stringify(summary));
    }catch(e){}
  }

  window.endBroadcastEarnings=function(){
    if(!session.active)return;
    var gross=total(), mine=hostNet(), ratePct=Math.round(session.rate*100);
    var summary={
      memberKey:currentMemberKey(),
      endedAt:Date.now(),
      memberType:session.memberType,
      roses:session.roses,
      gross:gross,
      rate:ratePct,
      mine:mine
    };
    saveMyLastEarnings(summary);
    session.active=false;
    showSheet('💰 방송 종료 · 내 수익',
      '<div class="rowbox" style="text-align:center;border:2px solid #ffd85a88;background:#3a2b071f;padding:20px 12px">'
      +'<div style="font-size:15px;color:#fff3b0;font-weight:900">회사 수수료 차감 후</div>'
      +'<div style="margin-top:5px;font-size:16px;font-weight:950;color:#ffe075">내가 받는 금액</div>'
      +'<div style="margin-top:8px;font-size:40px;font-weight:950;color:#ffe075">'+money(summary.mine)+'</div>'
      +'</div>'
      +'<div class="rowbox"><b>🌹 받은 장미</b><br>'+summary.roses.toLocaleString('ko-KR')+'송이 × 30원</div>'
      +'<div class="rowbox"><b>회원 구분 · 내 정산율</b><br>'+labelFor(summary.memberType)+' · '+summary.rate+'%</div>'
      +'<div class="note">방송을 끝내는 즉시 본인 화면에 표시됩니다. 일반회원은 총 선물금액의 35%, 구독자는 40%가 본인 수익으로 계산됩니다.</div>'
      +'<button class="act" onclick="closeSheet();home()">확인</button>'
    );
  };
})();
</script>
