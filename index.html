)=>openRoom(btn.dataset.room));document.getElementById('roomBack').onclick=()=>roomView.classList.remove('open');document.getElementById('createRoom').onclick=()=>{roomMsg.textContent=roomInfo[currentRoom].title+' 만들기 화면이 열렸습니다.'};document.getElementById('enterRoom').onclick=()=>{if(currentRoom==='secret'){const pw=document.getElementById('secretPassword')?.value.trim();if(!pw){roomMsg.textContent='비밀번호를 입력해 주세요.';return}}roomMsg.textContent=roomInfo[currentRoom].title+'에 입장했습니다.'};</script></body></html>
