<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>K-Talk LIVE</title><style>*{box-sizing:border-box}html,body{margin:0;background:#000;color:#fff;font-family:Arial,'Noto Sans KR',sans-serif;overflow:hidden}button,input{font:inherit}.feed{height:100dvh;overflow-y:auto;scroll-snap-type:y mandatory}.page{height:100dvh;scroll-snap-align:start;position:relative;overflow:hidden;background:#07050a}.photo{position:absolute;inset:0 0 180px;background-size:cover;background-position:center top}.female .photo,.female .avatar{background-image:url('./female-host.svg')}.male .photo,.male .avatar{background-image:url('./male-host.svg')}.shade{position:absolute;inset:0;background:linear-gradient(180deg,#0006 0,#0000 44%,#000 84%)}.top{position:absolute;z-index:3;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:center}.host{display:flex;align-items:center;gap:7px;font-weight:900}.avatar{width:36px;height:36px;border-radius:50%;border:1px solid #fff;background-size:cover;background-position:center}.live{background:#ff174f;border-radius:7px;padding:5px 8px;font-size:10px}.viewer{font-size:11px}.side{position:absolute;z-index:4;right:9px;bottom:102px;display:grid;gap:7px}.gift{width:54px;min-height:55px;border:1px solid #ffffff25;border-radius:14px;background:#08080cf0;color:#fff;font-size:20px}.gift small{display:block;font-size:9px}.info{position:absolute;z-index:4;left:12px;right:72px;bottom:72px}.info h2{font-size:18px;margin:0 0 5px}.chatbox{margin-top:5px;background:#050507e8;border:1px solid #ff4dc755;border-radius:7px;overflow:hidden}.messages{height:92px;overflow:auto;padding:7px;font-size:10px;line-height:1.5}.composer{display:flex;gap:4px;padding:4px;border-top:1px solid #ffffff18}.composer input{min-width:0;flex:1;height:30px;border:1px solid #ffffff2d;border-radius:6px;background:#0b0a0ddd;color:#fff;padding:0 8px}.composer button{border:0;border-radius:6px;padding:0 10px;background:#8b39f0;color:#fff;font-weight:900}.nav{position:fixed;z-index:10;bottom:0;left:0;right:0;height:64px;background:#030305f5;border-top:1px solid #ffffff18;display:grid;grid-template-columns:repeat(5,1fr);align-items:center}.nav button{border:0;background:transparent;color:#ddd;font-size:9px;height:64px}.nav strong{display:block;font-size:18px}.plusBtn{width:54px!important;height:44px!important;border-radius:13px;background:#fff!important;color:#111!important;font-size:31px!important;margin:auto;box-shadow:inset 5px 0 #20d5ec,inset -5px 0 #fe2c55}.sheet{display:none;position:fixed;z-index:30;inset:0;background:#000}.sheet.open{display:block}.camera{position:relative;width:100%;height:100%;overflow:hidden;background:#000}.cameraVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#080808;display:block}.cameraFallback{position:absolute;inset:0;display:grid;place-items:center;color:#ddd;font-size:14px;text-align:center;padding:20px;background:#111}.cameraShade{position:absolute;inset:0;background:linear-gradient(180deg,#0007 0,#0000 28%,#0001 48%,#0009 100%);pointer-events:none}.camTop{position:absolute;z-index:4;top:0;left:0;right:0;height:58px;display:flex;align-items:center;justify-content:space-between;padding:8px 14px}.close{width:42px;height:42px;border:0;background:#0009;color:#fff;border-radius:50%;font-size:28px}.camTop b{font-size:16px;text-shadow:0 2px 5px #000}.controls{position:absolute;z-index:5;left:0;right:0;bottom:18px;padding:0 12px}.captureRow{display:flex;align-items:center;justify-content:center;gap:28px;margin-bottom:2px}.round{width:44px;height:44px;border-radius:50%;border:0;background:#111b;color:#fff;font-size:18px}.capture{width:68px;height:68px;border-radius:50%;border:5px solid #fff;background:#ef3340}.modes{display:flex;justify-content:center;gap:14px;margin:5px 0 8px}.modes button{border:0;background:none;color:#ddd;padding:5px 3px;font-size:14px;text-shadow:0 2px 4px #000}.modes .on{color:#fff;font-weight:900}.rooms h3{font-size:15px;margin:0 0 7px;text-shadow:0 2px 4px #000}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.room{min-height:60px;border:1px solid #ffffff55;background:#0008;color:#fff;border-radius:12px;font-weight:900;font-size:14px;padding:6px 3px;text-shadow:0 1px 3px #000;backdrop-filter:blur(2px)}.room span{display:block;font-size:20px;line-height:22px}.toast{display:none;position:fixed;z-index:50;left:50%;bottom:90px;transform:translateX(-50%);background:#222;padding:9px 13px;border-radius:9px}.toast.show{display:block}@media(max-height:720px){.controls{bottom:10px}.capture{width:60px;height:60px}.round{width:40px;height:40px}.modes{margin:3px 0 5px}.room{min-height:52px;font-size:12px}.room span{font-size:17px}}</style></head><body><main class="feed" id="feed"><section class="page female"><div class="photo"></div><div class="shade"></div><div class="top"><div class="host"><div class="avatar"></div><span>AI 소라</span><span class="live">● LIVE</span></div><span class="viewer">👤 125</span></div><aside class="side"><button class="gift">🌹<small>1</small></button><button class="gift">💐<small>5</small></button><button class="gift">🌹<small>10</small></button><button class="gift">🎁<small>선물</small></button></aside><div class="info"><h2>AI 소라 · 1인 방송</h2><div class="chatbox"><div class="messages">소라: 어서 오세요. 반갑습니다.<br>해피걸: 오늘 방송 좋아요 👍<br>지수: 반가워요 💕</div><div class="composer"><input placeholder="메시지 입력"><button>전송</button></div></div></div></section><section class="page male"><div class="photo"></div><div class="shade"></div><div class="top"><div class="host"><div class="avatar"></div><span>AI 준호</span><span class="live">● LIVE</span></div><span class="viewer">👤 98</span></div><aside class="side"><button class="gift">🌹<small>1</small></button><button class="gift">💐<small>5</small></button><button class="gift">🌹<small>10</small></button><button class="gift">🎁<small>선물</small></button></aside><div class="info"><h2>AI 준호 · 1인 방송</h2><div class="chatbox"><div class="messages">준호: 안녕하세요. 즐겁게 시청하세요.<br>민수: 반갑습니다 👋<br>태훈: 오늘도 왔어요 👍</div><div class="composer"><input placeholder="메시지 입력"><button>전송</button></div></div></div></section></main><nav class="nav"><button><strong>⌂</strong>홈</button><button><strong>♧</strong>친구</button><button class="plusBtn" id="plusBtn">＋</button><button><strong>▦</strong>알림</button><button><strong>♙</strong>프로필</button></nav><section class="sheet" id="sheet"><div class="camera"><video id="cameraVideo" class="cameraVideo" autoplay playsinline muted></video><div class="cameraFallback" id="cameraFallback">카메라를 켜는 중입니다.</div><div class="cameraShade"></div><div class="camTop"><button class="close" id="close">×</button><b>게시 · 촬영 · 라이브</b><div style="width:42px"></div></div><div class="controls"><div class="captureRow"><button class="round" id="flip">↻</button><button class="capture" id="capture" aria-label="촬영"></button><button class="round" id="upload">▣</button></div><div class="modes"><button data-mode="15초">15초</button><button class="on" data-mode="60초">60초</button><button data-mode="사진">사진</button><button data-mode="게시물">게시물</button></div><div class="rooms"><h3>라이브 방송</h3><div class="grid"><button class="room"><span>🎙️</span>1인 방송</button><button class="room"><span>👥</span>13명 방송</button><button class="room"><span>👑</span>VIP 방송</button><button class="room"><span>🔒</span>비밀방</button><button class="room"><span>🎬</span>영화방</button><button class="room"><span>🎧</span>DJ방</button></div></div></div></div></section><div class="toast" id="toast"></div><script>const sheet=document.getElementById('sheet'),toast=document.getElementById('toast'),video=document.getElementById('cameraVideo'),fallback=document.getElementById('cameraFallback');let stream=null,facing='user';function msg(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1200)}async function startCamera(){if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){fallback.textContent='이 브라우저에서는 카메라 미리보기를 지원하지 않습니다.';return}if(stream)stream.getTracks().forEach(t=>t.stop());try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing},audio:false});video.srcObject=stream;fallback.style.display='none'}catch(e){fallback.style.display='grid';fallback.textContent='카메라 권한을 허용하면 화면 전체에 카메라가 보입니다.'}}function stopCamera(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}video.srcObject=null;fallback.style.display='grid';fallback.textContent='카메라를 켜는 중입니다.'}plusBtn.onclick=()=>{sheet.classList.add('open');startCamera()};close.onclick=()=>{sheet.classList.remove('open');stopCamera()};document.querySelectorAll('.modes button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.modes button').forEach(x=>x.classList.remove('on'));b.classList.add('on');msg(b.dataset.mode)});capture.onclick=()=>msg('촬영 시작');upload.onclick=()=>msg('사진·동영상 올리기');flip.onclick=async()=>{facing=facing==='user'?'environment':'user';await startCamera()};document.querySelectorAll('.room').forEach(b=>b.onclick=()=>msg(b.textContent.trim()+' 선택'));</script></body></html>
