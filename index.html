ick="chat('소라','soraInput','soraSpeech','female')">보내기</button></div></div></section><section class="page male"><div class="photo"></div><div class="shade"></div><div class="top"><div class="host"><div class="avatar"></div><span>AI 준호</span><span class="ai">AI</span><span class="live">● LIVE</span></div><span class="viewer">👤 98</span></div><div class="wave" id="wave2"></div><aside class="side"><button class="gift" onclick="gift('준호','장미 1개','male')">🌹<small>1</small></button><button class="gift" onclick="gift('준호','장미 5개','male')">💐<small>5</small></button><button class="gift" onclick="gift('준호','장미 10개','male')">🌹<small>10</small></button><button class="gift" onclick="gift('준호','장미 100개','male')">💐<small>100</small></button><button class="gift" onclick="gift('준호','선물','male')">🎁<small>선물상자</small></button></aside><div class="info"><h2>AI 준호 · 1인 방송</h2><div class="speech" id="junhoSpeech">대표님, 어서 오세요. 안녕하세요. 만나서 반갑습니다.</div><div class="chat"><b>대표:</b> 반갑습니다 👍</div><div class="composer"><input id="junhoInput" placeholder="채팅을 입력하세요"><button onclick="chat('준호','junhoInput','junhoSpeech','male')">보내기</button></div></div></section></main><button class="broadcastPlus" id="broadcastPlus" aria-label="방송하기">＋</button><nav class="nav"><button class="active" id="home"><strong>⌂</strong>홈</button><button id="list"><strong>▦</strong>방송목록</button><button id="mypage"><strong>♙</strong>마이페이지</button></nav><section class="screen" id="screen"><div class="bar"><button class="back" id="back">‹</button><b id="title">방송목록</b><button class="plus" id="plus">＋</button></div><div class="body" id="body"></div></section><script>function makeWave(id){let e=document.getElementById(id);for(let n=0;n<58;n++){let i=document.createElement('i');i.style.setProperty('--h',(7+Math.random()*27)+'px');i.style.setProperty('--d',(-Math.random())+'s');e.appendChild(i)}}makeWave('wave1');makeWave('wave2');let cachedVoices=[];function loadVoices(){cachedVoices=speechSynthesis.getVoices()}if('speechSynthesis'in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}function speak(t,gender='female'){if(!('speechSynthesis'in window))return;let u=new SpeechSynthesisUtterance(t),voices=(cachedVoices.length?cachedVoices:speechSynthesis.getVoices()).filter(v=>v.lang&&v.lang.toLowerCase().startsWith('ko'));if(gender==='male'){let male=voices.find(v=>/male|man|준우|민준|인준|우진|남성|google.*한국어/i.test(v.name));u.voice=male||voices.find(v=>!/female|woman|유나|서연|여성/i.test(v.name))||voices[voices.length-1]||null;u.pitch=.45;u.rate=.9}else{let female=voices.find(v=>/female|woman|유나|서연|여성/i.test(v.name));u.voice=female||voices[0]||null;u.pitch=1.05;u.rate=.95}u.lang='ko-KR';u.volume=1;speechSynthesis.cancel();speechSynthesis.speak(u)}let nickname='대표';localStorage.setItem('ktalkNickname',nickname);function welcome(host,speechId,gender){let msg=nickname+'님, 어서 오세요. 안녕하세요. 만나서 반갑습니다.';document.getElementById(speechId).textContent=msg;speak(msg,gender)}function gift(n,g,gender){speak(n+' 방송에 '+g+' 선물이 도착했습니다. 감사합니다.',gender)}function chat(n,i,s,gender){let el=document.getElementById(i),t=el.value.trim();if(!t)return;let r=t.includes('안녕')?'반가워요.':'네, '+t+'라고 하셨네요. 같이 이야기해요.';document.getElementById(s).textContent=r;speak(r,gender);el.value=''}const screen=document.getElementById('screen'),body=document.getElementById('body'),title=document.getElementById('title'),plus=document.getElementById('plus'),broadcastPlus=document.getElementById('broadcastPlus');function openScreen(t,h,showPlus=false){title.textContent=t;body.innerHTML=h;plus.style.display=showPlus?'block':'none';screen.classList.add('open')}function openBroadcastStart(){openScreen('방송 시작','<div class="item"><h2>＋ 방송 시작</h2><p>원하는 방송 종류를 선택하는 화면으로 연결됩니다.</p></div>',false)}back.onclick=()=>screen.classList.remove('open');home.onclick=()=>{screen.classList.remove('open');feed.scrollTo({top:0,behavior:'smooth'});setTimeout(()=>welcome('소라','soraSpeech','female'),250)};list.onclick=()=>openScreen('방송목록','<div class="item"><b>● LIVE · AI 소라</b><p>여자 AI 1인 방송</p><button class="enter" onclick="go(0)">방송 보기</button></div><div class="item"><b>● LIVE · AI 준호</b><p>남자 AI 1인 방송</p><button class="enter" onclick="go(1)">방송 보기</button></div>',true);plus.onclick=openBroadcastStart;broadcastPlus.onclick=openBroadcastStart;mypage.onclick=()=>openScreen('마이페이지','<div class="item"><h2>내 홈</h2><p>닉네임: 대표</p><p>내 프로필 · 내 동영상 · 내 쇼츠 · 내 방송 기록</p></div>',false);window.go=n=>{screen.classList.remove('open');feed.scrollTo({top:n*innerHeight,behavior:'smooth'});setTimeout(()=>welcome(n===0?'소라':'준호',n===0?'soraSpeech':'junhoSpeech',n===0?'female':'male'),350)};function firstGreeting(){welcome('소라','soraSpeech','female')}if(document.readyState==='complete'){setTimeout(firstGreeting,350)}else{window.addEventListener('load',()=>setTimeout(firstGreeting,350),{once:true})}document.addEventListener('click',function unlock(){firstGreeting()},{once:true});</script></body></html>
