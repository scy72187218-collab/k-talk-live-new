<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>K-Talk LIVE · 1번 1인 방송</title>
<style>
:root{
  --gold:#ffd86e;--pink:#ff4b94;--pink2:#ff2f66;--purple:#8d5cff;
  --line:rgba(255,255,255,.12);--soft:rgba(5,5,10,.55)
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#fff;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}
button,input{font:inherit}
body{display:grid;place-items:center}
.room{
  width:min(520px,100%);height:100dvh;position:relative;overflow:hidden;
  background:
    radial-gradient(circle at 18% 18%,rgba(150,74,255,.22),transparent 30%),
    radial-gradient(circle at 84% 24%,rgba(255,128,74,.18),transparent 28%),
    linear-gradient(160deg,#251a2d,#12131d 56%,#07070b 100%);
}
.room:after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(0,0,0,.03),rgba(0,0,0,.08) 52%,rgba(0,0,0,.48) 100%)
}

/* top */
.top{
  position:absolute;z-index:5;left:18px;right:18px;top:max(16px,env(safe-area-inset-top));
  display:flex;align-items:center;gap:11px
}
.avatar{
  width:58px;height:58px;border-radius:50%;display:grid;place-items:center;
  border:2px solid #d8d8dc;background:linear-gradient(145deg,#383840,#17171b);
  font-size:20px;font-weight:950
}
.host{min-width:0}
.host b{display:block;font-size:18px;line-height:1.05;letter-spacing:-.4px}
.host small{display:block;margin-top:6px;font-size:13px;color:#eee}
.crown{color:var(--gold);margin-left:4px}
.onair{
  margin-left:auto;padding:10px 14px;border-radius:21px;background:linear-gradient(135deg,#ff365e,#ff4f96);
  font-size:14px;font-weight:950;line-height:1.05;text-align:center;box-shadow:0 0 22px rgba(255,54,94,.22)
}
.views{
  padding:10px 14px;border-radius:21px;background:rgba(4,4,9,.58);font-size:14px;white-space:nowrap
}
.close{
  width:52px;height:52px;border:0;border-radius:50%;background:rgba(5,5,10,.55);
  color:#fff;font-size:29px;line-height:1
}
.rank,.time{
  position:absolute;z-index:5;top:92px;padding:8px 12px;border-radius:999px;
  background:rgba(5,5,10,.50);backdrop-filter:blur(10px);font-size:12px
}
.rank{left:18px}.time{right:18px}

/* side */
.side{
  position:absolute;z-index:6;right:18px;bottom:340px;display:flex;flex-direction:column;gap:14px
}
.side button{
  width:58px;height:58px;border-radius:50%;border:1px solid rgba(255,255,255,.09);
  background:rgba(7,7,12,.48);color:#fff;font-size:25px;backdrop-filter:blur(10px)
}
.side small{display:block;font-size:9px;color:#ddd;margin-top:1px}

/* chat */
.chat{
  position:absolute;z-index:6;left:18px;right:95px;bottom:365px;display:grid;gap:7px
}
.msg{
  width:max-content;max-width:100%;padding:7px 11px;border-radius:999px;
  background:rgba(5,5,10,.45);backdrop-filter:blur(9px);font-size:11px
}
.msg b{margin-right:10px}
.alert{
  position:absolute;z-index:6;left:18px;right:94px;bottom:315px;
  padding:10px 12px;border-radius:14px;border:1px solid rgba(255,74,145,.36);
  background:rgba(13,8,15,.58);color:#ff75ae;font-size:11px;font-weight:900
}
.messagebar{
  position:absolute;z-index:6;left:18px;right:94px;bottom:263px;
  display:flex;align-items:center;gap:8px;padding:9px 11px;border:1px solid rgba(255,255,255,.28);
  border-radius:999px;background:rgba(5,5,9,.34);backdrop-filter:blur(9px)
}
.messagebar input{flex:1;min-width:0;border:0;outline:0;background:none;color:#fff;font-size:12px}
.messagebar button{border:0;background:none;color:#fff;font-size:21px}

/* gifts */
.giftbox{
  position:absolute;z-index:6;left:14px;right:14px;bottom:118px;padding:9px;
  border:1px solid rgba(255,255,255,.13);border-radius:18px;background:rgba(7,7,12,.34);
  backdrop-filter:blur(8px)
}
.gifts{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.gift{
  min-height:118px;border:1px solid rgba(255,255,255,.12);border-radius:14px;
  background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(0,0,0,.12));
  color:#fff;padding:7px 4px;text-align:center
}
.gift-art{width:100%;height:76px;display:block;filter:drop-shadow(0 5px 7px rgba(0,0,0,.35))}
.gift b{display:block;font-size:11px;margin-top:3px;white-space:nowrap}
.gift small{display:block;font-size:8px;color:#ff69aa;margin-top:2px}
.rewards{
  margin-top:8px;display:grid;grid-template-columns:.78fr repeat(5,1fr);gap:4px;
  padding:5px;border:1px solid rgba(255,255,255,.10);border-radius:12px;background:rgba(4,4,8,.28)
}
.reward{
  min-width:0;min-height:61px;border:1px solid rgba(255,255,255,.08);border-radius:10px;
  background:rgba(0,0,0,.18);display:grid;place-items:center;text-align:center;padding:4px 2px
}
.reward.label{border-color:transparent;background:transparent;color:#ff68aa;font-weight:950;font-size:11px}
.reward b{font-size:8px;white-space:nowrap}.reward span{font-size:14px;line-height:1}.reward small{font-size:6.5px;color:#bdbdc6}
.start{
  position:absolute;z-index:7;left:18px;right:18px;bottom:max(14px,env(safe-area-inset-bottom));
  border:0;border-radius:22px;padding:16px 10px;
  background:linear-gradient(100deg,#ff2d5f,#ff4f96 55%,#8d5cff);
  color:#fff;font-weight:950;font-size:19px;letter-spacing:-.3px;
  box-shadow:0 10px 30px rgba(255,45,95,.28)
}
.start.active{background:linear-gradient(100deg,#2f3038,#17181e);color:#ffe071;box-shadow:none}

/* svg defs hidden */
svg.defs{position:absolute;width:0;height:0;overflow:hidden}

@media(max-height:760px){
  .rank,.time{top:82px}.side{bottom:315px}.chat{bottom:340px}.alert{bottom:292px}.messagebar{bottom:244px}
  .giftbox{bottom:106px}.gift{min-height:105px}.gift-art{height:66px}.reward{min-height:54px}
  .start{padding:14px 10px}
}
</style>
</head>
<body>

<div class="top">
  <div class="avatar">태</div>

  <div class="onair">ON<br>AIR</div>
  <div class="views">◉ 1,234</div>

</div>

    <button class="gift"><svg class="gift-art" viewBox="0 0 150 120"><use href="#rose100"/></svg><b>장미 100개</b></button>

</main>

<script>
function startBroadcast(){
  const b=document.getElementById('startBtn');
  b.classList.add('active');
  b.textContent='● 방송 중입니다';
}
</script>
