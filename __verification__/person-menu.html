<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>사람 메뉴 · 채팅 동작 미리보기</title>
<style>*{box-sizing:border-box}body{margin:0;background:#09090d;color:white;font:16px system-ui}header{padding:16px;background:#202026}button{cursor:pointer}#screen{width:min(100%,440px);height:620px;margin:0 auto;overflow:hidden}.ktg9-room{height:620px;padding:18px;background:#101014}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.ktg9-host,.ktg9-guest{position:relative;border:1px solid #555;border-radius:12px;height:120px;background:#29292f;display:grid;place-items:center;text-align:center;overflow:hidden}.ktg9-chat-input-row{margin-top:20px;display:flex;gap:8px;background:#25252a;padding:10px;border-radius:14px}.ktg9-chat-input-row input{min-width:0;flex:1;font-size:16px}#sheet{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,560px);background:#25252b;z-index:2147483647;padding:15px;border-radius:24px 24px 0 0}.ktgf-main>section{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.ktgf-card{padding:20px;background:#35353e;color:white;border:0;border-radius:12px}#results{white-space:pre-wrap;max-height:100px;overflow:auto;font-size:12px}#messages{height:40px;overflow:hidden}</style>
<header><b>사람 메뉴 · 채팅 미리보기</b><p>예시 인물 · 실제 방송이나 선물 결제가 아닙니다.</p><button id="run">동작 검사</button><pre id="results"></pre></header>
<div id="screen"><div class="ktg9-room"><p>🔴 LIVE · 예시 방송</p><div class="grid"><div class="ktg9-host self" data-name="내 방송">👤<br>내 사진</div><div class="ktg9-guest" data-kt-guest-viewer-id="demo-a" data-name="하늘">👤<br>하늘</div><div class="ktg9-guest" data-kt-guest-viewer-id="demo-b" data-name="바다">👤<br>바다</div><div class="ktg9-guest">빈 칸</div><div class="ktg9-guest">빈 칸</div><div class="ktg9-guest">빈 칸</div><div class="ktg9-guest">빈 칸</div><div class="ktg9-guest">빈 칸</div><div class="ktg9-guest">빈 칸</div></div><div id="messages">채팅 내용은 이곳에서 위로 흐릅니다.</div><form class="ktg9-chat-input-row"><input placeholder="채팅 입력" aria-label="채팅 입력"><button type="submit">보내기</button></form></div></div>
<script>
var vt={readyState:'live',enabled:true},at={readyState:'live',enabled:true};window.state={stream:{getVideoTracks:()=>[vt],getAudioTracks:()=>[at]}};
window.openGifts=function(){var old=document.getElementById('sheet');if(old)old.remove();var el=document.createElement('div');el.id='sheet';el.className='kt-gift-force';el.innerHTML='<div class="ktgf"><div class="ktgf-head">선물 고르기 <button onclick="this.closest(\'#sheet\').remove()">닫기</button></div><div class="ktgf-main"><section><button class="ktgf-card">🌹 장미</button><button class="ktgf-card">💖 하트</button><button class="ktgf-card">🎁 응원</button></section></div><p>검사용 예시입니다. 선물 차감·전송은 하지 않습니다.</p></div>';document.body.appendChild(el);};
document.querySelector('form').onsubmit=function(e){e.preventDefault();var input=this.querySelector('input');if(input.value){var p=document.createElement('div');p.textContent=input.value;document.getElementById('messages').prepend(p);input.value='';}};
</script>
<script src="../all-room-person-gift-target-20260928.js"></script>
<script src="../gift-recipient-picker-scroll-20261006.js"></script>
<script src="../group9-keyboard-no-jump-20261002.js"></script>
<script>
document.getElementById('run').onclick=async function(){
var out=[],wait=ms=>new Promise(r=>setTimeout(r,ms)),check=(name,ok)=>out.push((ok?'통과 ':'실패 ')+name),tap=el=>el.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true})),tile=document.querySelector('.ktg9-host'),rect=()=>{var r=tile.getBoundingClientRect();return [r.x,r.y,r.width,r.height].map(x=>Math.round(x)).join(',');},before=rect();
tap(tile);check('본인 메뉴',!!document.getElementById('ktPersonMenu20261012'));
tap(Array.from(document.querySelectorAll('#ktPersonMenu20261012 button')).find(x=>x.textContent==='카메라 끄기'));check('본인 카메라 끄기',!vt.enabled);
tap(Array.from(document.querySelectorAll('#ktPersonMenu20261012 button')).find(x=>x.textContent==='카메라 켜기'));check('본인 카메라 켜기',vt.enabled);
tap(Array.from(document.querySelectorAll('#ktPersonMenu20261012 button')).find(x=>x.textContent==='마이크 끄기'));check('본인 마이크 끄기',!at.enabled);
tap(Array.from(document.querySelectorAll('#ktPersonMenu20261012 button')).find(x=>x.textContent==='닫기'));
var guests=document.querySelectorAll('.ktg9-guest');tap(guests[0]);check('다른 사람 선물 메뉴',document.querySelector('#ktPersonMenu20261012').textContent.includes('선물 상자'));
check('다른 사람 미디어 조작 제외',!document.querySelector('#ktPersonMenu20261012').textContent.includes('카메라'));
tap(Array.from(document.querySelectorAll('#ktPersonMenu20261012 button')).find(x=>x.textContent.includes('선물 상자')));await wait(140);
check('선물 받을 사람 하늘',document.querySelector('.kt-gift-recipient-copy-20261006 b').textContent==='하늘');
var bar=document.querySelector('.kt-gift-recipient-bar-20261006');await wait(160);check('받는 사람 반복 재생성 방지',bar===document.querySelector('.kt-gift-recipient-bar-20261006'));
document.getElementById('sheet').remove();tap(guests[1]);tap(Array.from(document.querySelectorAll('#ktPersonMenu20261012 button')).find(x=>x.textContent.includes('선물 상자')));await wait(140);
check('받는 사람 바다로 변경',document.querySelector('.kt-gift-recipient-copy-20261006 b').textContent==='바다');document.getElementById('sheet').remove();
check('메뉴 전후 방송 칸 위치',before===rect());
var field=document.querySelector('input');field.focus({preventScroll:true});await wait(100);check('채팅 입력 중 방송 칸 위치',before===rect());
field.value='검사 메시지';document.querySelector('form').requestSubmit();check('채팅 전송',document.getElementById('messages').textContent.includes('검사 메시지'));field.blur();await wait(160);check('채팅 종료 후 방송 칸 위치',before===rect());
tap(guests[2]);check('빈 칸 메뉴 제외',!document.getElementById('ktPersonMenu20261012'));
document.getElementById('results').textContent=out.join('\n');
};
</script></html>
