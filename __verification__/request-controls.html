<!doctype html><html lang="ko"><meta charset="utf-8"><title>참여 신청 버튼 검증</title><style>body{background:#101118;color:white;font:18px system-ui;margin:30px}.ktg13-room{height:420px;position:relative;border:1px solid #555;border-radius:20px}button{padding:12px;margin:6px}#result{white-space:pre-wrap}</style><h1>참여 신청 버튼 검증</h1><p>실제 방송이나 회원에게 요청을 보내지 않는 독립 검증 화면입니다.</p><button onclick="changeApplicant()">신청자 B로 변경</button><div id="screen"><div class="ktg13-room"></div></div><p id="result">승인 대기</p><script>
let applicant='A';const events=[];Object.defineProperty(window,'localStorage',{value:{getItem:k=>k==='kt_live_device_id'?'fixture-host':null,setItem(){}}});
window.ktApproveGuest=function(id,name){events.push({id,name});document.getElementById('result').textContent='승인: '+id+' / '+name;};
function changeApplicant(){applicant='B';document.getElementById('result').textContent='신청자 B 조회 대기';}
window.fetch=async function(url){url=String(url);let value=[];if(url.startsWith('live-presence.js'))return{ok:true,text:async()=> "var BASE='https://fixture.invalid/';var KEY='fixture';"};
if(url.includes('ktalk_live_rooms'))value=[{started_at:new Date(Date.now()-60000).toISOString()}];
else if(url.includes('ktalk_live_messages'))value=[{sender_id:'viewer_'+applicant,sender_name:'신청자 '+applicant,message_type:'guest_request:viewer_'+applicant,created_at:new Date().toISOString()}];
return{ok:true,status:200,text:async()=>JSON.stringify(value),json:async()=>value};};
</script><script src="../guest-request-photo-cards-20260914.js"></script></html>
