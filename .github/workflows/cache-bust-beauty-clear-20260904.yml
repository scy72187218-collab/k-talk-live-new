name: Load clear AI beauty version
on:
  push:
    paths:
      - '.github/workflows/cache-bust-beauty-clear-20260904.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Refresh beauty script only
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='beauty-live-fix.js?v=20260904-beauty01'
          new='beauty-live-fix.js?v=20260904-beauty02'
          if old not in s:
              raise SystemExit('beauty loader not found')
          p.write_text(s.replace(old,new,1))
      - name: Commit cache refresh only
        run: |
          git config user.name "K-Talk Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Load clearer AI beauty filter"
          git push
