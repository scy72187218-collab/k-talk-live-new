name: Update group13 earnings rates once

on:
  push:
    paths:
      - '.github/workflows/update-group13-earnings-rates-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update only group13 earnings rate text
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('group13-approved-room.js')
          s = p.read_text(encoding='utf-8')

          old_css = ".ktg13-earn{height:42px;display:flex;align-items:flex-end;justify-content:flex-end}"
          new_css = ".ktg13-earn{height:64px;display:flex;align-items:flex-end;justify-content:flex-end}"
          if old_css not in s:
              raise SystemExit('desktop earnings height target not found')
          s = s.replace(old_css, new_css, 1)

          old_mobile = ".ktg13-earn{height:39px}.ktg13-earn #myEarnHud{padding:2px 4px!important}"
          new_mobile = ".ktg13-earn{height:62px}.ktg13-earn #myEarnHud{padding:2px 4px!important}"
          if old_mobile not in s:
              raise SystemExit('mobile earnings height target not found')
          s = s.replace(old_mobile, new_mobile, 1)

          old_detail = "+'<div id=\"myEarnDetail\" style=\"display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:1px;font-size:8px;color:#ddd\"><span id=\"hudEarnRoses\">'+esc(roses)+'</span><span id=\"hudEarnRate\" style=\"text-align:right\">일반회원 · '+esc(rate)+'</span></div>'"
          new_detail = "+'<div id=\"myEarnDetail\" style=\"display:grid;grid-template-columns:1fr auto;gap:1px 4px;margin-top:1px;font-size:7px;color:#ddd;line-height:1.15\"><span id=\"hudEarnRoses\">'+esc(roses)+'</span><span id=\"hudEarnRate\" style=\"text-align:right;white-space:nowrap\">일반회원 35%</span><span style=\"grid-column:1/-1;text-align:right;white-space:nowrap\">구독자회원 40% · 소속사 65%</span><span style=\"grid-column:1/-1;text-align:right;color:#ffe071;white-space:nowrap\">소속사 가입은 소속사가 결정</span></div>'"
          if old_detail not in s:
              raise SystemExit('earnings detail target not found')
          s = s.replace(old_detail, new_detail, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit only group13 earnings change
        run: |
          git config user.name 'K-Talk Earnings Helper'
          git config user.email 'actions@github.com'
          git add group13-approved-room.js
          git commit -m '13명방 수익표시 일반35 구독자40 소속사65로 수정'
          git push
