name: Load live feed sync

on:
  push:
    paths:
      - '.github/workflows/load-live-feed-sync-20260904.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch only LIVE visibility files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # Follow/friends status: trust active=true so an ongoing broadcast does not disappear just because a phone timer was throttled.
          p=Path('follow-live-status.js')
          s=p.read_text(encoding='utf-8')
          old="""      var since=new Date(Date.now()-120000).toISOString();
      var u=SB+'/rest/v1/ktalk_live_rooms?select=host_id,host_name,title,room_name,started_at,updated_at&active=eq.true&updated_at=gte.'+encodeURIComponent(since)+'&order=started_at.desc&limit=30';"""
          new="""      var u=SB+'/rest/v1/ktalk_live_rooms?select=host_id,host_name,title,room_name,started_at,updated_at&active=eq.true&order=started_at.desc&limit=30';"""
          if old in s:
              s=s.replace(old,new,1)
              p.write_text(s,encoding='utf-8')

          # Load the dynamic LIVE-in-video-feed sync file and cache-bust only the related status script.
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('follow-live-status.js?v=20260904-followlive01','follow-live-status.js?v=20260904-followlive02')
          tag='<script src="live-feed-sync.js?v=20260904-livefeed01"></script>'
          if tag not in s:
              marker='<script src="follow-live-status.js?v=20260904-followlive02"></script>'
              if marker not in s:
                  raise SystemExit('follow live status marker not found')
              s=s.replace(marker,marker+'\n'+tag,1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Commit LIVE visibility only
        shell: bash
        run: |
          git config user.name 'K-Talk Patch Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add follow-live-status.js index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Keep live broadcasts visible in feed and friend status'
            git push origin main
          fi
