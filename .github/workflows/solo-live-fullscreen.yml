name: Fix 1-person live fullscreen only

on:
  push:
    paths:
      - '.github/workflows/solo-live-fullscreen.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch only 1-person live framing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('feed-home-fix.js')
          s=p.read_text(encoding='utf-8')

          old="""      v.style.setProperty('object-fit','contain','important');
      v.style.setProperty('transform','scaleX(-1) scale(.72)','important');
      v.style.setProperty('transform-origin','50% 50%','important');
      var layer=document.getElementById('ktLiveEffectLayer');
      if(layer){
        layer.style.setProperty('transform','scale(.72)','important');
        layer.style.setProperty('transform-origin','50% 50%','important');
      }
"""

          new="""      var roomType='',roomMax=0,roomName='';
      try{
        roomType=(window.state&&state.liveRoomType)||'';
        roomMax=Number((window.state&&state.liveRoomMax)||0);
        roomName=(window.state&&state.liveRoomName)||'';
      }catch(e){}
      var isSolo=(roomType==='solo'||roomMax===1||roomName==='1인 방송');
      if(isSolo){
        v.style.setProperty('object-fit','cover','important');
        v.style.setProperty('width','100%','important');
        v.style.setProperty('height','100%','important');
        v.style.setProperty('transform','scaleX(-1)','important');
        v.style.setProperty('transform-origin','50% 50%','important');
      }else{
        v.style.setProperty('object-fit','contain','important');
        v.style.setProperty('transform','scaleX(-1) scale(.72)','important');
        v.style.setProperty('transform-origin','50% 50%','important');
      }
      var layer=document.getElementById('ktLiveEffectLayer');
      if(layer){
        layer.style.setProperty('transform',isSolo?'none':'scale(.72)','important');
        layer.style.setProperty('transform-origin','50% 50%','important');
      }
"""

          if old not in s:
            raise SystemExit('target live framing block not found')

          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY

          git config user.name "K-Talk Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add feed-home-fix.js
          git diff --cached --check
          git commit -m "Make only 1-person live video fill the phone screen"
          git push origin HEAD:main
