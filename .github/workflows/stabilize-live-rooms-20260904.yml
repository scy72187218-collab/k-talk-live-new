name: Stabilize all live room layouts

on:
  push:
    paths:
      - '.github/workflows/stabilize-live-rooms-20260904.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch only live layout stability
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p=Path(path)
              s=p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'Expected block not found in {path}')
              s=s.replace(old,new,1)
              p.write_text(s,encoding='utf-8')

          # 1-person LIVE: stop re-applying the same mobile layout every 180ms.
          old_solo="""  try{\n    var obs=new MutationObserver(function(){setTimeout(fillSolo,0);});\n    obs.observe(document.documentElement,{childList:true,subtree:true});\n  }catch(e){}\n  window.addEventListener('resize',fillSolo);\n  setInterval(fillSolo,180);\n  setTimeout(fillSolo,40);"""
          new_solo="""  var lastSoloVideo=null;\n  function applySoloForNewVideo(){\n    if(!isMobile()||!isSolo())return;\n    var v=document.getElementById('ktLiveVideo');\n    if(!v){lastSoloVideo=null;return;}\n    if(v===lastSoloVideo)return;\n    lastSoloVideo=v;\n    setTimeout(function(){if(v===document.getElementById('ktLiveVideo'))fillSolo();},40);\n  }\n  try{\n    var obs=new MutationObserver(applySoloForNewVideo);\n    obs.observe(document.documentElement,{childList:true,subtree:true});\n  }catch(e){}\n  applySoloForNewVideo();"""
          replace_once('desktop-live-fullscreen.js',old_solo,new_solo)

          # Use the same locked-height behavior for every mobile host LIVE room,
          # including solo, subscriber, and password/private rooms, and only sync on node changes.
          p=Path('permission-reuse.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('/* Mobile 13-person/subscriber LIVE only: keep the room height stable. */','/* Mobile LIVE rooms: keep the room height stable. */',1)
          old_fn="""  function isMulti(){\n    try{\n      var t=(window.state&&state.liveRoomType)||'';\n      return t==='group13'||t==='group'||t==='subscriber'||Number(window.state&&state.liveRoomMax)>1;\n    }catch(e){return false;}\n  }"""
          new_fn="""  function isLiveRoom(){\n    try{\n      var t=(window.state&&state.liveRoomType)||'';\n      var max=Number(window.state&&state.liveRoomMax);\n      return t==='solo'||t==='group13'||t==='group'||t==='subscriber'||t==='password'||max>=1;\n    }catch(e){return false;}\n  }"""
          if old_fn not in s:
              raise SystemExit('Expected live-room type block not found')
          s=s.replace(old_fn,new_fn,1)
          s=s.replace("if(!isMobile()||!isMulti()){if(lockedSection||lockedScreen)unlock();return;}","if(!isMobile()||!isLiveRoom()){if(lockedSection||lockedScreen)unlock();return;}",1)
          old_loop="""  try{new MutationObserver(function(){setTimeout(apply,30);}).observe(document.documentElement,{childList:true,subtree:true});}catch(e){}\n  setInterval(apply,500);setTimeout(apply,100);"""
          new_loop="""  var lastLiveVideo=null;\n  function syncLiveNode(){\n    var v=document.getElementById('ktLiveVideo');\n    if(!v){lastLiveVideo=null;if(lockedSection||lockedScreen)unlock();return;}\n    if(v===lastLiveVideo)return;\n    lastLiveVideo=v;\n    setTimeout(apply,30);\n  }\n  try{new MutationObserver(syncLiveNode).observe(document.documentElement,{childList:true,subtree:true});}catch(e){}\n  syncLiveNode();"""
          if old_loop not in s:
              raise SystemExit('Expected viewport interval block not found')
          s=s.replace(old_loop,new_loop,1)
          p.write_text(s,encoding='utf-8')

          # Cache-bust only the two changed scripts so phones receive the new code.
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'desktop-live-fullscreen\\.js\\?v=[^\"\']+','desktop-live-fullscreen.js?v=20260904-allrooms-stable01',s,count=1)
          s=re.sub(r'permission-reuse\\.js\\?v=[^\"\']+','permission-reuse.js?v=20260904-allrooms-stable01',s,count=1)
          p.write_text(s,encoding='utf-8')

          Path('.github/workflows/stabilize-live-rooms-20260904.yml').unlink(missing_ok=True)
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "K-Talk Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Stabilize solo subscriber and private live layouts"
          git push
