name: Install AI DJ 9 room
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-ai-dj-9-room.yml'
permissions:
  contents: write
jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load AI DJ room
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tags=[
            '<script src="ai-dj-photo-data-20260913.js?v=20260913-aidj1"></script>',
            '<script src="ai-dj-9-room-20260913.js?v=20260913-aidj1"></script>'
          ]
          for tag in tags:
              if tag not in s:
                  s=s.replace('</body>',tag+'\n</body>')
          p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Load AI DJ 9-person music room"
          git push
