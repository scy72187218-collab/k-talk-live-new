name: Apply approved solo room layout
on:
  push:
    paths:
      - '.github/workflows/apply-solo-approved-room.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load approved solo room script
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="solo-approved-room.js?v=20260907-approved01"></script>'
          if tag not in s:
              marker='<script src="posted-feed.js?v=20260904a"></script>'
              if marker not in s:
                  raise SystemExit('posted-feed marker not found')
              s=s.replace(marker,tag+'\n'+marker,1)
              p.write_text(s,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No index change needed"
          else
            git commit -m "Use approved 1-person live room layout [skip ci]"
            git push
          fi
