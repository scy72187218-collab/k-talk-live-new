name: Refresh compact 1-person live style

on:
  push:
    paths:
      - '.github/workflows/bump-solo-approved-style-20260905b.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Refresh solo approved style cache only
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('solo-live-approved-style.js?v=20260905-solo-approved01','solo-live-approved-style.js?v=20260905-solo-approved02')
          p.write_text(s,encoding='utf-8')
          Path('.github/workflows/bump-solo-approved-style-20260905b.yml').unlink(missing_ok=True)
      - name: Commit compact solo style refresh
        run: |
          git config user.name "K-Talk Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Refresh compact 1-person live style"
          git push