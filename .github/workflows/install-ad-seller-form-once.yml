name: Install ad seller form once
on:
  push:
    paths:
      - '.github/workflows/install-ad-seller-form-once.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add ad seller registration script only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tag='<script src="ad-seller-registration.js?v=20260910a"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'\n</body>')
              p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "K-Talk Ad Form Helper"
          git config user.email "actions@github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "광고·판매자 등록 신청 화면 연결 [skip ci]"
            git push
          fi
