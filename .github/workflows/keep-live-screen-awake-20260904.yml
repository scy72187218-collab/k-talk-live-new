name: Fix LIVE media stop regression

on:
  push:
    paths:
      - '.github/workflows/keep-live-screen-awake-20260904.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Keep LIVE video from being paused by page media stop
        shell: bash
        run: |
          python -c "import base64; from pathlib import Path; p=Path('multiroom-tiktok-layout.js'); s=p.read_text(encoding='utf-8'); old=base64.b64decode('ICAgICAgaWYodHlwZW9mIHdpbmRvdy5rdFN0b3BCYWNrZ3JvdW5kTWVkaWE9PT0nZnVuY3Rpb24nKXsKICAgICAgICB3aW5kb3cua3RTdG9wQmFja2dyb3VuZE1lZGlhKCk7CiAgICAgICAgcmV0dXJuOwogICAgICB9').decode(); new=base64.b64decode('ICAgICAgaWYodHlwZW9mIHdpbmRvdy5rdFN0b3BCYWNrZ3JvdW5kTWVkaWE9PT0nZnVuY3Rpb24nJiYhZG9jdW1lbnQuZ2V0RWxlbWVudEJ5SWQoJ2t0TGl2ZVZpZGVvJykmJiFkb2N1bWVudC5nZXRFbGVtZW50QnlJZCgna3RSZW1vdGVMaXZlJykpewogICAgICAgIHdpbmRvdy5rdFN0b3BCYWNrZ3JvdW5kTWVkaWEoKTsKICAgICAgICByZXR1cm47CiAgICAgIH0=').decode(); assert old in s or new in s, 'media stop target not found'; s=s.replace(old,new,1); p.write_text(s,encoding='utf-8'); p=Path('index.html'); s=p.read_text(encoding='utf-8'); s=s.replace('multiroom-tiktok-layout.js?v=20260904-controls02','multiroom-tiktok-layout.js?v=20260904-live-stable03'); p.write_text(s,encoding='utf-8')"
      - name: Commit only LIVE stability fix
        shell: bash
        run: |
          git config user.name 'K-Talk Patch Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add multiroom-tiktok-layout.js index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Prevent page media stop from pausing LIVE video'
            git push origin main
          fi
