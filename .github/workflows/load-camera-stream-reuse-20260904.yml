name: Load camera stream reuse fix

on:
  push:
    paths:
      - '.github/workflows/load-camera-stream-reuse-20260904.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Refresh only camera permission helper assets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('permission-reuse.js?v=20260904-permission05','permission-reuse.js?v=20260904-permission06')
          s=s.replace('camera-recovery.js?v=20260904-camera01','camera-recovery.js?v=20260904-camera02')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit camera stream reuse loader only
        shell: bash
        run: |
          git config user.name 'K-Talk Patch Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Load camera stream reuse without repeated prompt'
            git push origin main
          fi
