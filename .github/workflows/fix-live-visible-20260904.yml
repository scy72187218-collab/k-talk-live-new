name: Fix active LIVE visibility

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch active LIVE visibility only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, re
          feed = Path('feed-home-fix.js')
          s = feed.read_text(encoding='utf-8')
          s = s.replace('눌러서 방송 들어가기', '방송 자동 연결 중...')
          marker = '/* K-Talk: reliable viewer LIVE discovery. */'
          encoded = ''
          snippet = base64.b64decode(encoded).decode('utf-8')
          if marker not in s:
              s += '\n\n' + snippet
          feed.write_text(s, encoding='utf-8')

          index = Path('index.html')
          h = index.read_text(encoding='utf-8')
          h = re.sub(r'feed-home-fix\.js\?v=[^\"]+', 'feed-home-fix.js?v=20260904-live-visible05', h)
          h = re.sub(r'desktop-live-fullscreen\.js\?v=[^\"]+', 'desktop-live-fullscreen.js?v=20260904-live-visible05', h)
          index.write_text(h, encoding='utf-8')
          PY
      - name: Commit live visibility fix
        shell: bash
        run: |
          git config user.name "K-Talk Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add feed-home-fix.js index.html
          if ! git diff --cached --quiet; then
            git commit -m "Make active LIVE appear and connect automatically"
            git push
          fi
