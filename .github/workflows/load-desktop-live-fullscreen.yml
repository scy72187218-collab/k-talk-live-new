name: Load desktop live fullscreen fix

on:
  push:
    paths:
      - '.github/workflows/load-desktop-live-fullscreen.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Load desktop live fullscreen helper only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="desktop-live-fullscreen.js?v=20260904-desktop01"></script>'
          if tag not in s:
              s=s.replace('</body>', tag+'\n</body>')
              p.write_text(s,encoding='utf-8')
          PY
          if git diff --quiet -- index.html; then
            exit 0
          fi
          git config user.name 'K-Talk Patch Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git diff --cached --check
          git commit -m 'Load desktop-only live fullscreen helper'
          git push origin HEAD:main
