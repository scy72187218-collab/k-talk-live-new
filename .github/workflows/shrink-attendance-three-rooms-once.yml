name: Shrink attendance badges once
on:
  push:
    paths:
      - '.github/workflows/shrink-attendance-three-rooms-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Shrink only attendance badges
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'expected text not found in {path}: {old[:80]!r}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')

          # 1인 방송: 출석체크만 조금 축소
          replace_exact('solo-approved-room.js',
              '.ktsolo-att{justify-self:center;height:43px;min-width:142px;padding:0 9px;',
              '.ktsolo-att{justify-self:center;height:36px;min-width:120px;padding:0 6px;')
          replace_exact('solo-approved-room.js',
              'color:#ffd52f;font-size:18px;font-weight:950;box-shadow:',
              'color:#ffd52f;font-size:15px;font-weight:950;box-shadow:')
          replace_exact('solo-approved-room.js',
              'display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}.ktsolo-att img{width:23px;height:23px;',
              'display:flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap}.ktsolo-att img{width:19px;height:19px;')
          replace_exact('solo-approved-room.js',
              '.ktsolo-att{min-width:120px;height:38px;font-size:15px;padding:0 5px}.ktsolo-att img{width:19px;height:19px}',
              '.ktsolo-att{min-width:102px;height:32px;font-size:13px;padding:0 4px}.ktsolo-att img{width:17px;height:17px}')

          # 구독자 방송: 같은 크기로 축소
          replace_exact('subscriber-approved-room.js',
              '.ktsubscriber-att{justify-self:center;height:43px;min-width:142px;padding:0 9px;',
              '.ktsubscriber-att{justify-self:center;height:36px;min-width:120px;padding:0 6px;')
          replace_exact('subscriber-approved-room.js',
              'color:#ffd52f;font-size:18px;font-weight:950;box-shadow:',
              'color:#ffd52f;font-size:15px;font-weight:950;box-shadow:')
          replace_exact('subscriber-approved-room.js',
              'display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}.ktsubscriber-att img{width:23px;height:23px;',
              'display:flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap}.ktsubscriber-att img{width:19px;height:19px;')
          replace_exact('subscriber-approved-room.js',
              '.ktsubscriber-att{min-width:120px;height:38px;font-size:15px;padding:0 5px}.ktsubscriber-att img{width:19px;height:19px}',
              '.ktsubscriber-att{min-width:102px;height:32px;font-size:13px;padding:0 4px}.ktsubscriber-att img{width:17px;height:17px}')

          # 13명 방송(기본 라이브 출석체크): 글씨/날개/패딩만 조금 축소
          replace_exact('index.html',
              'font-weight:950;font-size:12px;white-space:nowrap;\n  display:flex;align-items:center;gap:3px;',
              'font-weight:950;font-size:10px;white-space:nowrap;\n  display:flex;align-items:center;gap:2px;')
          replace_exact('index.html',
              'padding:6px 9px;border-radius:999px;',
              'padding:4px 7px;border-radius:999px;')
          replace_exact('index.html',
              'color:#ff64cf;font-size:15px;line-height:1;',
              'color:#ff64cf;font-size:12px;line-height:1;')

          # 캐시 갱신용 버전만 변경
          replace_exact('index.html','solo-approved-room.js?v=20260907-approved01','solo-approved-room.js?v=20260907-approved02')
          replace_exact('index.html','subscriber-approved-room.js?v=20260907-subscriber01','subscriber-approved-room.js?v=20260907-subscriber02')

          # 임시 워크플로우는 작업 후 제거
          Path('.github/workflows/shrink-attendance-three-rooms-once.yml').unlink()
          PY
      - name: Commit only these size changes
        run: |
          git config user.name 'K-Talk Attendance Helper'
          git config user.email 'actions@github.com'
          git add solo-approved-room.js subscriber-approved-room.js index.html .github/workflows/shrink-attendance-three-rooms-once.yml
          git commit -m 'Reduce attendance badge size in three rooms'
          git push
