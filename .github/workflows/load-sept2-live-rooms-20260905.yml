name: Load Sept 2 live rooms only

on:
  push:
    paths:
      - '.github/workflows/load-sept2-live-rooms-20260905.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Load Sept 2 live-room restore last
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="live-rooms-sept2-restore.js?v=20260905-sept2restore01"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          Path('.github/workflows/load-sept2-live-rooms-20260905.yml').unlink(missing_ok=True)
      - name: Commit Sept 2 live-room loader
        run: |
          git config user.name "K-Talk Restore Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Load Sept 2 live rooms without changing other screens"
          git push
