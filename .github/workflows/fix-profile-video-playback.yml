name: Fix profile video playback

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-profile-video-playback.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch playback only
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('posted-feed.js')
          s = p.read_text(encoding='utf-8')
          marker = '/* Profile/local video playback fix only. */'
          if marker not in s:
              s += r'''

/* Profile/local video playback fix only. */
(function(){
  window.playStoredVideo=async function(id){
    try{
      var db=await ktOpenVideoDB();
      var tx=db.transaction('videos','readonly');
      var req=tx.objectStore('videos').get(id);
      req.onsuccess=function(){
        var item=req.result;
        try{db.close();}catch(e){}
        if(!item||!item.blob){alert('동영상을 찾지 못했습니다.');return;}
        var safeName=String(item.name||'내 동영상').replace(/</g,'&lt;');
        showSheet('동영상 재생','<div class="kt-myvideo-player">'
          +'<video id="ktLibraryPlayer" controls autoplay playsinline></video>'
          +'<b>'+safeName+'</b>'
          +'<div class="kt-myvideo-player-actions">'
          +'<button class="back" onclick="openMyVideoLibrary()">← 내 동영상</button>'
          +'<button class="upload" onclick="postStoredVideo(\''+id+'\',this)">⬆ 동영상 올리기</button>'
          +'</div></div>');
        try{if(window.ktLibraryPlayUrl)URL.revokeObjectURL(window.ktLibraryPlayUrl);}catch(e){}
        window.ktLibraryPlayUrl=URL.createObjectURL(item.blob);
        var player=document.getElementById('ktLibraryPlayer');
        if(player){
          player.src=window.ktLibraryPlayUrl;
          player.load();
          player.play().catch(function(){});
        }
      };
      req.onerror=function(){try{db.close();}catch(e){} alert('동영상을 찾지 못했습니다.');};
    }catch(e){alert('동영상을 재생하지 못했습니다.');}
  };
})();
'''
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "K-Talk Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add posted-feed.js
          git diff --cached --quiet || git commit -m "Fix profile video playback only"
          git push origin main
