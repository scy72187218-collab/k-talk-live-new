name: Fix multiroom floating controls

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch multiroom controls only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          p=Path('multiroom-tiktok-layout.js')
          s=p.read_text(encoding='utf-8')
          marker='/* K-Talk: compact multiroom live controls above guest seats. */'
          code=base64.b64decode('').decode('utf-8')
          if marker not in s:
              p.write_text(s+code,encoding='utf-8')
          idx=Path('index.html')
          h=idx.read_text(encoding='utf-8')
          h=h.replace('multiroom-tiktok-layout.js?v=20260904-room01','multiroom-tiktok-layout.js?v=20260904-controls02')
          idx.write_text(h,encoding='utf-8')
          PY
      - name: Commit multiroom controls fix
        shell: bash
        run: |
          git config user.name "K-Talk Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add multiroom-tiktok-layout.js index.html
          if ! git diff --cached --quiet; then
            git commit -m "Replace four floating live controls with one compact menu"
            git push
          fi
