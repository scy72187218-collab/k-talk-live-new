name: Secret room earnings and return button only

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/secret-room-earn-flip-only-20260914.yml'

permissions:
  contents: write

jobs:
  patch-secret-room-only:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch only secret room earnings size and return button
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('secret-room-password.js')
          s=p.read_text(encoding='utf-8')

          old_re=r"\+'\.ktsecret-earn-row\{flex:0 0 34px;display:flex;align-items:center;justify-content:flex-end;padding:0 3px\}\.ktsecret-earn-row #myEarnHud\{width:160px!important;margin:0!important;padding:4px 7px!important;border:1px solid #d2a936!important;border-radius:14px!important;background:linear-gradient\(135deg,#17140be8,#0d0d12e8\)!important;color:#fff!important\}'"
          new="+\'.ktsecret-earn-row{flex:0 0 30px;display:flex;align-items:center;justify-content:flex-end;padding:0 3px}html body .ktsecret-room .ktsecret-earn-row #myEarnHud{width:92px!important;max-width:92px!important;min-width:92px!important;height:50px!important;max-height:50px!important;margin:0!important;padding:2px 3px!important;border:1px solid #d2a936!important;border-radius:10px!important;background:linear-gradient(135deg,#17140be8,#0d0d12e8)!important;color:#fff!important;overflow:hidden!important}html body .ktsecret-room .ktsecret-earn-row #myEarnHud span{font-size:5.8px!important;line-height:1!important}html body .ktsecret-room .ktsecret-earn-row #myEarnHud b{font-size:8px!important;line-height:1!important}html body .ktsecret-room .ktsecret-earn-row #myEarnDetail{font-size:5.4px!important;line-height:1!important;gap:1px!important;margin-top:1px!important}\'"
          s,n=re.subn(old_re,new,s,count=1)
          if n!=1:
            raise SystemExit(f'earnings target count={n}')

          old="+'<div class=\"ktsecret-right\"><button class=\"like\" onclick=\"if(window.addHostLike)addHostLike(1)\">💗<small>좋아요</small><b id=\"hostLikeCount\" style=\"display:block;font-size:8px\">0</b></button>"
          new="+'<div class=\"ktsecret-right\"><button class=\"kt-room-camera-flip ktsecret-return\" onclick=\"if(window.ktAllRoomsFlipCamera)ktAllRoomsFlipCamera()\"><b>↻</b><small>되돌리기</small></button><button class=\"like\" onclick=\"if(window.addHostLike)addHostLike(1)\">💗<small>좋아요</small><b id=\"hostLikeCount\" style=\"display:block;font-size:8px\">0</b></button>"
          if s.count(old)!=1:
            raise SystemExit(f'button target count={s.count(old)}')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
      - name: Commit secret room only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add secret-room-password.js
          git commit -m "Shrink secret room earnings and show return button only"
          git push
