name: Isolate 1-person fixes from 13-person room
on:
  push:
    paths:
      - '.github/workflows/isolate-solo-from-group13-20260905.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Keep solo-only code out of 13-person room
        shell: python
        run: |
          from pathlib import Path
          import re

          files = [
              'desktop-live-fullscreen.js',
              'solo-host-fullscreen-top-timer.js',
              'solo-fullscreen-lock.js',
              'solo-attendance-fix.js',
          ]
          for name in files:
              p = Path(name)
              s = p.read_text(encoding='utf-8')
              s = s.replace("state.liveRoomType==='solo'||Number(state.liveRoomMax)===1||state.liveRoomName==='1인 방송'", "state.liveRoomType==='solo'||state.liveRoomName==='1인 방송'")
              s = s.replace("state.liveRoomType==='solo' || Number(state.liveRoomMax)===1 || state.liveRoomName==='1인 방송'", "state.liveRoomType==='solo' || state.liveRoomName==='1인 방송'")
              p.write_text(s, encoding='utf-8')

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          versions = {
              'desktop-live-fullscreen.js': '20260905-room13-isolate01',
              'solo-host-fullscreen-top-timer.js': '20260905-room13-isolate01',
              'solo-fullscreen-lock.js': '20260905-room13-isolate01',
              'solo-attendance-fix.js': '20260905-room13-isolate01',
          }
          for script, ver in versions.items():
              s = re.sub(re.escape(script) + r'\?v=[^\"\']+', script + '?v=' + ver, s, count=1)
          p.write_text(s, encoding='utf-8')

          Path('.github/workflows/isolate-solo-from-group13-20260905.yml').unlink(missing_ok=True)
      - name: Commit only the room isolation fix
        run: |
          git config user.name "K-Talk Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Keep 1-person layout code out of 13-person room"
          git push
