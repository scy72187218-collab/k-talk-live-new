name: Fix visible save button label only

on:
  push:
    paths:
      - '.github/workflows/fix-save-button-label.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Rename visible temporary-save button to save
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          s = path.read_text(encoding='utf-8')
          old = '<button class="draft" onclick="saveCreatorDraft()">▣ 임시 저장</button>'
          new = '<button class="draft" onclick="saveCreatorDraft()">▣ 저장</button>'
          if old not in s:
              raise SystemExit('visible save button target not found')
          path.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name "K-Talk Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "Rename visible temporary save button to save"
          git push origin HEAD:main
