name: Patch secret room six grid once

on:
  push:
    paths:
      - '.github/workflows/patch-secret-six-grid-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Change only secret room center to six slots
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('secret-room-password.js')
          s = p.read_text(encoding='utf-8')

          css_old = ".ktsecret-main{position:relative;flex:1 1 0;min-height:0;overflow:hidden;border-radius:10px;background:#111;border:1px solid rgba(255,196,73,.35)}.ktsecret-main video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 50%;transform:scaleX(-1);background:#111;filter:brightness(1.08) contrast(.95) saturate(1.02)}.ktsecret-shade{position:absolute;inset:0;background:linear-gradient(180deg,transparent 50%,rgba(0,0,0,.06) 65%,rgba(0,0,0,.55) 100%);pointer-events:none}"
          css_new = ".ktsecret-main{position:relative;flex:1 1 0;min-height:0;overflow:hidden;border-radius:10px;background:#111;border:1px solid rgba(255,196,73,.35)}.ktsecret-six-grid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:3px;padding:3px}.ktsecret-slot{position:relative;min-width:0;min-height:0;overflow:hidden;border:1px solid rgba(255,255,255,.18);border-radius:8px;background:linear-gradient(145deg,#15151a,#09090c);display:flex;align-items:center;justify-content:center}.ktsecret-slot.host{border-color:rgba(255,208,90,.72);box-shadow:inset 0 0 0 1px rgba(255,208,90,.12)}.ktsecret-slot video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 50%;transform:scaleX(-1);background:#111;filter:brightness(1.08) contrast(.95) saturate(1.02)}.ktsecret-slot-label{position:absolute;left:5px;bottom:5px;z-index:3;padding:2px 6px;border-radius:999px;background:rgba(0,0,0,.62);color:#fff;font-size:9px;font-weight:900}.ktsecret-slot.host .ktsecret-slot-label{color:#ffe071}.ktsecret-guest-wait{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#bdbdc7;font-size:10px;font-weight:850}.ktsecret-guest-wait b{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;border:1px solid rgba(255,255,255,.25);font-size:20px;color:#fff}.ktsecret-shade{position:absolute;inset:0;background:linear-gradient(180deg,transparent 50%,rgba(0,0,0,.06) 65%,rgba(0,0,0,.55) 100%);pointer-events:none}"
          if css_old not in s:
              raise SystemExit('secret room main CSS target not found')
          s = s.replace(css_old, css_new, 1)

          html_old = '<div class="ktsecret-main"><video id="ktLiveVideo" autoplay playsinline muted></video><div class="ktsecret-shade"></div>'
          html_new = '<div class="ktsecret-main"><div class="ktsecret-six-grid"><div class="ktsecret-slot host"><video id="ktLiveVideo" autoplay playsinline muted></video><span class="ktsecret-slot-label">호스트</span></div><div class="ktsecret-slot"><div class="ktsecret-guest-wait"><b>+</b><span>게스트 1</span></div></div><div class="ktsecret-slot"><div class="ktsecret-guest-wait"><b>+</b><span>게스트 2</span></div></div><div class="ktsecret-slot"><div class="ktsecret-guest-wait"><b>+</b><span>게스트 3</span></div></div><div class="ktsecret-slot"><div class="ktsecret-guest-wait"><b>+</b><span>게스트 4</span></div></div><div class="ktsecret-slot"><div class="ktsecret-guest-wait"><b>+</b><span>게스트 5</span></div></div></div><div class="ktsecret-shade"></div>'
          if html_old not in s:
              raise SystemExit('secret room main HTML target not found')
          s = s.replace(html_old, html_new, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit secret room six grid
        run: |
          git config user.name 'K-Talk Secret Room Helper'
          git config user.email 'actions@github.com'
          git add secret-room-password.js
          git commit -m '비밀방 가운데만 호스트 1명+게스트 5명 6칸으로 변경'
          git push
