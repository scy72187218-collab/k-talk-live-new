name: Move solo earnings next to chat
on:
  push:
    paths:
      - '.github/workflows/move-solo-earnings-next-to-chat.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move earnings box beside chat text in solo room only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('solo-approved-room.js')
          s=p.read_text(encoding='utf-8')
          old1=".ktsolo-earn{position:absolute;left:50%;bottom:170px;transform:translateX(-50%);z-index:10;width:46%;max-width:200px}"
          new1=".ktsolo-earn{position:absolute;left:auto;right:8px;bottom:70px;transform:none;z-index:10;width:155px;max-width:38%}"
          old2=".ktsolo-chat{position:absolute;left:8px;right:62px;bottom:70px;"
          new2=".ktsolo-chat{position:absolute;left:8px;right:170px;bottom:70px;"
          old3=".ktsolo-earn{bottom:160px;width:52%}.ktsolo-chat{right:54px;bottom:64px;max-height:88px}"
          new3=".ktsolo-earn{left:auto;right:5px;bottom:64px;transform:none;width:128px;max-width:40%}.ktsolo-chat{right:140px;bottom:64px;max-height:88px}"
          for old,new in ((old1,new1),(old2,new2),(old3,new3)):
              if old not in s:
                  raise SystemExit('Expected solo layout CSS not found: '+old[:60])
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "K-Talk Layout Helper"
          git config user.email "actions@github.com"
          git add solo-approved-room.js
          git commit -m "Place solo earnings beside chat text"
          git push
