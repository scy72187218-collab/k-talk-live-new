name: Fix mobile solo fullscreen
on:
  push:
    paths:
      - '.github/workflows/fix-mobile-solo-fullscreen-20260904.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Refresh only the mobile solo fullscreen script cache key
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='desktop-live-fullscreen.js?v=20260904-solo-countdown06'
          new='desktop-live-fullscreen.js?v=20260904-solo-fullscreen07'
          if old not in s:
              raise SystemExit('target script version not found; no files changed')
          p.write_text(s.replace(old,new,1))
      - name: Commit only the script cache refresh
        run: |
          git config user.name "K-Talk Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Load mobile 1-person full screen fix"
          git push
