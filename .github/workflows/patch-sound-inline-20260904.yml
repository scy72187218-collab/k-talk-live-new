name: Patch K-Talk sound panel once
on:
  push:
    paths:
      - '.github/workflows/patch-sound-inline-20260904.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch sound behavior only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          p=Path('music-recording-fix.js')
          s=p.read_text(encoding='utf-8')
          marker='/* K-Talk sound panel: never leave the app for catalog rows. */'
          patch=base64.b64decode(' '.replace(/ /g,''))
          if marker not in s:
              s += patch.decode('utf-8')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- music-recording-fix.js; then
            exit 0
          fi
          git config user.name 'K-Talk Patch Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add music-recording-fix.js
          git commit -m 'Keep sound choices inside K-Talk'
          git push origin main
