name: Patch K-Talk creator camera once
on:
  push:
    paths:
      - '.github/workflows/patch-sound-inline-20260904.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fix creator camera framing only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          p=Path('music-recording-fix.js')
          s=p.read_text(encoding='utf-8')
          start=base64.b64decode('ICAvKiBDYW1lcmEgZnJhbWluZyBvbmx5OiByZXF1ZXN0IGEgcG9ydHJhaXQgY2FtZXJhIHN0cmVhbSBzbyB0aGUgcGVyc29uIHN0YXlzIHNtYWxsZXI=').decode('utf-8')
          end=base64.b64decode('ICAvKiBPd24tcG9zdCBtZW51IG9ubHk6IGFkZCDii64gdG8gdmlkZW9zIEkgdXBsb2FkZWQsIHdpdGggU2F2ZSBhbmQgRGVsZXRlLiAqLw==').decode('utf-8')
          replacement=base64.b64decode('').decode('utf-8')
          i=s.find(start)
          j=s.find(end)
          if i!=-1 and j!=-1 and j>i:
              s=s[:i]+replacement+s[j:]
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit camera-only patch
        shell: bash
        run: |
          if git diff --quiet -- music-recording-fix.js; then
            exit 0
          fi
          git config user.name 'K-Talk Patch Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add music-recording-fix.js
          git commit -m 'Restore smaller creator camera framing only'
          git push origin main
