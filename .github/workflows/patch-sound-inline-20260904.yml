name: Patch K-Talk creator camera once
on:
  push:
    paths:
      - '.github/workflows/patch-sound-inline-20260904.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fix creator camera framing only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('music-recording-fix.js')
          s=p.read_text(encoding='utf-8')
          start='  /* Camera framing only: request a portrait camera stream so the person stays smaller'
          end='  /* Own-post menu only: add ⋮ to videos I uploaded, with Save and Delete. */'
          i=s.find(start)
          j=s.find(end)
          if i!=-1 and j!=-1 and j>i:
              replacement="""  /* Camera framing only: keep the original camera stream and use the widest supported zoom. No UI/layout/feature changes. */
  var oldEnsureLiveCamera=window.ensureLiveCamera;
  if(typeof oldEnsureLiveCamera==='function'){
    window.ensureLiveCamera=async function(){
      var result=await oldEnsureLiveCamera.apply(this,arguments);
      try{
        var track=state.stream&&state.stream.getVideoTracks&&state.stream.getVideoTracks()[0];
        var caps=track&&track.getCapabilities?track.getCapabilities():null;
        if(track&&caps&&caps.zoom&&typeof caps.zoom.min==='number'){
          var minZoom=caps.zoom.min;
          var settings=track.getSettings?track.getSettings():{};
          if(typeof settings.zoom!=='number' || settings.zoom>minZoom){
            await track.applyConstraints({advanced:[{zoom:minZoom}]});
          }
        }
      }catch(e){}
      return result;
    };
  }

"""
              s=s[:i]+replacement+s[j:]
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit camera-only patch
        shell: bash
        run: |
          if git diff --quiet -- music-recording-fix.js; then
            exit 0
          fi
          git config user.name 'K-Talk Patch Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add music-recording-fix.js
          git commit -m 'Restore smaller creator camera framing only'
          git push origin main
