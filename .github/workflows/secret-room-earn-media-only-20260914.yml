name: Secret room phone earnings compact only

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/secret-room-earn-media-only-20260914.yml'

permissions:
  contents: write

jobs:
  patch-secret-room-phone-only:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep only secret room earnings compact on phone
        shell: python
        run: |
          from pathlib import Path
          p=Path('secret-room-password.js')
          s=p.read_text(encoding='utf-8')
          old='.ktsecret-earn-row #myEarnHud{width:145px!important}'
          new='html body .ktsecret-room .ktsecret-earn-row #myEarnHud{width:92px!important;max-width:92px!important;min-width:92px!important;height:50px!important;max-height:50px!important}'
          if s.count(old)!=1:
            raise SystemExit(f'target count={s.count(old)}')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
      - name: Commit secret room phone size only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add secret-room-password.js
          git commit -m "Keep secret room earnings compact on phone only"
          git push
