name: Fix save label only

on:
  push:
    paths:
      - '.github/workflows/fix-save-label.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Rename temporary save text to save
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app.js')
          s = path.read_text(encoding='utf-8')
          s2 = s.replace('임시 저장할 동영상이 없습니다.', '저장할 동영상이 없습니다.')
          s2 = s2.replace('임시 저장 동영상 ', '저장 동영상 ')
          s2 = s2.replace('✅ 임시 저장했습니다.', '✅ 저장했습니다.')
          s2 = s2.replace('이 기기에서는 임시 저장하지 못했습니다.', '이 기기에서는 저장하지 못했습니다.')
          if s2 == s:
              raise SystemExit('save text target not found')
          path.write_text(s2, encoding='utf-8')
          PY
          git config user.name "K-Talk Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app.js
          git diff --cached --check
          git commit -m "Rename temporary save text to save"
          git push origin HEAD:main
