name: Shrink attendance badges more once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/shrink-attendance-more-once.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Shrink only attendance badges
        run: |
          python3 - <<'PY'
          from pathlib import Path

          for name, prefix in [('solo-approved-room.js','ktsolo'),('subscriber-approved-room.js','ktsubscriber')]:
              p=Path(name)
              s=p.read_text()
              s=s.replace(f'.{prefix}-att{{justify-self:center;height:36px;min-width:120px;padding:0 6px;',f'.{prefix}-att{{justify-self:center;height:31px;min-width:98px;padding:0 4px;')
              s=s.replace('background-size:8px 8px;color:#ffd52f;font-size:15px;font-weight:950;','background-size:8px 8px;color:#ffd52f;font-size:13px;font-weight:950;',1)
              s=s.replace('display:flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap}', 'display:flex;align-items:center;justify-content:center;gap:2px;white-space:nowrap}',1)
              s=s.replace(f'.{prefix}-att img{{width:19px;height:19px;',f'.{prefix}-att img{{width:15px;height:15px;',1)
              s=s.replace(f'.{prefix}-att{{min-width:102px;height:32px;font-size:13px;padding:0 4px}}',f'.{prefix}-att{{min-width:88px;height:28px;font-size:11px;padding:0 3px}}',1)
              s=s.replace(f'.{prefix}-att img{{width:17px;height:17px}}',f'.{prefix}-att img{{width:14px;height:14px}}',1)
              p.write_text(s)

          p=Path('index.html')
          s=p.read_text()
          s=s.replace('font-weight:950;font-size:10px;white-space:nowrap;\n  display:flex;align-items:center;gap:2px;','font-weight:950;font-size:9px;white-space:nowrap;\n  display:flex;align-items:center;gap:1px;',1)
          s=s.replace('padding:4px 7px;border-radius:999px;','padding:3px 5px;border-radius:999px;',1)
          s=s.replace('color:#ff64cf;font-size:12px;line-height:1;','color:#ff64cf;font-size:10px;line-height:1;',1)
          p.write_text(s)
          PY
          rm -f .github/workflows/shrink-attendance-more-once.yml
          git config user.name "K-Talk Attendance Helper"
          git config user.email "actions@github.com"
          git add index.html solo-approved-room.js subscriber-approved-room.js .github/workflows/shrink-attendance-more-once.yml
          git commit -m "Shrink attendance badge further in all four rooms"
          git push origin main
