name: Room select then live
on:
  push:
    paths:
      - '.github/workflows/room-select-then-live-20260904.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch room shortcut behavior only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          pairs=[
          ("onclick=\"if(window.state){state.liveRoomType='solo';state.liveRoomName='1인 방송';state.liveRoomMax=1;}var t=document.getElementById('liveTitle');if(t)t.value='1인 방송';if(window.startBroadcast)window.startBroadcast();\"",
           "onclick=\"if(window.state){state.liveRoomType='solo';state.liveRoomName='1인 방송';state.liveRoomMax=1;}if(window.openTikLivePrep)window.openTikLivePrep();setTimeout(function(){var a=document.querySelectorAll('.room-switch');for(var i=0;i<a.length;i++)a[i].classList.remove('on');if(a[0])a[0].classList.add('on');var t=document.getElementById('liveTitle');if(t)t.value='1인 방송';},0);\""),
          ("onclick=\"if(window.state){state.liveRoomType='group13';state.liveRoomName='13명 방송';state.liveRoomMax=13;}var t=document.getElementById('liveTitle');if(t)t.value='13명 방송';if(window.startBroadcast)window.startBroadcast();\"",
           "onclick=\"if(window.state){state.liveRoomType='group13';state.liveRoomName='13명 방송';state.liveRoomMax=13;}if(window.openTikLivePrep)window.openTikLivePrep();setTimeout(function(){var a=document.querySelectorAll('.room-switch');for(var i=0;i<a.length;i++)a[i].classList.remove('on');if(a[1])a[1].classList.add('on');var t=document.getElementById('liveTitle');if(t)t.value='13명 방송';},0);\""),
          ("onclick=\"if(window.state){state.liveRoomType='subscriber';state.liveRoomName='구독자 방송';state.liveRoomMax=10;}var t=document.getElementById('liveTitle');if(t)t.value='구독자 방송';if(window.startBroadcast)window.startBroadcast();\"",
           "onclick=\"if(window.state){state.liveRoomType='subscriber';state.liveRoomName='구독자 방송';state.liveRoomMax=10;}if(window.openTikLivePrep)window.openTikLivePrep();setTimeout(function(){var a=document.querySelectorAll('.room-switch');for(var i=0;i<a.length;i++)a[i].classList.remove('on');if(a[2])a[2].classList.add('on');var t=document.getElementById('liveTitle');if(t)t.value='구독자 방송';},0);\""),
          ("onclick=\"if(window.state){state.liveRoomType='password';state.liveRoomName='비밀방';state.liveRoomMax=7;}var t=document.getElementById('liveTitle');if(t)t.value='비밀방';if(window.startBroadcast)window.startBroadcast();\"",
           "onclick=\"if(window.state){state.liveRoomType='password';state.liveRoomName='비밀방';state.liveRoomMax=7;}if(window.openTikLivePrep)window.openTikLivePrep();setTimeout(function(){var a=document.querySelectorAll('.room-switch');for(var i=0;i<a.length;i++)a[i].classList.remove('on');if(a[3])a[3].classList.add('on');var t=document.getElementById('liveTitle');if(t)t.value='비밀방';},0);\""),
          ]
          changed=0
          for old,new in pairs:
              if old in s:
                  s=s.replace(old,new,1)
                  changed+=1
          old13="onclick=\"selectPrepRoom(this,'group','13명 방송',13)\""
          new13="onclick=\"selectPrepRoom(this,'group13','13명 방송',13)\""
          if old13 in s:
              s=s.replace(old13,new13,1)
              changed+=1
          if changed < 5:
              raise SystemExit(f'Expected 5 targeted replacements, got {changed}')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Remove one-time workflow and commit
        run: |
          rm -f .github/workflows/room-select-then-live-20260904.yml
          git config user.name "K-Talk Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/room-select-then-live-20260904.yml
          git commit -m "Require room selection before live start"
          git push
