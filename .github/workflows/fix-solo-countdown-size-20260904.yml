name: Fix solo LIVE countdown and size

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch solo live only
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/kt-solo-patch.py
          python /tmp/kt-solo-patch.py
      - name: Commit solo live fix
        shell: bash
        run: |
          git config user.name "K-Talk Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add desktop-live-fullscreen.js index.html
          if ! git diff --cached --quiet; then
            git commit -m "Make solo host smaller and add real 5 second countdown"
            git push
          fi
