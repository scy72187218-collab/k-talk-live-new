name: Patch TikTok style 13 and subscriber rooms

on:
  push:
    paths:
      - '.github/workflows/patch-tiktok-multiroom-layout.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch only 13-person and subscriber live room layout
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) In the existing live-camera helper, do not shrink the whole canvas
          # for 13-person/subscriber rooms. Their right side will be filled by invite slots.
          feed = Path('feed-home-fix.js')
          s = feed.read_text(encoding='utf-8')
          old = """      v.style.setProperty('object-fit','contain','important');
      v.style.setProperty('transform','scaleX(-1) scale(.72)','important');
      v.style.setProperty('transform-origin','50% 50%','important');
      var layer=document.getElementById('ktLiveEffectLayer');
      if(layer){
        layer.style.setProperty('transform','scale(.72)','important');
        layer.style.setProperty('transform-origin','50% 50%','important');
      }
"""
          new = """      var roomType=(window.state&&state.liveRoomType)||'general';
      var multi=(roomType==='group13'||roomType==='subscriber');
      v.style.setProperty('object-fit',multi?'cover':'contain','important');
      v.style.setProperty('transform',multi?'scaleX(-1)':'scaleX(-1) scale(.72)','important');
      v.style.setProperty('transform-origin','50% 50%','important');
      var layer=document.getElementById('ktLiveEffectLayer');
      if(layer){
        layer.style.setProperty('transform',multi?'none':'scale(.72)','important');
        layer.style.setProperty('transform-origin','50% 50%','important');
      }
      if(multi&&window.ktApplyTikTokMultiRoomLayout)window.ktApplyTikTokMultiRoomLayout();
"""
          if old not in s:
              raise SystemExit('feed camera target not found')
          feed.write_text(s.replace(old, new, 1), encoding='utf-8')

          # 2) Append a very targeted runtime layout patch to app.js.
          app = Path('app.js')
          a = app.read_text(encoding='utf-8')
          marker = '/* KT_TIKTOK_MULTIROOM_LAYOUT_20260904 */'
          if marker not in a:
              patch = r'''

/* KT_TIKTOK_MULTIROOM_LAYOUT_20260904 */
(function(){
  function roomType(){
    try{return (window.state&&state.liveRoomType)||'general';}catch(e){return 'general';}
  }
  function isTarget(){
    var t=roomType();
    return t==='group13'||t==='subscriber';
  }

  window.ktApplyTikTokMultiRoomLayout=function(){
    if(!isTarget())return;
    var video=document.getElementById('ktLiveVideo');
    if(!video)return;
    var section=video.closest('section');
    if(!section)return;

    section.classList.add('kt-tiktok-multi-room');
    section.style.setProperty('background','#050505','important');

    /* TikTok-like: large HOST panel on the left, invite cells on the right. */
    video.style.setProperty('position','absolute','important');
    video.style.setProperty('left','0','important');
    video.style.setProperty('right','auto','important');
    video.style.setProperty('top','200px','important');
    video.style.setProperty('bottom','145px','important');
    video.style.setProperty('width','56%','important');
    video.style.setProperty('height','auto','important');
    video.style.setProperty('object-fit','cover','important');
    video.style.setProperty('object-position','50% 50%','important');
    video.style.setProperty('transform','scaleX(-1)','important');
    video.style.setProperty('transform-origin','50% 50%','important');
    video.style.setProperty('border-radius','10px','important');
    video.style.setProperty('background','#111','important');

    var grid=document.getElementById('ktMultiInviteGrid');
    if(!grid){
      grid=document.createElement('div');
      grid.id='ktMultiInviteGrid';
      section.appendChild(grid);
    }

    var max=13;
    try{
      var m=parseInt(state.liveRoomMax,10);
      if(m>1)max=m;
      else if(roomType()==='subscriber')max=10;
    }catch(e){if(roomType()==='subscriber')max=10;}
    var slots=Math.max(1,max-1);
    var rows=Math.ceil(slots/2);

    grid.style.cssText='position:absolute;z-index:3;left:56%;right:0;top:200px;bottom:145px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat('+rows+',minmax(0,1fr));gap:4px;padding:0 5px 0 4px;overflow:hidden;pointer-events:auto';

    if(grid.dataset.slots!==String(slots)){
      grid.dataset.slots=String(slots);
      grid.innerHTML='';
      for(var i=0;i<slots;i++){
        var cell=document.createElement('button');
        cell.type='button';
        cell.className='kt-multi-invite-cell';
        cell.innerHTML='<b style="font-size:28px;line-height:1">＋</b><span style="display:block;margin-top:2px;font-size:12px;font-weight:900">초대</span>';
        cell.style.cssText='min-width:0;min-height:0;border:1px solid rgba(255,255,255,.12);border-radius:8px;background:linear-gradient(180deg,#16161a,#0b0b0e);color:#f4f4f5;display:grid;place-content:center;text-align:center;padding:2px;box-shadow:inset 0 0 12px rgba(255,255,255,.025)';
        grid.appendChild(cell);
      }
    }

    var badge=document.getElementById('ktMultiHostBadge');
    if(!badge){
      badge=document.createElement('div');
      badge.id='ktMultiHostBadge';
      badge.textContent='호스트';
      section.appendChild(badge);
    }
    badge.style.cssText='position:absolute;z-index:6;left:7px;top:207px;padding:3px 7px;border-radius:6px;background:rgba(10,10,12,.72);border:1px solid rgba(255,255,255,.45);color:#fff;font-size:11px;font-weight:900;pointer-events:none';

    /* Keep face/effect tracking over the host area without creating side bars. */
    var layer=document.getElementById('ktLiveEffectLayer');
    if(layer){
      layer.style.setProperty('transform','none','important');
      layer.style.setProperty('transform-origin','50% 50%','important');
    }
  };

  /* Works even when another script replaces startBroadcast later. */
  try{
    var obs=new MutationObserver(function(){
      if(isTarget()&&document.getElementById('ktLiveVideo')){
        setTimeout(window.ktApplyTikTokMultiRoomLayout,20);
      }
    });
    obs.observe(document.documentElement,{childList:true,subtree:true});
  }catch(e){}

  setInterval(function(){
    if(isTarget()&&document.getElementById('ktLiveVideo'))window.ktApplyTikTokMultiRoomLayout();
  },700);
})();
'''
              app.write_text(a + patch, encoding='utf-8')

          PY
          git config user.name "K-Talk Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app.js feed-home-fix.js
          git diff --cached --check
          git commit -m "Make 13-person and subscriber rooms TikTok style full-width"
          git push origin HEAD:main
