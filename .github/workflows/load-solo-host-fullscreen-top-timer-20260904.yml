name: Load solo host fullscreen top timer
on:
  push:
    paths:
      - '.github/workflows/load-solo-host-fullscreen-top-timer-20260904.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Load solo-only layout fix last
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tag='<script src="solo-host-fullscreen-top-timer.js?v=20260904-solo-top01"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'\n</body>',1)
              p.write_text(s)
      - name: Commit only solo loader change
        run: |
          git config user.name "K-Talk Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Load 1-person fullscreen and top timer fix"
          git push
