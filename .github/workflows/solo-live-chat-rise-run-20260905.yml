name: Run solo live rising chat patch

on:
  push:
    paths:
      - '.github/workflows/solo-live-chat-rise-run-20260905.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply patch
        run: python .github/kt-solo-chat-patch.py
      - name: Commit patch
        run: |
          git config user.name "K-Talk Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Add rising live messages without changing 1-person style"
          git push
