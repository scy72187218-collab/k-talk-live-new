name: One-shot creator reference UI patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-creator-reference-20260915.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply only creator camera, beauty and sound-bar adjustments
        shell: python
        run: |
          from pathlib import Path
          p = Path('ai-dj-9-room-20260913.js')
          s = p.read_text(encoding='utf-8')

          # Keep every other room/function untouched. Only widen the creator camera framing.
          s = s.replace("scaleX(-1) scale(.88)", "scaleX(-1) scale(.82)")

          # Slightly strengthen only the existing neutral beauty tone/smoothing presets.
          s = s.replace("normal:{skin:90,tone:60,bright:72,sharp:46,filter:'brightness(1.10) saturate(1.06) contrast(.90) blur(.42px)'}",
                        "normal:{skin:92,tone:61,bright:74,sharp:44,filter:'brightness(1.11) saturate(1.06) contrast(.89) blur(.55px)'}")
          s = s.replace("strong:{skin:96,tone:64,bright:78,sharp:41,filter:'brightness(1.13) saturate(1.07) contrast(.85) blur(.70px)'}",
                        "strong:{skin:97,tone:65,bright:80,sharp:39,filter:'brightness(1.15) saturate(1.07) contrast(.82) blur(.90px)'}")
          s = s.replace("makeup:{skin:92,tone:68,bright:74,sharp:44,filter:'brightness(1.11) saturate(1.18) contrast(.89) sepia(.04) hue-rotate(-4deg) blur(.48px)'}",
                        "makeup:{skin:94,tone:68,bright:76,sharp:42,filter:'brightness(1.12) saturate(1.16) contrast(.87) sepia(.04) hue-rotate(-4deg) blur(.62px)'}")
          s = s.replace("makeupStrong:{skin:97,tone:72,bright:80,sharp:39,filter:'brightness(1.14) saturate(1.23) contrast(.84) sepia(.06) hue-rotate(-5deg) blur(.76px)'}",
                        "makeupStrong:{skin:98,tone:72,bright:82,sharp:37,filter:'brightness(1.16) saturate(1.20) contrast(.80) sepia(.05) hue-rotate(-5deg) blur(.95px)'}")

          marker = '/* 2026-09-15 참고 사진형 촬영 인터페이스: 사운드 버튼 표시만 정돈. 다른 화면은 변경하지 않음. */'
          if marker not in s:
              s += "\n\n" + marker + r'''
(function(){
  if(window.__ktCreatorReferenceUi20260915)return;
  window.__ktCreatorReferenceUi20260915=true;

  function styleOnly(){
    if(!document.getElementById('ktCreatorReferenceUiStyle20260915')){
      var st=document.createElement('style');
      st.id='ktCreatorReferenceUiStyle20260915';
      st.textContent=''
        +'#creator .creator-top .sound{height:54px!important;max-width:430px!important;border-radius:22px!important;background:rgba(20,20,20,.32)!important;font-size:21px!important;font-weight:950!important;letter-spacing:-.4px!important;backdrop-filter:blur(7px)!important}'
        +'#creator.camera-on:not(.creator-review) video#camera{transform:scaleX(-1) scale(.82)!important;transform-origin:center center!important}'
        +'#creator .creator-tools button[aria-label="AI 보정"],#creator .creator-tools button[aria-label="보정"],#creator .creator-tools button[aria-label="편집효과"]{background:rgba(90,90,90,.30)!important;backdrop-filter:blur(6px)!important}';
      document.head.appendChild(st);
    }

    var sound=document.getElementById('creatorSoundBtn')||document.querySelector('#creator .creator-top .sound');
    if(sound){
      sound.textContent='♪ 사운드 추가';
      sound.style.setProperty('pointer-events','auto','important');
      sound.style.setProperty('touch-action','manipulation','important');
      if(!sound.dataset.ktReferenceSound){
        sound.dataset.ktReferenceSound='1';
        sound.addEventListener('click',function(e){
          e.preventDefault();
          e.stopPropagation();
          if(e.stopImmediatePropagation)e.stopImmediatePropagation();
          if(typeof window.openSoundPanel==='function')window.openSoundPanel();
        },true);
      }
    }
  }

  styleOnly();
  [100,350,800,1500].forEach(function(ms){setTimeout(styleOnly,ms);});
  try{
    var mo=new MutationObserver(function(){clearTimeout(window.__ktCreatorReferenceUiTimer);window.__ktCreatorReferenceUiTimer=setTimeout(styleOnly,40);});
    mo.observe(document.documentElement,{childList:true,subtree:true});
  }catch(e){}
})();
'''

          p.write_text(s, encoding='utf-8')
      - name: Remove one-shot workflow and commit only the requested app change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-creator-reference-20260915.yml
          git add ai-dj-9-room-20260913.js
          git commit -m "Match creator camera framing, beauty and sound bar to reference"
          git push origin HEAD:main
