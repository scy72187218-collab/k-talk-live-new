name: Load K-Talk unified home feed once
on:
  push:
    paths:
      - '.github/workflows/load-feed-home-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Load feed and multiroom layout only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          feed='<script src="feed-home-fix.js?v=20260904-feed01"></script>'
          room='<script src="multiroom-tiktok-layout.js?v=20260904-room01"></script>'
          if feed not in s:
              s=s.replace('</body>', feed+'\n</body>')
          if room not in s:
              s=s.replace('</body>', room+'\n</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit loader
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            exit 0
          fi
          git config user.name 'K-Talk Patch Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Load TikTok style 13-person and subscriber room layout'
          git push origin main
