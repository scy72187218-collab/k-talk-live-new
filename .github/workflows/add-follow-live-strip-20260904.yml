name: Add follow live status strip

on:
  push:
    paths:
      - '.github/workflows/add-follow-live-strip-20260904.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Load follow live status script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="follow-live-status.js?v=20260904-followlive01"></script>'
          if tag not in s:
              marker='<script src="video-owner-actions.js?v=20260904-manual-live01"></script>'
              if marker not in s:
                  import re
                  m=re.search(r'<script src="video-owner-actions\.js\?v=[^"\']+"></script>',s)
                  if not m:
                      raise SystemExit('video-owner-actions script marker not found')
                  marker=m.group(0)
              s=s.replace(marker,marker+'\n'+tag,1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit loader only
        shell: bash
        run: |
          git config user.name 'K-Talk Patch Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Show live red and followed offline blue status circles'
            git push origin main
          fi
