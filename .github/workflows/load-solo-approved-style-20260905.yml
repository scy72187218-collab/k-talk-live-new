name: Load approved 1-person live room style

on:
  push:
    paths:
      - '.github/workflows/load-solo-approved-style-20260905.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Load solo approved style only
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="solo-live-approved-style.js?v=20260905-solo-approved01"></script>'
          if tag not in s:
              s=s.replace('</body>', tag+'\n</body>')
          p.write_text(s,encoding='utf-8')
          Path('.github/workflows/load-solo-approved-style-20260905.yml').unlink(missing_ok=True)
      - name: Commit approved 1-person style loader
        run: |
          git config user.name "K-Talk Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Load approved 1-person live room style"
          git push
