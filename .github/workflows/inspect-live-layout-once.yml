name: Inspect live layout once

on:
  push:
    paths:
      - '.github/workflows/inspect-live-layout-once.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Capture exact 13-person screen source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          terms=['행복한사람','장미다발','큰 선물 보기','시청자 4명이','환영합니다','13명 방송']
          exts={'.html','.js','.css','.svg'}
          out=[]
          for p in Path('.').rglob('*'):
            if not p.is_file() or p.suffix.lower() not in exts or '.git' in p.parts:
              continue
            try:s=p.read_text(encoding='utf-8')
            except:continue
            hits=[t for t in terms if t in s]
            if not hits:continue
            out.append(f'\n=== FILE {p} HITS {hits} ===\n')
            seen=[]
            for t in hits:
              i=s.find(t)
              start=max(0,i-7000); end=min(len(s),i+18000)
              key=(start,end)
              if any(abs(start-a)<3000 for a,b in seen):
                continue
              seen.append(key)
              out.append(f'\n--- TERM {t} ---\n{s[start:end]}\n')
          Path('LAYOUT_INSPECT_TMP.txt').write_text(''.join(out),encoding='utf-8')
          PY
          git config user.name "K-Talk Layout Helper"
          git config user.email "actions@github.com"
          git add LAYOUT_INSPECT_TMP.txt
          git diff --cached --check
          git commit -m "Capture live layout source for precise patch"
          git push origin HEAD:main
