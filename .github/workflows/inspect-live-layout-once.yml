name: Apply precise 13-person spacing once

on:
  push:
    paths:
      - '.github/workflows/inspect-live-layout-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch only approved 13-person lower layout
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('group13-approved-room.js')
          s=p.read_text(encoding='utf-8')
          reps=[
            ('flex:0 0 58px;display:grid;grid-template-columns:minmax(0,1fr) 46%;gap:7px;align-items:end;min-height:0}.ktg13-chat{position:static;width:100%;height:58px;max-height:58px;',
             'flex:0 0 74px;display:grid;grid-template-columns:minmax(0,1fr) 38%;gap:7px;align-items:end;min-height:0}.ktg13-chat{position:static;width:100%;height:74px;max-height:74px;'),
            ('.ktg13-gifts{flex:0 0 64px;', '.ktg13-gifts{flex:0 0 56px;'),
            ('.ktg13-gift img{width:36px;max-width:84%;height:29px;', '.ktg13-gift img{width:34px;max-width:84%;height:24px;'),
            ('.ktg13-emoji{height:29px;display:grid;place-items:center;font-size:25px;', '.ktg13-emoji{height:24px;display:grid;place-items:center;font-size:21px;'),
            ('.ktg13-gift b{color:#ffe23e;font-size:9px;', '.ktg13-gift b{color:#ffe23e;font-size:8px;'),
            ('.ktg13-gift small{display:block;margin-top:1px;color:#fff;font-size:7px;', '.ktg13-gift small{display:block;margin-top:1px;color:#fff;font-size:6.5px;'),
            ('.ktg13-tools{flex:0 0 58px;', '.ktg13-tools{flex:0 0 50px;'),
            ('.ktg13-tool i{width:39px;height:39px;', '.ktg13-tool i{width:34px;height:34px;'),
            ('font-style:normal;font-size:20px;box-shadow:inset 0 0 13px', 'font-style:normal;font-size:18px;box-shadow:inset 0 0 13px'),
            ('.ktg13-tool span{font-size:9px;', '.ktg13-tool span{font-size:8px;'),
            ('.ktg13-mid{flex-basis:54px;grid-template-columns:minmax(0,1fr) 47%;gap:5px}.ktg13-chat{height:54px;max-height:54px;',
             '.ktg13-mid{flex-basis:70px;grid-template-columns:minmax(0,1fr) 40%;gap:5px}.ktg13-chat{height:70px;max-height:70px;'),
            ('.ktg13-gifts{flex-basis:59px}', '.ktg13-gifts{flex-basis:52px}'),
            ('.ktg13-gift img{height:26px}', '.ktg13-gift img{height:23px}'),
            ('.ktg13-emoji{height:26px;font-size:23px}', '.ktg13-emoji{height:23px;font-size:20px}'),
            ('.ktg13-tools{flex-basis:54px}', '.ktg13-tools{flex-basis:47px}'),
            ('.ktg13-tool i{width:36px;height:36px;font-size:18px}', '.ktg13-tool i{width:32px;height:32px;font-size:16px}')
          ]
          changed=0
          for old,new in reps:
            if old not in s:
              raise SystemExit('Expected layout token not found: '+old[:90])
            s=s.replace(old,new,1)
            changed+=1
          p.write_text(s,encoding='utf-8')
          print('Applied',changed,'targeted spacing replacements only')
          PY
          rm -f LAYOUT_INSPECT_TMP.txt
          rm -f .github/workflows/inspect-live-layout-once.yml
          git config user.name "K-Talk Layout Helper"
          git config user.email "actions@github.com"
          git add group13-approved-room.js LAYOUT_INSPECT_TMP.txt .github/workflows/inspect-live-layout-once.yml
          git diff --cached --check
          git diff --cached -- group13-approved-room.js
          git commit -m "Widen 13-person chat and compact lower controls only"
          git push origin HEAD:main
