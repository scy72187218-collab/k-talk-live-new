name: Load posted feed
on:
  push:
    paths:
      - '.github/workflows/load-posted-feed.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add only posted-feed script
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="posted-feed.js?v=20260904a"></script>'
          if tag not in s:
              if '</body>' not in s:
                  raise SystemExit('body close not found')
              s=s.replace('</body>',tag+'\n</body>',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit only index link
        shell: bash
        run: |
          git config user.name "scy72187218-collab"
          git config user.email "scy72187218@gmail.com"
          git add index.html
          git rm .github/workflows/load-posted-feed.yml
          git commit -m "Load posted video feed helper"
          git push
