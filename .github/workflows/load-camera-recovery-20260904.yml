name: Load camera recovery helper

on:
  push:
    paths:
      - '.github/workflows/load-camera-recovery-20260904.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Load only camera recovery helper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="camera-recovery.js?v=20260904-camera01"></script>'
          if tag not in s:
              anchor='<script src="permission-reuse.js?v=20260904-permission05"></script>'
              if anchor in s:
                  s=s.replace(anchor,anchor+'\n'+tag,1)
              else:
                  s=s.replace('</body>',tag+'\n</body>',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit camera recovery loader only
        shell: bash
        run: |
          git config user.name 'K-Talk Patch Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Load camera preview recovery fix'
            git push origin main
          fi
