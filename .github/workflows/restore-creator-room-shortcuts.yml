name: Restore creator room shortcuts

on:
  push:
    paths:
      - '.github/workflows/restore-creator-room-shortcuts.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Restore plus-to-camera and four room buttons
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          s = path.read_text(encoding='utf-8')

          old_quick = """   if(window.openLiveRoom)window.openLiveRoom();"""
          new_quick = """   try{
             if(window.openCreator)await window.openCreator();
           }catch(e){}"""
          if old_quick not in s:
              raise SystemExit('quickStartBroadcast target not found')
          s = s.replace(old_quick, new_quick, 1)

          old_creator = """<div class=\"creator-bottom\"><div class=\"modes\"><span class=\"on\" onclick=\"selectCreatorDuration(this,600000)\">10분</span><span onclick=\"selectCreatorDuration(this,60000)\">60초</span><span onclick=\"selectCreatorDuration(this,15000)\">15초</span><span onclick=\"if(window.openTikLivePrep)openTikLivePrep()\">라이브</span></div><div class=\"recordrow\">"""
          room_row = """<div class=\"creator-bottom\"><div class=\"modes\"><span class=\"on\" onclick=\"selectCreatorDuration(this,600000)\">10분</span><span onclick=\"selectCreatorDuration(this,60000)\">60초</span><span onclick=\"selectCreatorDuration(this,15000)\">15초</span><span onclick=\"if(window.openTikLivePrep)openTikLivePrep()\">라이브</span></div><div class=\"kt-creator-room-shortcuts\"><button type=\"button\" onclick=\"if(window.state){state.liveRoomType='solo';state.liveRoomName='1인 방송';state.liveRoomMax=1;}var t=document.getElementById('liveTitle');if(t)t.value='1인 방송';if(window.startBroadcast)window.startBroadcast();\">1인 방송</button><button type=\"button\" onclick=\"if(window.state){state.liveRoomType='group13';state.liveRoomName='13명 방송';state.liveRoomMax=13;}var t=document.getElementById('liveTitle');if(t)t.value='13명 방송';if(window.startBroadcast)window.startBroadcast();\">13명 방송</button><button type=\"button\" onclick=\"if(window.state){state.liveRoomType='subscriber';state.liveRoomName='구독자 방송';state.liveRoomMax=10;}var t=document.getElementById('liveTitle');if(t)t.value='구독자 방송';if(window.startBroadcast)window.startBroadcast();\">구독자 방송</button><button type=\"button\" onclick=\"if(window.state){state.liveRoomType='password';state.liveRoomName='비밀방';state.liveRoomMax=7;}var t=document.getElementById('liveTitle');if(t)t.value='비밀방';if(window.startBroadcast)window.startBroadcast();\">비밀방</button></div><div class=\"recordrow\">"""
          if old_creator not in s:
              raise SystemExit('creator-bottom target not found')
          s = s.replace(old_creator, room_row, 1)

          css_anchor = """.creator-bottom .modes .on{background:#fff!important;color:#111!important;border-radius:999px!important;padding:8px 18px!important;opacity:1!important}"""
          css_add = css_anchor + """.kt-creator-room-shortcuts{display:grid!important;grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:5px!important;width:min(94%,360px)!important;margin:0 auto 7px!important}.kt-creator-room-shortcuts button{height:30px!important;min-width:0!important;padding:0 2px!important;border-radius:10px!important;border:1px solid rgba(255,255,255,.28)!important;background:rgba(10,10,16,.66)!important;color:#fff!important;font-size:10px!important;font-weight:900!important;white-space:nowrap!important;box-shadow:0 0 8px rgba(255,72,187,.18)!important;touch-action:manipulation!important}"""
          if css_anchor not in s:
              raise SystemExit('creator CSS anchor not found')
          s = s.replace(css_anchor, css_add, 1)

          path.write_text(s, encoding='utf-8')
          PY

          git config user.name "K-Talk Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "Restore camera-first room shortcuts"
          git push origin HEAD:main
