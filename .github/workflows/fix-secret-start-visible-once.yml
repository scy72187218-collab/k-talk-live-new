name: Keep secret room start visible once

on:
  push:
    paths:
      - '.github/workflows/fix-secret-start-visible-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep secret room start button visible
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('secret-room-password.js')
          s = p.read_text(encoding='utf-8')
          old = "#ktSecretPasswordError{display:none;margin-top:5px;color:#ff7c92;font-size:11px;font-weight:900} \\\n      .kt-secret-live-pill"
          new = "#ktSecretPasswordError{display:none;margin-top:5px;color:#ff7c92;font-size:11px;font-weight:900} \\\n      #ktSecretPasswordBox.on{margin-bottom:62px!important} \\\n      #ktSecretPasswordBox.on + .prep-start{position:fixed!important;left:18px!important;right:18px!important;bottom:10px!important;width:auto!important;z-index:9999!important;margin:0!important;padding:12px!important} \\\n      @media(max-width:600px){#ktSecretPasswordBox{padding:7px 8px!important;margin:5px 0 2px!important}#ktSecretPasswordBox label{margin-bottom:4px!important;font-size:11px!important}#ktSecretPassword{height:34px!important;font-size:16px!important}#ktSecretPasswordSave{height:34px!important}#ktSecretPasswordHelp{margin-top:3px!important;font-size:9px!important}#ktSecretPasswordBox.on + .prep-start{left:12px!important;right:12px!important;bottom:8px!important}} \\\n      .kt-secret-live-pill"
          if old not in s:
              raise SystemExit('target style not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name 'K-Talk Secret Room Helper'
          git config user.email 'actions@github.com'
          git add secret-room-password.js
          git commit -m 'Keep secret room start button visible above browser controls'
          git push
