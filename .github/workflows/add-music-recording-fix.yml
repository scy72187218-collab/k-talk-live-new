name: Load music recording fix

on:
  push:
    paths:
      - '.github/workflows/add-music-recording-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add music recording helper script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="music-recording-fix.js?v=20260904a"></script>'
          if tag not in s:
              anchor='<script src="posted-feed.js?v=20260904a"></script>'
              if anchor not in s:
                  raise SystemExit('posted-feed script anchor not found')
              s=s.replace(anchor, anchor+'\n'+tag, 1)
              p.write_text(s,encoding='utf-8')
          PY
          git config user.name "K-Talk Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git diff --cached --check
          git commit -m "Load music recording helper"
          git push origin HEAD:main
