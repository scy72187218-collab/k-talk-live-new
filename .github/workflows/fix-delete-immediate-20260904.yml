name: Fix immediate public video delete

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch delete behavior
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('video-owner-actions.js')
          s=p.read_text(encoding='utf-8')
          marker='/* K-Talk: immediate public video delete UX. */'
          if marker not in s:
              s += r'''

/* K-Talk: immediate public video delete UX. */
(function(){
  if(window.__ktImmediatePublicVideoDeleteLoaded)return;
  window.__ktImmediatePublicVideoDeleteLoaded=true;

  function normalize(u){try{return new URL(u,location.href).href;}catch(e){return String(u||'');}}
  function removeVisibleVideo(url){
    var target=normalize(url||'');
    if(!target)return;
    try{
      document.querySelectorAll('.kt-feed-card .kt-public-video').forEach(function(v){
        var src=normalize(v.currentSrc||v.src||v.getAttribute('src')||'');
        if(src!==target)return;
        try{v.pause();}catch(e){}
        var card=v.closest('.kt-feed-card');
        if(card)card.remove();
      });
    }catch(e){}
  }
  function reloadFeed(){
    try{
      if(typeof window.ktRefreshUnifiedFeed==='function'){window.ktRefreshUnifiedFeed();return;}
      if(typeof window.home==='function')window.home();
    }catch(e){}
  }

  var originalDelete=window.ktDeletePublicVideo;
  if(typeof originalDelete!=='function')return;

  window.ktOpenPublicVideoOwnerMenu=function(id,url,path){
    var qid=String(id||'').replace(/'/g,"\\'");
    var qurl=String(url||'').replace(/'/g,"\\'");
    var qpath=String(path||'').replace(/'/g,"\\'");
    var html='<div style="display:grid;gap:10px;padding:2px">'
      +'<button class="act" style="margin:0" onclick="ktSavePublicVideo(\\''+qurl+'\\')">⬇ 동영상 저장</button>'
      +'<button class="act" style="margin:0;background:#7b1824;border-color:#b93245" onclick="ktDeletePublicVideoImmediate(\\''+qid+'\\',\\''+qpath+'\\',\\''+qurl+'\\')">🗑 동영상 삭제</button>'
      +'<div class="note">삭제해도 휴대폰의 ‘내 동영상’ 원본은 그대로 남습니다.</div>'
      +'</div>';
    if(window.showSheet)showSheet('동영상 관리',html);
  };

  window.ktDeletePublicVideoImmediate=async function(id,path,url){
    if(!id)return;
    if(!confirm('이 동영상을 공개 목록에서 삭제할까요?\n내 동영상 원본은 그대로 남습니다.'))return;
    try{if(window.closeSheet)closeSheet();}catch(e){}
    removeVisibleVideo(url);

    var oldConfirm=window.confirm;
    try{
      window.confirm=function(){return true;};
      await originalDelete(id,path);
    }finally{
      window.confirm=oldConfirm;
      setTimeout(reloadFeed,100);
    }
  };
})();
'''
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "K-Talk Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add video-owner-actions.js
          if ! git diff --cached --quiet; then
            git commit -m "Make deleted videos disappear immediately"
            git push
          fi
