name: Install earnings size sync once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-earnings-size-secret-sync-once.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add earnings size sync script to index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="earnings-size-secret-sync.js?v=20260913-secret-size1"></script>'

          # 기존 같은 파일 연결이 있으면 최신 버전 한 줄로 교체
          s = re.sub(r'<script\s+src="earnings-size-secret-sync\.js\?v=[^"]+"></script>', tag, s)

          # 없으면 가장 마지막 </body> 바로 앞에 추가
          if tag not in s:
              s = s.replace('</body>', tag + '\n</body>')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit only index connection
        run: |
          if git diff --quiet -- index.html; then
            echo "Already installed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Load secret-room earnings size sync"
          git push
