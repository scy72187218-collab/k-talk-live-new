name: Finish compact 1-person live reference style

on:
  push:
    paths:
      - '.github/workflows/solo-reference-finish-20260905.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch only 1-person approved UI
        shell: python
        run: |
          from pathlib import Path

          p=Path('solo-live-approved-style.js')
          s=p.read_text(encoding='utf-8')

          s=s.replace("#ktSoloHostLive{background:#000!important;}\\\n", "#ktSoloHostLive{background:radial-gradient(circle at 25% 20%,#341033 0,transparent 34%),radial-gradient(circle at 78% 28%,#102d48 0,transparent 32%),#08050d!important;}\\\n")

          s=s.replace("#ktSoloHostLive .kt-sa-eq{left:8px;right:68px;bottom:181px;height:27px;display:flex;align-items:center;justify-content:center;gap:2px;padding:0 4px;pointer-events:none;}\\\n", "#ktSoloHostLive .kt-sa-eq{left:8px;right:8px;bottom:179px;height:24px;display:flex;align-items:center;justify-content:center;gap:1px;padding:0 3px;pointer-events:none;overflow:hidden;}\\\n")
          s=s.replace("#ktSoloHostLive .kt-sa-eq i{display:block;width:3px;border-radius:5px;background:linear-gradient(#ff46cd,#53d7ff,#ffe24c);box-shadow:0 0 6px currentColor;animation:ktSaEq 760ms ease-in-out infinite alternate;}\\\n", "#ktSoloHostLive .kt-sa-eq i{display:block;width:2px;border-radius:5px;background:linear-gradient(180deg,#ff59d7 0 25%,#56d9ff 25% 55%,#ffd64f 55% 100%);box-shadow:0 0 5px #7adfff99;animation:ktSaEq 680ms ease-in-out infinite alternate;}\\\n")
          s=s.replace("@keyframes ktSaEq{from{height:5px}to{height:25px}}\\\n", "@keyframes ktSaEq{from{height:3px}to{height:19px}}\\\n")
          s=s.replace("for(var i=0;i<54;i++)s+='<i style=\"animation-delay:'+((i%11)*55)+'ms\"></i>';", "for(var i=0;i<84;i++)s+='<i style=\"animation-delay:'+((i%14)*42)+'ms\"></i>';")

          gift_line="        +'<button class=\"kt-sa-act\" type=\"button\" onclick=\"if(window.openGifts)openGifts()\">🎁<small>선물</small></button>'\\n"
          s=s.replace(gift_line,'')

          marker="    var wrap=document.createElement('div');\\n"
          insert="    var liveVideo=document.getElementById('ktLiveVideo');\\n    if(liveVideo){\\n      liveVideo.style.setProperty('transform','scaleX(-1) scale(.92)','important');\\n      liveVideo.style.setProperty('transform-origin','50% 50%','important');\\n    }\\n\\n"
          if insert not in s:
              s=s.replace(marker,insert+marker)

          p.write_text(s,encoding='utf-8')

          idx=Path('index.html')
          t=idx.read_text(encoding='utf-8')
          t=t.replace('solo-live-approved-style.js?v=20260905-solo-approved01','solo-live-approved-style.js?v=20260905-solo-approved03')
          idx.write_text(t,encoding='utf-8')

          Path('.github/workflows/solo-reference-finish-20260905.yml').unlink(missing_ok=True)

      - name: Commit targeted 1-person changes
        run: |
          git config user.name "K-Talk Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Match 1-person live to approved compact reference"
          git push
