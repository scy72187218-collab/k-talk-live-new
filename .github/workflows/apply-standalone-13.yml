name: Apply 13-person standalone fullscreen
on:
  push:
    paths:
      - '.github/workflows/apply-standalone-13.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make 13-person broadcast app-like fullscreen
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('group13-approved-room.js')
          s = p.read_text(encoding='utf-8')
          marker = "  function gift(icon,count,label,img){"
          insert = r'''  function setupStandaloneShell(){
    try{
      var head=document.head||document.getElementsByTagName('head')[0];
      if(!head)return;
      if(!document.querySelector('link[rel="manifest"]')){
        var link=document.createElement('link');
        link.rel='manifest';
        link.href='/manifest.webmanifest?v=20260907-fullscreen13';
        head.appendChild(link);
      }
      var theme=document.querySelector('meta[name="theme-color"]');
      if(!theme){theme=document.createElement('meta');theme.name='theme-color';head.appendChild(theme);}
      theme.content='#000000';
      var cap=document.querySelector('meta[name="mobile-web-app-capable"]');
      if(!cap){cap=document.createElement('meta');cap.name='mobile-web-app-capable';head.appendChild(cap);}
      cap.content='yes';
      var acap=document.querySelector('meta[name="apple-mobile-web-app-capable"]');
      if(!acap){acap=document.createElement('meta');acap.name='apple-mobile-web-app-capable';head.appendChild(acap);}
      acap.content='yes';
      var ast=document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
      if(!ast){ast=document.createElement('meta');ast.name='apple-mobile-web-app-status-bar-style';head.appendChild(ast);}
      ast.content='black-translucent';
      document.documentElement.style.background='#000';
      if(document.body)document.body.style.background='#000';
    }catch(e){}
  }
  setupStandaloneShell();

  function requestGroup13Fullscreen(){
    try{
      var standalone=(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)||(navigator.standalone===true);
      if(standalone||document.fullscreenElement||document.webkitFullscreenElement)return;
      var el=document.documentElement;
      var fn=el.requestFullscreen||el.webkitRequestFullscreen;
      if(fn){
        var r;
        try{r=fn.call(el,{navigationUI:'hide'});}catch(e){r=fn.call(el);}
        if(r&&r.catch)r.catch(function(){});
      }else{
        setTimeout(function(){try{window.scrollTo(0,1);}catch(e){}},40);
      }
    }catch(e){}
  }

'''
          if 'function requestGroup13Fullscreen()' not in s:
              if marker not in s:
                  raise SystemExit('gift marker not found')
              s = s.replace(marker, insert + marker, 1)
          old = "  window.startBroadcast=async function(){\n    if(!isGroup13())return oldStartBroadcast.apply(this,arguments);"
          new = "  window.startBroadcast=async function(){\n    if(!isGroup13())return oldStartBroadcast.apply(this,arguments);\n    requestGroup13Fullscreen();"
          if 'requestGroup13Fullscreen();\n    var result=await oldStartBroadcast' not in s:
              if old not in s:
                  raise SystemExit('startBroadcast marker not found')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          Path('manifest.webmanifest').write_text('''{
            "name": "K-Talk LIVE",
            "short_name": "K-Talk LIVE",
            "start_url": "/",
            "scope": "/",
            "display": "standalone",
            "background_color": "#000000",
            "theme_color": "#000000",
            "orientation": "portrait-primary",
            "icons": [
              {"src": "/ktalk-icon.svg", "sizes": "any", "type": "image/svg+xml", "purpose": "any maskable"}
            ]
          }\n''', encoding='utf-8')

          Path('ktalk-icon.svg').write_text('''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
          <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff2dbb"/><stop offset="1" stop-color="#7a52ff"/></linearGradient></defs>
          <rect width="512" height="512" rx="112" fill="#050307"/>
          <rect x="28" y="28" width="456" height="456" rx="96" fill="none" stroke="url(#g)" stroke-width="20"/>
          <text x="256" y="245" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="132" font-weight="900">K</text>
          <text x="256" y="340" text-anchor="middle" fill="#ff4bbf" font-family="Arial,sans-serif" font-size="68" font-weight="900">TALK</text>
          </svg>\n''', encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add group13-approved-room.js manifest.webmanifest ktalk-icon.svg
          git rm .github/workflows/apply-standalone-13.yml
          git commit -m "Make 13-person broadcast standalone fullscreen [skip ci]"
          git push
