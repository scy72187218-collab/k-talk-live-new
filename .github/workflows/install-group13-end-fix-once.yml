name: install-group13-end-fix-once

on:
  push:
    branches: [main]
    paths:
      - 'group13-end-fix.js'
      - '.github/workflows/install-group13-end-fix-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Insert 13-room end fix loader once
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="group13-end-fix.js?v=20260908-end1"></script>'
          if tag not in s:
              if '</body>' in s:
                  s=s.replace('</body>', tag+'\n</body>', 1)
              else:
                  s += '\n'+tag+'\n'
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit only loader change
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "13명 방송 종료 버튼 보강 파일 연결"
          git push
