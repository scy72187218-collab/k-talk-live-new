name: Secret room guest placeholders only

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/secret-room-guest-placeholders-only-20260914.yml'

permissions:
  contents: write

jobs:
  patch-secret-room-only:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace only secret-room sample guest photos
        shell: python
        run: |
          from pathlib import Path
          p = Path('secret-room-password.js')
          s = p.read_text(encoding='utf-8')
          old = '''<div class="ktsecret-slot"><img class="ktsecret-guest-photo" src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=500&q=80" alt="게스트 1"><span class="ktsecret-slot-label">게스트 1</span></div><div class="ktsecret-slot"><img class="ktsecret-guest-photo" src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=500&q=80" alt="게스트 2"><span class="ktsecret-slot-label">게스트 2</span></div><div class="ktsecret-slot"><img class="ktsecret-guest-photo" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=500&q=80" alt="게스트 3"><span class="ktsecret-slot-label">게스트 3</span></div><div class="ktsecret-slot"><img class="ktsecret-guest-photo" src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=500&q=80" alt="게스트 4"><span class="ktsecret-slot-label">게스트 4</span></div><div class="ktsecret-slot"><div class="ktsecret-guest-wait"><b>+</b><span>게스트 5</span></div></div>'''
          new = '''<div class="ktsecret-slot"><div class="ktsecret-guest-wait"><b>+</b><span>게스트</span></div></div><div class="ktsecret-slot"><div class="ktsecret-guest-wait"><b>+</b><span>게스트</span></div></div><div class="ktsecret-slot"><div class="ktsecret-guest-wait"><b>+</b><span>게스트</span></div></div><div class="ktsecret-slot"><div class="ktsecret-guest-wait"><b>+</b><span>게스트</span></div></div><div class="ktsecret-slot"><div class="ktsecret-guest-wait"><b>+</b><span>게스트</span></div></div>'''
          if old not in s:
              raise SystemExit('Target guest-photo block not found; nothing else changed.')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit only secret-room-password.js
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add secret-room-password.js
          git commit -m "Replace secret room sample faces with guest placeholders only"
          git push
