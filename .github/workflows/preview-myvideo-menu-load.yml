name: Preview my video menu loader

on:
  push:
    branches:
      - preview-myvideo-menu-2026-09-06
    paths:
      - '.github/workflows/preview-myvideo-menu-load.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-myvideo-menu-2026-09-06
      - name: Load only my video menu fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="myvideo-menu-fix.js?v=20260906"></script>'
          if tag in s:
              raise SystemExit('loader already present')
          if '</body>' not in s:
              raise SystemExit('body end not found')
          s=s.replace('</body>',tag+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "K-Talk Preview Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "Preview: 내 동영상 메뉴 수정 파일만 로드"
          git push origin HEAD:preview-myvideo-menu-2026-09-06
