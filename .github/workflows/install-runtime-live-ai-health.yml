name: Install runtime live AI health
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-runtime-live-ai-health.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load runtime live and AI health
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<script src="runtime-live-ai-health-20260913.js?v=20260913-health2"></script>'
          tag='<script src="runtime-live-ai-health-20260913.js?v=20260913-health3"></script>'
          if old in s:
              s=s.replace(old,tag)
          elif tag not in s:
              s=s.replace('</body>',tag+'\n</body>')
          p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refresh runtime live and AI health"
          git push
