name: Cache-bust permission stability patch
on:
  push:
    paths:
      - '.github/workflows/cachebust-permission-stability-20260904.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update only permission helper version
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='permission-reuse.js?v=20260904-permission02'
          new='permission-reuse.js?v=20260904-permission03'
          if old not in s:
              raise SystemExit('target script version not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'K-Talk Patch Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Load permission and live viewport stability fix' || exit 0
          git push
