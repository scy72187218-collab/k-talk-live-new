name: Live back to video feed
on:
  push:
    paths:
      - '.github/workflows/live-back-to-video.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Change only live back destination
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = """    try{history.replaceState({ktDashboard:true},'',location.href);}catch(e){}\n    if(window.openDashboard)window.openDashboard();\n    else if(window.home)window.home();"""
          new = """    try{history.replaceState({ktVideoHome:true},'',location.href);}catch(e){}\n    if(window.home)window.home();\n    else if(window.openDashboard)window.openDashboard();"""
          if old not in s:
              raise SystemExit('target snippet not found; no files changed')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          Path('.github/workflows/live-back-to-video.yml').unlink()
          PY
      - name: Commit exact change
        run: |
          git config user.name "scy72187218-collab"
          git config user.email "scy72187218@gmail.com"
          git add index.html .github/workflows/live-back-to-video.yml
          git commit -m "Return from live broadcast to video feed"
          git push
